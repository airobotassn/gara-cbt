<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>문제 생성 도구 — 독립 기능</title>
<style>
  :root { --ink:#1f2937; --line:#e5e7eb; --bg:#f7f8fa; --accent:#3aa79f; --bad:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap { max-width:1000px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:#6b7686; margin:0 0 14px; font-size:12px; }
  a.back { font-size:12px; color:#2563eb; text-decoration:none; }
  .banner { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; border-radius:9px; padding:10px 12px; font-size:12px; margin-bottom:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  label { display:block; font-weight:600; font-size:12px; margin:10px 0 4px; color:#374151; }
  input, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font:inherit; background:#fff; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .row > div { flex:1; min-width:120px; }
  button { background:var(--ink); color:#fff; border:0; border-radius:8px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .axisbox { display:flex; flex-wrap:wrap; gap:6px; }
  .axchip { display:inline-flex; align-items:center; gap:5px; font-weight:500; font-size:12px; border:1px solid var(--line); border-radius:999px; padding:5px 10px; cursor:pointer; background:#fff; }
  .axchip:has(input:checked) { border-color:var(--accent); background:#f0faf8; color:#1c6b63; font-weight:600; }
  .axchip input { width:auto; margin:0; }
  .muted { color:#6b7686; font-size:12px; }
  .err { color:var(--bad); font-weight:600; }
  details summary { cursor:pointer; font-weight:600; font-size:13px; }
  .topbar { display:flex; align-items:center; gap:10px; margin-top:12px; }
  #out { white-space:pre-wrap; font-family:ui-monospace,monospace; font-size:13px; }
  .placeholder { color:#9aa3af; text-align:center; padding:30px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 도구 목록</a>
  <h1 style="margin-top:8px">문제 생성 도구 <span class="muted">— 출처 도구와 독립</span></h1>
  <p class="sub">정리된 지식에서 문항을 만든다. <b>출처 도구와 별개</b>로 들어와 단독으로 쓴다.</p>

  <div class="banner">⚠ 생성 백엔드(<code>kb-generate</code>)는 아직 미구현 — 지금은 <b>독립 기능 뼈대(UI)</b>만. 저장소가 채워진 뒤 생성 로직을 붙인다.</div>

  <details class="card">
    <summary>⚙️ 연결 설정</summary>
    <label>함수 URL <span class="muted">예: …/functions/v1/kb-generate</span></label>
    <input id="fnUrl" placeholder="https://&lt;project&gt;.supabase.co/functions/v1/kb-generate" />
    <div class="row">
      <div><label>Passcode</label><input id="passcode" placeholder="(없으면 비움)" /></div>
      <div><label>anon key</label><input id="anonKey" placeholder="(없으면 비움)" /></div>
    </div>
  </details>

  <div class="card">
    <div class="row">
      <div style="max-width:130px"><label>레벨</label><select id="level"></select></div>
      <div><label>축 (영역) <span class="muted">— 복수 선택</span></label><div id="axisBox" class="axisbox"></div></div>
      <div style="max-width:110px"><label>개수</label><input id="count" type="number" min="1" max="20" value="5" /></div>
    </div>
    <div class="topbar">
      <button id="go">문제 생성</button>
      <span id="status" class="muted"></span>
    </div>
  </div>

  <div class="card"><div id="out"><div class="placeholder">레벨·축 고르고 <b>문제 생성</b>을 누르면 여기에 표시돼.</div></div></div>
</div>

<script>
const $ = (id) => document.getElementById(id)
const LS = 'kb_generate_cfg_v1'
const AXES = {
  1: [['l1_principle','생성형 AI 기본 원리'],['l1_security','AI 취약점·보안'],['l1_ethics','AI 윤리·편향'],['l1_responsibility','AI 사회적 책임·규범'],['l1_llm_eco','LLM 응용·생태계'],['l1_prompt','프롬프트 엔지니어링']],
  2: [['l2_genai','생성형 AI 중급'],['l2_api','생성형 AI API 호출'],['l2_algo','AI 알고리즘 기획'],['l2_sensor','내장 센서 제어'],['l2_block','블록코딩 논리'],['l2_python','파이썬 기초']],
  3: [['l3_rag','RAG·검색 파이프라인'],['l3_llm_ctrl','LLM 활용·생성 제어'],['l3_vision_eval','비전 인식·평가지표'],['l3_vision_data','비전 처리·데이터'],['l3_c_basic','C 기초 문법·흐름'],['l3_c_adv','C 메모리·구조·고급']],
  4: [['l4_preproc','물리적 AI 전처리'],['l4_stm32','STM32 정밀제어'],['l4_ros2','ROS2 시스템 통합'],['l4_plc','PLC 프로그래밍'],['l4_sim','공정 시뮬레이션'],['l4_smartfactory','스마트공장']],
  5: [['l5_reasoning','AI 지능·추론'],['l5_edge','엣지 AI 컴퓨팅'],['l5_iiot','산업 IoT·데이터 연계'],['l5_dtwin','디지털 트윈·시뮬레이션'],['l5_sysopt','시스템 통합·제조 최적화'],['l5_ros2','로봇 OS·제어(ROS2)']],
  6: [['l6_swarm','군집 지능'],['l6_hrc','인간-로봇 협업(HRC)'],['l6_dtwin','디지털 트윈'],['l6_orchestration','AI 오케스트레이션'],['l6_process_opt','지능형 공정 최적화'],['l6_robosec','로보틱스 보안 및 사이버-물리 시스템']],
  7: [['l7_standard','글로벌 표준 및 규제'],['l7_arch','초거대 시스템 아키텍처'],['l7_phyfusion','차세대 물리-지능 융합'],['l7_faulttol','극단적 결함 허용'],['l7_governance','AI 생태계 및 거버넌스'],['l7_ethics','범용 물리 지능 윤리']],
}
function fillLevels() { $('level').innerHTML = Object.keys(AXES).map(l => `<option value="${l}">Lv.${l}</option>`).join('') }
function fillAxes() { const lv = $('level').value; $('axisBox').innerHTML = (AXES[lv]||[]).map(([k,label]) => `<label class="axchip"><input type="checkbox" value="${k}|${label}" checked> ${label}</label>`).join('') }
fillLevels(); fillAxes()
$('level').addEventListener('change', fillAxes)
const selectedAxes = () => [...$('axisBox').querySelectorAll('input:checked')].map(i => { const [key,label] = i.value.split('|'); return { key, label } })

function loadCfg(){ try { const c = JSON.parse(localStorage.getItem(LS)||'{}'); $('fnUrl').value=c.fnUrl||''; $('passcode').value=c.passcode||''; $('anonKey').value=c.anonKey||'' } catch {} }
function saveCfg(){ localStorage.setItem(LS, JSON.stringify({ fnUrl:$('fnUrl').value.trim(), passcode:$('passcode').value.trim(), anonKey:$('anonKey').value.trim() })) }
loadCfg(); ['fnUrl','passcode','anonKey'].forEach(id => $(id).addEventListener('change', saveCfg))
const esc = (s) => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))

async function generate() {
  saveCfg()
  const fnUrl = $('fnUrl').value.trim()
  if (!fnUrl) { $('status').innerHTML = '<span class="err">함수 URL을 설정하세요 (⚙️). — kb-generate 는 아직 미구현.</span>'; return }
  const axes = selectedAxes()
  if (!axes.length) { $('status').innerHTML = '<span class="err">축을 하나 이상 고르세요.</span>'; return }
  $('go').disabled = true; $('status').textContent = '생성 중…'; $('out').innerHTML = '<div class="placeholder">생성 중…</div>'
  try {
    const headers = { 'Content-Type':'application/json' }
    const pc = $('passcode').value.trim(); if (pc) headers['x-passcode'] = pc
    const ak = $('anonKey').value.trim(); if (ak) { headers['apikey']=ak; headers['Authorization']='Bearer '+ak }
    const res = await fetch(fnUrl, { method:'POST', headers, body: JSON.stringify({ level:$('level').value, axes, count:+$('count').value||5 }) })
    const j = await res.json().catch(()=>({}))
    if (!res.ok) throw new Error(j.error || ('HTTP '+res.status))
    $('out').textContent = JSON.stringify(j, null, 2)
    $('status').textContent = '완료'
  } catch (e) { $('status').innerHTML = '<span class="err">실패: '+esc(e.message)+'</span>'; $('out').innerHTML = '<div class="placeholder">실패 — 생성 백엔드 미구현이거나 오류</div>' }
  finally { $('go').disabled = false }
}
$('go').addEventListener('click', generate)
</script>
</body>
</html>
