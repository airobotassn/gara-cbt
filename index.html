<!doctype html>
<!-- 기본 테마 = 다크. class 를 미리 박아두고, 아래 스크립트가 '라이트를 고른 사람'만 벗긴다
     (JS 가 죽어도 다크로 뜬다 — 스타일 기본값이 다크여야 하므로). -->
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <!-- 저장된 테마를 React 렌더 전에 적용 (플래시 방지).
         FAB 토글로 라이트를 고른 적이 있을 때만 <html class="dark"> 를 벗긴다. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark')
        } catch (e) {}
      })()
    </script>
    <!-- 본문 서체 = Pretendard 하나(라틴·한글 모두). 2026-08-04 Hanken Grotesk 를 걷어냈다 —
         라틴만 다른 얼굴로 그려져 한 줄 안에서 자폭·굵기가 어긋났다. 아이콘만 Material Symbols. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <title>CARIS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
