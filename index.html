<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- 테마를 React 렌더 전에 적용(플래시 방지).
         기본 = **폰/브라우저 설정(prefers-color-scheme)**. 앱 FAB 토글로 고른 값이 있으면 그게 우선이지만,
         그 뒤 시스템 설정이 바뀌면 사용자 선택은 버린다 — 폰을 라이트로 바꾸면 사이트도 하얘져야 하므로
         (그래서 고를 당시의 시스템 값 themeSys 를 같이 저장해 비교한다). -->
    <script>
      (function () {
        try {
          var sys =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          var saved = localStorage.getItem('theme')
          var savedSys = localStorage.getItem('themeSys')
          var use = saved && savedSys === sys ? saved : sys
          if (use === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <!-- GARA Precision 폰트: 라틴/숫자 Hanken Grotesk · CJK·힌디 본문 Pretendard 폴백 · 아이콘 Material Symbols -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <title>CARIS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
