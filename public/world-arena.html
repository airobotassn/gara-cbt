<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== GARA 글로벌 응시 현황 — 보고용 드릴다운 맵 (자체 완결) ===== */
:root {
  --bg: #faf8ff; --panel: #ffffff; --panel-2: #eef3fd;
  --ink: #33323f; --muted: #6c7188; --faint: #9aa0b8;
  --line: #33323f; --line-2: #33323f;
  --accent: #5f8ed0; --accent-soft: #dbe7fb; --gold: #f2c65e;
  --ocean: #cfe0f7; --sphere-line: rgba(51,50,63,.18); --land-none: #dfe6f4;
  --shadow: 0 6px 0 rgba(51,50,63,.13), 0 16px 26px -14px rgba(51,50,63,.24);
  --c0: #dde8fb; --c1: #a7c4ee; --c2: #6f9fe0; --c3: #3f6fc0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #faf8ff; --panel: #ffffff; --panel-2: #eef3fd;
    --ink: #33323f; --muted: #6c7188; --faint: #9aa0b8;
    --line: #33323f; --line-2: #33323f;
    --accent: #5f8ed0; --accent-soft: #dbe7fb; --gold: #f2c65e;
    --ocean: #cfe0f7; --sphere-line: rgba(51,50,63,.18); --land-none: #dfe6f4;
    --shadow: 0 6px 0 rgba(51,50,63,.13), 0 16px 26px -14px rgba(51,50,63,.24);
    --c0: #dde8fb; --c1: #a7c4ee; --c2: #6f9fe0; --c3: #3f6fc0;
  }
}
:root[data-theme="light"] {
  --bg: #faf8ff; --panel: #ffffff; --panel-2: #eef3fd;
  --ink: #33323f; --muted: #6c7188; --faint: #9aa0b8;
  --line: #33323f; --line-2: #33323f;
  --accent: #5f8ed0; --accent-soft: #dbe7fb; --gold: #f2c65e;
  --ocean: #cfe0f7; --sphere-line: rgba(51,50,63,.18); --land-none: #dfe6f4;
  --shadow: 0 6px 0 rgba(51,50,63,.13), 0 16px 26px -14px rgba(51,50,63,.24);
  --c0: #dde8fb; --c1: #a7c4ee; --c2: #6f9fe0; --c3: #3f6fc0;
}
:root[data-theme="dark"] {
  --bg: #faf8ff; --panel: #ffffff; --panel-2: #eef3fd;
  --ink: #33323f; --muted: #6c7188; --faint: #9aa0b8;
  --line: #33323f; --line-2: #33323f;
  --accent: #5f8ed0; --accent-soft: #dbe7fb; --gold: #f2c65e;
  --ocean: #cfe0f7; --sphere-line: rgba(51,50,63,.18); --land-none: #dfe6f4;
  --shadow: 0 6px 0 rgba(51,50,63,.13), 0 16px 26px -14px rgba(51,50,63,.24);
  --c0: #dde8fb; --c1: #a7c4ee; --c2: #6f9fe0; --c3: #3f6fc0;
}

* { box-sizing: border-box; }
body {
  margin: 0; color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(circle 480px at 50% 120px, rgba(0, 74, 198, .16), rgba(0, 74, 198, 0) 62%);
  background-repeat: no-repeat;
  font-family: 'Hanken Grotesk', 'Pretendard Variable', Pretendard, -apple-system,
    BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1240px; margin: 0 auto; padding: 22px clamp(14px, 3vw, 30px) 40px; }

/* ── 헤더 ── */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .mk { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(150deg, #1b55d0, #00174b); color: #fff; font-weight: 800; letter-spacing: .5px; font-size: 15px;
  box-shadow: 0 8px 20px -8px rgba(0, 74, 198, .5); }
.brand h1 { margin: 0; font-size: clamp(26px, 3.6vw, 36px); font-weight: 900; letter-spacing: -.02em; }
.brand .sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.tag { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent);
  border-radius: 999px; padding: 5px 11px; background: color-mix(in srgb, var(--gold) 9%, transparent); }

/* ── 레이아웃 ── */
.grid { display: grid; grid-template-columns: 1fr 316px; gap: 16px; align-items: stretch; height: clamp(500px, 70vh, 720px); }
.stage, .side { height: 100%; min-height: 0; }
@media (max-width: 880px) { .grid { grid-template-columns: 1fr; height: auto; } .stage { height: 60vh; } .side { height: auto; max-height: 74vh; } }
.card { background: var(--panel); border: 2.5px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }

/* ── 지도 ── */
.stage { position: relative; overflow: hidden; display: flex; flex-direction: column; }
.crumb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 14px 18px 10px; font-size: 13px; }
.crumb button { font: inherit; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 3px 7px; border-radius: 8px; font-weight: 600; }
.crumb button:hover { background: var(--panel-2); color: var(--ink); }
.crumb .cur { color: var(--ink); font-weight: 800; padding: 3px 7px; }
.crumb .sep { color: var(--faint); }
.crumb .lvl { margin-left: auto; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
#map { flex: 1; min-height: 0; width: 100%; display: block; cursor: grab; }
#map.dragging { cursor: grabbing; }
.hint { position: absolute; right: 18px; left: auto; bottom: 14px; font-size: 12px; color: var(--faint); font-weight: 700;
  background: color-mix(in srgb, var(--panel) 72%, transparent); padding: 5px 10px; border-radius: 8px; backdrop-filter: blur(4px); pointer-events: none; }

/* ── 시·도 재클릭 진입 안내 프롬프트 ── */
.prompt { position: absolute; left: 50%; top: 50px; transform: translateX(-50%); z-index: 7; max-width: 92%;
  background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 800; padding: 7px 15px; border-radius: 999px;
  border: 2px solid var(--line); box-shadow: 0 4px 0 rgba(51,50,63,.22); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  opacity: 0; pointer-events: none; transition: opacity .15s; }
.prompt.on { opacity: 1; }

/* ── 우리 순위 카드 ── */
.ourrank { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 10px;
  padding: 9px 13px; border-radius: 14px; border: 2.5px solid var(--accent); background: color-mix(in srgb, var(--accent) 9%, #fff);
  box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 38%, #fff); }
.ourrank .or-t { display: block; font-size: 10px; font-weight: 800; letter-spacing: .09em; color: var(--accent); text-transform: uppercase; }
.ourrank .or-n { display: block; font-size: 14px; font-weight: 900; color: var(--ink); }
.ourrank .or-r { text-align: right; line-height: 1.02; }
.ourrank .or-r b { font-size: 25px; font-weight: 900; color: var(--accent); }
.ourrank .or-r span { font-size: 12px; font-weight: 800; color: var(--muted); }
.ourrank .or-r i { display: block; font-style: normal; font-size: 11px; font-weight: 700; color: var(--faint); }

/* ── 범례 ── */
.legend { display: flex; align-items: center; gap: 10px; padding: 10px 18px 15px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.legend .bar { flex: 1; height: 8px; border-radius: 999px;
  background: linear-gradient(90deg, var(--c0), var(--c1), var(--c2), var(--c3)); }

/* ── 아레나 마스코트(새싹이) ── */
.mascot { position: absolute; left: 6px; bottom: 6px; height: 188px; z-index: 6; pointer-events: none;
  filter: drop-shadow(0 10px 5px rgba(51,50,63,.18)); }
@media (max-width: 880px) { .mascot { height: 120px; } }

/* ── 하단 런처(이동 버튼 3개) ── */
.launch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
.lbtn { display: flex; align-items: center; gap: 13px; padding: 15px 18px; border-radius: 18px;
  background: var(--panel); border: 2.5px solid var(--line); box-shadow: 0 4px 0 rgba(51,50,63,.14);
  text-decoration: none; cursor: pointer; transition: transform .1s ease, box-shadow .1s ease; }
.lbtn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(51,50,63,.14); }
.lbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(51,50,63,.14); }
.lbtn .ic { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
  font-size: 22px; background: color-mix(in srgb, var(--lb-bg) 20%, #fff); border: 2px solid var(--lb-bg); }
.lbtn .lt { min-width: 0; line-height: 1.25; }
.lbtn .lt b { display: block; font-size: 15.5px; font-weight: 900; color: var(--ink); letter-spacing: -.01em; }
.lbtn .lt i { font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.lbtn .go { margin-left: auto; font-size: 20px; font-weight: 900; color: var(--lb-bg); }
.lbtn.cari  { --lb-bg: #5f8ed0; }
.lbtn.lvl   { --lb-bg: #56b6ae; }
.lbtn.daily { --lb-bg: #e0a93e; }
@media (max-width: 880px) { .launch { grid-template-columns: 1fr; } }

/* ── 사이드 패널(랭킹) ── */
.side { display: flex; flex-direction: column; padding: 16px 16px 12px; }
.side h2 { margin: 0 0 12px; font-size: 20px; font-weight: 900; letter-spacing: -.02em; }
.side .meta { margin: 3px 0 12px; font-size: 12px; color: var(--muted); font-weight: 600; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.stat { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; }
.stat .k { font-size: 11px; color: var(--muted); font-weight: 700; }
.stat .v { font-size: 19px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.rank { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
.rank li { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 9px;
  padding: 8px 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.rank li:hover, .rank li.hot { background: var(--panel-2); border-color: var(--line); }
.search { width: 100%; margin: 0 0 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); color: var(--ink); font: inherit; font-size: 13px; outline: none; }
.search::placeholder { color: var(--faint); }
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); background: var(--panel); }
.rank li.sel { background: color-mix(in srgb, #e5484d 12%, var(--panel)); border-color: color-mix(in srgb, #e5484d 45%, transparent); box-shadow: inset 3px 0 0 #e5484d; }
.rank .no { font-size: 12px; font-weight: 800; color: var(--faint); text-align: center; font-variant-numeric: tabular-nums; }
.rank .nm { min-width: 0; }
.rank .nm b { font-size: 13.5px; font-weight: 700; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank .nm .bw { height: 5px; border-radius: 999px; background: var(--accent); margin-top: 5px; opacity: .9; }
.rank .nm .cnt { font-size: 11px; color: var(--faint); font-weight: 600; margin-top: 3px; }
.rank .sc { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.rank li .go { display: none; }
.rank li.drill .sc::after { content: "›"; margin-left: 5px; color: var(--faint); font-weight: 700; }

/* ── 툴팁 ── */
#tip { position: fixed; z-index: 20; pointer-events: none; opacity: 0; transform: translate(-50%, -114%);
  background: var(--ink); color: var(--bg); padding: 8px 11px; border-radius: 10px; font-size: 12.5px; font-weight: 600;
  box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); transition: opacity .12s; white-space: nowrap; }
#tip b { font-size: 13.5px; }
#tip .row { display: flex; justify-content: space-between; gap: 14px; margin-top: 3px; font-weight: 600; opacity: .85; }
#tip .row span:last-child { font-variant-numeric: tabular-nums; }

.geo { stroke: #ffffff; stroke-width: 1; transition: fill .15s; cursor: pointer; }
.geo.dim { cursor: pointer; }
.geo.hot { stroke: var(--gold); stroke-width: 1.6; }
.geo.sel { fill: #e5484d !important; stroke: #ffffff; stroke-width: 2.2; filter: drop-shadow(0 0 7px rgba(229, 72, 77, .75)); }
.sphere { fill: url(#oceanGrad); filter: url(#globeShadow); stroke: var(--line); stroke-width: 3; }
.spec { fill: url(#specGrad); pointer-events: none; }
#specGrad .s-in  { stop-color: #ffffff; stop-opacity: .72; }
#specGrad .s-out { stop-color: #ffffff; stop-opacity: 0; }
.atmo { fill: url(#atmoGrad); pointer-events: none; }
#oceanGrad .g-hi  { stop-color: #eaf4ff; }
#oceanGrad .g-mid { stop-color: #9fc6f2; }
#oceanGrad .g-lo  { stop-color: #4f88d4; }
#atmoGrad .a-in   { stop-color: #9cc6ff; stop-opacity: 0; }
#atmoGrad .a-out  { stop-color: #9cc6ff; stop-opacity: .6; }
.grat { fill: none; stroke: var(--sphere-line); stroke-width: .5; opacity: .5; }
.krmark { fill: none; stroke: var(--gold); stroke-width: 2; }
.foot { margin-top: 16px; font-size: 12px; color: var(--faint); text-align: center; font-weight: 600; line-height: 1.6; }
.embed .tag, .embed .foot { display: none !important; }
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } }

</style>

  }

  // ── mock data (deterministic from region key) ──
  function h32(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  const scoreOf = (k) => Math.round((45 + (h32("s" + k) % 511) / 10) * 10) / 10; // 45.0–96.0
  const takersOf = (k) => 30 + (h32("n" + k) % 9970);

  const cscale = d3.scaleLinear().domain([45, 62, 79, 96])
    .range(["#d9e8fd", "#9dc2f0", "#5b93e2", "#2e6bc8"]).clamp(true);

  // ── state ──
  let level = 0, curProv = null, rot = [-30, -12, 0], timer = null, selKey = null;
  const svg = d3.select("#map");
  const defs = svg.append("defs");
  (() => {
    const og = defs.append("radialGradient").attr("id", "oceanGrad").attr("cx", "0.36").attr("cy", "0.30").attr("r", "0.74");
    og.append("stop").attr("class", "g-hi").attr("offset", "0%");
    og.append("stop").attr("class", "g-mid").attr("offset", "56%");
    og.append("stop").attr("class", "g-lo").attr("offset", "100%");
    const ag = defs.append("radialGradient").attr("id", "atmoGrad").attr("cx", "0.5").attr("cy", "0.5").attr("r", "0.5");
    ag.append("stop").attr("class", "a-in").attr("offset", "74%");
    ag.append("stop").attr("class", "a-out").attr("offset", "100%");
    const sp = defs.append("radialGradient").attr("id", "specGrad").attr("cx", "0.5").attr("cy", "0.5").attr("r", "0.5");
    sp.append("stop").attr("class", "s-in").attr("offset", "0%");
    sp.append("stop").attr("class", "s-out").attr("offset", "100%");
    const fl = defs.append("filter").attr("id", "globeShadow").attr("x", "-40%").attr("y", "-40%").attr("width", "180%").attr("height", "180%");
    fl.append("feDropShadow").attr("dx", 0).attr("dy", 12).attr("stdDeviation", 16).attr("flood-color", "#33456b").attr("flood-opacity", 0.3);
  })();
  const gAtmo = svg.append("g"), gSphere = svg.append("g"), gSpec = svg.append("g"), gGrat = svg.append("g"),
    gGeo = svg.append("g"), gMark = svg.append("g");
  const grat = d3.geoGraticule10();
  const tip = d3.select("#tip");
  let W = 0, H = 0, proj = null, path = null, current = [];

  function size() {
    const r = document.getElementById("map").getBoundingClientRect();
    W = r.width; H = Math.max(420, r.height);
    svg.attr("viewBox", `0 0 ${W} ${H}`).attr("width", W).attr("height", H);
  }

  // ── region set for current level ──
  function regions() {
    if (level === 0) return countries.map((f) => ({ f, key: "C" + f.id, name: koCountry(f), drill: f.id === KR_ID }));
    if (level === 1) return provinces.map((f) => ({ f, key: "P" + f.properties.code, name: f.properties.name, code: f.properties.code, drill: true }));
    return munis.filter((f) => f.properties.code.slice(0, 2) === curProv.code)
      .map((f) => ({ f, key: "M" + f.properties.code, name: f.properties.name, drill: false }));
  }

  function makeProjection(regs) {
    if (level === 0) { const p = d3.geoOrthographic().fitExtent([[18, 14], [W - 18, H - 24]], { type: "Sphere" }).rotate(rot); p.scale(p.scale() * 1.32); return p; }
    const fc = { type: "FeatureCollection", features: regs.map((r) => r.f) };
    return d3.geoMercator().fitExtent([[16, 16], [W - 16, H - 16]], fc);
  }

  // ── draw geometry (called on tick + interactions) ──
  function paint() {
    path = d3.geoPath(proj);
    if (level === 0) {
      const ctr = proj.translate(), rr = proj.scale();
      gAtmo.selectAll("circle").data([0]).join("circle").attr("class", "atmo")
        .attr("cx", ctr[0]).attr("cy", ctr[1]).attr("r", rr + 11);
      gSphere.selectAll("path").data([{ type: "Sphere" }]).join("path").attr("class", "sphere").attr("d", path);
      gSpec.selectAll("ellipse").data([0]).join("ellipse").attr("class", "spec")
        .attr("cx", ctr[0] - rr * 0.26).attr("cy", ctr[1] - rr * 0.34)
        .attr("rx", rr * 0.46).attr("ry", rr * 0.32)
        .attr("transform", `rotate(-24 ${ctr[0] - rr * 0.26} ${ctr[1] - rr * 0.34})`);
      gGrat.selectAll("path").data([grat]).join("path").attr("class", "grat").attr("d", path);
    } else { gAtmo.selectAll("*").remove(); gSphere.selectAll("*").remove(); gSpec.selectAll("*").remove(); gGrat.selectAll("*").remove(); }
    gGeo.selectAll("path").attr("d", (d) => path(d.f));
    // 지구본 위 한국 표시 링
    if (level === 0) {
      const kr = countries.find((f) => f.id === KR_ID);
      const c = d3.geoCentroid(kr), vis = isVisible(c);
      gMark.selectAll("circle").data(vis ? [proj(c)] : []).join("circle")
        .attr("class", "krmark").attr("cx", (d) => d[0]).attr("cy", (d) => d[1]).attr("r", 13);
    } else gMark.selectAll("*").remove();
  }
  function isVisible(coord) {
    const r = proj.rotate();
    return d3.geoDistance(coord, [-r[0], -r[1]]) < Math.PI / 2; // 앞면 반구에 있을 때만
  }

  // ── full render on level change ──
  function render() {
    current = regions();
    current.forEach((r) => { r.score = scoreOf(r.key); r.takers = takersOf(r.key); });
    proj = makeProjection(current);
    const sel = gGeo.selectAll("path").data(current, (d) => d.key);
    sel.exit().remove();
    sel.enter().append("path").attr("class", "geo")
      .on("pointermove", onHover).on("pointerleave", () => tip.style("opacity", 0))
      .on("click", (e, d) => activate(d))
      .merge(sel)
      .classed("dim", (d) => !d.drill && level === 0)
      .classed("sel", (d) => d.key === selKey)
      .attr("fill", (d) => cscale(d.score));
    paint();
    panel();
    crumb();
    if (level === 0 && !reduce) startSpin(); else stopSpin();
  }

  // ── auto-rotate ──
  function startSpin() {
    stopSpin(); let last = 0;
    timer = d3.timer((el) => {
      const dt = el - last; last = el;
      rot[0] += dt * 0.012; proj.rotate(rot); paint();
    });
  }
  function stopSpin() { if (timer) { timer.stop(); timer = null; } }

  // ── interactions ──
  function onHover(e, d) {
    const rank = current.slice().sort((a, b) => b.score - a.score).findIndex((x) => x.key === d.key) + 1;
    tip.html(`<b>${d.name}</b><div class="row"><span>평균점수</span><span>${d.score.toFixed(1)}점</span></div>` +
      `<div class="row"><span>응시자</span><span>${d.takers.toLocaleString()}명</span></div>` +
      `<div class="row"><span>순위</span><span>${rank} / ${current.length}</span></div>`)
      .style("left", e.clientX + "px").style("top", e.clientY + "px").style("opacity", 1);
    gGeo.selectAll("path").classed("hot", (x) => x.key === d.key);
    d3.selectAll("#rank li").classed("hot", (x, i, n) => n[i].dataset.key === d.key);
  }
  function activate(d) {
    if (level === 0) {
      selKey = d.key;
      if (d.drill) rotateTo(d, () => fadeRender(() => { level = 1; }));
      else rotateTo(d);
    } else if (level === 1) {
      if (selKey === d.key) {
        fadeRender(() => { curProv = { code: d.code, name: d.name }; level = 2; });
      } else {
        selKey = d.key;
        gGeo.selectAll("path").classed("sel", (x) => x.key === selKey);
        d3.selectAll("#rank li").classed("sel", (x, i, n) => n[i].dataset.key === selKey);
        setPrompt("‘" + d.name + "’ 선택됨 · 한 번 더 누르면 시·군·구로 들어가요");
      }
    } else {
      selKey = d.key;
      gGeo.selectAll("path").classed("sel", (x) => x.key === selKey);
      d3.selectAll("#rank li").classed("sel", (x, i, n) => n[i].dataset.key === selKey);
    }
  }
  function rotateTo(d, cb) {
    stopSpin();
    const c = d3.geoCentroid(d.f);
    const from = rot.slice();
    let dl = (-c[0]) - from[0]; while (dl > 180) dl -= 360; while (dl < -180) dl += 360;
    const dp = (-c[1]) - from[1], dur = 820, ease = d3.easeCubicInOut;
    const tm = d3.timer((el) => {
      const t = Math.min(1, el / dur), k = ease(t);
      rot = [from[0] + dl * k, from[1] + dp * k, 0];
      proj.rotate(rot); paint();
      if (t >= 1) {
        tm.stop(); timer = null;
        gGeo.selectAll("path").classed("sel", (x) => x.key === selKey);
        d3.selectAll("#rank li").classed("sel", (x, i, n) => n[i].dataset.key === selKey);
        if (cb) cb();
      }
    });
    timer = tm;
  }

  // 레벨 전환을 페이드로 부드럽게(팍 넘어가지 않게)
  function fadeRender(mut) {
    selKey = null;
    const qi = document.getElementById("q"); if (qi) qi.value = "";
    setPrompt("");
    svg.interrupt()
      .style("transform-origin", "50% 50%")
      .transition().duration(420).ease(d3.easeCubicIn)
      .style("opacity", 0).style("transform", "scale(1.16)")
      .on("end", () => {
        mut();
        render();
        svg.style("opacity", 0).style("transform", "scale(0.9)")
          .transition().duration(620).ease(d3.easeCubicOut)
          .style("opacity", 1).style("transform", "scale(1)");
      });
  }
  function goto(l) { fadeRender(() => { level = l; if (l < 2) curProv = l === 0 ? null : curProv; }); }

  // ── side panel ──
  function panel() {
    const sorted = current.slice().sort((a, b) => b.score - a.score);
    const avg = d3.mean(current, (d) => d.score), max = sorted[0];
    const totalTakers = d3.sum(current, (d) => d.takers);
    const scope = level === 0 ? "세계 리그" : level === 1 ? "대한민국 리그" : curProv.name + " 리그";
    document.getElementById("sideTitle").textContent = scope;
    document.getElementById("stats").innerHTML =
      `<div class="stat"><div class="k">최고 지역</div><div class="v">${max.name.length > 7 ? max.name.slice(0, 7) + "…" : max.name}</div></div>` +
      `<div class="stat"><div class="k">총 응시자</div><div class="v">${totalTakers.toLocaleString("ko-KR")}명</div></div>`;
    // 우리 순위 — 우리 국가/지역이 몇 위인지 항상 표시
    const ourEl = document.getElementById("ourRank");
    let our = null, ourLabel = "";
    if (level === 0) { our = current.find((d) => d.drill); ourLabel = "🇰🇷 대한민국 · 세계"; }
    else if (level === 1) { our = current.find((d) => /서울/.test(d.name)); ourLabel = "📍 서울 · 우리 지역"; }
    else if (level === 2) { our = current.find((d) => /강남/.test(d.name)); ourLabel = "🏠 강남구 · 우리 동네"; }
    if (our) {
      const orank = sorted.indexOf(our) + 1;
      ourEl.style.display = "";
      ourEl.innerHTML = `<div><span class="or-t">우리 순위</span><span class="or-n">${ourLabel}</span></div>` +
        `<div class="or-r"><b>${orank}</b><span> / ${current.length}위</span><i>평균 ${our.score.toFixed(1)}</i></div>`;
    } else { ourEl.style.display = "none"; }
    const maxSc = sorted[0].score, minSc = sorted[sorted.length - 1].score;
    const rank = document.getElementById("rank");
    rank.innerHTML = "";
    const q = (document.getElementById("q").value || "").trim().toLowerCase();
    let shown = q ? sorted.filter((d) => d.name.toLowerCase().includes(q)).slice(0, 60) : sorted.slice(0, 60);
    // 세계 단위: 드릴 대상(대한민국)이 상위 60 밖이면 맨 아래 고정 노출(검색 중엔 제외)
    if (!q && level === 0) { const kr = current.find((d) => d.drill); if (kr && !shown.includes(kr)) shown.push(kr); }
    shown.forEach((d) => {
      const rk = sorted.indexOf(d) + 1;
      const li = document.createElement("li");
      li.dataset.key = d.key; if (d.drill) li.classList.add("drill");
      if (d.key === selKey) li.classList.add("sel");
      const w = 10 + 90 * ((d.score - minSc) / (maxSc - minSc || 1));
      li.innerHTML = `<span class="no">${rk}</span><div class="nm"><b>${d.name}${d.drill && level === 0 ? " 🇰🇷" : ""}</b>` +
        `<div class="bw" style="width:${w}%;background:${cscale(d.score)}"></div>` +
        `<div class="cnt">응시 ${d.takers.toLocaleString()}명</div></div>` +
        `<span class="sc">${d.score.toFixed(1)}</span>`;
      li.onclick = () => activate(d);
      li.onmouseenter = () => { gGeo.selectAll("path").classed("hot", (x) => x.key === d.key); };
      li.onmouseleave = () => gGeo.selectAll("path").classed("hot", false);
      rank.appendChild(li);
    });
  }

  // ── breadcrumb ──
  function crumb() {
    const c = document.getElementById("crumb");
    if (level === 0) { c.innerHTML = ""; c.style.display = "none"; return; }
    c.style.display = "";
    const parts = [{ t: "세계", l: 0 }];
    if (level >= 1) parts.push({ t: "대한민국", l: 1 });
    if (level >= 2) parts.push({ t: curProv.name, l: 2 });
    c.innerHTML = "";
    parts.forEach((p, i) => {
      if (i) { const s = document.createElement("span"); s.className = "sep"; s.textContent = "›"; c.appendChild(s); }
      if (i === parts.length - 1) { const b = document.createElement("span"); b.className = "cur"; b.textContent = p.t; c.appendChild(b); }
      else { const b = document.createElement("button"); b.textContent = p.t; b.onclick = () => goto(p.l); c.appendChild(b); }
    });
  }

  // ── drag to rotate (globe only) ──
  let dragBase = null;
  svg.call(d3.drag()
    .on("start", (e) => { if (level !== 0) return; stopSpin(); dragBase = { x: e.x, y: e.y, r: rot.slice() }; svg.classed("dragging", true); })
    .on("drag", (e) => { if (level !== 0 || !dragBase) return; rot[0] = dragBase.r[0] + (e.x - dragBase.x) * 0.35; rot[1] = Math.max(-88, Math.min(88, dragBase.r[1] - (e.y - dragBase.y) * 0.35)); proj.rotate(rot); paint(); })
    .on("end", () => { dragBase = null; svg.classed("dragging", false); if (level === 0 && !reduce) startSpin(); }));

  function resync() { size(); proj = makeProjection(current); paint(); }
  window.addEventListener("resize", resync);
  size(); render();
  document.getElementById("q").addEventListener("input", panel);
  requestAnimationFrame(resync); // 레이아웃 안정화 후 크기 재동기화
})();

</script>
