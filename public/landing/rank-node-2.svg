<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 92">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".42" stop-color="#eaf7ff"/><stop offset="1" stop-color="#91bad0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="170%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
      <feFlood flood-color="#5ed8ff" flood-opacity=".48"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g font-family="Arial,Helvetica,sans-serif" font-style="italic" filter="url(#glow)">
    <text x="12" y="76" font-size="76" font-weight="800" fill="url(#face)" stroke="#a9c4d7" stroke-width="1.5" paint-order="stroke">2</text>
    <text x="66" y="36" font-size="31" font-weight="700" fill="#ffffff" stroke="#7898ad" stroke-width=".75" paint-order="stroke">nd</text>
  </g>
</svg>
