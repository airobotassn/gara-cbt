<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARIS 레벨 테스트 인증서 — 미리보기</title>
<style>
  /* 서체 — 제목·브랜드=송명, 이름·날짜=Noto Serif KR (둘 다 OFL) */
  @font-face{font-family:SongMyung;font-weight:400;font-display:swap;src:url(cert/song-myung-korean-400-normal.woff2) format('woff2')}
  @font-face{font-family:NotoSerifKR;font-weight:700;font-display:swap;src:url(cert/noto-serif-kr-korean-700-normal.woff2) format('woff2')}

  :root{ --ui:'Pretendard Variable',Pretendard,'Noto Sans KR','Malgun Gothic',system-ui,sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0e16;color:#dfe6f2;font-family:var(--ui);min-height:100vh}

  /* ── 조작 바(인증서 아님) ───────────────────────── */
  .bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
       padding:10px 16px;background:rgba(10,14,22,.92);border-bottom:1px solid #1c2534;backdrop-filter:blur(6px)}
  .bar b{font-size:13px;letter-spacing:.5px;color:#7d8ba3;font-weight:600}
  .lv{display:flex;gap:6px;flex-wrap:wrap}
  .lv button{width:36px;height:32px;border-radius:8px;border:1px solid #2a3547;
             background:#131a26;color:#93a3bd;font:600 13px var(--ui);cursor:pointer}
  .lv button:hover{border-color:#3a4a63;color:#cfd8e8}
  .lv button[aria-pressed="true"]{background:rgba(53,200,245,.16);border-color:#35c8f5;color:#dff5ff}
  .bar .hint{margin-left:auto;font-size:12px;color:#55617a}

  .wrap{display:flex;justify-content:center;padding:20px 12px 48px}

  /* ── 인증서 본체 : 1448 × 900 고정 좌표계 ───────────── */
  .stage{position:relative;width:1448px;height:900px;transform-origin:top center;
         overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6)}
  .stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .vig{position:absolute;inset:0;
       background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 35%,rgba(3,6,12,.55) 78%,rgba(2,4,9,.86) 100%)}

  /* 모서리 장식 — corner.png 한 장을 네 방향으로 뒤집어 쓴다 */
  .orn{position:absolute;width:320px;pointer-events:none}
  .orn.tl{left:26px;top:26px}
  .orn.tr{right:26px;top:26px;transform:scaleX(-1)}
  .orn.bl{left:26px;bottom:26px;transform:scaleY(-1)}
  .orn.br{right:26px;bottom:26px;transform:scale(-1)}

  .abs{position:absolute}

  /* 좌측 컬럼 — 폭 560px, 캔버스 세로 정중앙, 안의 요소는 같은 중심선에 가운데 정렬 */
  .col{position:absolute;left:82px;top:50%;transform:translateY(-50%);width:560px;text-align:center}

  /* 브랜드 락업 — 'CARIS' 글자가 컬럼 중앙에 오도록 로고 폭의 절반만큼 왼쪽으로 민다 */
  .brand{display:flex;align-items:center;justify-content:center;gap:2px;margin-bottom:26px;
         transform:translateX(-40px)}
  .brand img{height:52px;filter:drop-shadow(0 0 14px rgba(224,192,124,.3))}
  .brand span{font:400 34px SongMyung,var(--ui);letter-spacing:9px;text-indent:9px;
              background:linear-gradient(180deg,#fff6d9 0%,#f6de9e 30%,#e8bf65 52%,#c99433 76%,#f0d489 100%);
              -webkit-background-clip:text;background-clip:text;color:transparent;
              filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}

  .title{font:400 64px SongMyung,var(--ui);letter-spacing:6px;text-indent:6px;white-space:nowrap;
         background:linear-gradient(180deg,#fff6d9 0%,#f6de9e 30%,#e8bf65 52%,#c99433 76%,#f0d489 100%);
         -webkit-background-clip:text;background-clip:text;color:transparent;
         filter:drop-shadow(0 1px 0 rgba(0,0,0,.4)) drop-shadow(0 0 24px rgba(230,180,80,.3))}

  .name{margin-top:48px;font:700 58px NotoSerifKR,var(--ui);letter-spacing:9px;text-indent:9px;
        color:#fff;text-shadow:0 0 26px rgba(255,235,190,.3);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* LEVEL 워드마크 + 숫자 — 둘 다 에셋 */
  .mark{margin-top:46px;display:flex;align-items:center;justify-content:center;gap:26px}
  .mark-cap{height:52px;filter:drop-shadow(0 0 18px rgba(224,192,124,.28))}
  .mark-num{height:58px;filter:drop-shadow(0 0 18px rgba(224,192,124,.28))}

  /* 북두칠성 SVG — 좌표계는 원본 dipper.png(1122×1402) 그대로 */
  .dipper{left:690px;top:96px;width:720px;height:760px}
  .dipper svg{width:100%;height:100%;filter:brightness(1.14) saturate(1.06)}
</style>
</head>
<body>

<div class="bar">
  <b>레벨</b>
  <span class="lv" id="lv"></span>
  <span class="hint">레벨 버튼으로 1~7 확인 · 이름은 계정 닉네임</span>
</div>

<div class="wrap"><div class="stage" id="stage">
  <img class="bg" src="cert/bg.png" alt="">
  <div class="vig"></div>

  <img class="orn tl" src="cert/corner.png" alt=""><img class="orn tr" src="cert/corner.png" alt="">
  <img class="orn bl" src="cert/corner.png" alt=""><img class="orn br" src="cert/corner.png" alt="">

  <div class="col">
    <div class="brand"><img src="cert/logo-gold.png" alt=""><span>CARIS</span></div>
    <div class="title">레벨 테스트 인증서</div>
    <div class="name" id="name">홍길동</div>
    <div class="mark">
      <img class="mark-cap" src="cert/level-word.png" alt="LEVEL">
      <img class="mark-num" id="lv-num" src="cert/num-3.png" alt="3">
    </div>
  </div>

  <div class="abs dipper">
    <svg id="dip" viewBox="50 95 993 1140" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff6d9"/><stop offset=".30" stop-color="#f6de9e"/>
          <stop offset=".52" stop-color="#e8bf65"/><stop offset=".76" stop-color="#c99433"/>
          <stop offset="1" stop-color="#f0d489"/>
        </linearGradient>
        <!-- 미달성 레벨 = 채도를 뺀 은색(금=획득 / 은=미획득) -->
        <filter id="ash" x="-30%" y="-30%" width="160%" height="160%">
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.18"/><feFuncG type="linear" slope="1.2"/><feFuncB type="linear" slope="1.3"/></feComponentTransfer>
        </filter>
      </defs>
      <g id="dip-g"></g>
    </svg>
  </div>
</div></div>

<script>
/* ── 북두칠성 ────────────────────────────────────────────────
   좌표 = 원본 dipper.png(1122×1402)의 링 중심을 픽셀 분석으로 뽑은 값 그대로. */
const NODES = [
  { n:1, x:992, y: 923 }, { n:2, x:776, y:1158 }, { n:3, x:454, y: 975 },
  { n:4, x:538, y: 715 }, { n:5, x:463, y: 488 }, { n:6, x:279, y: 296 },
  { n:7, x: 99, y: 123 },
];
const EDGES = [[1,2],[2,3],[3,4],[4,1],[4,5],[5,6],[6,7]];  // 국자(1-2-3-4) + 손잡이(4-5-6-7)
const R = 28;
/* 레벨별 취득일(발자취) — 지금은 샘플. 실제 붙일 땐 서버에서 받은 값으로 교체 */
const DATES = { 1:'2026.03.02', 2:'2026.05.11', 3:'2026.07.15',
                4:'2026.09.20', 5:'2026.11.08', 6:'2027.01.17', 7:'2027.03.05' };

const NEI = {};
EDGES.forEach(([a, b]) => { (NEI[a] = NEI[a] || []).push(b); (NEI[b] = NEI[b] || []).push(a); });
const at = n => NODES.find(p => p.n === n);
function outward(p){                                   // 이웃 방향의 반대 = 날짜를 놓을 바깥쪽
  let vx = 0, vy = 0;
  (NEI[p.n] || []).forEach(n => {
    const q = at(n), dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy) || 1;
    vx += dx / L; vy += dy / L;
  });
  const L = Math.hypot(vx, vy);
  if (L < 0.02) return { x: 0, y: 1 };
  return { x: -vx / L, y: -vy / L };
}

const SVGNS = 'http://www.w3.org/2000/svg';
const el = (t, a) => { const e = document.createElementNS(SVGNS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };

const ROTC = { x: 546, y: 665 };
const ROT = -12;

/* 기울기를 반영한 콘텐츠 bbox 로 viewBox 를 잡는다 → 돌려도 틀 안에 딱 맞음 */
function refitViewBox(){
  const rad = ROT * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  NODES.forEach(p => {
    const pad = R + 18, u = outward(p), D = R + 34, TW = 205;
    const lx = u.x * D, ly = u.y * D + 9;
    const l0 = u.x > 0.35 ? lx : u.x < -0.35 ? lx - TW : lx - TW / 2;
    const l1 = l0 + TW;
    [[-pad,-pad],[pad,-pad],[-pad,pad],[pad,pad],
     [l0, ly+10],[l1, ly+10],[l0, ly-28],[l1, ly-28]].forEach(([ox, oy]) => {
      const x = p.x + ox - ROTC.x, y = p.y + oy - ROTC.y;
      const rx = ROTC.x + x * cos - y * sin, ry = ROTC.y + x * sin + y * cos;
      if (rx < minx) minx = rx; if (rx > maxx) maxx = rx;
      if (ry < miny) miny = ry; if (ry > maxy) maxy = ry;
    });
  });
  document.getElementById('dip').setAttribute('viewBox', `${minx} ${miny} ${maxx - minx} ${maxy - miny}`);
}

function draw(level){
  const g = document.getElementById('dip-g');
  g.textContent = '';
  g.setAttribute('transform', `rotate(${ROT} ${ROTC.x} ${ROTC.y})`);
  refitViewBox();
  const upright = (x, y) => ({ transform:`rotate(${-ROT} ${x} ${y})` });   // 글자는 수평 유지
  const lit = n => n <= level;

  // ① 연결선 — 각인 선 조각(edge.png)을 구간마다 회전·신축해 깐다. 링 앞에서 끊어 여백을 준다.
  const GAP = R + 12;
  EDGES.forEach(([a,b]) => {
    const p = at(a), q = at(b), on = lit(a) && lit(b);
    const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy);
    const seg = len - GAP * 2, th = 9;
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    const deg = Math.atan2(dy, dx) * 180 / Math.PI;
    g.appendChild(el('image', { href:'cert/edge.png', x:-seg/2, y:-th/2, width:seg, height:th,
      preserveAspectRatio:'none', opacity: on ? 1 : 0.62, ...(on ? {} : { filter:'url(#ash)' }),
      transform:`translate(${mx},${my}) rotate(${deg})` }));
  });

  // ② 발광 별 — flare-gold.png 의 빛 중심이 (0.502, 0.371) 지점이라 그만큼 보정
  NODES.filter(p => lit(p.n)).forEach(p => {
    const s = 430;
    g.appendChild(el('image', { href:'cert/flare-gold.png', x:p.x-s*0.502, y:p.y-s*0.371, width:s, height:s }));
  });

  // ③ 링 + 숫자 + 취득일 — 레벨과 무관하게 항상 같은 좌표
  NODES.forEach(p => {
    const on = lit(p.n);
    g.appendChild(el('circle', { cx:p.x, cy:p.y, r:R, fill:'rgba(3,11,20,.72)' }));
    const rw = 637 / 630 * (R * 2.45), rh = R * 2.45;
    g.appendChild(el('image', { href:'cert/node.png', x:p.x-rw/2, y:p.y-rh/2, width:rw, height:rh,
      opacity: on ? 1 : 0.72, ...(on ? {} : { filter:'url(#ash)' }) }));
    const num = el('text', { x:p.x, y:p.y+11, 'text-anchor':'middle',
      'font-family':'NotoSerifKR,serif', 'font-size':32, 'font-weight': on ? 700 : 500,
      fill: on ? '#fff4dd' : 'rgba(206,216,230,.82)', ...upright(p.x, p.y) });
    num.textContent = p.n; g.appendChild(num);

    const u = outward(p), D = R + 34;
    const lx = p.x + u.x * D, ly = p.y + u.y * D + 9;
    const anchor = u.x > 0.35 ? 'start' : u.x < -0.35 ? 'end' : 'middle';
    const d = DATES[p.n];
    if (on && d) {
      const dt = el('text', { x:lx, y:ly, 'text-anchor':anchor,
        'font-family':'NotoSerifKR,serif', 'font-size':26, 'letter-spacing':1.8,
        'font-weight':400, fill:'url(#goldg)', ...upright(lx, ly) });
      dt.textContent = d.replace(/\./g, ' · '); g.appendChild(dt);
    }
    // 미달성 레벨은 은색 링만으로 구분된다
  });
}

/* ── 파라미터 : ?name=닉네임&level=3 ─────────────────── */
const qs = new URLSearchParams(location.search);
const qName = (qs.get('name') || '').trim();
if (qName) document.getElementById('name').textContent = qName.slice(0, 12);

/* 레벨 버튼 */
const lvBox = document.getElementById('lv');
for (let i = 1; i <= 7; i++){
  const b = document.createElement('button');
  b.textContent = i; b.onclick = () => setLevel(i);
  lvBox.appendChild(b);
}
function setLevel(n){
  const numEl = document.getElementById('lv-num');
  numEl.src = `cert/num-${n}.png`; numEl.alt = String(n);
  [...lvBox.children].forEach((b,i) => b.setAttribute('aria-pressed', i+1 === n));
  draw(n);
}

/* 북두칠성 박스 배치 + 뷰포트에 맞춰 축소 */
const stage = document.getElementById('stage');
const dipperBox = document.querySelector('.dipper');
const DIP = { cx: 895, w: 720, h: 760 }, H = 900, K = 1.4;
(function placeDipper(){
  const h = Math.min(H - 44, DIP.h * K), w = Math.min(1000, DIP.w * K);
  dipperBox.style.width = w + 'px'; dipperBox.style.height = h + 'px';
  dipperBox.style.left = (DIP.cx - w / 2) + 'px'; dipperBox.style.top = ((H - h) / 2) + 'px';
})();
function fit(){
  const s = Math.min(1, (window.innerWidth - 24) / 1448);
  stage.style.transform = `scale(${s})`;
  stage.parentElement.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

const qLevel = Math.min(7, Math.max(1, parseInt(qs.get('level'), 10) || 3));
setLevel(qLevel);
</script>
</body>
</html>
