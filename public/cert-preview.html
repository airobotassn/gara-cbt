<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARIS 레벨 테스트 인증서 — 미리보기</title>
<style>
  /* 서체 — 이름·취득일용 Noto Serif KR(OFL) 하나뿐이다.
     브랜드·제목·LEVEL·숫자는 전부 확정 시안 에셋(PNG)이라 영문 세리프를 따로 싣지 않는다. */
  @font-face{font-family:NotoSerifKR;font-weight:700;font-display:swap;src:url(cert/noto-serif-kr-korean-700-normal.woff2) format('woff2')}

  :root{ --ui:'Pretendard Variable',Pretendard,'Noto Sans KR','Malgun Gothic',system-ui,sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0e16;color:#dfe6f2;font-family:var(--ui);min-height:100vh}

  /* ── 조작 바(인증서 아님) ───────────────────────── */
  .bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
       padding:10px 16px;background:rgba(10,14,22,.92);border-bottom:1px solid #1c2534;backdrop-filter:blur(6px)}
  .bar b{font-size:13px;letter-spacing:.5px;color:#7d8ba3;font-weight:600}
  .lv{display:flex;gap:6px;flex-wrap:wrap}
  .lv button{width:36px;height:32px;border-radius:8px;border:1px solid #2a3547;
             background:#131a26;color:#93a3bd;font:600 13px var(--ui);cursor:pointer}
  .lv button:hover{border-color:#3a4a63;color:#cfd8e8}
  .lv button[aria-pressed="true"]{background:rgba(53,200,245,.16);border-color:#35c8f5;color:#dff5ff}
  .bar .hint{margin-left:auto;font-size:12px;color:#55617a}

  .wrap{display:flex;justify-content:center;padding:20px 12px 48px}

  /* ── 인증서 본체 : 1448 × 900 고정 좌표계 ───────────── */
  .stage{position:relative;width:1448px;height:900px;transform-origin:top center;
         overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6)}
  .stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .vig{position:absolute;inset:0;
       background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 35%,rgba(3,6,12,.55) 78%,rgba(2,4,9,.86) 100%)}

  /* 모서리 장식 — corner.webp 한 장을 네 방향으로 뒤집어 쓴다 */
  .orn{position:absolute;width:320px;pointer-events:none}
  .orn.tl{left:26px;top:26px}
  .orn.tr{right:26px;top:26px;transform:scaleX(-1)}
  .orn.bl{left:26px;bottom:26px;transform:scaleY(-1)}
  .orn.br{right:26px;bottom:26px;transform:scale(-1)}

  .abs{position:absolute}

  /* 텍스트 컬럼 — 폭 560px, 캔버스 세로 정중앙, 안의 요소는 같은 중심선에 가운데 정렬.
     **오른쪽**(별자리를 왼쪽으로 보냈다 — React 판 .lc-col 과 같은 배치) */
  .col{position:absolute;right:82px;top:50%;transform:translateY(-50%);width:560px;text-align:center}

  /* 발행기관 워드마크 — 제목 위 락업(옛 CARIS 락업 자리).
     에셋은 원본에서 알파 여백을 잘라낸 판이라 높이만 주면 그대로 앉는다. */
  .brand{display:block;height:52px;margin:0 auto 30px;
         filter:drop-shadow(0 0 16px rgba(224,192,124,.3))}

  /* 제목 — 확정 시안 에셋(LEVEL TEST / CERTIFICATE 2줄 금박 각인).
     CSS 금박 텍스트로 흉내내던 걸 그림으로 교체했다 → 서체·자간·그라디언트를 여기서 만지지 않는다.
     ⚠️ 아래 크기 4종(.title 폭 · .mark 간격 · cap/num 높이)은 React 판 src/styles/levelcert.css 의
     .lc-title/.lc-mark/.lc-mark-cap/.lc-mark-num 과 **같은 값이어야 한다**. */
  .title{display:block;width:440px;margin:0 auto;
         filter:drop-shadow(0 0 26px rgba(230,180,80,.28))}

  .name{margin-top:48px;font:700 58px NotoSerifKR,var(--ui);letter-spacing:9px;text-indent:9px;
        color:#fff;text-shadow:0 0 26px rgba(255,235,190,.3);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* LEVEL 워드마크 + 숫자 — 둘 다 에셋.
     크기는 폭이 아니라 **높이**로 잡는다. 숫자 폭이 글자마다 달라(1=21px, 4=37px) 줄 폭을 고정하면
     레벨을 바꿀 때마다 LEVEL 워드마크가 커졌다 작아졌다 한다.
     cap 과 num 은 반드시 같은 높이 — 예전 숫자가 가는 세리프라 58px 로 키워뒀던 게 지금은 안 맞는다. */
  .mark{margin-top:44px;display:flex;align-items:center;justify-content:center;gap:24px}
  .mark-cap{height:58px;filter:drop-shadow(0 0 18px rgba(224,192,124,.28))}
  .mark-num{height:58px;filter:drop-shadow(0 0 18px rgba(224,192,124,.28))}

  /* 발행기관 — 잔글씨. ⚠️ 금색으로 쓰지 말 것.
     이 인증서의 금색은 전부 금박 각인 질감 + 광택 림을 가진 이미지 자산이라, CSS 금색 텍스트를 얹으면
     혼자 납작해서 따로 논다(하이라이트 0%). 재질 경쟁을 피하려고 일부러 무채에 가까운 웜톤으로 뺐다.
     구분선만 아주 옅은 금빛 헤어라인 — 면적이 없어 질감이 문제되지 않는다. */
  .issuer{margin-top:38px;font:400 20px NotoSerifKR,var(--ui);letter-spacing:3.5px;text-indent:3.5px;
          color:rgba(228,216,194,.58);white-space:nowrap}
  .issuer::before{content:'';display:block;width:120px;height:1px;margin:0 auto 20px;
                  background:linear-gradient(90deg,transparent,rgba(224,192,124,.45),transparent)}

  /* 북두칠성 SVG — 왼쪽. ⚠️ 이 3값은 React 판 src/styles/levelcert.css 의 .lc-dipbox 와 같아야 한다
     (viewBox 가 별+날짜에 딱 맞게 잘려 나오므로 내용이 늘 이 상자의 좌우 끝에 닿는다). */
  .dipper{left:62px;top:8px;width:979px;height:856px}
  .dipper svg{width:100%;height:100%;filter:brightness(1.14) saturate(1.06)}
</style>
</head>
<body>

<div class="bar">
  <b>레벨</b>
  <span class="lv" id="lv"></span>
  <span class="hint">레벨 버튼으로 1~7 확인 · 이름은 계정 닉네임</span>
</div>

<div class="wrap"><div class="stage" id="stage">
  <img class="bg" src="cert/bg.webp" alt="">
  <div class="vig"></div>

  <img class="orn tl" src="cert/corner.webp" alt=""><img class="orn tr" src="cert/corner.webp" alt="">
  <img class="orn bl" src="cert/corner.webp" alt=""><img class="orn br" src="cert/corner.webp" alt="">

  <div class="col">
    <img class="brand" src="cert/logo-gara.webp" alt="GARA">
    <img class="title" src="cert/title-word.webp" alt="LEVEL TEST CERTIFICATE">
    <div class="name" id="name">홍길동</div>
    <div class="mark">
      <img class="mark-cap" src="cert/level-word.webp" alt="LEVEL">
      <img class="mark-num" id="lv-num" src="cert/num-3.png" alt="3">
    </div>
    <div class="issuer">Global AI &amp; Robotics Association</div>
  </div>

  <div class="abs dipper">
    <svg id="dip" viewBox="50 95 993 1140" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff6d9"/><stop offset=".30" stop-color="#f6de9e"/>
          <stop offset=".52" stop-color="#e8bf65"/><stop offset=".76" stop-color="#c99433"/>
          <stop offset="1" stop-color="#f0d489"/>
        </linearGradient>
        <!-- 미달성 레벨 = 채도를 뺀 은색(금=획득 / 은=미획득) -->
        <filter id="ash" x="-30%" y="-30%" width="160%" height="160%">
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer><feFuncR type="linear" slope="1.18"/><feFuncG type="linear" slope="1.2"/><feFuncB type="linear" slope="1.3"/></feComponentTransfer>
        </filter>
      </defs>
      <g id="dip-g"></g>
    </svg>
  </div>
</div></div>

<script>
/* ── 북두칠성 ────────────────────────────────────────────────
   ⚠️ 아래 좌표·회전·라벨표는 React 판 src/pages/LevelCert.tsx 와 **같은 값이어야 한다.**
   좌표 = 레벨 선택(/test/select)의 별 배치 그대로. 옛 dipper.png 실측 좌표(1=오른쪽 아래 → 7=왼쪽 위)를
   좌우 반전한 배치이며, 그 반전은 의도한 것이다(글자 기둥이 오른쪽으로 갔다).
   ⚠️ 좌표의 x 나 y 를 뒤집어 방향을 바꾸려 들지 말 것 — 국자를 1→2→3→4 로 도는 방향이 반대가 되어
      다른 별자리가 된다. 방향은 아래 ROT(회전각)로만 손댄다. */
const NODES = [
  { n:1, x:  70, y: 70 }, { n:2, x:  74, y:389 }, { n:3, x: 436, y:468 },
  { n:4, x: 547, y:218 }, { n:5, x: 754, y: 99 }, { n:6, x:1019, y: 79 },
  { n:7, x:1269, y: 70 },
];
const EDGES = [[1,2],[2,3],[3,4],[4,1],[4,5],[5,6],[6,7]];  // 국자(1-2-3-4) + 손잡이(4-5-6-7)
const R = 28;
/* 레벨별 취득일(발자취) — 지금은 샘플. 실제 붙일 땐 서버에서 받은 값으로 교체 */
const DATES = { 1:'2026.03.02', 2:'2026.05.11', 3:'2026.07.15',
                4:'2026.09.20', 5:'2026.11.08', 6:'2027.01.17', 7:'2027.03.05' };

const SVGNS = 'http://www.w3.org/2000/svg';
const el = (t, a) => { const e = document.createElementNS(SVGNS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };

const ROTC = { x: 670, y: 269 };
const ROT = -30;   // 45° 는 국자가 세로로 서서 아래 별이 하단 테두리까지 내려갔다 → 30°(2026-08-06)

/* 회전을 **좌표에 먼저 먹인다**. 예전엔 <g transform=rotate> 로 통째로 돌리고 글자만 반대로 되돌렸는데,
   그러면 라벨의 정렬·여백 계산이 회전 전 좌표를 보게 돼서 각도를 바꿀 때마다 날짜가 잘리고 겹쳤다. */
const RAD = ROT * Math.PI / 180;
const P = NODES.map(p => {
  const dx = p.x - ROTC.x, dy = p.y - ROTC.y;
  return { n: p.n,
    x: ROTC.x + dx * Math.cos(RAD) - dy * Math.sin(RAD),
    y: ROTC.y + dx * Math.sin(RAD) + dy * Math.cos(RAD) };
});
const at = n => P.find(p => p.n === n);

/* 취득일 라벨 자리 — **손으로 박는다.** 별이 7개뿐이라 한 번 정하면 끝이고, 자동 계산(이웃 반대 방향)은
   손잡이처럼 이웃이 일직선인 별에서 옆 라벨과 겹친다.
   원칙: 그 별에 붙은 연결선의 반대쪽, 그리고 국자 안쪽(1-2-3-4 사각형 내부)이 아닌 바깥쪽.
   ⚠️ 위 ROT 을 바꾸면 별 위치가 통째로 움직이므로 이 7줄도 다시 잡아야 한다. */
const TW = 205;   // 날짜 한 줄의 대략적인 폭(여백 계산용)
const LABEL = {
  1: { dx:-44, dy: 12, anchor:'end'    },  // 국자 왼쪽 끝 — 왼쪽으로(1→2 선이 아래로 지나간다)
  2: { dx:  0, dy: 68, anchor:'middle' },  // 국자 바닥 — 아래로
  3: { dx: 46, dy: 12, anchor:'start'  },  // 국자 오른쪽 — 오른쪽으로
  4: { dx:-46, dy:-24, anchor:'end'    },  // 이음매 — 왼쪽 위(4→1 선 위로 띄운다)
  5: { dx:-46, dy: -8, anchor:'end'    },  // 손잡이 — 왼쪽 위. 오른쪽에 두면 글자 기둥을 침범한다
  6: { dx:-46, dy: -8, anchor:'end'    },  // 손잡이 — 5 와 같은 쪽
  7: { dx:  0, dy:-46, anchor:'middle' },  // 끝 별 — 위로(옆으로 빼면 GARA 로고에 붙는다)
};

/* 별 + 라벨이 전부 들어가는 최소 사각형 = viewBox. 좌표가 이미 회전된 값이라 최대·최소만 잡으면 된다. */
function refitViewBox(){
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  const hit = (x, y) => {
    if (x < minx) minx = x; if (x > maxx) maxx = x;
    if (y < miny) miny = y; if (y > maxy) maxy = y;
  };
  P.forEach(p => {
    const pad = R + 18;
    hit(p.x - pad, p.y - pad); hit(p.x + pad, p.y + pad);
    const L = LABEL[p.n], ax = p.x + L.dx, ay = p.y + L.dy;
    const x0 = L.anchor === 'start' ? ax : L.anchor === 'end' ? ax - TW : ax - TW / 2;
    hit(x0, ay - 28); hit(x0 + TW, ay + 10);
  });
  document.getElementById('dip').setAttribute('viewBox', `${minx} ${miny} ${maxx - minx} ${maxy - miny}`);
}

function draw(level){
  const g = document.getElementById('dip-g');
  g.textContent = '';
  refitViewBox();
  const lit = n => n <= level;   // 좌표가 이미 회전된 값이라 글자를 되돌릴 필요가 없다

  // ① 연결선 — 각인 선 조각(edge.webp)을 구간마다 회전·신축해 깐다. 링 앞에서 끊어 여백을 준다.
  const GAP = R + 12;
  EDGES.forEach(([a,b]) => {
    const p = at(a), q = at(b), on = lit(a) && lit(b);
    const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy);
    const seg = len - GAP * 2, th = 9;
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    const deg = Math.atan2(dy, dx) * 180 / Math.PI;
    g.appendChild(el('image', { href:'cert/edge.webp', x:-seg/2, y:-th/2, width:seg, height:th,
      preserveAspectRatio:'none', opacity: on ? 1 : 0.62, ...(on ? {} : { filter:'url(#ash)' }),
      transform:`translate(${mx},${my}) rotate(${deg})` }));
  });

  // ② 발광 별 — flare-gold.webp 의 빛 중심이 (0.502, 0.371) 지점이라 그만큼 보정
  P.filter(p => lit(p.n)).forEach(p => {
    const s = 430;
    g.appendChild(el('image', { href:'cert/flare-gold.webp', x:p.x-s*0.502, y:p.y-s*0.371, width:s, height:s }));
  });

  // ③ 링 + 숫자 + 취득일 — 레벨과 무관하게 항상 같은 좌표
  P.forEach(p => {
    const on = lit(p.n);
    g.appendChild(el('circle', { cx:p.x, cy:p.y, r:R, fill:'rgba(3,11,20,.72)' }));
    const rw = 637 / 630 * (R * 2.45), rh = R * 2.45;
    g.appendChild(el('image', { href:'cert/node.webp', x:p.x-rw/2, y:p.y-rh/2, width:rw, height:rh,
      opacity: on ? 1 : 0.72, ...(on ? {} : { filter:'url(#ash)' }) }));
    const num = el('text', { x:p.x, y:p.y+11, 'text-anchor':'middle',
      'font-family':'NotoSerifKR,serif', 'font-size':32, 'font-weight': on ? 700 : 500,
      fill: on ? '#fff4dd' : 'rgba(206,216,230,.82)' });
    num.textContent = p.n; g.appendChild(num);

    const L = LABEL[p.n], d = DATES[p.n];
    if (on && d) {
      const dt = el('text', { x:p.x + L.dx, y:p.y + L.dy, 'text-anchor':L.anchor,
        'font-family':'NotoSerifKR,serif', 'font-size':26, 'letter-spacing':1.8,
        'font-weight':400, fill:'url(#goldg)' });
      dt.textContent = d.replace(/\./g, ' · '); g.appendChild(dt);
    }
    // 미달성 레벨은 은색 링만으로 구분된다
  });
}

/* ── 파라미터 : ?name=닉네임&level=3 ─────────────────── */
const qs = new URLSearchParams(location.search);
const qName = (qs.get('name') || '').trim();
if (qName) document.getElementById('name').textContent = qName.slice(0, 12);

/* 레벨 버튼 */
const lvBox = document.getElementById('lv');
for (let i = 1; i <= 7; i++){
  const b = document.createElement('button');
  b.textContent = i; b.onclick = () => setLevel(i);
  lvBox.appendChild(b);
}
function setLevel(n){
  const numEl = document.getElementById('lv-num');
  numEl.src = `cert/num-${n}.png`; numEl.alt = String(n);
  [...lvBox.children].forEach((b,i) => b.setAttribute('aria-pressed', i+1 === n));
  draw(n);
}

/* 뷰포트에 맞춰 축소. 북두칠성 박스는 CSS(.dipper)가 단일 출처 — 여기서 다시 계산하지 않는다
   (React 판 .lc-dipbox 와 값을 맞춰야 해서 JS 로 덮어쓰면 두 곳이 어긋난다). */
const stage = document.getElementById('stage');
const H = 900;
function fit(){
  const s = Math.min(1, (window.innerWidth - 24) / 1448);
  stage.style.transform = `scale(${s})`;
  stage.parentElement.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

const qLevel = Math.min(7, Math.max(1, parseInt(qs.get('level'), 10) || 3));
setLevel(qLevel);
</script>
</body>
</html>
