<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>닿아라 CARI</title>
<style>
:root{
  --page:#09172c; --bg:#f7f9fc; --ink:#172642; --sub:#71809a;
  --brand:#004ac6; --brand-hi:#1b55d0; --line:#e6e9f3;
  --good:#12b58c; --bad:#f2664f; --skip:#e59b17;
  --cream:#ece9e0;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:radial-gradient(120% 80% at 50% -10%, #24466e 0%, #09172c 68%);
  color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
  display:flex; align-items:center; justify-content:center; min-height:100%; overflow:hidden; user-select:none;
}
.stage{
  position:relative; width:min(460px,100vw); height:min(860px,100vh);
  display:flex; flex-direction:column; background:var(--bg);
  box-shadow:0 0 70px rgba(0,0,0,.48); overflow:hidden;
}
.art{width:100%;height:100%;display:block;}

/* HUD */
.hud{position:relative;display:flex;align-items:center;gap:9px;height:65px;margin:6px 10px 2px;padding:12px 31px 11px;z-index:5;
  background:url('/games/reach-cari-hud-v4.webp') center/100% 100% no-repeat;color:#fff;filter:drop-shadow(0 6px 8px rgba(0,20,60,.3));}
.hud .cari-mini{display:none;}
.hud .lvlbox{display:flex;flex-direction:column;line-height:1.05;}
.hud .lvlbox b{font-size:17px;color:#fff;text-shadow:0 1px 3px #001b51;}
.hud .lvlbox span{font-size:11.5px;color:#bfe9ff;margin-top:3px;}
.hud .goalpill{margin-left:auto;width:26%;color:#ffe273;font-weight:900;font-size:13px;padding:7px 0;text-align:center;text-shadow:0 0 8px #c67a00;}
.dofrow{display:none;}
.dofrow .dl{font-size:10.5px;color:#61738e;font-weight:900;}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#d6ddec;margin-left:4px;vertical-align:middle;}
.dot.on{background:var(--brand);}

/* play area */
.field{position:relative; flex:1; margin:2px 12px 6px; border-radius:18px; overflow:hidden;
  background:#eaf2fb url('/games/reach-cari-lab-v2.webp') center/cover no-repeat; border:1px solid #cddced;
  box-shadow:inset 0 0 30px rgba(14,65,125,.12),0 8px 24px rgba(30,60,110,.12);}
.field svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
/* 튜토리얼 — 지어라(build-cari)와 같은 방식: 지금 할 것 하나만 빛나고, 안내 한 줄이 위에 뜬다. 진입점은 인트로·게임화면 둘. */
.tutmsg{position:absolute;left:10px;right:10px;top:10px;z-index:6;display:none;padding:9px 12px;border-radius:12px;
  background:linear-gradient(#143563,#0d2145);border:1.5px solid rgba(238,233,220,.5);color:#e9f7ff;font-size:12.5px;font-weight:800;line-height:1.35;
  box-shadow:0 4px 12px rgba(0,20,60,.35);text-align:center;}
.tutmsg b{color:#ffd253;}
.tutmsg.on{display:block;}
.tut-help{position:absolute;right:10px;bottom:10px;z-index:6;width:30px;height:30px;padding:0;border-radius:50%;cursor:pointer;
  border:1.5px solid rgba(238,233,220,.5);background:linear-gradient(#143563,#0d2145);
  color:#ffd253;font:900 15px/1 system-ui,-apple-system,sans-serif;
  box-shadow:0 3px 0 rgba(4,14,32,.4),inset 0 1px 0 rgba(255,255,255,.16);}
.tut-help.quit{color:#ffb0a0;font-size:14px;}
@keyframes tutring{
  0%,100%{box-shadow:0 0 0 3px #ffd253,0 0 10px 2px rgba(255,210,83,.5)}
  50%    {box-shadow:0 0 0 3px #ffd253,0 0 18px 6px rgba(255,210,83,.95)}
}
.jrow.tut-on{border-radius:10px;animation:tutring 1.15s ease-in-out infinite;}
/* SVG 안의 지목(관절·목표)은 box-shadow 가 안 먹어서 링을 그려 깜빡인다. */
.tut-ring{fill:none;stroke:#ffd253;stroke-width:3;animation:tutsvg 1.15s ease-in-out infinite;}
@keyframes tutsvg{0%,100%{opacity:.45}50%{opacity:1}}

/* controls */
.controls{position:relative;flex:0 0 230px;padding:0;z-index:5;background:url('/games/reach-cari-controls-v5.webp') center/100% 100% no-repeat;color:#fff;filter:drop-shadow(0 -5px 10px rgba(0,20,60,.28));}
/* 남은 시간 — 필드 위쪽 가운데 칩. 손끝 모드는 2026-09-11 에 뺐다(문제를 대신 풀어주는 버튼이라 실력 측정이 안 됐다).
   ⚠️ 컨트롤 판 위 홈(옛 모드 토글 자리)에 넣었더니 홈 그림의 테두리에 글자가 잘리고 막대가 그림에 그려진 막대 위에 겹쳤다 → 필드로 옮김.
   튜토리얼 중엔 숨긴다(그 자리에 안내가 뜬다). */
.timebar{position:absolute;left:38px;right:38px;top:12px;height:35px;z-index:6;display:flex;align-items:center;padding:1px;margin:0;}
.timebar.hide{visibility:hidden;}
.timebar>*{flex:1;display:grid;place-items:center;height:100%;}
.timebar .tb-lab{font-size:12px;font-weight:900;color:#8ec9ed;white-space:nowrap;}
.timebar .tb-track{display:none;}
.timebar b{font-size:16px;font-weight:900;color:#ffe273;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #001b51;}
.timebar.crit b{color:#ff8a78;animation:tutsvg .6s ease-in-out infinite;}
.jointpanel{position:absolute;left:39px;right:39px;top:52px;height:112px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:0;}
.jrow{display:flex;align-items:center;gap:10px;}
.jrow label{font-size:11.5px;font-weight:900;color:#d7efff;width:64px;line-height:1.05;text-shadow:0 1px 2px #001735;}
.jrow input[type=range]{flex:1; accent-color:var(--brand); height:22px;}
.jointpanel.dense{gap:1px;}
.jointpanel.dense .jrow input[type=range]{height:16px;}
.jointpanel.dense .jrow label{font-size:10.5px;width:56px;}
.jointpanel.dense .jrow .deg{font-size:11px;}
.jointpanel.dense7{gap:0;}
.jointpanel.dense7 .jrow input[type=range]{height:14px;}
.jointpanel.dense7 .jrow label{font-size:10px;}
.jrow .deg{font-size:12px;color:#ffe273;font-weight:900;width:44px;text-align:right;
  font-variant-numeric:tabular-nums;}
.jrow.hint{border-radius:10px;background:rgba(255,205,53,.16);box-shadow:0 0 0 1px rgba(255,220,92,.7),0 0 14px rgba(255,191,31,.48);animation:hintPulse .65s ease-in-out 3;}
.jrow.hint label,.jrow.hint .deg{color:#fff09a;text-shadow:0 0 7px #d88b00;}
@keyframes hintPulse{50%{filter:brightness(1.35);transform:scale(1.015)}}
.btnrow{position:absolute;left:39px;right:39px;bottom:8px;height:48px;display:flex;gap:7px;margin:0;}
.btn{flex:1; padding:13px 10px; border-radius:26px; border:0; cursor:pointer;
  background:linear-gradient(120deg,#1b55d0,#004ac6); color:#fff; font-size:15px; font-weight:800;
  box-shadow:0 8px 20px rgba(0,74,198,.28);}
.btn.ghost{background:#eef1f8;color:var(--brand);box-shadow:none;}
.btnrow .btn{height:49px;margin:0;padding:0 8px;border-radius:0;background:url('/games/reach-cari-start-btn-v3.webp') center/100% 100% no-repeat;color:#fff;font-size:14px;text-shadow:0 2px 4px #001b55;box-shadow:none;filter:drop-shadow(0 5px 7px rgba(0,12,45,.35));}
.btn:active{transform:scale(.97);}

/* overlays */
.overlay{position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:26px;
  background:url('/games/reach-cari-intro-bg-v3.webp') center/cover no-repeat;color:#fff;}
.overlay.hide{display:none;}
.floaty{width:190px;height:205px;object-fit:contain;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 16px 18px rgba(0,0,0,.35));}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.t1,.t2{font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:35px;font-weight:900;letter-spacing:-2px;-webkit-text-stroke:0;filter:none;}
.t1{color:#132d55;text-shadow:0 2px 0 rgba(255,255,255,.9),0 4px 9px rgba(19,45,85,.22);}
.t2{background:none;-webkit-background-clip:initial;background-clip:initial;-webkit-text-fill-color:#0874d8;color:#0874d8;text-shadow:0 2px 0 #dff5ff,0 4px 9px rgba(0,74,160,.25);}
.title{margin:8px 0 3px;line-height:1.12;}
.tag{color:#25456f;font-size:14.5px;margin:2px 0 15px;font-weight:900;text-shadow:0 1px 0 rgba(255,255,255,.9);}
.rules{display:grid;grid-template-rows:repeat(3,1fr);align-items:center;gap:0;width:min(342px,88vw);height:150px;
  background:url('/games/reach-cari-rule-panel-v3.webp') center/100% 100% no-repeat;padding:19px 31px 18px;text-align:left;
  filter:drop-shadow(0 11px 16px rgba(0,20,60,.3));}
.rules div{font-size:12.5px;font-weight:800;color:#e9f7ff;margin:0;display:flex;gap:10px;align-items:center;line-height:1.25;text-shadow:0 1px 3px #00173c;}
.rules>div>b{flex:none;width:25px;height:25px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#0874d8;
  border:1px solid #84e6ff;box-shadow:inset 0 0 0 2px rgba(132,230,255,.12),0 0 8px rgba(38,181,255,.35);text-shadow:none;}
.rules div span b{color:#ffe477;}
.overlay #btnStart{width:190px;height:60px;margin-top:12px;padding:0;border-radius:0;background:url('/games/reach-cari-start-btn-v3.webp') center/100% 100% no-repeat;box-shadow:none;text-shadow:0 2px 4px #001b55;filter:drop-shadow(0 9px 11px rgba(0,15,55,.45));}
.overlay #btnTutIntro{flex:0 0 auto;margin-top:8px;padding:9px 24px;background:rgba(255,255,255,.88);color:#0874d8;font-size:13.5px;box-shadow:0 4px 10px rgba(0,20,60,.18);}
.result-console{position:relative;width:min(330px,78vw);height:min(430px,55vh);background:url('/games/reach-cari-result-console-v3.webp') center/100% 100% no-repeat;filter:drop-shadow(0 18px 24px rgba(0,10,42,.55));}
#ovResult .floaty{position:absolute;top:6%;left:50%;transform:translateX(-50%);width:145px;height:155px;animation:none;}
#ovResult .badge{position:absolute;top:40%;left:0;width:100%;font-size:29px;color:#6fffd2;text-shadow:0 0 12px #00b97e;}
#ovResult .scorebox{position:absolute;top:51%;left:12%;width:76%;margin:0;padding:11px 10px;background:transparent;border:0;box-shadow:none;color:#fff;}
#ovResult .scorebox .big{color:#fff;font-size:17px;text-shadow:0 2px 4px #00102f;} #ovResult .scorebox .take{color:#e5f6ff;font-size:11.5px;background:rgba(0,20,60,.45);border-radius:9px;padding:7px 8px;text-shadow:0 1px 3px #00102f;}
#ovResult .scorebox .take b{color:#ffe47d;}
#ovResult .ovbtns{position:absolute;left:8%;bottom:9%;width:84%;height:52px;margin:0;display:block;} #ovResult .ovbtns .btn{position:absolute;display:grid;place-items:center;height:50px;margin:0;padding:0!important;line-height:1;box-shadow:none;background:transparent;color:#fff;text-align:center;font-size:18px;}
#ovResult #btnRetry{left:-1%;top:2px;width:52%;} #ovResult #btnNext{left:47%;top:2px;width:52%;}
.badge{font-size:28px;font-weight:900;margin:6px 0 2px;}
.badge.win{color:var(--good);} .badge.lose{color:var(--bad);}
.scorebox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 26px;margin:12px 0 4px;
  box-shadow:0 6px 18px rgba(70,90,140,.10);max-width:340px;}
.scorebox .big{font-size:15px;font-weight:800;color:var(--ink);}
.scorebox .take{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.5;}
.scorebox .take b{color:var(--brand);}
.ovbtns{display:flex;gap:10px;margin-top:16px;}
.ovbtns .btn{padding:13px 30px;flex:0 0 auto;}
.toast{position:absolute;top:96px;left:50%;transform:translateX(-50%);z-index:15;
  background:var(--bad);color:#fff;font-weight:800;font-size:13px;padding:9px 18px;border-radius:20px;
  box-shadow:0 6px 16px rgba(0,0,0,.18);opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<script src="i18n.js"></script>
<div class="stage" id="stage">

  <!-- HUD -->
  <div class="hud">
    <img class="cari-mini" id="hudCari" src="/games/reach-cari-hero-v2.webp" alt=""/>
    <div class="lvlbox"><b id="lvlName">레벨 1</b><span id="lvlSub"></span></div>
    <div class="goalpill" id="goalPill">별에 닿아라</div>
  </div>
  <div class="dofrow"><span class="dl">움직이는 관절</span><span id="dofDots"></span></div>

  <!-- PLAY FIELD -->
  <div class="field">
    <svg id="svg" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="tutmsg" id="tutMsg"></div>
    <!-- 튜토리얼 두 번째 진입점 — 게임에 들어간 뒤에도 다시 볼 수 있어야 한다(한 번 봐도 이해 못 할 수 있다). -->
    <button class="tut-help" id="btnTut" type="button" aria-label="튜토리얼" data-i18n-attr="aria-label:reach.tutorial">?</button>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="timebar" id="timebar"><span class="tb-lab" data-i18n="reach.time_left">남은 시간</span><div class="tb-track"><i id="tbFill"></i></div><b id="tbNum">30</b></div>
    <div class="jointpanel" id="panel"></div>
    <div class="btnrow">
      <button class="btn ghost" id="btnReset" data-i18n="reach.reset">처음 자세</button>
      <button class="btn" id="btnHint" data-i18n="reach.hint">관절 힌트</button>
    </div>
  </div>

  <div class="toast" id="toast">충돌!</div>

  <!-- START OVERLAY -->
  <div class="overlay" id="ovStart">
    <img class="floaty" id="startCari" src="/games/reach-cari-hero-v2.webp" alt="CARI와 로봇팔"/>
    <div class="title"><span class="t1" data-i18n="reach.title">닿아라</span> <span class="t2">CARI</span></div>
    <div class="tag" data-i18n="reach.tagline">로봇팔을 움직여 별에 닿아라!</div>
    <div class="rules">
      <div><b>1</b><span data-i18n="reach.rule1">관절을 돌려 손끝을 <b>목표에 맞춰요</b></span></div>
      <div><b>2</b><span data-i18n="reach.rule2">시간 안에 못 닿으면 <b>게임 끝</b></span></div>
      <div><b>3</b><span data-i18n="reach.rule3">벽에 닿지 않게 <b>피해서 이동!</b></span></div>
    </div>
    <button class="btn" id="btnStart" style="margin-top:20px;padding:15px 50px;flex:0 0 auto;" data-i18n="reach.start">시작하기</button>
    <button class="btn" id="btnTutIntro" type="button" data-i18n="reach.tutorial">튜토리얼</button>
  </div>

  <!-- RESULT OVERLAY -->
  <div class="overlay hide" id="ovResult">
    <div class="result-console">
      <img class="floaty" id="resCari" src="/games/reach-cari-win-v3.webp" alt="기뻐하는 CARI"/>
      <div class="badge win" id="resBadge">목표 포착!</div>
      <div class="scorebox">
        <div class="big" id="resTitle">레벨 클리어</div>
        <div class="take" id="resTake"></div>
      </div>
      <div class="ovbtns">
        <button class="btn ghost" id="btnRetry">다시</button>
        <button class="btn" id="btnNext">다음</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ================= CARI mascot ================= */
function charSVG(suit,o={}){
  const [body,shade,ear]=suit; const isCari=o.cari, dir=o.dir||0, shock=o.shock;
  const gid='c'+shade.slice(1)+(isCari?'m':'')+(shock?'k':'')+(dir+1)+Math.random().toString(36).slice(2,6);
  const ex=dir*2.2;
  const eyes = shock
    ? `<path d="M22.5 25.5 l5.5 5 M28 25.5 l-5.5 5" stroke="#8fd0ff" stroke-width="2.3" stroke-linecap="round"/>
       <path d="M36 25.5 l5.5 5 M41.5 25.5 l-5.5 5" stroke="#8fd0ff" stroke-width="2.3" stroke-linecap="round"/>`
    : `<ellipse cx="${25.5+ex}" cy="27" rx="3.7" ry="4.8" fill="#d3ecff"/>
       <ellipse cx="${38.5+ex}" cy="27" rx="3.7" ry="4.8" fill="#d3ecff"/>
       <ellipse cx="${24.6+ex}" cy="25.2" rx="1.15" ry="1.5" fill="#fff"/>
       <ellipse cx="${37.6+ex}" cy="25.2" rx="1.15" ry="1.5" fill="#fff"/>`;
  const mouth = shock
    ? `<ellipse cx="32" cy="35.5" rx="2.8" ry="3.4" fill="#2b5f8c"/>`
    : `<path d="M28.8 34 q3.2 2.8 6.4 0" stroke="#7fc4ff" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  const antenna = isCari ? `
    <path d="M32 10 v-4.4" stroke="#7fa8d8" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="32" cy="3.8" r="3" fill="#5b90ff"/>
    <ellipse cx="32" cy="3.8" rx="5.7" ry="1.9" fill="none" stroke="#9cc0ff" stroke-width="1.2" transform="rotate(-18 32 3.8)"/>` : '';
  const badge = isCari ? `
    <rect x="24" y="45" width="16" height="8.5" rx="3" fill="#fdfbf5" stroke="${shade}" stroke-width=".9"/>
    <text x="32" y="51.3" font-size="5.4" font-weight="900" text-anchor="middle" fill="#8fb0e2" font-family="system-ui,sans-serif">CARI</text>` : '';
  return `<svg class="art" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs><radialGradient id="${gid}" cx="38%" cy="26%" r="80%">
      <stop offset="0" stop-color="#fff" stop-opacity=".62"/>
      <stop offset="42%" stop-color="${body}"/><stop offset="100%" stop-color="${shade}"/>
    </radialGradient></defs>
    <ellipse cx="32" cy="58.5" rx="16" ry="3.4" fill="rgba(0,0,0,.32)"/>
    ${antenna}
    <circle cx="12.8" cy="15.5" r="8.6" fill="${body}" stroke="${shade}" stroke-width="1.2"/>
    <circle cx="51.2" cy="15.5" r="8.6" fill="${body}" stroke="${shade}" stroke-width="1.2"/>
    <circle cx="12.8" cy="15.5" r="4.6" fill="${ear}"/><circle cx="51.2" cy="15.5" r="4.6" fill="${ear}"/>
    <path d="M32 8 C46.5 8 54 17.5 54 30 C54 38 52.4 43 50.4 47.4 C49.6 53.6 45 57 32 57
             C19 57 14.4 53.6 13.6 47.4 C11.6 43 10 38 10 30 C10 17.5 17.5 8 32 8 Z"
          fill="url(#${gid})" stroke="${shade}" stroke-width="1.3"/>
    <ellipse cx="32" cy="28" rx="15.2" ry="14.2" fill="#141a2b"/>
    <ellipse cx="26" cy="19.5" rx="6.4" ry="3.4" fill="#fff" opacity=".13"/>
    ${eyes}${mouth}${badge}</svg>`;
}
const CARI_SUIT=['#f4efe4','#cfc6b4','#9fb6de'];

/* ================= Level data ================= */
// base at (bx,by) in 400x520 svg coords. angles in degrees (absolute per-joint delta chained).
// segLens list; jointLimits [min,max] absolute? we use relative angle per joint w/ limits.
// time = 제한시간(초). 안 적으면 DEFAULT_TIME. 난이도는 전부 레벨 데이터가 정한다(배치 + 시간) — 배수 사다리는 안 건다(2026-09-11).
// ⛔ 아래 배열의 기하(base·segs·limits·target·obstacles·time)는 서버 `_shared/reach-levels.ts` 와 **sync pair** 다 —
//    서버가 "그 각도로 정말 닿았나" 를 다시 계산해서 랭킹을 만든다. 레벨을 넣거나 고치면 서버 쪽도 같이.
//    tests/minigame-replay.mjs 가 두 파일을 대조한다(name·sub·goal·take 같은 문구는 대조 안 함).
const D2R=Math.PI/180, R2D=180/Math.PI;
/* 문구는 전부 사전(i18n.js 의 reach.*)에서 온다 — 레벨 문구는 reach.lv{n}.sub/goal/take. 사전에 없으면 LEVELS 의 한국어로 떨어진다. */

/* ================= State ================= */
let LI=0, L=null, ang=[], won=false, rafId=0;
let cleared=0, runLog=[], runT0=0, levelStartT=0;   // 이번 판에서 깬 레벨 수 / 레벨별 기록(서버 재채점용) / 판 시작·레벨 시작 시각

let tutOn=false, tutRound=0, tutIdx=0, tutFrom='intro', tutReturnLI=0, tutTimer=null, tutRef=null, tutDragged=false;
const nowMs=()=>Math.round(performance.now()-runT0);
const svg=document.getElementById('svg');
const NS='http://www.w3.org/2000/svg';

function fkPoints(a){
  // returns array of points from base to tip
  const pts=[{x:L.base.x,y:L.base.y}];
  let acc=0;
  for(let i=0;i<a.length;i++){
    acc+=a[i]*D2R;
    const p=pts[i];
    pts.push({x:p.x+L.segs[i]*Math.cos(acc), y:p.y+L.segs[i]*Math.sin(acc)});
  }
  return pts;
}

/* segment vs rect collision */
function segRect(p1,p2,r){
  // expand rect slightly (arm thickness)
  const pad=6;
  const rx=r.x-r.w/2-pad, ry=r.y-r.h/2-pad, rw=r.w+pad*2, rh=r.h+pad*2;
  // Liang-Barsky style: check if segment intersects axis-aligned rect
  return segAABB(p1.x,p1.y,p2.x,p2.y,rx,ry,rx+rw,ry+rh);
}
function segAABB(x1,y1,x2,y2,xmin,ymin,xmax,ymax){
  // if either endpoint inside
  const inside=(x,y)=>x>=xmin&&x<=xmax&&y>=ymin&&y<=ymax;
  if(inside(x1,y1)||inside(x2,y2)) return true;
  // test against 4 edges
  return segSeg(x1,y1,x2,y2,xmin,ymin,xmax,ymin)||
         segSeg(x1,y1,x2,y2,xmax,ymin,xmax,ymax)||
         segSeg(x1,y1,x2,y2,xmax,ymax,xmin,ymax)||
         segSeg(x1,y1,x2,y2,xmin,ymax,xmin,ymin);
}
function segSeg(a,b,c,d,p,q,r,s){
  const d1=(r-p)*(b-q)-(s-q)*(a-p);
  const d2=(r-p)*(d-q)-(s-q)*(c-p);
  const d3=(c-a)*(q-b)-(d-b)*(p-a);
  const d4=(c-a)*(s-b)-(d-b)*(r-a);
  if(((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0))) return true;
  return false;
}
function armHitsAny(pts){
  for(const ob of L.obstacles){
    for(let i=0;i<pts.length-1;i++){
      if(segRect(pts[i],pts[i+1],ob)) return true;
    }
  }
  // walls of field (with margin)
  for(let i=1;i<pts.length;i++){
    if(pts[i].x<4||pts[i].x>396||pts[i].y<4||pts[i].y>516) return true;
  }
  return false;
}

/* ================= CCD inverse kinematics ================= */
function ccdSolve(a, goal){
  // work on a copy, iterate; returns new angle array respecting limits
  const A=a.slice();
  for(let iter=0;iter<24;iter++){
    // later iterations use higher gain so the tip snaps in satisfyingly
    const gain = iter<3 ? 0.5 : 0.85;
    for(let j=A.length-1;j>=0;j--){
      const pts=fkPoints(A);
      const tip=pts[pts.length-1];
      const piv=pts[j];
      const v1x=tip.x-piv.x, v1y=tip.y-piv.y;
      const v2x=goal.x-piv.x, v2y=goal.y-piv.y;
      const a1=Math.atan2(v1y,v1x), a2=Math.atan2(v2y,v2x);
      let delta=(a2-a1)*R2D;
      // normalize
      while(delta>180)delta-=360; while(delta<-180)delta+=360;
      delta*=gain;
      const nv=clamp(A[j]+delta, L.limits[j][0], L.limits[j][1]);
      A[j]=nv;
    }
    const pts=fkPoints(A);
    const tip=pts[pts.length-1];
    if(Math.hypot(tip.x-goal.x,tip.y-goal.y)<0.8) break;
  }
  return A;
}

/* ================= Rendering ================= */
function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

/* 판정점 = 손끝이 아니라 **집게 중심**이다. 집게 그림(48px)이 마지막 마디 끝에서 앞으로 40px 뻗어 있어서, 손끝 점으로 재면
   집게가 별을 감싸고 있어도 "안 닿음" 이 된다(2026-09-14 지적: 버그로 보인다). GRIP = 그림에서 잰 집게 중심까지의 거리.
   ⛔ 서버 `_shared/reach-levels.ts` 의 REACH_GRIP 과 sync pair — 한쪽만 바꾸면 게임은 클리어인데 서버는 400 이다. */
const GRIP=26;
function gripPoint(pts){
  const t=pts[pts.length-1], p=pts[pts.length-2], len=Math.hypot(t.x-p.x,t.y-p.y)||1;
  return { x:t.x+(t.x-p.x)/len*GRIP, y:t.y+(t.y-p.y)/len*GRIP };
}
/** 자세 하나 판정(그리지 않음) — 충돌·닿음. */
function judge(A){
  const pts=fkPoints(A), hit=armHitsAny(pts), g=gripPoint(pts), tg=L.target;
  const dist=Math.hypot(g.x-tg.x,g.y-tg.y);
  return { pts, hit, grip:g, dist, reached: dist<tg.r+9 && !hit };
}
/* 떨림(noise)은 뺐다(2026-09-14 지시 "멀미난다"). 한때 뒤 세 관절을 흔들고 붙잡기 0.7초로 판정했었다 — 되살릴 거면
   좁은 통로 레벨은 떨림 폭을 레벨마다 맞춰야 한다(정답 자세에서도 벽에 닿으면 영영 못 깬다). */
function draw(A){
  A=A||ang;
  const {pts,hit,grip,dist,reached}=judge(A);
  const tip=pts[pts.length-1];
  const tg=L.target;
  let s='';
  // grid backdrop faint
  s+=`<defs>
    <radialGradient id="tgg" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="${tg.kind==='batt'?'#ffd45e':'#ffe08a'}"/>
    </radialGradient>
    <linearGradient id="armMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#69c7ff"/><stop offset=".35" stop-color="#1471e8"/><stop offset="1" stop-color="#003d9f"/>
    </linearGradient>
    <filter id="armShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#071b38" flood-opacity=".38"/>
    </filter>
    <filter id="goalGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffc629" flood-opacity=".95"/>
    </filter>
    <filter id="hitRed" x="-35%" y="-35%" width="170%" height="170%">
      <feColorMatrix type="matrix" values="1.35 0 0 0 .28  0 .08 0 0 0  0 0 .08 0 0  0 0 0 1 0"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff1f2d" flood-opacity="1"/>
    </filter>
    <linearGradient id="obMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52647e"/><stop offset=".16" stop-color="#263750"/>
      <stop offset=".72" stop-color="#111b2d"/><stop offset="1" stop-color="#354a68"/>
    </linearGradient>
    <linearGradient id="obEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55d9ff"/><stop offset=".5" stop-color="#0875dc"/><stop offset="1" stop-color="#00377e"/>
    </linearGradient>
    <pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <rect width="8" height="16" fill="#ffc321"/><rect x="8" width="8" height="16" fill="#1b1d24"/>
    </pattern>
  </defs>`;

  // reach-space hint circle (max reach)
  const maxR=L.segs.reduce((s,v)=>s+v,0);
  s+=`<circle cx="${L.base.x}" cy="${L.base.y}" r="${maxR}" fill="none" stroke="#c9d5ec" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"/>`;

  // obstacles
  for(const ob of L.obstacles){
    s+=obstacleMarkup(ob);
  }

  // target
  if(tg.kind==='star'){
    const sz=tg.r*3.2;
    s+=`<image href="/games/reach-cari-target-star-v3.webp" x="${tg.x-sz/2}" y="${tg.y-sz/2}" width="${sz}" height="${sz}" filter="url(#goalGlow)"/>`;
  }else{
    const bw=tg.r*2, bh=tg.r*3.1;
    s+=`<image href="/games/reach-cari-target-battery-v3.webp" x="${tg.x-bw/2}" y="${tg.y-bh/2}" width="${bw}" height="${bh}"/>`;
  }

  // arm segments
  const armCol=hit?'#f2664f':'#004ac6';
  const armColHi=hit?'#f78b78':'#3b74e0';
  s+=`<g filter="${hit?'url(#hitRed)':'url(#armShadow)'}">`;
  for(let i=0;i<pts.length-1;i++){
    const p1=pts[i],p2=pts[i+1];
    const len=Math.hypot(p2.x-p1.x,p2.y-p1.y), rot=Math.atan2(p2.y-p1.y,p2.x-p1.x)*R2D;
    s+=`<image href="/games/reach-cari-arm-link-v4.webp" x="0" y="-11" width="${len}" height="22"
      preserveAspectRatio="none" transform="translate(${p1.x} ${p1.y}) rotate(${rot})"/>`;
    if(hit) s+=`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#ff1727" stroke-width="24" stroke-linecap="round" opacity=".82"/>`;
  }
  s+='</g>';
  // base mount: draw it before the base joint so both pieces overlap as one mechanism
  s+=`<image href="/games/reach-cari-arm-base-v3.webp" x="${L.base.x-38}" y="${L.base.y-10}" width="76" height="59" preserveAspectRatio="xMidYMid meet" filter="${hit?'url(#hitRed)':''}"/>`;

  // joints: cover both segment ends with one larger bearing
  for(let i=0;i<pts.length-1;i++){
    s+=`<image href="/games/reach-cari-arm-joint-v3.webp" x="${pts[i].x-18}" y="${pts[i].y-18}" width="36" height="36" preserveAspectRatio="xMidYMid meet" filter="${hit?'url(#hitRed)':''}"/>`;
    // joint drag handles
    s+=`<circle class="jhandle" data-j="${i}" cx="${pts[i].x}" cy="${pts[i].y}" r="20" fill="transparent" style="cursor:grab"/>`;
  }
  // gripper / CARI tip
  const tipAngle=Math.atan2(pts[pts.length-1].y-pts[pts.length-2].y, pts[pts.length-1].x-pts[pts.length-2].x)*R2D;
  s+=gripper(tip.x,tip.y,tipAngle,reached,hit);
  if(reached) s+=`<image href="/games/reach-cari-contact-vfx-v3.webp" x="${grip.x-34}" y="${grip.y-34}" width="68" height="68"/>`;
  // 튜토리얼 지목 — 관절 하나 또는 목표
  const ts=tutStep();
  if(ts && ts.joint!=null) s+=`<circle class="tut-ring" cx="${pts[ts.joint].x}" cy="${pts[ts.joint].y}" r="27"/>`;
  if(ts && ts.target) s+=`<circle class="tut-ring" cx="${tg.x}" cy="${tg.y}" r="${tg.r+18}"/>`;
  svg.innerHTML=s;
  updatePanel(hit);
  if(hit && !window._wasHit) toast(T('reach.collide'));
  window._wasHit=hit;
  if(tutOn){ tutCheck(hit,reached); return {hit,reached,dist}; }   // 튜토리얼은 기록·타이머 없이 단계만 진행
  if(reached && !won){ won=true; levelCleared(); setTimeout(()=>result(true), 260); }
  return {hit,reached,dist};
}

function obstacleMarkup(ob){
  const x=ob.x-ob.w/2, y=ob.y-ob.h/2;
  const horizontal=ob.w>=ob.h;
  const radius=Math.min(7,ob.w/4,ob.h/4);
  let h=`<g filter="url(#armShadow)">
    <rect x="${x}" y="${y}" width="${ob.w}" height="${ob.h}" rx="${radius}" fill="url(#obEdge)"/>
    <rect x="${x+2}" y="${y+2}" width="${Math.max(1,ob.w-4)}" height="${Math.max(1,ob.h-4)}" rx="${Math.max(1,radius-2)}" fill="url(#obMetal)"/>
    <path d="M${x+radius} ${y+3} H${x+ob.w-radius}" stroke="#9cecff" stroke-width="1.2" opacity=".65"/>`;
  if(horizontal){
    const bh=Math.min(7,Math.max(4,ob.h*.32));
    h+=`<rect x="${x+5}" y="${y+ob.h-bh-2}" width="${Math.max(1,ob.w-10)}" height="${bh}" rx="2" fill="url(#hazard)"/>`;
  }else{
    const bw=Math.min(7,Math.max(4,ob.w*.32));
    h+=`<rect x="${x+ob.w-bw-2}" y="${y+5}" width="${bw}" height="${Math.max(1,ob.h-10)}" rx="2" fill="url(#hazard)"/>`;
  }
  if(ob.w>34) h+=`<circle cx="${x+7}" cy="${y+7}" r="2" fill="#a9bdd4"/><circle cx="${x+ob.w-7}" cy="${y+7}" r="2" fill="#a9bdd4"/>`;
  return h+'</g>';
}

function starPath(cx,cy,r,fill){
  let pth='';
  for(let i=0;i<10;i++){
    const rr=i%2===0?r:r*0.44;
    const a=(-90+i*36)*D2R;
    pth+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1)+' ';
  }
  pth+='Z';
  return `<path d="${pth}" fill="${fill}" stroke="#c98f00" stroke-width="1.5"/>`;
}

function gripper(x,y,angDeg,reached,hit){
  return `<image href="/games/reach-cari-arm-gripper-v3.webp" x="-8" y="-18" width="48" height="36"
    preserveAspectRatio="xMidYMid meet" transform="translate(${x} ${y}) rotate(${angDeg})" filter="${hit?'url(#hitRed)':''}"/>`;
}

/* joint sliders panel (FK) / tip hint (IK) */
function updatePanel(hit){
  const panel=document.getElementById('panel');
  // build sliders once, then update values
  if(panel.dataset.fk!==String(ang.length)){
    panel.dataset.fk=String(ang.length);
    let h='';
    const jointNames=ang.length===2?[T('reach.joint.bottom'),T('reach.joint.top')]:
      ang.length===3?[T('reach.joint.bottom'),T('reach.joint.middle'),T('reach.joint.wrist')]:
      [T('reach.joint.bottom'),...Array.from({length:ang.length-2},(_,k)=>T('reach.joint.mid_n',{n:k+1})),T('reach.joint.wrist')];
    panel.classList.toggle('dense', ang.length>4);   // 5~6개는 줄을 촘촘히 — 안 그러면 판 밖으로 넘친다
    panel.classList.toggle('dense7', ang.length>6);  // 7개는 더 촘촘히
    for(let i=0;i<ang.length;i++){
      h+=`<div class="jrow"><label>${jointNames[i]||T('reach.joint_n',{n:i+1})}</label>
        <input type="range" min="${L.limits[i][0]}" max="${L.limits[i][1]}" value="${ang[i]}" data-j="${i}">
        <span class="deg" id="deg${i}">${Math.round(ang[i])}°</span></div>`;
    }
    panel.innerHTML=h;
    panel.querySelectorAll('input[type=range]').forEach(inp=>{
      inp.addEventListener('input',()=>{
        const j=+inp.dataset.j;
        ang[j]=+inp.value;
        draw();
      });
    });
  }
  for(let i=0;i<ang.length;i++){
    const d=document.getElementById('deg'+i);
    if(d) d.textContent=Math.round(ang[i])+'°';
    const inp=panel.querySelector(`input[data-j="${i}"]`);
    if(inp && +inp.value!==Math.round(ang[i])) inp.value=ang[i];
  }
}

/* ================= Pointer interaction ================= */
function svgPoint(evt){
  const src=evt.touches&&evt.touches[0]?evt.touches[0]:(evt.changedTouches&&evt.changedTouches[0]?evt.changedTouches[0]:evt);
  const cx=src.clientX, cy=src.clientY;
  // use the SVG's screen transform so preserveAspectRatio letterboxing is honored
  const ctm=svg.getScreenCTM();
  if(ctm){
    const pt=svg.createSVGPoint(); pt.x=cx; pt.y=cy;
    const u=pt.matrixTransform(ctm.inverse());
    return {x:u.x, y:u.y};
  }
  const r=svg.getBoundingClientRect(); const vb=svg.viewBox.baseVal;
  return { x:(cx-r.left)/r.width*vb.width, y:(cy-r.top)/r.height*vb.height };
}

let dragJoint=-1;
function onDown(e){
  if(won || timerPaused) return;
  const t=e.target;
  if(t.classList && t.classList.contains('jhandle')){
    dragJoint=+t.dataset.j; e.preventDefault();
  }else{
    // nearest joint pivot: rotate the joint whose pivot is closest to the touch
    const p=svgPoint(e); const pts=fkPoints(ang);
    let best=-1,bd=26;
    for(let i=0;i<ang.length;i++){
      const d=Math.hypot(p.x-pts[i].x,p.y-pts[i].y);
      if(d<bd){bd=d;best=i;}
    }
    if(best>=0){ dragJoint=best; e.preventDefault(); }
  }
  if(dragJoint>=0){ tutDragged=true; if(tutOn) tutCheck(); }   // 튜토리얼 "직접 끌기" 단계 신호
}
function onMove(e){
  if(won) return;
  if(dragJoint>=0){
    e.preventDefault();
    const p=svgPoint(e);
    const pts=fkPoints(ang);
    const piv=pts[dragJoint];
    // desired absolute angle of this segment
    const desiredAbs=Math.atan2(p.y-piv.y, p.x-piv.x)*R2D;
    // current absolute angle up to and including this joint = sum ang[0..dragJoint]
    let baseAbs=0; for(let i=0;i<dragJoint;i++) baseAbs+=ang[i];
    let rel=desiredAbs-baseAbs;
    while(rel>180)rel-=360; while(rel<-180)rel+=360;
    ang[dragJoint]=clamp(rel, L.limits[dragJoint][0], L.limits[dragJoint][1]);
    draw();
  }
}
function onUp(){ dragJoint=-1; }

svg.addEventListener('mousedown',onDown);
svg.addEventListener('touchstart',onDown,{passive:false});
window.addEventListener('mousemove',onMove);
window.addEventListener('touchmove',onMove,{passive:false});
window.addEventListener('mouseup',onUp);
window.addEventListener('touchend',onUp);


/* ================= Buttons ================= */
document.getElementById('btnReset').onclick=()=>{ if(won) return; ang=L.start.slice(); draw(); };
document.getElementById('btnHint').onclick=()=>{
  if(won) return;
  const goal=L.solve ? L.solve : ccdSolve(ang,L.target);
  let pick=0, gap=-1;
  for(let i=0;i<ang.length;i++){
    const range=L.limits[i][1]-L.limits[i][0];
    const d=Math.abs(goal[i]-ang[i])/range;
    if(d>gap){gap=d;pick=i;}
  }
  const rows=[...document.querySelectorAll('.jrow')];
  rows.forEach(r=>r.classList.remove('hint'));
  const row=rows[pick];
  if(row){
    row.classList.add('hint');
    setTimeout(()=>row.classList.remove('hint'),2100);
  }
  const name=row?.querySelector('label')?.textContent||T('reach.joint_n',{n:pick+1});
  toast(T('reach.hint_turn',{name, dir:T(goal[pick]>ang[pick]?'reach.dir.right':'reach.dir.left')}));
};

/* ================= Toast ================= */
let toastT=0;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),900);
}

/* ================= Timer =================
   레벨마다 제한시간(L.time, 초). 0 이 되면 게임오버 — 이 게임의 유일한 실패 조건이다(2026-09-11).
   탭이 가려지면 멈추고 돌아오면 이어간다(다른 게임의 일시정지와 같은 이유 — 백그라운드에서 시간이 새면 억울하다). */
function levelTime(){ return L.time || DEFAULT_TIME; }
function renderTimer(){
  const total=levelTime(), t=Math.max(0,timeLeft);
  document.getElementById('tbNum').textContent=Math.ceil(t-1e-6);
  document.getElementById('tbFill').style.width=(t/total*100).toFixed(1)+'%';
  document.getElementById('timebar').classList.toggle('crit', t<=Math.min(10,total*0.34) && t>0);
}
function startTimer(){
  document.getElementById('timebar').classList.remove('hide');
  clearInterval(timerId); timeLeft=levelTime(); renderTimer();
  timerId=setInterval(()=>{
    if(timerPaused||won) return;
    timeLeft-=0.1; renderTimer();
    if(timeLeft<=0){ clearInterval(timerId); gameOver(); }
  },100);
}
document.addEventListener('visibilitychange',()=>{ timerPaused=document.hidden; });
window.addEventListener('blur',()=>{ timerPaused=true; });
window.addEventListener('focus',()=>{ timerPaused=false; });

/* ================= 튜토리얼 =================
   지어라(build-cari)와 같은 규칙: 눌러야 시작하고(자동 실행 없음), 언제든 다시 볼 수 있고(인트로·게임화면 둘),
   끝나면 시작한 자리로 돌아간다(메인 게임으로 밀지 않음). 점수·타이머 없음.
   두 라운드 — ① 관절 돌리기(슬라이더·직접 끌기·목표에 대기) ② 벽 피하기(붉은 팔 떼기·벽 돌아 닿기).
   ⚠️ ② 의 시작 자세는 일부러 벽을 관통한다 — "붉으면 안 된다" 는 붉은 걸 보여줘야 가르쳐진다. */
const TUT_ROUNDS=[
  { title:T('reach.tut.r1'),
    level:{ name:T('reach.tut.name1'), sub:T('reach.tut.r1'), goal:T('reach.tut.goal1'),
      base:{x:200,y:460}, segs:[115,100], limits:[[-165,165],[-155,155]],
      start:[-94,25], target:{x:300,y:340,r:20,kind:"star"}, obstacles:[], take:'' },
    steps:[
      { msg:T('reach.tut.s1'), row:0, done:()=>Math.abs(ang[0]-tutRef[0])>=20 },
      { msg:T('reach.tut.s2'), row:1, done:()=>Math.abs(ang[1]-tutRef[1])>=20 },
      { msg:T('reach.tut.s3'), joint:1, done:()=>tutDragged },
      { msg:T('reach.tut.s4'), target:true, done:(hit,reached)=>reached } ] },
  { title:T('reach.tut.r2'),
    level:{ name:T('reach.tut.name2'), sub:T('reach.tut.r2'), goal:T('reach.tut.goal2'),
      base:{x:210,y:460}, segs:[100,88,70], limits:[[-160,160],[-150,150],[-150,150]],
      start:[-90,0,0], target:{x:120,y:320,r:19,kind:"star"}, obstacles:[{x:210,y:360,w:120,h:24}], take:'' },
    steps:[
      { msg:T('reach.tut.s5'), row:0, done:(hit)=>!hit },
      { msg:T('reach.tut.s6'), target:true, done:(hit,reached)=>reached } ] },
];
function tutStep(){ return tutOn ? TUT_ROUNDS[tutRound].steps[tutIdx] : null; }
function tutSetHelp(){
  const b=document.getElementById('btnTut');
  b.textContent=tutOn?'✕':'?'; b.classList.toggle('quit',tutOn);
  b.setAttribute('aria-label', T(tutOn?'reach.tutorial_quit':'reach.tutorial'));
}
function tutMark(){
  document.querySelectorAll('.jrow.tut-on').forEach(el=>el.classList.remove('tut-on'));
  const st=tutStep(); const m=document.getElementById('tutMsg');
  if(!st){ m.classList.remove('on'); return; }
  m.innerHTML=st.msg; m.classList.add('on');
  if(st.row!=null){ const rows=document.querySelectorAll('.jrow'); if(rows[st.row]) rows[st.row].classList.add('tut-on'); }
  tutRef=ang.slice(); tutDragged=false;
}
/** draw() 마다 불린다 — 지금 단계의 조건이 맞으면 다음 단계로. */
function tutCheck(hit,reached){
  const st=tutStep(); if(!st || !st.done(hit,reached)) return;
  tutIdx++;
  if(tutIdx<TUT_ROUNDS[tutRound].steps.length){ tutMark(); draw(); return; }
  // 라운드 끝
  document.getElementById('tutMsg').innerHTML = tutRound<TUT_ROUNDS.length-1
    ? T('reach.tut.good_next',{title:TUT_ROUNDS[tutRound+1].title}) : T('reach.tut.good');
  document.querySelectorAll('.jrow.tut-on').forEach(el=>el.classList.remove('tut-on'));
  won=true;   // 조작 잠금(연출 동안)
  clearTimeout(tutTimer);
  tutTimer=setTimeout(()=>{
    if(!tutOn) return;
    if(tutRound<TUT_ROUNDS.length-1){ tutRound++; loadTutRound(); return; }
    // 전부 끝 — 결과창
    const ov=document.getElementById('ovResult'), b=document.getElementById('resBadge');
    b.textContent=T('reach.tut.done'); b.className='badge win';
    document.getElementById('resTitle').textContent=T('reach.tut.done_title');
    document.getElementById('resTake').innerHTML=T('reach.tut.done_take');
    document.getElementById('btnRetry').style.display=''; document.getElementById('btnRetry').textContent=T('reach.tut.again');
    document.getElementById('btnNext').textContent=T('reach.tut.close');
    ov.classList.remove('hide');
  }, 1300);
}
function loadTutRound(){
  tutIdx=0; LI=-1; L=TUT_ROUNDS[tutRound].level; ang=L.start.slice(); won=false; tutRef=ang.slice(); tutDragged=false;
  clearInterval(timerId);
  document.getElementById('lvlName').textContent=L.name;
  document.getElementById('lvlSub').textContent=L.sub;
  document.getElementById('goalPill').textContent=L.goal;
  document.getElementById('panel').dataset.fk='';
  document.getElementById('timebar').classList.add('hide');
  draw(); tutMark(); draw();
}
/** from='intro' | 'game' */
function startTutorial(from){
  tutFrom=from; if(from==='game') tutReturnLI=LI;
  clearTimeout(tutTimer);
  document.getElementById('ovStart').classList.add('hide'); document.getElementById('ovResult').classList.add('hide');
  tutOn=true; tutRound=0; loadTutRound(); tutSetHelp();
}
function exitTutorial(){
  clearTimeout(tutTimer); tutOn=false; runOver=false;
  document.getElementById('tutMsg').classList.remove('on');
  document.querySelectorAll('.jrow.tut-on').forEach(el=>el.classList.remove('tut-on'));
  document.getElementById('ovResult').classList.add('hide');
  tutSetHelp();
  if(tutFrom==='game'){ startRun(); return; }   // 하던 판은 시간이 흘렀으니 새 판으로
  L=LEVELS[0]; LI=0; ang=L.start.slice(); won=false; draw();
  document.getElementById('lvlName').textContent=levelName(0); document.getElementById('lvlSub').textContent=lvText(0,'sub',L.sub); document.getElementById('goalPill').textContent=lvText(0,'goal',L.goal);
  document.getElementById('timebar').classList.remove('hide');
  document.getElementById('tbNum').textContent=levelTime(); document.getElementById('tbFill').style.width='100%';
  document.getElementById('ovStart').classList.remove('hide');
}
document.getElementById('btnTut').onclick=()=>{ tutOn?exitTutorial():startTutorial('game'); };
document.getElementById('btnTutIntro').onclick=()=>startTutorial('intro');

/* ================= Load level ================= */
function levelName(i){ return T('reach.level_n',{n:i+1}); }
function loadLevel(i){
  LI=i; L=LEVELS[i]; ang=L.start.slice(); won=false;
  document.getElementById('lvlName').textContent=levelName(i);
  document.getElementById('lvlSub').textContent=lvText(i,'sub',L.sub);
  document.getElementById('goalPill').textContent=lvText(i,'goal',L.goal);
  const panel=document.getElementById('panel'); panel.dataset.fk='';
  // DOF dots
  let dots=''; for(let k=0;k<L.segs.length;k++) dots+='<span class="dot on"></span>';
  document.getElementById('dofDots').innerHTML=dots;
  levelStartT=nowMs();
  draw();
  startTimer();
}
/** 한 판 = 1레벨부터. 기록 = 깬 레벨 수. */
function startRun(){
  cleared=0; runLog=[]; runT0=performance.now();
  document.getElementById('ovResult').classList.add('hide');
  loadLevel(0);
}
/** 클리어 순간 — 최종 관절 각도와 시각을 기록한다(서버가 이 각도로 손끝 위치·충돌을 다시 계산한다). */
function levelCleared(){
  clearInterval(timerId);
  cleared++;
  runLog.push({ lv:LI, a:ang.map(v=>Math.round(v*10)/10), s:levelStartT, t:nowMs() });
}

/* ================= Result =================
   레벨 클리어 → [다음]. 마지막 레벨까지 깨거나 시간이 다 되면 판이 끝난다 → 기록 제출 + [처음으로 / 다시 도전]. */
let runOver=false;
function submitRun(){
  // 랭킹: 깬 레벨 수 — 숫자는 참고값이고 서버가 log(레벨별 최종 각도·시각)로 다시 센다
  if(window.MGBridge) MGBridge.submit(cleared, {timed:true, log:runLog});
}
function result(win){
  const ov=document.getElementById('ovResult');
  const b=document.getElementById('resBadge');
  const last = LI>=LEVELS.length-1;
  runOver = last;
  b.textContent = T(last ? 'reach.all_clear' : 'reach.caught');
  b.className='badge win';
  document.getElementById('resTitle').textContent = last ? T('reach.all_levels_clear',{n:LEVELS.length}) : T('reach.level_clear',{name:levelName(LI)});
  document.getElementById('resTake').innerHTML=lvText(LI,'take',L.take);
  document.getElementById('btnRetry').style.display='';
  document.getElementById('btnRetry').textContent = T(last ? 'reach.to_start' : 'reach.quit');   // 그만두기 = 여기까지를 기록으로 남기고 끝
  document.getElementById('btnNext').textContent = T(last ? 'reach.retry' : 'reach.next');
  if(last) submitRun();
  ov.classList.remove('hide');
}
/** 레벨 클리어 창에서 그만두기 — 깬 데까지가 기록이다(다음 레벨을 안 깨도 지금까지가 랭킹에 남는다). */
function quitRun(){
  runOver=true;
  const b=document.getElementById('resBadge');
  b.textContent=T('reach.here'); b.className='badge win';
  document.getElementById('resTitle').textContent = T('reach.n_levels_clear',{n:cleared});
  document.getElementById('resTake').innerHTML = T('reach.here_take');
  document.getElementById('btnRetry').textContent=T('reach.to_start');
  document.getElementById('btnNext').textContent=T('reach.retry');
  submitRun();
}
function gameOver(){
  won=true; runOver=true;   // 조작 잠금
  const ov=document.getElementById('ovResult');
  const b=document.getElementById('resBadge');
  b.textContent=T('reach.timeout'); b.className='badge lose';
  document.getElementById('resTitle').textContent = cleared ? T('reach.n_levels_clear',{n:cleared}) : T('reach.stuck_first');
  document.getElementById('resTake').innerHTML = T('reach.timeout_take',{name:levelName(LI), t:levelTime()});
  document.getElementById('btnRetry').style.display=''; document.getElementById('btnRetry').textContent=T('reach.to_start');
  document.getElementById('btnNext').textContent=T('reach.retry');
  submitRun();
  ov.classList.remove('hide');
}
document.getElementById('btnRetry').onclick=()=>{   // 판 끝 → 인트로로 / 튜토리얼 끝 → 처음부터 다시 / 레벨 클리어 창 → 그만두기
  if(tutOn) return startTutorial(tutFrom);
  if(!runOver) return quitRun();
  document.getElementById('ovResult').classList.add('hide');
  document.getElementById('ovStart').classList.remove('hide');
};
document.getElementById('btnNext').onclick=()=>{
  if(tutOn) return exitTutorial();
  if(runOver) return startRun();
  document.getElementById('ovResult').classList.add('hide');
  loadLevel(LI+1);
};
/* ================= Start ================= */
document.getElementById('btnStart').onclick=()=>{
  document.getElementById('ovStart').classList.add('hide');
  startRun();
};
// 인트로 뒤에서 첫 레벨을 그려 둔다(타이머는 시작 버튼을 눌러야 돈다).
L=LEVELS[0]; LI=0; ang=L.start.slice(); runT0=performance.now(); draw();
</script>

<!-- ===== 앱 브리지: 랭킹 버튼 + 점수 전송 =====
     이 HTML 은 자립형이라 세션도 supabase 클라도 없다 → 실제 제출/조회는 부모(/games/:id = MiniGame.tsx)가 한다.
     여기서는 (1) 인트로·아웃트로 우상단에 '랭킹' 버튼을 얹고, (2) 점수가 나면 postMessage 로 알리기만 한다.
     ⚠️ 이 파일을 단독으로 열면 부모가 없어 버튼도 숨고 아무것도 보내지 않는다(게임은 그대로 동작).
     ⚠️ tieMs(레벨형 동률 해소용 소요시간)는 인트로에서 시작을 누른 시점부터 잰다. '처음으로'로 되돌아가
       인트로를 다시 거치지 않으면 계속 누적된다 — 순위 1차 키가 아니라 동률 해소용이라 그대로 둔다. -->
<style>
.mg-rank{position:absolute; top:12px; right:12px; z-index:60; display:none; align-items:center; justify-content:center;
  box-sizing:border-box; width:112px; height:34px; padding:0; border:0; cursor:pointer;
  font:850 11.5px/1 system-ui,-apple-system,sans-serif; letter-spacing:.025em; color:#fff;
  background:url("rank-button.webp") center/100% 100% no-repeat; text-shadow:0 1px 3px #001c55;
  filter:drop-shadow(0 3px 4px rgba(8,20,60,.24)); -webkit-tap-highlight-color:transparent;}
.mg-rank.on{display:inline-flex;}
/* ⚠️ 랭킹 글자는 판 정중앙(58.5%)이 아니라 **54%** 다 — 왼쪽 트로피가 시각적으로 무거워서
     기하학적 중앙에 두면 오른쪽으로 밀려 보인다. 모든 게임이 같은 값이다(2026-08-18 일괄 정렬).
     px 오프셋으로 밀지 말 것 — 버튼 폭이 게임마다 달라(112 vs 131) 같은 px 이 다른 위치가 된다. */
.mg-rank span{position:absolute;left:54%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}
.mg-rank:hover{filter:brightness(1.06) drop-shadow(0 3px 5px rgba(8,20,60,.28));}
.mg-rank:active{transform:translateY(1px) scale(.98);}
</style>
<script>
(function(){
  var EMBED = window.parent !== window;
  var T0 = 0;
  function post(m){ if(EMBED) window.parent.postMessage(m, window.location.origin); }
  window.MGBridge = {
    /** 점수 전송. timed:true 면 시작 이후 경과시간을 동률 해소용으로 같이 보낸다. */
    submit: function(v, opts){
      if(typeof v !== 'number' || !isFinite(v)) return;
      post({ t:'mg:score', score:v, tieMs:(opts && opts.timed && T0) ? (Date.now()-T0) : undefined,
             log:(opts && Array.isArray(opts.log)) ? opts.log : undefined });
    }
  };
  function mount(id){
    var ov = document.getElementById(id); if(!ov) return;
    if(ov.querySelector('.mg-rank')) return;
    var b = document.createElement('button');
    b.type='button'; b.className='mg-rank' + (EMBED ? ' on' : '');
    b.setAttribute('aria-label', window.MGI18N ? MGI18N.t('mg.rank_aria') : '이 게임 랭킹 보기');
    b.innerHTML='<span>'+(window.MGI18N ? MGI18N.t('mg.rank') : '랭킹')+'</span>';
    b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); post({t:'mg:rank'}); });
    ov.appendChild(b);
  }
  mount('ovStart'); mount('ovResult');
  // 인트로에서 (랭킹 버튼이 아닌) 무엇이든 누르면 = 플레이 시작 → 소요시간 기준점 리셋.
  var intro = document.getElementById('ovStart');
  if(intro) intro.addEventListener('click', function(e){
    if(e.target && e.target.closest && e.target.closest('.mg-rank')) return;
    T0 = Date.now();
  }, true);
})();
</script>
<script>if (window.MGI18N) MGI18N.apply();</script>
</body>
</html>
