<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>닿아라 CARI</title>
<style>
:root{
  --page:#09172c; --bg:#f7f9fc; --ink:#172642; --sub:#71809a;
  --brand:#004ac6; --brand-hi:#1b55d0; --line:#e6e9f3;
  --good:#12b58c; --bad:#f2664f; --skip:#e59b17;
  --cream:#ece9e0;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:radial-gradient(120% 80% at 50% -10%, #24466e 0%, #09172c 68%);
  color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
  display:flex; align-items:center; justify-content:center; min-height:100%; overflow:hidden; user-select:none;
}
.stage{
  position:relative; width:min(460px,100vw); height:min(860px,100vh);
  display:flex; flex-direction:column; background:var(--bg);
  box-shadow:0 0 70px rgba(0,0,0,.48); overflow:hidden;
}
.art{width:100%;height:100%;display:block;}

/* HUD */
.hud{position:relative;display:flex;align-items:center;gap:9px;height:65px;margin:6px 10px 2px;padding:12px 31px 11px;z-index:5;
  background:url('/games/reach-cari-hud-v4.png') center/100% 100% no-repeat;color:#fff;filter:drop-shadow(0 6px 8px rgba(0,20,60,.3));}
.hud .cari-mini{display:none;}
.hud .lvlbox{display:flex;flex-direction:column;line-height:1.05;}
.hud .lvlbox b{font-size:17px;color:#fff;text-shadow:0 1px 3px #001b51;}
.hud .lvlbox span{font-size:11.5px;color:#bfe9ff;margin-top:3px;}
.hud .goalpill{margin-left:auto;width:26%;color:#ffe273;font-weight:900;font-size:13px;padding:7px 0;text-align:center;text-shadow:0 0 8px #c67a00;}
.dofrow{display:none;}
.dofrow .dl{font-size:10.5px;color:#61738e;font-weight:900;}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#d6ddec;margin-left:4px;vertical-align:middle;}
.dot.on{background:var(--brand);}

/* play area */
.field{position:relative; flex:1; margin:2px 12px 6px; border-radius:18px; overflow:hidden;
  background:#eaf2fb url('/games/reach-cari-lab-v2.png') center/cover no-repeat; border:1px solid #cddced;
  box-shadow:inset 0 0 30px rgba(14,65,125,.12),0 8px 24px rgba(30,60,110,.12);}
.field svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}

/* controls */
.controls{position:relative;flex:0 0 230px;padding:0;z-index:5;background:url('/games/reach-cari-controls-v5.png') center/100% 100% no-repeat;color:#fff;filter:drop-shadow(0 -5px 10px rgba(0,20,60,.28));}
.modeseg{position:absolute;left:38px;right:38px;top:12px;height:35px;display:flex;background:transparent;border-radius:10px;padding:1px;margin:0;}
.modeseg button{flex:1;border:0;background:transparent;color:#8ec9ed;font-weight:900;font-size:11.5px;
  padding:5px 4px;border-radius:9px;cursor:pointer;}
.modeseg button.act{background:rgba(42,181,255,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(106,221,255,.55),0 0 10px rgba(23,170,255,.3);}
.jointpanel{position:absolute;left:39px;right:39px;top:52px;height:112px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:0;}
.jrow{display:flex;align-items:center;gap:10px;}
.jrow label{font-size:11.5px;font-weight:900;color:#d7efff;width:64px;line-height:1.05;text-shadow:0 1px 2px #001735;}
.jrow input[type=range]{flex:1; accent-color:var(--brand); height:22px;}
.jrow .deg{font-size:12px;color:#ffe273;font-weight:900;width:44px;text-align:right;
  font-variant-numeric:tabular-nums;}
.jrow.hint{border-radius:10px;background:rgba(255,205,53,.16);box-shadow:0 0 0 1px rgba(255,220,92,.7),0 0 14px rgba(255,191,31,.48);animation:hintPulse .65s ease-in-out 3;}
.jrow.hint label,.jrow.hint .deg{color:#fff09a;text-shadow:0 0 7px #d88b00;}
@keyframes hintPulse{50%{filter:brightness(1.35);transform:scale(1.015)}}
.iktip{font-size:12px;color:#c9e9ff;text-align:center;padding:10px;line-height:1.45;}
.btnrow{position:absolute;left:39px;right:39px;bottom:8px;height:48px;display:flex;gap:7px;margin:0;}
.btn{flex:1; padding:13px 10px; border-radius:26px; border:0; cursor:pointer;
  background:linear-gradient(120deg,#1b55d0,#004ac6); color:#fff; font-size:15px; font-weight:800;
  box-shadow:0 8px 20px rgba(0,74,198,.28);}
.btn.ghost{background:#eef1f8;color:var(--brand);box-shadow:none;}
.btnrow .btn{height:49px;margin:0;padding:0 8px;border-radius:0;background:url('/games/reach-cari-start-btn-v3.png') center/100% 100% no-repeat;color:#fff;font-size:14px;text-shadow:0 2px 4px #001b55;box-shadow:none;filter:drop-shadow(0 5px 7px rgba(0,12,45,.35));}
.btn:active{transform:scale(.97);}

/* overlays */
.overlay{position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:26px;
  background:url('/games/reach-cari-intro-bg-v3.png') center/cover no-repeat;color:#fff;}
.overlay.hide{display:none;}
.floaty{width:190px;height:205px;object-fit:contain;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 16px 18px rgba(0,0,0,.35));}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.t1,.t2{font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:35px;font-weight:900;letter-spacing:-2px;-webkit-text-stroke:0;filter:none;}
.t1{color:#132d55;text-shadow:0 2px 0 rgba(255,255,255,.9),0 4px 9px rgba(19,45,85,.22);}
.t2{background:none;-webkit-background-clip:initial;background-clip:initial;-webkit-text-fill-color:#0874d8;color:#0874d8;text-shadow:0 2px 0 #dff5ff,0 4px 9px rgba(0,74,160,.25);}
.title{margin:8px 0 3px;line-height:1.12;}
.tag{color:#25456f;font-size:14.5px;margin:2px 0 15px;font-weight:900;text-shadow:0 1px 0 rgba(255,255,255,.9);}
.rules{display:grid;grid-template-rows:repeat(3,1fr);align-items:center;gap:0;width:min(342px,88vw);height:150px;
  background:url('/games/reach-cari-rule-panel-v3.png') center/100% 100% no-repeat;padding:19px 31px 18px;text-align:left;
  filter:drop-shadow(0 11px 16px rgba(0,20,60,.3));}
.rules div{font-size:12.5px;font-weight:800;color:#e9f7ff;margin:0;display:flex;gap:10px;align-items:center;line-height:1.25;text-shadow:0 1px 3px #00173c;}
.rules>div>b{flex:none;width:25px;height:25px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#0874d8;
  border:1px solid #84e6ff;box-shadow:inset 0 0 0 2px rgba(132,230,255,.12),0 0 8px rgba(38,181,255,.35);text-shadow:none;}
.rules div span b{color:#ffe477;}
.overlay #btnStart{width:190px;height:60px;margin-top:12px;padding:0;border-radius:0;background:url('/games/reach-cari-start-btn-v3.png') center/100% 100% no-repeat;box-shadow:none;text-shadow:0 2px 4px #001b55;filter:drop-shadow(0 9px 11px rgba(0,15,55,.45));}
.result-console{position:relative;width:min(330px,78vw);height:min(430px,55vh);background:url('/games/reach-cari-result-console-v3.png') center/100% 100% no-repeat;filter:drop-shadow(0 18px 24px rgba(0,10,42,.55));}
#ovResult .floaty{position:absolute;top:6%;left:50%;transform:translateX(-50%);width:145px;height:155px;animation:none;}
#ovResult .badge{position:absolute;top:40%;left:0;width:100%;font-size:29px;color:#6fffd2;text-shadow:0 0 12px #00b97e;}
#ovResult .scorebox{position:absolute;top:51%;left:12%;width:76%;margin:0;padding:11px 10px;background:transparent;border:0;box-shadow:none;color:#fff;}
#ovResult .scorebox .big{color:#fff;font-size:17px;text-shadow:0 2px 4px #00102f;} #ovResult .scorebox .take{color:#e5f6ff;font-size:11.5px;background:rgba(0,20,60,.45);border-radius:9px;padding:7px 8px;text-shadow:0 1px 3px #00102f;}
#ovResult .scorebox .take b{color:#ffe47d;}
#ovResult .ovbtns{position:absolute;left:8%;bottom:9%;width:84%;height:52px;margin:0;display:block;} #ovResult .ovbtns .btn{position:absolute;display:grid;place-items:center;height:50px;margin:0;padding:0!important;line-height:1;box-shadow:none;background:transparent;color:#fff;text-align:center;font-size:18px;}
#ovResult #btnRetry{left:-1%;top:2px;width:52%;} #ovResult #btnNext{left:47%;top:2px;width:52%;}
.badge{font-size:28px;font-weight:900;margin:6px 0 2px;}
.badge.win{color:var(--good);} .badge.lose{color:var(--bad);}
.scorebox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 26px;margin:12px 0 4px;
  box-shadow:0 6px 18px rgba(70,90,140,.10);max-width:340px;}
.scorebox .big{font-size:15px;font-weight:800;color:var(--ink);}
.scorebox .take{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.5;}
.scorebox .take b{color:var(--brand);}
.ovbtns{display:flex;gap:10px;margin-top:16px;}
.ovbtns .btn{padding:13px 30px;flex:0 0 auto;}
.toast{position:absolute;top:96px;left:50%;transform:translateX(-50%);z-index:15;
  background:var(--bad);color:#fff;font-weight:800;font-size:13px;padding:9px 18px;border-radius:20px;
  box-shadow:0 6px 16px rgba(0,0,0,.18);opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- HUD -->
  <div class="hud">
    <img class="cari-mini" id="hudCari" src="/games/reach-cari-hero-v2.png" alt=""/>
    <div class="lvlbox"><b id="lvlName">레벨 1</b><span id="lvlSub">관절 2개 · 쉬움</span></div>
    <div class="goalpill" id="goalPill">별에 닿아라</div>
  </div>
  <div class="dofrow"><span class="dl">움직이는 관절</span><span id="dofDots"></span></div>

  <!-- PLAY FIELD -->
  <div class="field">
    <svg id="svg" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="modeseg">
      <button id="mFK" class="act">관절 하나씩 돌리기</button>
      <button id="mIK">손끝 잡고 움직이기</button>
    </div>
    <div class="jointpanel" id="panel"></div>
    <div class="btnrow">
      <button class="btn ghost" id="btnReset">처음 자세</button>
      <button class="btn" id="btnHint">관절 힌트</button>
    </div>
  </div>

  <div class="toast" id="toast">충돌!</div>

  <!-- START OVERLAY -->
  <div class="overlay" id="ovStart">
    <img class="floaty" id="startCari" src="/games/reach-cari-hero-v2.png" alt="CARI와 로봇팔"/>
    <div class="title"><span class="t1">닿아라 </span><span class="t2">CARI</span></div>
    <div class="tag">로봇팔을 움직여 별에 닿아라!</div>
    <div class="rules">
      <div><b>1</b><span>관절을 돌려 손끝을 <b>목표에 맞춰요</b></span></div>
      <div><b>2</b><span>손끝을 끌면 팔 전체가 <b>함께 움직여요</b></span></div>
      <div><b>3</b><span>벽에 닿지 않게 <b>피해서 이동!</b></span></div>
    </div>
    <button class="btn" id="btnStart" style="margin-top:20px;padding:15px 50px;flex:0 0 auto;">시작하기</button>
  </div>

  <!-- RESULT OVERLAY -->
  <div class="overlay hide" id="ovResult">
    <div class="result-console">
      <img class="floaty" id="resCari" src="/games/reach-cari-win-v3.png" alt="기뻐하는 CARI"/>
      <div class="badge win" id="resBadge">목표 포착!</div>
      <div class="scorebox">
        <div class="big" id="resTitle">레벨 클리어</div>
        <div class="take" id="resTake"></div>
      </div>
      <div class="ovbtns">
        <button class="btn ghost" id="btnRetry">다시</button>
        <button class="btn" id="btnNext">다음</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ================= CARI mascot ================= */
function charSVG(suit,o={}){
  const [body,shade,ear]=suit; const isCari=o.cari, dir=o.dir||0, shock=o.shock;
  const gid='c'+shade.slice(1)+(isCari?'m':'')+(shock?'k':'')+(dir+1)+Math.random().toString(36).slice(2,6);
  const ex=dir*2.2;
  const eyes = shock
    ? `<path d="M22.5 25.5 l5.5 5 M28 25.5 l-5.5 5" stroke="#8fd0ff" stroke-width="2.3" stroke-linecap="round"/>
       <path d="M36 25.5 l5.5 5 M41.5 25.5 l-5.5 5" stroke="#8fd0ff" stroke-width="2.3" stroke-linecap="round"/>`
    : `<ellipse cx="${25.5+ex}" cy="27" rx="3.7" ry="4.8" fill="#d3ecff"/>
       <ellipse cx="${38.5+ex}" cy="27" rx="3.7" ry="4.8" fill="#d3ecff"/>
       <ellipse cx="${24.6+ex}" cy="25.2" rx="1.15" ry="1.5" fill="#fff"/>
       <ellipse cx="${37.6+ex}" cy="25.2" rx="1.15" ry="1.5" fill="#fff"/>`;
  const mouth = shock
    ? `<ellipse cx="32" cy="35.5" rx="2.8" ry="3.4" fill="#2b5f8c"/>`
    : `<path d="M28.8 34 q3.2 2.8 6.4 0" stroke="#7fc4ff" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  const antenna = isCari ? `
    <path d="M32 10 v-4.4" stroke="#7fa8d8" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="32" cy="3.8" r="3" fill="#5b90ff"/>
    <ellipse cx="32" cy="3.8" rx="5.7" ry="1.9" fill="none" stroke="#9cc0ff" stroke-width="1.2" transform="rotate(-18 32 3.8)"/>` : '';
  const badge = isCari ? `
    <rect x="24" y="45" width="16" height="8.5" rx="3" fill="#fdfbf5" stroke="${shade}" stroke-width=".9"/>
    <text x="32" y="51.3" font-size="5.4" font-weight="900" text-anchor="middle" fill="#8fb0e2" font-family="system-ui,sans-serif">CARI</text>` : '';
  return `<svg class="art" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs><radialGradient id="${gid}" cx="38%" cy="26%" r="80%">
      <stop offset="0" stop-color="#fff" stop-opacity=".62"/>
      <stop offset="42%" stop-color="${body}"/><stop offset="100%" stop-color="${shade}"/>
    </radialGradient></defs>
    <ellipse cx="32" cy="58.5" rx="16" ry="3.4" fill="rgba(0,0,0,.32)"/>
    ${antenna}
    <circle cx="12.8" cy="15.5" r="8.6" fill="${body}" stroke="${shade}" stroke-width="1.2"/>
    <circle cx="51.2" cy="15.5" r="8.6" fill="${body}" stroke="${shade}" stroke-width="1.2"/>
    <circle cx="12.8" cy="15.5" r="4.6" fill="${ear}"/><circle cx="51.2" cy="15.5" r="4.6" fill="${ear}"/>
    <path d="M32 8 C46.5 8 54 17.5 54 30 C54 38 52.4 43 50.4 47.4 C49.6 53.6 45 57 32 57
             C19 57 14.4 53.6 13.6 47.4 C11.6 43 10 38 10 30 C10 17.5 17.5 8 32 8 Z"
          fill="url(#${gid})" stroke="${shade}" stroke-width="1.3"/>
    <ellipse cx="32" cy="28" rx="15.2" ry="14.2" fill="#141a2b"/>
    <ellipse cx="26" cy="19.5" rx="6.4" ry="3.4" fill="#fff" opacity=".13"/>
    ${eyes}${mouth}${badge}</svg>`;
}
const CARI_SUIT=['#f4efe4','#cfc6b4','#9fb6de'];

/* ================= Level data ================= */
// base at (bx,by) in 400x520 svg coords. angles in degrees (absolute per-joint delta chained).
// segLens list; jointLimits [min,max] absolute? we use relative angle per joint w/ limits.
const D2R=Math.PI/180, R2D=180/Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const LEVELS=[
  { name:"레벨 1", sub:"관절 2개 · 쉬움", goal:"별에 닿아라",
    base:{x:200,y:460}, segs:[115,100], limits:[[-165,165],[-155,155]],
    start:[-94,25], solve:[-90,86], target:{x:300,y:340,r:20,kind:"star"}, obstacles:[],
    take:"<b>아래 관절</b>과 <b>위 관절</b>을 함께 움직여 목표 위치를 정확히 맞췄어요." },

  { name:"레벨 2", sub:"관절 3개 · 장애물", goal:"장애물 넘어 별 집기",
    base:{x:210,y:460}, segs:[100,88,70], limits:[[-160,160],[-150,150],[-150,150]],
    start:[9,-123,-110], solve:[160,111,1], target:{x:120,y:320,r:19,kind:"star"}, obstacles:[
      {x:210,y:360,w:120,h:24}],
    take:"관절이 하나 늘어나면 같은 목표에도 <b>여러 자세</b>로 닿을 수 있어요." },

  { name:"레벨 3", sub:"관절 4개 · 벽 돌아가기", goal:"벽 뒤 배터리에 닿아라",
    base:{x:110,y:460}, segs:[95,85,75,62], limits:[[-170,170],[-160,160],[-160,160],[-160,160]],
    start:[-76,113,124,-22], solve:[-33,125,-104,-39], target:{x:300,y:430,r:20,kind:"batt"}, obstacles:[
      {x:230,y:350,w:26,h:220}],
    take:"관절들을 차례로 꺾어 벽을 <b>감아 돌아</b> 목표에 닿았어요." },

  { name:"레벨 4", sub:"관절 4개 · 좁은 통로", goal:"틈새로 넣어 배터리 집기",
    base:{x:90,y:460}, segs:[95,85,74,62], limits:[[-170,170],[-160,160],[-160,160],[-160,160]],
    start:[-60,-33,-43,-98], solve:[-50,-29,67,25], target:{x:300,y:300,r:18,kind:"batt"}, obstacles:[
      {x:200,y:150,w:24,h:150},{x:200,y:400,w:24,h:120}],
    take:"여러 관절을 세밀하게 움직이면 <b>좁은 틈</b>도 안전하게 통과할 수 있어요." },

  { name:"레벨 5", sub:"관절 3개 · 흔들림", goal:"흔들리는 관절로 별 맞추기",
    base:{x:200,y:460}, segs:[110,90,66], limits:[[-160,160],[-150,150],[-150,150]],
    start:[-110,-126,-103], solve:[-6,-117,72], target:{x:300,y:320,r:23,kind:"star"}, obstacles:[], noise:2.6,
    take:"흔들리는 손끝을 계속 조절해 목표를 맞췄어요. 실제 로봇도 센서로 자세를 반복해서 고쳐요." },
];

/* ================= State ================= */
let LI=0, L=null, ang=[], mode="FK", won=false, rafId=0;
const svg=document.getElementById('svg');
const NS='http://www.w3.org/2000/svg';

function fkPoints(a){
  // returns array of points from base to tip
  const pts=[{x:L.base.x,y:L.base.y}];
  let acc=0;
  for(let i=0;i<a.length;i++){
    acc+=a[i]*D2R;
    const p=pts[i];
    pts.push({x:p.x+L.segs[i]*Math.cos(acc), y:p.y+L.segs[i]*Math.sin(acc)});
  }
  return pts;
}

/* segment vs rect collision */
function segRect(p1,p2,r){
  // expand rect slightly (arm thickness)
  const pad=6;
  const rx=r.x-r.w/2-pad, ry=r.y-r.h/2-pad, rw=r.w+pad*2, rh=r.h+pad*2;
  // Liang-Barsky style: check if segment intersects axis-aligned rect
  return segAABB(p1.x,p1.y,p2.x,p2.y,rx,ry,rx+rw,ry+rh);
}
function segAABB(x1,y1,x2,y2,xmin,ymin,xmax,ymax){
  // if either endpoint inside
  const inside=(x,y)=>x>=xmin&&x<=xmax&&y>=ymin&&y<=ymax;
  if(inside(x1,y1)||inside(x2,y2)) return true;
  // test against 4 edges
  return segSeg(x1,y1,x2,y2,xmin,ymin,xmax,ymin)||
         segSeg(x1,y1,x2,y2,xmax,ymin,xmax,ymax)||
         segSeg(x1,y1,x2,y2,xmax,ymax,xmin,ymax)||
         segSeg(x1,y1,x2,y2,xmin,ymax,xmin,ymin);
}
function segSeg(a,b,c,d,p,q,r,s){
  const d1=(r-p)*(b-q)-(s-q)*(a-p);
  const d2=(r-p)*(d-q)-(s-q)*(c-p);
  const d3=(c-a)*(q-b)-(d-b)*(p-a);
  const d4=(c-a)*(s-b)-(d-b)*(r-a);
  if(((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0))) return true;
  return false;
}
function armHitsAny(pts){
  for(const ob of L.obstacles){
    for(let i=0;i<pts.length-1;i++){
      if(segRect(pts[i],pts[i+1],ob)) return true;
    }
  }
  // walls of field (with margin)
  for(let i=1;i<pts.length;i++){
    if(pts[i].x<4||pts[i].x>396||pts[i].y<4||pts[i].y>516) return true;
  }
  return false;
}

/* ================= CCD inverse kinematics ================= */
function ccdSolve(a, goal){
  // work on a copy, iterate; returns new angle array respecting limits
  const A=a.slice();
  for(let iter=0;iter<24;iter++){
    // later iterations use higher gain so the tip snaps in satisfyingly
    const gain = iter<3 ? 0.5 : 0.85;
    for(let j=A.length-1;j>=0;j--){
      const pts=fkPoints(A);
      const tip=pts[pts.length-1];
      const piv=pts[j];
      const v1x=tip.x-piv.x, v1y=tip.y-piv.y;
      const v2x=goal.x-piv.x, v2y=goal.y-piv.y;
      const a1=Math.atan2(v1y,v1x), a2=Math.atan2(v2y,v2x);
      let delta=(a2-a1)*R2D;
      // normalize
      while(delta>180)delta-=360; while(delta<-180)delta+=360;
      delta*=gain;
      const nv=clamp(A[j]+delta, L.limits[j][0], L.limits[j][1]);
      A[j]=nv;
    }
    const pts=fkPoints(A);
    const tip=pts[pts.length-1];
    if(Math.hypot(tip.x-goal.x,tip.y-goal.y)<0.8) break;
  }
  return A;
}

/* ================= Rendering ================= */
function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

function draw(){
  const pts=fkPoints(ang);
  const hit=armHitsAny(pts);
  const tip=pts[pts.length-1];
  const tg=L.target;
  const dist=Math.hypot(tip.x-tg.x,tip.y-tg.y);
  const reached=dist<tg.r+9 && !hit;

  let s='';
  // grid backdrop faint
  s+=`<defs>
    <radialGradient id="tgg" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="${tg.kind==='batt'?'#ffd45e':'#ffe08a'}"/>
    </radialGradient>
    <linearGradient id="armMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#69c7ff"/><stop offset=".35" stop-color="#1471e8"/><stop offset="1" stop-color="#003d9f"/>
    </linearGradient>
    <filter id="armShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#071b38" flood-opacity=".38"/>
    </filter>
    <filter id="goalGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffc629" flood-opacity=".95"/>
    </filter>
    <filter id="hitRed" x="-35%" y="-35%" width="170%" height="170%">
      <feColorMatrix type="matrix" values="1.35 0 0 0 .28  0 .08 0 0 0  0 0 .08 0 0  0 0 0 1 0"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff1f2d" flood-opacity="1"/>
    </filter>
    <linearGradient id="obMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52647e"/><stop offset=".16" stop-color="#263750"/>
      <stop offset=".72" stop-color="#111b2d"/><stop offset="1" stop-color="#354a68"/>
    </linearGradient>
    <linearGradient id="obEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55d9ff"/><stop offset=".5" stop-color="#0875dc"/><stop offset="1" stop-color="#00377e"/>
    </linearGradient>
    <pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <rect width="8" height="16" fill="#ffc321"/><rect x="8" width="8" height="16" fill="#1b1d24"/>
    </pattern>
  </defs>`;

  // reach-space hint circle (max reach)
  const maxR=L.segs.reduce((s,v)=>s+v,0);
  s+=`<circle cx="${L.base.x}" cy="${L.base.y}" r="${maxR}" fill="none" stroke="#c9d5ec" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"/>`;

  // obstacles
  for(const ob of L.obstacles){
    s+=obstacleMarkup(ob);
  }

  // target
  if(tg.kind==='star'){
    const sz=tg.r*3.2;
    s+=`<image href="/games/reach-cari-target-star-v3.png" x="${tg.x-sz/2}" y="${tg.y-sz/2}" width="${sz}" height="${sz}" filter="url(#goalGlow)"/>`;
  }else{
    const bw=tg.r*2, bh=tg.r*3.1;
    s+=`<image href="/games/reach-cari-target-battery-v3.png" x="${tg.x-bw/2}" y="${tg.y-bh/2}" width="${bw}" height="${bh}"/>`;
  }

  // arm segments
  const armCol=hit?'#f2664f':'#004ac6';
  const armColHi=hit?'#f78b78':'#3b74e0';
  s+=`<g filter="${hit?'url(#hitRed)':'url(#armShadow)'}">`;
  for(let i=0;i<pts.length-1;i++){
    const p1=pts[i],p2=pts[i+1];
    const len=Math.hypot(p2.x-p1.x,p2.y-p1.y), rot=Math.atan2(p2.y-p1.y,p2.x-p1.x)*R2D;
    s+=`<image href="/games/reach-cari-arm-link-v4.png" x="0" y="-11" width="${len}" height="22"
      preserveAspectRatio="none" transform="translate(${p1.x} ${p1.y}) rotate(${rot})"/>`;
    if(hit) s+=`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#ff1727" stroke-width="24" stroke-linecap="round" opacity=".82"/>`;
  }
  s+='</g>';
  // base mount: draw it before the base joint so both pieces overlap as one mechanism
  s+=`<image href="/games/reach-cari-arm-base-v3.png" x="${L.base.x-38}" y="${L.base.y-10}" width="76" height="59" preserveAspectRatio="xMidYMid meet" filter="${hit?'url(#hitRed)':''}"/>`;

  // joints: cover both segment ends with one larger bearing
  for(let i=0;i<pts.length-1;i++){
    s+=`<image href="/games/reach-cari-arm-joint-v3.png" x="${pts[i].x-18}" y="${pts[i].y-18}" width="36" height="36" preserveAspectRatio="xMidYMid meet" filter="${hit?'url(#hitRed)':''}"/>`;
    // joint drag handles (FK drag on non-base joints)
    if(mode==='FK') s+=`<circle class="jhandle" data-j="${i}" cx="${pts[i].x}" cy="${pts[i].y}" r="20" fill="transparent" style="cursor:grab"/>`;
  }
  // gripper / CARI tip
  const tipAngle=Math.atan2(pts[pts.length-1].y-pts[pts.length-2].y, pts[pts.length-1].x-pts[pts.length-2].x)*R2D;
  s+=gripper(tip.x,tip.y,tipAngle,reached,hit);
  if(reached) s+=`<image href="/games/reach-cari-contact-vfx-v3.png" x="${tip.x-34}" y="${tip.y-34}" width="68" height="68"/>`;

  // tip drag handle in IK mode
  if(mode==='IK'){
    s+=`<circle id="tipDrag" cx="${tip.x}" cy="${tip.y}" r="26" fill="rgba(0,74,198,.10)" stroke="#004ac6" stroke-width="1.5" stroke-dasharray="3 4" style="cursor:grab"/>`;
  }

  svg.innerHTML=s;

  updatePanel(hit);
  if(hit && !window._wasHit) toast('충돌! 벽을 피해요');
  window._wasHit=hit;
  if(reached && !won){ won=true; setTimeout(()=>result(true), 260); }
  return {hit,reached,dist};
}

function obstacleMarkup(ob){
  const x=ob.x-ob.w/2, y=ob.y-ob.h/2;
  const horizontal=ob.w>=ob.h;
  const radius=Math.min(7,ob.w/4,ob.h/4);
  let h=`<g filter="url(#armShadow)">
    <rect x="${x}" y="${y}" width="${ob.w}" height="${ob.h}" rx="${radius}" fill="url(#obEdge)"/>
    <rect x="${x+2}" y="${y+2}" width="${Math.max(1,ob.w-4)}" height="${Math.max(1,ob.h-4)}" rx="${Math.max(1,radius-2)}" fill="url(#obMetal)"/>
    <path d="M${x+radius} ${y+3} H${x+ob.w-radius}" stroke="#9cecff" stroke-width="1.2" opacity=".65"/>`;
  if(horizontal){
    const bh=Math.min(7,Math.max(4,ob.h*.32));
    h+=`<rect x="${x+5}" y="${y+ob.h-bh-2}" width="${Math.max(1,ob.w-10)}" height="${bh}" rx="2" fill="url(#hazard)"/>`;
  }else{
    const bw=Math.min(7,Math.max(4,ob.w*.32));
    h+=`<rect x="${x+ob.w-bw-2}" y="${y+5}" width="${bw}" height="${Math.max(1,ob.h-10)}" rx="2" fill="url(#hazard)"/>`;
  }
  if(ob.w>34) h+=`<circle cx="${x+7}" cy="${y+7}" r="2" fill="#a9bdd4"/><circle cx="${x+ob.w-7}" cy="${y+7}" r="2" fill="#a9bdd4"/>`;
  return h+'</g>';
}

function starPath(cx,cy,r,fill){
  let pth='';
  for(let i=0;i<10;i++){
    const rr=i%2===0?r:r*0.44;
    const a=(-90+i*36)*D2R;
    pth+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1)+' ';
  }
  pth+='Z';
  return `<path d="${pth}" fill="${fill}" stroke="#c98f00" stroke-width="1.5"/>`;
}

function gripper(x,y,angDeg,reached,hit){
  return `<image href="/games/reach-cari-arm-gripper-v3.png" x="-8" y="-18" width="48" height="36"
    preserveAspectRatio="xMidYMid meet" transform="translate(${x} ${y}) rotate(${angDeg})" filter="${hit?'url(#hitRed)':''}"/>`;
}

/* joint sliders panel (FK) / tip hint (IK) */
function updatePanel(hit){
  const panel=document.getElementById('panel');
  if(mode==='IK'){
    if(!panel.dataset.ik){
      panel.dataset.ik='1'; panel.dataset.fk='';
      panel.innerHTML=`<div class="iktip">로봇의 <b>손끝</b>을 손가락이나 마우스로 끌어보세요.<br>관절들이 손끝을 따라 함께 움직여요.<br>팔이 붉어지면 장애물에 닿은 거예요.</div>`;
    }
    return;
  }
  // FK: build sliders once, then update values
  if(panel.dataset.fk!==String(ang.length)){
    panel.dataset.fk=String(ang.length); panel.dataset.ik='';
    let h='';
    const jointNames=ang.length===2?['아래 관절','위 관절']:
      ang.length===3?['아래 관절','가운데 관절','손목 관절']:
      ['아래 관절','가운데 1','가운데 2','손목 관절'];
    for(let i=0;i<ang.length;i++){
      h+=`<div class="jrow"><label>${jointNames[i]||('관절 '+(i+1))}</label>
        <input type="range" min="${L.limits[i][0]}" max="${L.limits[i][1]}" value="${ang[i]}" data-j="${i}">
        <span class="deg" id="deg${i}">${Math.round(ang[i])}°</span></div>`;
    }
    panel.innerHTML=h;
    panel.querySelectorAll('input[type=range]').forEach(inp=>{
      inp.addEventListener('input',()=>{
        const j=+inp.dataset.j;
        ang[j]=+inp.value;
        draw();
      });
    });
  }
  for(let i=0;i<ang.length;i++){
    const d=document.getElementById('deg'+i);
    if(d) d.textContent=Math.round(ang[i])+'°';
    const inp=panel.querySelector(`input[data-j="${i}"]`);
    if(inp && +inp.value!==Math.round(ang[i])) inp.value=ang[i];
  }
}

/* ================= Pointer interaction ================= */
function svgPoint(evt){
  const src=evt.touches&&evt.touches[0]?evt.touches[0]:(evt.changedTouches&&evt.changedTouches[0]?evt.changedTouches[0]:evt);
  const cx=src.clientX, cy=src.clientY;
  // use the SVG's screen transform so preserveAspectRatio letterboxing is honored
  const ctm=svg.getScreenCTM();
  if(ctm){
    const pt=svg.createSVGPoint(); pt.x=cx; pt.y=cy;
    const u=pt.matrixTransform(ctm.inverse());
    return {x:u.x, y:u.y};
  }
  const r=svg.getBoundingClientRect(); const vb=svg.viewBox.baseVal;
  return { x:(cx-r.left)/r.width*vb.width, y:(cy-r.top)/r.height*vb.height };
}

let dragJoint=-1, draggingTip=false;

function onDown(e){
  if(won) return;
  const t=e.target;
  if(mode==='IK' && (t.id==='tipDrag' || t.id==='tipDrag')){
    draggingTip=true; e.preventDefault(); return;
  }
  if(mode==='IK'){
    // allow grabbing anywhere near tip
    const p=svgPoint(e); const pts=fkPoints(ang); const tip=pts[pts.length-1];
    if(Math.hypot(p.x-tip.x,p.y-tip.y)<40){ draggingTip=true; e.preventDefault(); return; }
  }
  if(mode==='FK' && t.classList && t.classList.contains('jhandle')){
    dragJoint=+t.dataset.j; e.preventDefault(); return;
  }
  if(mode==='FK'){
    // nearest joint pivot: rotate the joint whose pivot is closest to the touch
    const p=svgPoint(e); const pts=fkPoints(ang);
    let best=-1,bd=26;
    for(let i=0;i<ang.length;i++){
      const d=Math.hypot(p.x-pts[i].x,p.y-pts[i].y);
      if(d<bd){bd=d;best=i;}
    }
    if(best>=0){ dragJoint=best; e.preventDefault(); }
  }
}

function onMove(e){
  if(won) return;
  if(draggingTip){
    e.preventDefault();
    const p=svgPoint(e);
    const goal={x:clamp(p.x,6,394), y:clamp(p.y,6,514)};
    const solved=ccdSolve(ang, goal);
    // collision guard: only accept if not worse-colliding (allow but show red)
    ang=solved;
    draw();
    return;
  }
  if(dragJoint>=0){
    e.preventDefault();
    const p=svgPoint(e);
    const pts=fkPoints(ang);
    const piv=pts[dragJoint];
    // desired absolute angle of this segment
    const desiredAbs=Math.atan2(p.y-piv.y, p.x-piv.x)*R2D;
    // current absolute angle up to and including this joint = sum ang[0..dragJoint]
    let baseAbs=0; for(let i=0;i<dragJoint;i++) baseAbs+=ang[i];
    let rel=desiredAbs-baseAbs;
    while(rel>180)rel-=360; while(rel<-180)rel+=360;
    ang[dragJoint]=clamp(rel, L.limits[dragJoint][0], L.limits[dragJoint][1]);
    draw();
  }
}
function onUp(){ dragJoint=-1; draggingTip=false; }

svg.addEventListener('mousedown',onDown);
svg.addEventListener('touchstart',onDown,{passive:false});
window.addEventListener('mousemove',onMove);
window.addEventListener('touchmove',onMove,{passive:false});
window.addEventListener('mouseup',onUp);
window.addEventListener('touchend',onUp);

/* ================= Noise (level 5) ================= */
function tickNoise(){
  if(L && L.noise && !won && document.getElementById('ovResult').classList.contains('hide')
     && document.getElementById('ovStart').classList.contains('hide')){
    // jitter last-but-one joint slightly, self-correct visually
    const j=ang.length-1;
    const noisy=ang.slice();
    noisy[j]=clamp(ang[j]+(Math.random()-0.5)*L.noise*2, L.limits[j][0], L.limits[j][1]);
    const pts=fkPoints(noisy);
    const tip=pts[pts.length-1], tg=L.target;
    const hit=armHitsAny(pts);
    const reached=Math.hypot(tip.x-tg.x,tip.y-tg.y)<tg.r+9 && !hit;
    // draw noisy version without committing (except when reached, commit)
    renderFrom(noisy, reached);
    if(reached && !won){ won=true; ang=noisy; setTimeout(()=>result(true),260); }
  }
  rafId=requestAnimationFrame(tickNoise);
}
function renderFrom(a, forceReached){
  const save=ang; ang=a; draw(); ang=save;
}

/* ================= Mode / buttons ================= */
function setMode(m){
  mode=m;
  document.getElementById('mFK').classList.toggle('act',m==='FK');
  document.getElementById('mIK').classList.toggle('act',m==='IK');
  const panel=document.getElementById('panel');
  panel.dataset.fk=''; panel.dataset.ik='';
  draw();
}
document.getElementById('mFK').onclick=()=>setMode('FK');
document.getElementById('mIK').onclick=()=>setMode('IK');

document.getElementById('btnReset').onclick=()=>{ ang=L.start.slice(); won=false; draw(); };
document.getElementById('btnHint').onclick=()=>{
  if(won) return;
  if(mode!=='FK') setMode('FK');
  const goal=L.solve ? L.solve : ccdSolve(ang,L.target);
  let pick=0, gap=-1;
  for(let i=0;i<ang.length;i++){
    const range=L.limits[i][1]-L.limits[i][0];
    const d=Math.abs(goal[i]-ang[i])/range;
    if(d>gap){gap=d;pick=i;}
  }
  const rows=[...document.querySelectorAll('.jrow')];
  rows.forEach(r=>r.classList.remove('hint'));
  const row=rows[pick];
  if(row){
    row.classList.add('hint');
    setTimeout(()=>row.classList.remove('hint'),2100);
  }
  const name=row?.querySelector('label')?.textContent||('관절 '+(pick+1));
  toast(`${name}을 ${goal[pick]>ang[pick]?'오른쪽':'왼쪽'}으로 돌려보세요`);
};

/* ================= Toast ================= */
let toastT=0;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),900);
}

/* ================= Load level ================= */
function loadLevel(i){
  LI=i; L=LEVELS[i]; ang=L.start.slice(); won=false; mode='FK';
  document.getElementById('lvlName').textContent=L.name;
  document.getElementById('lvlSub').textContent=L.sub;
  document.getElementById('goalPill').textContent=L.goal;
  document.getElementById('mFK').classList.add('act');
  document.getElementById('mIK').classList.remove('act');
  const panel=document.getElementById('panel'); panel.dataset.fk=''; panel.dataset.ik='';
  // DOF dots
  let dots=''; for(let k=0;k<L.segs.length;k++) dots+='<span class="dot on"></span>';
  document.getElementById('dofDots').innerHTML=dots;
  draw();
}

/* ================= Result ================= */
function result(win){
  const ov=document.getElementById('ovResult');
  const b=document.getElementById('resBadge');
  b.textContent=win?'목표 포착!':'다시 조정해요';
  b.className='badge '+(win?'win':'lose');
  document.getElementById('resTitle').textContent=win?(L.name+' 클리어!'):'다시 도전';
  document.getElementById('resTake').innerHTML=L.take;
  const nextBtn=document.getElementById('btnNext');
  if(win && window.MGBridge) MGBridge.submit(LI+1, {timed:true}); // 랭킹: 도달 레벨(동률=시간)
  nextBtn.textContent = (LI>=LEVELS.length-1)?'처음으로':'다음';
  ov.classList.remove('hide');
}
document.getElementById('btnRetry').onclick=()=>{
  document.getElementById('ovResult').classList.add('hide');
  loadLevel(LI);
};
document.getElementById('btnNext').onclick=()=>{
  document.getElementById('ovResult').classList.add('hide');
  loadLevel((LI+1)%LEVELS.length);
};

/* ================= Start ================= */
document.getElementById('btnStart').onclick=()=>{
  document.getElementById('ovStart').classList.add('hide');
  loadLevel(0);
};

loadLevel(0);
rafId=requestAnimationFrame(tickNoise);
</script>

<!-- ===== 앱 브리지: 랭킹 버튼 + 점수 전송 =====
     이 HTML 은 자립형이라 세션도 supabase 클라도 없다 → 실제 제출/조회는 부모(/games/:id = MiniGame.tsx)가 한다.
     여기서는 (1) 인트로·아웃트로 우상단에 '랭킹' 버튼을 얹고, (2) 점수가 나면 postMessage 로 알리기만 한다.
     ⚠️ 이 파일을 단독으로 열면 부모가 없어 버튼도 숨고 아무것도 보내지 않는다(게임은 그대로 동작).
     ⚠️ tieMs(레벨형 동률 해소용 소요시간)는 인트로에서 시작을 누른 시점부터 잰다. '처음으로'로 되돌아가
       인트로를 다시 거치지 않으면 계속 누적된다 — 순위 1차 키가 아니라 동률 해소용이라 그대로 둔다. -->
<style>
.mg-rank{position:absolute; top:12px; right:12px; z-index:60; display:none; align-items:center; justify-content:center;
  box-sizing:border-box; width:112px; height:34px; padding:0; border:0; cursor:pointer;
  font:850 11.5px/1 system-ui,-apple-system,sans-serif; letter-spacing:.025em; color:#fff;
  background:url("rank-button.png") center/100% 100% no-repeat; text-shadow:0 1px 3px #001c55;
  filter:drop-shadow(0 3px 4px rgba(8,20,60,.24)); -webkit-tap-highlight-color:transparent;}
.mg-rank.on{display:inline-flex;}
.mg-rank span{display:block; transform:translateX(7px);}
.mg-rank:hover{filter:brightness(1.06) drop-shadow(0 3px 5px rgba(8,20,60,.28));}
.mg-rank:active{transform:translateY(1px) scale(.98);}
</style>
<script>
(function(){
  var EMBED = window.parent !== window;
  var T0 = 0;
  function post(m){ if(EMBED) window.parent.postMessage(m, window.location.origin); }
  window.MGBridge = {
    /** 점수 전송. timed:true 면 시작 이후 경과시간을 동률 해소용으로 같이 보낸다. */
    submit: function(v, opts){
      if(typeof v !== 'number' || !isFinite(v)) return;
      post({ t:'mg:score', score:v, tieMs:(opts && opts.timed && T0) ? (Date.now()-T0) : undefined });
    }
  };
  function mount(id){
    var ov = document.getElementById(id); if(!ov) return;
    if(ov.querySelector('.mg-rank')) return;
    var b = document.createElement('button');
    b.type='button'; b.className='mg-rank' + (EMBED ? ' on' : '');
    b.setAttribute('aria-label','이 게임 랭킹 보기');
    b.innerHTML='<span>랭킹</span>';
    b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); post({t:'mg:rank'}); });
    ov.appendChild(b);
  }
  mount('ovStart'); mount('ovResult');
  // 인트로에서 (랭킹 버튼이 아닌) 무엇이든 누르면 = 플레이 시작 → 소요시간 기준점 리셋.
  var intro = document.getElementById('ovStart');
  if(intro) intro.addEventListener('click', function(e){
    if(e.target && e.target.closest && e.target.closest('.mg-rank')) return;
    T0 = Date.now();
  }, true);
})();
</script>
</body>
</html>
