<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>버텨라 CARI</title>
<style>
  :root{
    /* CARI 곰 톤: 크림 + 소프트 페리윙클 블루 + 코발트 */
    --page:#e9eff9; --bg:#fbfaf5; --ink:#28324c; --sub:#7c869e;
    --brand:#004ac6; --brand-hi:#1b55d0;
    --good:#12b58c; --bad:#f2664f; --skip:#e59b17;
    --wall1:#aec3e8; --wall2:#8aa4d3; --wall3:#6f8ac2; --wall-edge:#5f7bb5;
    --cream:#ece9e0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    /* 스테이지(460px) 바깥 = 레터박스. 사이트 하늘색을 그대로 쓰면 따뜻한 동굴 아트가 찬 파랑 위에
       스티커처럼 붙어 보여, 동굴 아트의 암부색(샘플: #281a2f/#231729)으로 어둡게 덮는다.
       ⚠️ 이 색은 /games 상단 바와 짝 — 바꾸면 src/lib/minigames.ts 의 frame 도 같이 고칠 것. */
    background:radial-gradient(120% 80% at 50% 42%, #2e2038 0%, #241830 45%, #180f20 100%);
    color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100%; overflow:hidden;
    user-select:none;
  }
  .stage{
    position:relative; width:min(460px,100vw); height:min(860px,100vh);
    display:flex; flex-direction:column;
    /* 동굴 배경을 스테이지 전체에 — 헤더 등 투명부로 그대로 노출.
       ⚠️ cover 금지: 이미지(941x1672) 맨 위가 거의 검정(#23162a)인데 cover 는 세로 전체를 쓰므로
          그 암흑부가 헤더 뒤에 깔려 검은 띠가 된다(.pit 은 자기 높이로 cover 해 위쪽이 잘려나감).
          auto 200% + bottom 으로 위쪽 암흑부를 잘라낸다. */
    background:url("beat-cari-bg.webp") center bottom/auto 200% no-repeat;
    /* 어두운 레터박스 위에선 파란 글로우가 안 보인다 → 얇은 광택 테두리로 스테이지 경계를 세운다. */
    box-shadow:0 0 0 1px rgba(255,255,255,.07), 0 18px 60px rgba(10,4,16,.6); overflow:hidden;
  }

  /* HUD */
  .hud{ position:relative; z-index:6; width:100%; height:90px; }
  /* inset 이 음수인 건 의도 — 헤더 PNG 는 알약 바깥이 투명이라 inset:0 이면 그 투명 여백으로
     스테이지 배경이 비쳐 검은 띠·모서리가 생긴다. 스테이지 밖으로 넘겨서 overflow:hidden 으로 잘라낸다. */
  .hud::before{ content:""; position:absolute; inset:-8px -14px -2px;   /* 9-slice: 왼쪽(별)·오른쪽(pill) 고정, 가운데만 늘림 */
    border-style:solid; border-width:0 129px 0 107px;
    border-image:url("beat-cari-header.webp") 0 360 0 300 fill; border-image-repeat:stretch;
  }
  .hud-score, .hud-right, .hud-chip{ display:block; }
  .hs-ic, .hud-chip svg, .hc-lab{ display:none; }   /* 별·왕관·번개·라벨 = 이미지에 포함 */
  /* top 값은 아트에 맞춘 실측치 — 헤더 이미지의 별 세로중심이 43px(=47.8%)이고
     이 글꼴 숫자는 em 박스 중심보다 약 5% 아래에 찍혀서 그만큼 올려 잡았다. 눈대중으로 고치지 말 것. */
  .hs-num{ position:absolute; z-index:1; left:70px; top:45.5%; transform:translateY(-50%);
    font-size:36px; font-weight:900; color:#6d3f7a; font-variant-numeric:tabular-nums;
    text-shadow:0 1px 2px rgba(255,255,255,.7); line-height:1; }
  /* 최고·배속도 같은 실측 기준 — 왕관 세로중심 27px, 번개 세로중심 64px(=알약 가운데) */
  #best{ position:absolute; z-index:1; right:60px; top:30%; transform:translateY(-50%);
    font-size:15px; font-weight:900; color:#6d3f7a; font-variant-numeric:tabular-nums;
    text-shadow:0 1px 1px rgba(255,255,255,.7); }
  #spd{ position:absolute; z-index:1; right:60px; top:70%; transform:translateY(-50%);
    font-size:14px; font-weight:900; color:#b06a1f; font-variant-numeric:tabular-nums;
    text-shadow:0 1px 1px rgba(255,255,255,.7); }

  /* PIT */
  .pit{position:relative; flex:1; overflow:hidden;
      background:url("beat-cari-bg.webp") center bottom/cover no-repeat, #ece9e0;}
  .pit::after{ /* soft vignette */
    content:""; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 70px rgba(150,170,210,.25);
  }
  .ceiling{position:absolute; left:0; right:0; top:0; will-change:transform;}
  .ceiling-body{
    height:100%;
    background:url("beat-cari-rock.webp") center bottom / 100% 100% no-repeat;
    filter:drop-shadow(0 6px 10px rgba(90,55,80,.4));
  }
  .teeth{ display:none; } /* 돌 이미지(beat-cari-rock.webp) 자체에 종유석 끝이 있어 미사용 */
  .dust{position:absolute; width:5px;height:5px;border-radius:50%;background:#b9c9e6;opacity:.55;}

  /* 정답/오답 = 천장 밑면 흙먼지. 화면 흔들림은 쓰지 않는다(문제를 읽는 중이라 가독성이 먼저).
     정답(밝은 먼지, 위로 피어오름) / 오답(.dark, 아래로 흩날림) */
  /* 정답 = 머리 위 안테나(행성)에서 위로 퍼지는 빛 파동. 곰이 점프해서 천장을 밀 수는 없으니
     '기(氣)로 밀어낸다'로 인과를 바꾼 것 — 파동이 천장에 닿는 순간 반동+먼지가 터진다. */
  .wave{position:absolute; z-index:6; pointer-events:none; width:210px; height:58px; border-radius:50%;
    /* 동굴 배경이 밝은 살구색이라 얇고 은은한 링은 그냥 묻힌다 — 굵게 + 흰 심 + 강한 글로우. */
    border:5px solid rgba(226,248,255,.95); border-bottom-color:rgba(190,238,255,.35);
    box-shadow:0 0 10px rgba(255,255,255,.9), 0 0 30px rgba(90,195,255,.85),
               0 0 58px rgba(70,170,255,.5), inset 0 0 20px rgba(190,240,255,.55);}
  .player.zap{animation:zap .36s ease-out;}
  @keyframes zap{
    0%  {filter:drop-shadow(0 6px 7px rgba(70,90,140,.30));}
    28% {filter:drop-shadow(0 6px 7px rgba(70,90,140,.30)) drop-shadow(0 0 11px rgba(150,225,255,.95));}
    100%{filter:drop-shadow(0 6px 7px rgba(70,90,140,.30));}}

  /* 먼지 = 손그림 퍼프 4종(회색조 원본, 256² webp). CSS 원 그라디언트로 그렸더니 솜뭉치처럼 보여서
     실제 아트로 교체했다. 색은 여기서 filter 로 입힌다 — 원본은 무채색이라 정답/오답을 같은 파일로 쓴다. */
  .puff{position:absolute; z-index:5; pointer-events:none;
    background-size:100% 100%; background-repeat:no-repeat;}
  .puff.d1{background-image:url("beat-cari-dust-1.webp");}
  .puff.d2{background-image:url("beat-cari-dust-2.webp");}
  .puff.d3{background-image:url("beat-cari-dust-3.webp");}
  .puff.d4{background-image:url("beat-cari-dust-4.webp");}
  /* 정답 = 돌에서 튄 따뜻한 흙먼지 */
  .puff{filter:sepia(.42) saturate(1.45) hue-rotate(-12deg) brightness(1.02);}
  /* 오답 = 차갑게 내려앉는 재. ⚠️ 어둡게 하면 안 된다 — 천장 위쪽이 짙은 자주라 검은 먼지는 안 보인다.
     정답과의 구분은 색이 아니라 방향(위로 피어오름 / 아래로 흘러내림)이 먼저다. */
  .puff.dark{filter:grayscale(1) brightness(.97) contrast(1.05);}

  /* 충격 이펙트 (게임오버 직전) */
  .wflash{position:absolute; inset:0; z-index:8; pointer-events:none; background:#fff; animation:wf .28s ease-out forwards;}
  @keyframes wf{0%{opacity:.5}100%{opacity:0}}
  .shock{position:absolute; z-index:8; width:280px; height:280px; border-radius:50%;
    border:6px solid rgba(111,138,190,.85); transform:translate(-50%,-50%) scale(.05); pointer-events:none;
    animation:shock .6s cubic-bezier(.15,.7,.35,1) forwards;}
  @keyframes shock{0%{transform:translate(-50%,-50%) scale(.05); opacity:.9}
                   100%{transform:translate(-50%,-50%) scale(1); opacity:0; border-width:1px}}
  .debris{position:absolute; z-index:8; border-radius:3px; pointer-events:none;
    background:linear-gradient(160deg,#b6cae9,#6f86bf); box-shadow:0 1px 2px rgba(60,80,130,.4);}
  .shake-hard{animation:shk2 .09s linear infinite;}
  @keyframes shk2{0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}100%{transform:translate(3px,1px)}}

  .mood{position:absolute; left:0; top:0; z-index:4; font-size:22px; pointer-events:none;
    opacity:0; transition:opacity .18s ease; transform:translate(-50%,-140%); will-change:transform,opacity;
    filter:drop-shadow(0 1px 1px rgba(80,90,120,.3));}
  .sweat{position:absolute; left:0; top:0; z-index:4; width:7px; height:9px; pointer-events:none;
    background:radial-gradient(circle at 40% 30%, #eaf4ff, #7fb0ea 68%, #5f93d8);
    border-radius:50% 50% 50% 50%/62% 62% 40% 40%; box-shadow:0 1px 2px rgba(70,110,180,.4);}

  .player{
    position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
    width:78px; height:auto; z-index:2; transform-origin:50% 100%;
    filter:drop-shadow(0 6px 7px rgba(70,90,140,.30));
    transition:none;
  }
  .floor{ display:none; } /* 초록 풀떼기 바닥 제거 — 동굴 배경의 모래바닥을 실제 바닥으로 사용 */
  .danger{
    position:absolute; inset:0; pointer-events:none; opacity:0; z-index:3;
    background:radial-gradient(120% 60% at 50% 100%, rgba(242,102,79,.5), transparent 70%);
    transition:opacity .12s;
  }
  .depth{
    position:absolute; right:6px; top:6px; z-index:4; font-size:11px; color:var(--sub);
    background:rgba(255,255,255,.72); border:1px solid #e6e9f3; padding:2px 8px; border-radius:20px; font-variant-numeric:tabular-nums;
  }

  /* floating feedback */
  .flash{
    position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
    font-size:30px; font-weight:900; z-index:5; pointer-events:none; opacity:0;
    text-shadow:0 2px 6px rgba(255,255,255,.85), 0 1px 2px rgba(80,90,120,.25);
  }
  @keyframes pop{
    0%{opacity:0; transform:translate(-50%,-30%) scale(.7);}
    18%{opacity:1; transform:translate(-50%,-55%) scale(1.12);}
    100%{opacity:0; transform:translate(-50%,-120%) scale(1);}
  }
  .flash.show{animation:pop .7s ease-out forwards;}

  /* QUESTION CARD */
  .qcard{
    background:transparent; z-index:6;
    border-style:solid; border-width:16px 24px 28px 24px;   /* 문제 영역 전체를 문제창 패널로 9-slice 채움 (좌우 줄여 버튼 폭 확보) */
    border-image:url("beat-cari-panel.webp") 175 200 180 200 fill; border-image-repeat:stretch;
    padding:0 6px 6px;
    margin:-3px;   /* 헤더와 같은 이유 — 패널 PNG 바깥 1~2px 이 반투명이라 스테이지 배경이 어두운 실선으로 비친다 */
  }
  .qmeta{display:flex; justify-content:flex-end; align-items:center; min-height:0; margin-bottom:0;}
  .qmeta .streak{font-size:12px; color:#ffcf6b; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.3);}
  .qmeta .tag{display:none;}  /* 카테고리 안내 제거 */
  /* 문제창 높이는 문항과 무관하게 고정한다(2026-09-14 지적: 글 길이에 따라 동굴 바닥이 오르내렸다).
     지문 2줄·보기 2줄 높이로 못 박고, 넘치는 문항은 fitText() 가 글자를 한 단씩 줄여 넣는다 — 잘리는 건 없다.
     ⚠️ height 를 min-height 로 되돌리지 말 것 — 그 순간 바닥이 다시 움직인다. */
  .prompt{
    font-size:18px; font-weight:800; color:#5c4463; line-height:1.4; margin-bottom:10px;
    height:56px; text-align:left; overflow:hidden;
    display:flex; align-items:center; justify-content:flex-start; padding:2px 8px;
  }
  /* 1fr = minmax(auto,1fr) — 칸의 최소 너비가 '가장 긴 어절'이라
     보통은 5:5 로 붙고, 한 어절이 반칸보다 길 때만 그 칸이 조금 넓어진다(옆 칸 찌그러짐 없음). */
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .choice{
    position:relative; text-align:left; padding:12px 8px 12px 54px; border:0;
    background:url("beat-cari-choice.webp") center/100% 100% no-repeat;
    color:#3e2b52; font-size:15.5px; font-weight:800; line-height:1.25;
    /* 긴 보기(예: "시뮬레이션 투 리얼(Sim-to-Real)")는 줄바꿈.
       keep-all = 한국어를 어절 단위로 끊고, break-word 는 한 어절이 칸보다 길 때만 강제로 끊는다. */
    white-space:normal; word-break:keep-all; overflow-wrap:break-word;
    cursor:pointer; transition:transform .05s, filter .12s; height:66px; overflow:hidden;
    display:flex; align-items:center;
  }
  .choice:active{transform:scale(.97);}
  .choice .num{  /* 왼쪽 크리스탈 위 번호 */
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    width:30px; text-align:center; color:#4e2c5e; font-size:17px; font-weight:900;
    text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 1px 1px #fff;
  }
  .choice.correct{ filter:drop-shadow(0 0 4px var(--good)) drop-shadow(0 0 9px rgba(18,181,140,.6)); }
  .choice.correct .num{ color:var(--good); }
  .choice.wrong{ filter:drop-shadow(0 0 4px var(--bad)) drop-shadow(0 0 9px rgba(242,102,79,.6)); }
  .choice.wrong .num{ color:var(--bad); }
  /* OVERLAYS */
  .overlay{
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:28px;
    background:rgba(245,247,252,.9); backdrop-filter:blur(4px);
  }
  .overlay h1{font-size:30px; margin:0 0 6px; font-weight:900; color:var(--ink); letter-spacing:-.01em;}
  .overlay .em{font-size:52px; margin-bottom:8px;}
  .overlay p{color:var(--sub); font-size:14px; line-height:1.6; margin:4px 0; max-width:320px;}
  .overlay .big{font-size:56px; font-weight:900; color:var(--brand); font-variant-numeric:tabular-nums; margin:6px 0;}
  .overlay .row{display:flex; gap:18px; margin:10px 0 4px;}
  .overlay .row .k{font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.06em;}
  .overlay .row .val{font-size:24px; font-weight:800; color:var(--ink);}
  .btn{
    margin-top:18px; padding:14px 34px; border-radius:30px; border:0; cursor:pointer;
    background:linear-gradient(120deg,#1b55d0,#004ac6); color:#fff; font-size:16px; font-weight:800;
    box-shadow:0 10px 24px rgba(0,74,198,.32);
  }
  .btn:active{transform:scale(.97);}
  .kbd{display:inline-block; padding:1px 7px; border-radius:5px; background:#eef1f8; border:1px solid #d9e0f0; font-size:12px; font-weight:700; color:var(--ink);}

  /* 시작 인트로 (게임 타이틀 화면) */
  .intro{ gap:0; }
  /* 배경 = 인트로/아웃트로 동굴 아트로 교체 (기존 반투명 흰 배경/블러 제거). 세로 941x1672 → cover */
  .overlay.intro, .overlay.over{
    backdrop-filter:none;
    background:url("beat-cari-intro-bg.webp") center/cover no-repeat;
  }
  /* 마스코트 크기를 화면 높이에 연동 — 세로가 짧은 폰(예: 375x667)에서 앱 헤더까지 빠지면
     '버티기 시작' 버튼이 화면 밖으로 밀려 잘렸다. 높은 화면에서는 min() 이 284px 로 잡혀 원래 그대로. */
  .intro-mascot{ width:min(284px, 36vh); height:auto; margin-top:-6px; filter:drop-shadow(0 14px 18px rgba(70,90,140,.32)); animation:bob 2.6s ease-in-out infinite; }
  @keyframes bob{0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)}}
  .intro-title{ font-size:44px; font-weight:900; letter-spacing:-.02em; line-height:1; margin:2px 0 0;
    transform:rotate(-2.5deg); animation:titlePop .55s cubic-bezier(.2,1.7,.4,1) both; }
  /* 동굴 배경(분홍·보라)과 같은 색상 계열이라 명도로 띄운다: 짙은 자주 외곽선 + 밝은 속면.
     -webkit-text-stroke 는 글자 안쪽을 깎아 획이 얇아지므로 쓰지 않고 8방향 text-shadow 로 외곽선을 만든다. */
  .intro-title .t1, .intro-title .t2::before{
    text-shadow:
      -2px -2px 0 #4a2450, 0 -2px 0 #4a2450, 2px -2px 0 #4a2450,
      -2px  0   0 #4a2450,                   2px  0   0 #4a2450,
      -2px  2px 0 #4a2450, 0  2px 0 #4a2450, 2px  2px 0 #4a2450,
      0 6px 15px rgba(60,24,54,.55);
  }
  .intro-title .t1{ color:#fff7ea; }
  .intro-title .t2{ position:relative; display:inline-block;
    background:linear-gradient(180deg,#fff2c8 4%,#ffc63f 48%,#e5921f 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent; }
  /* background-clip:text 는 '배경' 레이어라 text-shadow 가 그 위를 덮는다(= 금색이 사라짐).
     그래서 그림자는 같은 글자를 투명하게 한 벌 더 깐 ::before 에 준다. */
  .intro-title .t2::before{ content:attr(data-t); position:absolute; left:0; top:0; z-index:-1;
    color:#4a2450; -webkit-text-fill-color:#4a2450; }
  @keyframes titlePop{0%{opacity:0; transform:scale(.5) rotate(-2.5deg)} 60%{transform:scale(1.08) rotate(-2.5deg)} 100%{opacity:1; transform:scale(1) rotate(-2.5deg)}}
  .intro-tag{ font-size:14.5px; font-weight:800; color:#fff4e4; margin:15px 0 30px; letter-spacing:.005em;
    text-shadow:
      -1px -1px 0 rgba(74,36,80,.9), 1px -1px 0 rgba(74,36,80,.9),
      -1px  1px 0 rgba(74,36,80,.9), 1px  1px 0 rgba(74,36,80,.9),
      0 3px 9px rgba(60,24,54,.6); }
  /* 규칙 3줄 = 크리스탈 텍스트창 이미지 하나.
     ⚠️ 원본(1775x886)은 투명 여백이 있어 잘라낸 1759x843 을 쓴다. 비율 고정 필수.
     ⚠️ 아이콘(▲▼★ 원형 배지)이 이미지에 박혀 있다 → .ir-ic 는 숨기고 글자만 얹는다.
        배지는 가로 7.5~17.5%, 세로중심 20%/48%/76% (실측). 3등분 그리드로 그 중심에 줄을 맞춘다:
        본문 높이 84%·위 6%·아래 10% → 각 줄 중심이 정확히 20/48/76%.
     ⚠️ padding 을 그냥 % 로 쓰면 안 된다 — % padding 은 '부모(오버레이) 폭' 기준이라
        화면이 386px 을 넘어 패널이 330px 로 고정되는 순간부터 글자가 오른쪽으로 밀린다(460px 에서 14px 밀렸음).
        그래서 패널 실폭을 --pw 로 잡아 calc 로 곱한다. 세로값은 비율(2.087)로 나눈 값. */
  .intro-rules{ display:grid; grid-template-rows:repeat(3,1fr); align-items:center;
    --pw:min(330px, 100%);
    width:var(--pw); aspect-ratio:1759/843; margin-bottom:20px;
    padding:calc(var(--pw)*.0287) calc(var(--pw)*.06) calc(var(--pw)*.0479) calc(var(--pw)*.205);
    background:url("beat-cari-intro-panel.webp") center/100% 100% no-repeat; }
  /* 텍스트창이 크림색 → 보라로 바뀌면서 기존 #5c4463 은 대비가 3.6:1 까지 떨어져 잘 안 보였다.
     글자를 더 진하게 하고 흰 헤일로(5px)는 줄인다 — 헤일로가 클수록 글자 가장자리가 배경에 녹는다. */
  .ir{ display:flex; align-items:center; text-align:left; font-size:13.5px; color:#3a2440;
    background:none; border:0; border-radius:0; padding:0; box-shadow:none;
    text-shadow:0 1px 0 rgba(255,255,255,.7), 0 0 3px rgba(255,255,255,.5); }
  .ir-ic{ display:none !important; }   /* 아이콘은 텍스트창 이미지에 포함 */
  .ir b{ font-weight:800; }
  /* 규칙 아이콘 = 인라인 SVG(삼각형 위/아래·별). 크림 패널 위에서 튀지 않게
     진한 색은 아이콘에만 주고 칩은 같은 색 옅은 원으로. 색은 인게임 정답/오답 색과 동일. */
  /* 원은 반드시 불투명 — 반투명이면 크림 패널·하단 바위 그림에 아이콘이 묻힌다.
     흰 원 + 같은 색 링 + 그림자로 배경에서 떼어내고, 색은 아이콘과 링에만 준다. */
  .ir-ic{ flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
    text-shadow:none; background:#fffdf8; box-shadow:0 1px 3px rgba(96,62,108,.3); }
  .ir-ic svg{ width:15px; height:15px; display:block; }
  .ir-ic.up{ color:var(--good); box-shadow:0 1px 3px rgba(96,62,108,.3), inset 0 0 0 1.5px rgba(18,181,140,.5); }
  .ir-ic.dn{ color:var(--bad);  box-shadow:0 1px 3px rgba(96,62,108,.3), inset 0 0 0 1.5px rgba(242,102,79,.5); }
  .ir-ic.st{ color:var(--skip); box-shadow:0 1px 3px rgba(96,62,108,.3), inset 0 0 0 1.5px rgba(229,155,23,.55); }
  .btn.play{ padding:15px 48px; font-size:17px; }
  /* 시작·다시도전 버튼 = 크리스탈 알약 이미지 (원본 932x227 비율 고정, 글자만 얹음) */
  #startBtn, #againBtn{
    margin-top:16px; padding:0; border:0; border-radius:0; box-shadow:none;
    width:min(224px, 64%); aspect-ratio:932/227;   /* 가로로 너무 길어 축소 — 글자(100px)와 양끝 크리스탈 사이 여백 57px */
    background:url("beat-cari-startbtn.webp") center/100% 100% no-repeat;
    color:#5c3a6b; font-size:19px; font-weight:900; letter-spacing:-.01em;
    text-shadow:0 1px 0 rgba(255,255,255,.85), 0 0 8px rgba(255,255,255,.65);
    filter:drop-shadow(0 7px 13px rgba(95,60,110,.28));
  }
  .intro-keys{ margin-top:14px; font-size:12px; color:var(--sub); }

  /* 게임오버 화면 */
  .over-emoji{ font-size:56px; margin:12px 0 0; animation:titlePop .5s cubic-bezier(.2,1.7,.4,1) both; }
  /* 액자가 커진 만큼 마스코트는 화면 높이에 연동 — 짧은 폰에서 '다시 도전'이 밀려 잘리는 것 방지 */
  .over-img{ width:min(196px, 22vh); height:auto; margin:4px 0 2px; animation:titlePop .5s cubic-bezier(.2,1.7,.4,1) both;
    filter:drop-shadow(0 9px 13px rgba(70,90,140,.3)); }
  .over-title{ font-size:33px; font-weight:900; color:var(--ink); letter-spacing:-.02em; transform:rotate(-2deg);
    margin:2px 0 16px; text-shadow:0 2px 0 #fff, 0 4px 10px rgba(80,100,150,.25); }
  /* 아웃트로 타이틀은 동굴 배경 위 — 인트로 타이틀과 같은 처리(밝은 속면 + 짙은 자주 외곽선).
     .over-title 은 일시정지 화면(흰 배경)도 함께 쓰므로 반드시 .over 안으로 한정할 것. */
  .overlay.over .over-title{ color:#fff7ea; margin:6px 0 18px;
    text-shadow:
      -2px -2px 0 #4a2450, 0 -2px 0 #4a2450, 2px -2px 0 #4a2450,
      -2px  0   0 #4a2450,                   2px  0   0 #4a2450,
      -2px  2px 0 #4a2450, 0  2px 0 #4a2450, 2px  2px 0 #4a2450,
      0 6px 15px rgba(60,24,54,.55); }
  /* 점수/통계 = 크리스탈 액자 이미지. 상·하단 중앙 마름모와 하단 크리스탈이 특정 위치에 박혀 있어
     9-slice(border-image)로 늘리면 장식이 뭉개진다 → 원본 비율 고정 + 통짜 스트레치로 쓴다.
     두 액자 모두 안쪽이 투명(alpha=0)이라 ::before 로 옅은 판을 뒤에 깔아 글자 가독성을 확보한다. */
  .over-scorebox, .ost{ position:relative; border:0; border-radius:0; box-shadow:none; padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  /* 뒷판은 프레임 '안쪽 구멍'보다 살짝 크게 잡아 금테 아래로 물리게 한다.
     구멍보다 작으면 가장자리에 동굴 배경이 비쳐 빈칸처럼 보인다(실측: 점수 상하 11~92%, 통계 좌우 4~94%). */
  .over-scorebox::before, .ost::before{ content:""; position:absolute; z-index:-1;
    background:linear-gradient(180deg, rgba(252,246,255,.88), rgba(228,207,245,.82)); }

  .over-scorebox{ width:min(320px, 86%, 44vh); aspect-ratio:931/529; margin-bottom:14px;
    background:url("beat-cari-outro-score.webp") center/100% 100% no-repeat; }
  .over-scorebox::before{ inset:9% 6% 6% 6%; border-radius:18px; }
  .os-lab{ font-size:15px; color:#7a5a86; font-weight:800; letter-spacing:.1em;
    text-shadow:0 1px 0 rgba(255,255,255,.7); }
  .os-num{ font-size:50px; font-weight:900; color:#6a45a5; font-variant-numeric:tabular-nums; line-height:1.05;
    text-shadow:0 1px 0 rgba(255,255,255,.85), 0 3px 10px rgba(106,69,165,.28); }
  .os-new{ margin-top:2px; font-size:12.5px; font-weight:800; color:#c07a1c;
    text-shadow:0 1px 0 rgba(255,255,255,.8); }

  .over-stats{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;
    width:min(320px, 86%, 44vh); margin-bottom:18px; }
  .ost{ aspect-ratio:784/762; min-width:0;
    background:url("beat-cari-outro-stat.webp") center/100% 100% no-repeat; }
  .ost::before{ inset:9% 3% 6% 3%; border-radius:12px; }
  .ost-k{ font-size:13px; color:#7a5a86; letter-spacing:0; font-weight:800; margin-bottom:2px;
    text-transform:none; white-space:nowrap; text-shadow:0 1px 0 rgba(255,255,255,.7); }
  .ost-v{ font-size:19px; font-weight:900; color:#6a45a5; font-variant-numeric:tabular-nums; line-height:1.1;
    text-shadow:0 1px 0 rgba(255,255,255,.85); }
  .hidden{display:none!important;}
  .shake{animation:shk .28s linear infinite;}
  @keyframes shk{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}100%{transform:translate(0,0)}}
</style>

<script>/* 표정 스프라이트 — ⛔ base64 로 되돌리지 말 것(CLAUDE.md). 박아 두면 HTML 을 다 받기 전엔
     파싱이 안 끝나고, 브라우저가 캐시를 못 해 들어올 때마다 다시 받는다. 파일이면 표정 4장 = 42KB 다. */
window.CARI_FACES={left:"beat-cari-face-left.webp",right:"beat-cari-face-right.webp",shock:"beat-cari-face-shock.webp"};</script>

<script>
(() => {
  // ---------- 문제풀: 바탕화면 "AI로봇피지컬AI_용어퀴즈_50문항.xlsx" 전사 ----------

  let POOL = [

    ["AI","여러 층의 인공신경망으로 데이터의 복잡한 패턴을 학습하는 머신러닝 기법",["딥러닝","강화학습","전이학습","지도학습"]],
    ["AI","뇌의 뉴런 구조를 모방해 입력과 가중치를 연산해 출력을 만드는 딥러닝의 기본 구조",["신경망","트랜스포머","어텐션 메커니즘","하이퍼파라미터"]],
    ["AI","입력값과 정답(레이블)이 쌍으로 주어진 데이터로 모델을 학습시키는 방식",["지도학습","비지도학습","강화학습","자기지도학습"]],
    ["AI","정답 레이블 없이 데이터의 구조·패턴(군집 등)을 스스로 찾아내는 학습 방식",["비지도학습","지도학습","강화학습","모방학습"]],
    ["AI","에이전트가 환경과 상호작용하며 보상을 최대화하도록 행동을 학습하는 방식",["강화학습","지도학습","비지도학습","모방학습"]],

  /* 문항 갈아끼우기 — 부모(앱)가 DB 문항을 내려주면 위 POOL 을 대체한다.
     ⛔ 위 배열은 **폴백**이다. 단일 출처는 관리자 화면(term_questions)이고, 이 파일을 앱 없이
        직접 열었거나 서버가 안 열릴 때만 쓰인다 — 여기 문항을 고쳐도 서비스에는 안 나간다.
     ⚠️ 받은 문항은 이미 화면 언어로 번역돼 온다(앱이 투영해서 보낸다). */
  window.addEventListener("message", function(e){
    if(e.origin !== window.location.origin) return;
    var m = e.data;
    if(!m || m.t !== "mg:pool" || !Array.isArray(m.items)) return;
    var next = m.items
      .filter(function(it){ return it && it.desc && it.answer && it.distractors && it.distractors.length === 3; })
      .map(function(it){ return [it.field || "AI", it.desc, [it.answer].concat(it.distractors), it.id || null]; });
    if(!next.length) return;
    POOL = next;
    reshuffleBag();   // 옛 문항 수로 만든 순서표를 버린다 — 안 버리면 없는 인덱스를 집는다
  });

  // ---------- 튜닝 상수 (여기 숫자만 바꾸면 난이도 조절) ----------
  const START_P   = 0.10;   // 시작 천장 위치(0=꼭대기, 1=바닥/사망)
  const BASE_DESC = 0.018;  // L1 초당 낙하(비율). 레벨이 오르면 아래 speedMult 배 — 화면 크기와 무관하게 시간이 같다.
  const RISE      = 0.110;  // 정답 시 상승
  const DROP_WRONG= 0.055;  // 오답 시 하강
  const REVEAL_MS = 230;    // 정답/오답 표시 후 다음 문제까지 (= 답과 답 사이 최소 간격 — 서버가 이걸로 기록을 검사한다)
  /* ===== 공용 규칙 — 버텨라·쏴라 동일 (2026-09-11 통일) =====
     점수: 정답 1개 = SCORE_BASE × 연속 배수(5연속 1.5 · 10연속 2 · 20연속 3). 틀리면 0점, 연속 끊김. 레벨은 점수에 안 들어간다.
     레벨: 정답 LEVEL_STEP 개마다 한 칸, LEVEL_MAX 가 끝. 효과는 속도 배수 하나(레벨당 +SPEED_STEP → L7 2.8배).
     ⛔ 서버(supabase/functions/_shared/minigame-replay.ts)가 **같은 숫자로 점수를 다시 센다** — 게임은 점수가 아니라
        답안 기록을 보내고 서버가 그걸로 랭킹 점수를 만든다. 여기만 바꾸면 게임이 보여준 점수와 랭킹이 갈린다.
        tests/minigame-replay.mjs 가 두 게임 HTML 과 서버의 이 숫자들을 대조한다. */
  const SCORE_BASE  = 10;
  const STREAK_MULT = [[20,3],[10,2],[5,1.5]];   // [n연속부터, 배수] — 큰 것부터
  const LEVEL_STEP  = 10;
  const LEVEL_MAX   = 7;
  const SPEED_STEP  = 0.3;
  function streakMult(n){ for(const [k,m] of STREAK_MULT) if(n>=k) return m; return 1; }
  function levelFor(correct){ return Math.min(LEVEL_MAX, 1+Math.floor(correct/LEVEL_STEP)); }
  function speedMult(level){ return 1+(level-1)*SPEED_STEP; }

      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.value=freq; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
      o.start(); o.stop(ac.currentTime+dur);
    }catch(e){}
  }

  function initDust(){

  function measure(){
    PH = pit.clientHeight;
    const w = pit.clientWidth;
    const SURF = 0.155, FLOORFRAC = 0.03;     // 배경 발판면 비율(cover 기준) / 캐릭터 발높이 비율(작을수록 바닥 아래 덜 보임)
    const FLOOR = Math.max(8, Math.round(w * FLOORFRAC));
    const bgShift = Math.round(w * (SURF - FLOORFRAC)); // 배경을 내려 발판면을 발 높이에 맞춤 → 바닥 아래 과다 노출 제거
    pit.style.backgroundPosition = "center calc(100% + " + bgShift + "px)";
    yF = PH - FLOOR;                          // yF = 발판 윗면 = 캐릭터 발 = 천장 닿는 바닥

  /** 고정 높이 칸에 글이 넘치면 글자 크기를 한 단씩 줄인다(min 까지). 문제창 높이를 고정한 대가 — 긴 문항만 작아진다. */
  function fitText(el, startPx, minPx){
    let px=startPx; el.style.fontSize=px+"px";
    while(el.scrollHeight>el.clientHeight+1 && px>minPx){ px-=1; el.style.fontSize=px+"px"; }
  }
  function loadQuestion(){
    const q = POOL[nextIndex()];
    const order = shuffleArr([0,1,2,3]);
    const choices = order.map(i=>q[2][i]);
    const ans = order.indexOf(0); // 원래 정답은 0번
    cur = { text:q[1], choices, ans, order, id:q[3]||null };   // order[i] = 보기 i 의 원본 자리(0=정답) — 기록에 남긴다
    document.getElementById("cat").textContent = q[0];
    promptEl.textContent = q[1];
    choicesEl.innerHTML = "";
    choices.forEach((c,i)=>{
      const b=document.createElement("button");
      b.className="choice"; b.dataset.i=i;
      b.innerHTML = `<span class="num">${i+1}</span>${c}`;
      b.addEventListener("click", ()=>answer(i));
      choicesEl.appendChild(b);
    });
    fitText(promptEl, 18, 12);
    choicesEl.querySelectorAll(".choice").forEach(b=>fitText(b, 15.5, 11));
    locked=false;
  }

  function answer(i){
    if(!running || locked || paused) return;
    locked=true; answered++;
    const btns=[...choicesEl.children];
    const right = (i===cur.ans);
    runLog.push({ q:cur.id, k:cur.order[i], t:Math.round(performance.now()-runT0) });
    btns[cur.ans].classList.add("correct");
    if(!right) btns[i].classList.add("wrong");

    if(right){
      correct++; streak++;
      score += SCORE_BASE*streakMult(streak);   // 연속 배수 — 레벨은 안 곱한다(공용 규칙)
      level = levelFor(correct);                // 레벨업(속도만 빨라진다)
      p = Math.max(0, p - RISE);
      scoreEl.textContent = score;
      streakEl.textContent = streak>=2 ? MGI18N.t('beat.streak', { n: streak }) : "";
      showFlash(streak>=3?MGI18N.t('beat.combo', { n: streak }):MGI18N.t('beat.correct'), "var(--good)");
      blip(660,.09,"triangle"); if(streak%5===0) blip(880,.12,"triangle");
      jumpT = performance.now();          // 제자리 기합(웅크렸다 발돋움 — 뛰지 않는다)
      // 웅크림(90ms)이 끝나 몸을 펴는 순간 = 파동 발사. 파동이 천장에 닿으면 그때 반동+먼지.
      setTimeout(()=>{
        if(!running) return;
        player.classList.remove("zap"); void player.offsetWidth; player.classList.add("zap");
        const reach = pushWave();
        kickT = performance.now() + reach;
        setTimeout(()=>{ if(running) dustBurst("up"); }, reach);
      }, 90);
    }else{
      streak=0; streakEl.textContent="";
      p = Math.min(1, p + DROP_WRONG);
      showFlash(MGI18N.t('beat.wrong'), "var(--bad)");
      blip(150,.18,"sawtooth",.18); flinchT = performance.now();  // 움찔
      dustBurst("down");
    }
    setTimeout(()=>{ if(running) loadQuestion(); }, REVEAL_MS);
  }

  // 정답 파동 — 곰 머리에서 천장 밑면까지 올라간다. 도달 시간(ms)을 돌려주고, 호출부가 그 타이밍에
  //   천장 반동·먼지를 맞춘다(파동이 닿아야 돌이 밀린다는 인과를 눈으로 보이게).
  function pushWave(){
    const cx = pit.clientWidth/2 + runX, headY = yF - BH + 16, topY = dispP*yF + 8;
    const dist = Math.max(26, headY - topY);
    const dur = Math.max(180, Math.min(400, dist*0.85));
    const el=document.createElement("div"); el.className="wave";
    el.style.left=cx+"px"; el.style.top=headY+"px";
    pit.appendChild(el);
    const anim = el.animate([
      {transform:"translate(-50%,-50%) scale(.18,.22)", opacity:0, easing:"cubic-bezier(.25,.7,.4,1)"},
      {transform:`translate(-50%,-50%) translateY(${(-dist*0.34).toFixed(0)}px) scale(.52,.55)`, opacity:.95, offset:.28},
      // 끝까지 밝기를 붙잡는다 — 중간에 흐려지면 '천장에 닿아서 밀어냈다'가 안 보인다.
      {transform:`translate(-50%,-50%) translateY(${(-dist*0.86).toFixed(0)}px) scale(.92,.92)`, opacity:.8, offset:.82},
      {transform:`translate(-50%,-50%) translateY(${(-dist).toFixed(0)}px) scale(1.05,1)`, opacity:0}
    ], {duration:dur, easing:"linear", fill:"forwards"});
    anim.onfinish = () => el.remove();
    return dur;
  }

  // 천장 밑면 먼지 — dir="up": 정답(돌이 밀려 올라가며 먼지가 피어오름) / "down": 오답(내려앉으며 아래로 흩날림).
  //   ⚠️ 오답 연출로 화면을 흔들지 말 것 — 문제를 읽는 중이라 흔들리면 못 푼다. 인과는 먼지로만 보여준다.
  function dustBurst(dir){
    const w = pit.clientWidth, yUnder = dispP*yF;   // 천장 밑면 = 현재 압박선
    const up = dir === "up", n = up ? 11 : 9;   // 알갱이가 많으면 벽처럼 뭉쳐 보인다
    for(let i=0;i<n;i++){
      const el=document.createElement("div");
      // 4종 중 랜덤 + 회전/좌우반전 — 같은 그림이 반복되는 티를 없앤다.
      const v = 1 + (Math.random()*4|0);
      el.className = (up ? "puff d" : "puff dark d") + v;
      const sz = (up?26:22) + Math.random()*(up?30:26);
      el.style.width=el.style.height=sz+"px";
      el.style.left=(w*(0.05+Math.random()*0.90))+"px";
      el.style.top=(yUnder - sz*0.3)+"px";
      pit.appendChild(el);
      const dx=(Math.random()*2-1)*(up?42:26);
      const dy=up ? -(22+Math.random()*30) : (34+Math.random()*46);
      const rot=(Math.random()*360|0), flip=Math.random()<0.5?-1:1;
      const T=(x,y,s)=>`translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rot}deg) scale(${(s*flip).toFixed(3)},${s.toFixed(3)})`;
      // 중간 키프레임에서 불투명도를 붙잡아 둔다 — 바로 페이드하면 눈에 안 띄고 지나간다.
      //   ⚠️ 전체 easing 을 ease-out 계열로 주면 타임라인이 앞으로 쏠려 350ms 만에 다 사라진다.
      //      전체는 linear 로 두고, 튀어나오는 첫 구간에만 이징을 건다.
      const anim = el.animate([
        {transform:T(0, 0, .32), opacity:0, easing:"cubic-bezier(.2,.8,.4,1)"},
        {transform:T((dx*0.35).toFixed(1), (dy*0.28).toFixed(1), 1), opacity:up?.46:.52, offset:.2},
        {transform:T((dx*0.7).toFixed(1), (dy*0.62).toFixed(1), up?1.3:1.15), opacity:up?.32:.38, offset:.55},
        {transform:T(dx.toFixed(1), dy.toFixed(1), up?1.6:1.35), opacity:0}
      ], {duration:(up?820:940)+Math.random()*260, easing:"linear", fill:"forwards"});
      // ⚠️ fill:"forwards" 필수 — 없으면 애니메이션이 끝나는 순간 요소가 기본 스타일(불투명도 1·원위치)로
      //    되돌아와, 사라졌던 먼지가 제거될 때까지 한 번 더 번쩍인다. 제거도 타이머 말고 onfinish 로.
      anim.onfinish = () => el.remove();
    }
  }

  // 땀방울 하나 튀기기
  function spawnSweat(x,y){
    const s=document.createElement("div"); s.className="sweat";
    s.style.left=x+"px"; s.style.top=y+"px"; pit.appendChild(s);
    const dir=(Math.random()<0.5?-1:1), dx=dir*(12+Math.random()*20);
    const anim = s.animate([
      {transform:"translate(-50%,-50%) scale(.6)", opacity:0},
      {transform:`translate(calc(-50% + ${dx*0.6}px), -15px) scale(1)`, opacity:1, offset:.3},
      {transform:`translate(calc(-50% + ${dx}px), 20px) scale(.9)`, opacity:0}
    ], {duration:580, easing:"ease-out", fill:"forwards"});   // fill 없으면 끝나는 순간 원위치로 번쩍
    anim.onfinish = () => s.remove();
  }
  // 머리 위 무드 말풍선 (부드럽게 페이드)
  function setMood(txt, op, x, y){
    if(!moodEl) return;
    if(op<=0.02){ moodEl.style.opacity=0; return; }
    if(moodEl.textContent!==txt) moodEl.textContent=txt;
    moodEl.style.left=x+"px"; moodEl.style.top=y+"px";
    moodEl.style.opacity=Math.min(1,op).toFixed(2);
  }

  // 곰 상태머신: 여유↑=가만히 웃기 / 가까움=땀+허둥지둥 달리기 / 접촉=정면 놀람→압축
  function updateBear(v, dt){
    if(crushed) return;
    const now = performance.now();
    const cx = pit.clientWidth/2, maxRun = Math.max(40, cx-46);
    const PAD = 22;  // 곰 머리 위 투명여백·안테나 보정 — "살짝 더/덜 닿게"는 이 값만 조절(↑=더 닿음)
    const teeth = v*yF, headY = yF - BH + PAD;   // 발 = yF(발판 윗면)

    // 접촉: 돌이 정수리를 누름 → 가운데로 모여 정면 놀람 → 압축
    if(teeth >= headY){
      runX += (0-runX)*Math.min(1, dt*11);
      lean += (0-lean)*Math.min(1, dt*11);
      let sy=(yF-teeth)/(BH-PAD); sy=Math.max(0.08,sy);
      const sx=1+(1-sy)*0.45, tr=Math.sin(now/38)*Math.min(2,(1-sy)*3);
      player.style.transform=`translateX(calc(-50% + ${(runX+tr).toFixed(1)}px)) rotate(${lean.toFixed(1)}deg) scaleX(${sx.toFixed(3)}) scaleY(${sy.toFixed(3)})`;
      setMood("😱", 1, cx+runX, headY+2);
      setFace("shock");
      return;
    }

    // 공포도(연속): 여유 55%→15% 구간에서 0→1 (smoothstep)
    const room=1-v;
    let fear=(0.55-room)/(0.55-0.15); fear=Math.max(0,Math.min(1,fear)); fear=fear*fear*(3-2*fear);

    // 허둥지둥 다트: fear 클수록 자주·멀리 목표 갱신
    dartT-=dt*1000;
    if(dartT<=0){ targetX=(Math.random()*2-1)*maxRun*fear*0.8; dartT=780-260*fear+Math.random()*320; }
    runX += (targetX-runX)*Math.min(1, dt*(1.9+1.9*fear));
    const vel=targetX-runX;
    lean += (Math.max(-9,Math.min(9,vel*0.06)) - lean)*Math.min(1,dt*9);
    const freq=250-95*fear;
    const waddle = fear>0.04 ? Math.sin(now/freq)*2.4*fear : 0;
    let dy = (fear>0.04 ? -Math.abs(Math.sin(now/freq))*3.2*fear : 0) + Math.sin(now/650)*2*(1-fear);
    let sx=1+0.03*fear, sy=1-0.05*fear, tx=0;

    // 정답 = 제자리 '기합'(웅크림 90ms → 발돋움 250ms). ⚠️ 발을 띄우지 않는다(dy 변화 없음) —
    //   점프로는 저 높이의 천장에 닿을 수 없어서 뛰는 순간 인과가 깨진다. 돌을 밀어내는 건
    //   안테나에서 나가는 파동(pushWave)이고, 곰은 기를 모으는 동작만 한다.
    //   transform-origin 이 발바닥(50% 100%)이라 scaleY 만 키워도 몸이 솟아 보인다.
    const je=now-jumpT;
    if(je>=0&&je<340){
      if(je<90){ const k=je/90;                        sy*=1-0.15*k; sx*=1+0.11*k; }   // 웅크림
      else     { const k=Math.sin((je-90)/250*Math.PI); sy*=1+0.17*k; sx*=1-0.08*k; }   // 발돋움
    }
    const fe=now-flinchT; if(fe>=0&&fe<240){ const k=Math.sin(fe/240*Math.PI); sy*=1-0.09*k; tx+=Math.sin(fe/240*Math.PI*4)*3; }

    player.style.transform=`translateX(calc(-50% + ${(runX+waddle+tx).toFixed(1)}px)) translateY(${dy.toFixed(1)}px) rotate(${lean.toFixed(1)}deg) scale(${sx.toFixed(3)},${sy.toFixed(3)})`;
    // 방향 전환: 이동방향 보게 / 겁나 멈칫=정면 놀람 / 평온=웃는 정면
    const faceDir = targetX - runX;
    if(fear < 0.22) setFace("calm");
    else if(faceDir < -14) setFace("left");
    else if(faceDir > 14) setFace("right");
    else setFace("shock");

    // 땀 (fear>0.25부터, 클수록 자주)
    if(fear>0.25){ sweatT-=dt*1000; if(sweatT<=0){ spawnSweat(cx+runX+(Math.random()<.5?-16:16), headY+10); sweatT=680-360*fear; } }
    // 무드 말풍선
    if(fear>0.6) setMood("💦",(fear-0.6)/0.4, cx+runX, headY+2);
    else if(fear>0.22) setMood("❓",(fear-0.22)/0.4, cx+runX, headY+2);
    else setMood("",0,cx+runX,headY);
  }

  function showFlash(txt,color){
    flash.textContent=txt; flash.style.color=color;
    flash.classList.remove("show"); void flash.offsetWidth; flash.classList.add("show");
  }

  // 게임오버 순간 충격 연출: 번쩍 + 충격파 링 + 돌 파편 + 강한 흔들림 + "꽝!"
  function impactFX(){
    const cx = pit.clientWidth/2, cy = PH - 12;
    const fl=document.createElement("div"); fl.className="wflash"; pit.appendChild(fl);
    setTimeout(()=>fl.remove(), 300);
    const ring=document.createElement("div"); ring.className="shock";
    ring.style.left=cx+"px"; ring.style.top=cy+"px"; pit.appendChild(ring);
    setTimeout(()=>ring.remove(), 640);
    for(let i=0;i<14;i++){
      const d=document.createElement("div"); d.className="debris";
      const sz=4+Math.random()*7; d.style.width=d.style.height=sz+"px";
      d.style.left=cx+"px"; d.style.top=cy+"px"; pit.appendChild(d);
      const vx=(Math.random()*2-1)*150, up=70+Math.random()*100;
      const anim = d.animate([
        {transform:"translate(-50%,-50%) rotate(0deg)", opacity:1},
        {transform:`translate(calc(-50% + ${vx*0.5}px), -${up}px) rotate(160deg)`, opacity:1, offset:.4},
        {transform:`translate(calc(-50% + ${vx}px), 44px) rotate(320deg)`, opacity:0}
      ], {duration:640+Math.random()*220, easing:"cubic-bezier(.2,.5,.4,1)", fill:"forwards"});
      anim.onfinish = () => d.remove();   // 타이머 제거 + fill 없으면 파편이 사라졌다 다시 번쩍인다
    }
    pit.classList.add("shake-hard");
    setTimeout(()=>pit.classList.remove("shake-hard"), 380);
    showFlash(MGI18N.t('beat.bust'), "var(--bad)");
    blip(70,.4,"sawtooth",.22); blip(300,.05,"square",.12);
  }

  function gameOver(){
    running=false; pit.classList.remove("shake");
    crushed=true;                       // 마지막 압축 프레임에서 정지(=완전히 눌린 상태)
    if(moodEl) moodEl.style.opacity=0;
    impactFX();
    const acc = answered? Math.round(correct/answered*100):0;
    const isNew = score>best;
    if(window.MGBridge) MGBridge.submit(score, { log: runLog }); // 랭킹: 점수는 참고값, 서버가 log 로 다시 센다
    if(isNew){ best=score; localStorage.setItem("rockfall_best_v3",best); bestEl.textContent=best; }
    $("finalScore").textContent=score;
    $("finalAns").textContent=answered;
    $("finalAcc").textContent=acc+"%";
    $("finalBest").textContent=best;
    $("newbest").classList.toggle("hidden", !isNew);
    setTimeout(()=>$("overOv").classList.remove("hidden"), 720);
  }

  // ---------- 메인 루프 (transform만 만짐, React 없음) ----------
  function loop(t){
    if(!running || paused) return;
    const dt = Math.min(0.05,(t-lastT)/1000); lastT=t;
    const descTarget = BASE_DESC*speedMult(level);
    descCur += (descTarget - descCur)*Math.min(1, dt*1.8);   // 레벨업 시 ~1초 스르륵 기어변속
    const desc = descCur;
    p = Math.min(1, p + desc*dt);
    dispP += (p-dispP)*Math.min(1,dt*12);
    // 반동은 '보이기만' 하는 값 — 접촉 판정(updateBear)·게임오버는 dispP 그대로 쓴다.
    const ke = t - kickT, kick = (ke>=0 && ke<300) ? -0.018*Math.sin(ke/300*Math.PI) : 0;
    renderCeil(Math.max(0, dispP + kick));
    updateBear(dispP, dt);

    // 먼지 낙하
    for(const d of dust){
      d.y += d.sp*dt; if(d.y>1){ d.y=0; d.x=Math.random(); }
      d.el.style.transform=`translate(${d.x*pit.clientWidth}px, ${d.y*PH}px)`;
      d.el.style.width=d.el.style.height=d.sz+"px";
    }

    // HUD / 위험 연출
    spdEl.textContent = "x"+(descCur/BASE_DESC).toFixed(1);
    const room = Math.max(0, 1-dispP);

    danger.style.opacity = room<0.30 ? ((0.30-room)/0.30).toFixed(2) : 0;
    if(room<0.12) pit.classList.add("shake"); else pit.classList.remove("shake");

    if(dispP>=0.995){ gameOver(); return; }   // 돌이 바닥에 닿음 = 여유 0% = 게임오버
    requestAnimationFrame(loop);
  }

  function renderCeil(v){ ceiling.style.transform = `translateY(${(v*yF - PH).toFixed(1)}px)`; }

  // ---------- 입력 ----------

  function pauseGame(){
    if(!running || paused) return;
    paused=true;
    $("pauseOv").classList.remove("hidden");
  }
  function resumeGame(){
    if(!paused) return;
    paused=false;
    $("pauseOv").classList.add("hidden");
    lastT=performance.now();
    requestAnimationFrame(loop);
  }

  $("startBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
  window.addEventListener("keydown", e=>{
    if(paused){ if(e.key==="Enter"||e.code==="Space"){ e.preventDefault(); resumeGame(); } return; }
    if(e.key>="1" && e.key<="4"){ const i=+e.key-1; if(cur && i<cur.choices.length) answer(i); }
    else if(e.key==="Enter"){ if(!running) start(); }
  });
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) pauseGame(); });
  window.addEventListener("blur", pauseGame);
  $("resumeBtn").addEventListener("click", resumeGame);

  measure();
})();
</script>

<!-- ===== 앱 브리지: 랭킹 버튼 + 점수 전송 =====
     이 HTML 은 자립형이라 세션도 supabase 클라도 없다 → 실제 제출/조회는 부모(/games/:id = MiniGame.tsx)가 한다.
     여기서는 (1) 인트로·아웃트로 우상단에 '랭킹' 버튼을 얹고, (2) 점수가 나면 postMessage 로 알리기만 한다.
     ⚠️ 이 파일을 단독으로 열면 부모가 없어 버튼도 숨고 아무것도 보내지 않는다(게임은 그대로 동작).
     ⚠️ tieMs(레벨형 동률 해소용 소요시간)는 인트로에서 시작을 누른 시점부터 잰다. '처음으로'로 되돌아가
       인트로를 다시 거치지 않으면 계속 누적된다 — 순위 1차 키가 아니라 동률 해소용이라 그대로 둔다. -->
<style>
.mg-rank{position:absolute; top:12px; right:12px; z-index:60; display:none; align-items:center; justify-content:center;
  box-sizing:border-box; width:112px; height:34px; padding:0; border:0; cursor:pointer;
  font:850 11.5px/1 system-ui,-apple-system,sans-serif; letter-spacing:.025em; color:#fff;
  background:url("rank-button.webp") center/100% 100% no-repeat; text-shadow:0 1px 3px #001c55;
  filter:drop-shadow(0 3px 4px rgba(8,20,60,.24)); -webkit-tap-highlight-color:transparent;}
.mg-rank.on{display:inline-flex;}
/* ⚠️ 랭킹 글자는 판 정중앙(58.5%)이 아니라 **54%** 다 — 왼쪽 트로피가 시각적으로 무거워서
     기하학적 중앙에 두면 오른쪽으로 밀려 보인다. 모든 게임이 같은 값이다(2026-08-18 일괄 정렬).
     px 오프셋으로 밀지 말 것 — 버튼 폭이 게임마다 달라(112 vs 131) 같은 px 이 다른 위치가 된다. */
.mg-rank span{position:absolute;left:54%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}
.mg-rank:hover{filter:brightness(1.06) drop-shadow(0 3px 5px rgba(8,20,60,.28));}
.mg-rank:active{transform:translateY(1px) scale(.98);}
</style>
<script>
(function(){
  var EMBED = window.parent !== window;
  var T0 = 0;
  function post(m){ if(EMBED) window.parent.postMessage(m, window.location.origin); }
  window.MGBridge = {
    /** 점수 전송. timed:true 면 시작 이후 경과시간을 동률 해소용으로 같이 보낸다. */
    submit: function(v, opts){
      if(typeof v !== 'number' || !isFinite(v)) return;
      post({ t:'mg:score', score:v, tieMs:(opts && opts.timed && T0) ? (Date.now()-T0) : undefined,
             log:(opts && Array.isArray(opts.log)) ? opts.log : undefined });
    }
  };
  function mount(id){
    var ov = document.getElementById(id); if(!ov) return;
    if(ov.querySelector('.mg-rank')) return;
    var b = document.createElement('button');
    b.type='button'; b.className='mg-rank' + (EMBED ? ' on' : '');
    b.setAttribute('aria-label', window.MGI18N ? MGI18N.t('mg.rank_aria') : '이 게임 랭킹 보기');
    b.innerHTML='<span>'+(window.MGI18N ? MGI18N.t('mg.rank') : '랭킹')+'</span>';
    b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); post({t:'mg:rank'}); });
    ov.appendChild(b);
  }
  mount('startOv'); mount('overOv');
  // 인트로에서 (랭킹 버튼이 아닌) 무엇이든 누르면 = 플레이 시작 → 소요시간 기준점 리셋.
  var intro = document.getElementById('startOv');
  if(intro) intro.addEventListener('click', function(e){
    if(e.target && e.target.closest && e.target.closest('.mg-rank')) return;
    T0 = Date.now();
  }, true);
})();
</script>
<script>if (window.MGI18N) MGI18N.apply();</script>
</body>
</html>
