<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>버텨라 CARI</title>
<style>
  :root{
    /* CARI 곰 톤: 크림 + 소프트 페리윙클 블루 + 코발트 */
    --page:#e9eff9; --bg:#fbfaf5; --ink:#28324c; --sub:#7c869e;
    --brand:#004ac6; --brand-hi:#1b55d0;
    --good:#12b58c; --bad:#f2664f; --skip:#e59b17;
    --wall1:#aec3e8; --wall2:#8aa4d3; --wall3:#6f8ac2; --wall-edge:#5f7bb5;
    --cream:#ece9e0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #eff4fc 0%, #e3ebf7 60%);
    color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100%; overflow:hidden;
    user-select:none;
  }
  .stage{
    position:relative; width:min(460px,100vw); height:min(860px,100vh);
    display:flex; flex-direction:column;
    /* 동굴 배경을 스테이지 전체에 — 헤더 등 투명부로 그대로 노출.
       ⚠️ cover 금지: 이미지(941x1672) 맨 위가 거의 검정(#23162a)인데 cover 는 세로 전체를 쓰므로
          그 암흑부가 헤더 뒤에 깔려 검은 띠가 된다(.pit 은 자기 높이로 cover 해 위쪽이 잘려나감).
          auto 200% + bottom 으로 위쪽 암흑부를 잘라낸다. */
    background:url("beat-cari-bg.png") center bottom/auto 200% no-repeat;
    box-shadow:0 0 60px rgba(70,90,140,.25); overflow:hidden;
  }

  /* HUD */
  .hud{ position:relative; z-index:6; width:100%; height:90px; }
  /* inset 이 음수인 건 의도 — 헤더 PNG 는 알약 바깥이 투명이라 inset:0 이면 그 투명 여백으로
     스테이지 배경이 비쳐 검은 띠·모서리가 생긴다. 스테이지 밖으로 넘겨서 overflow:hidden 으로 잘라낸다. */
  .hud::before{ content:""; position:absolute; inset:-8px -14px -2px;   /* 9-slice: 왼쪽(별)·오른쪽(pill) 고정, 가운데만 늘림 */
    border-style:solid; border-width:0 129px 0 107px;
    border-image:url("beat-cari-header.png") 0 360 0 300 fill; border-image-repeat:stretch;
  }
  .hud-score, .hud-right, .hud-chip{ display:block; }
  .hs-ic, .hud-chip svg, .hc-lab{ display:none; }   /* 별·왕관·번개·라벨 = 이미지에 포함 */
  .hs-num{ position:absolute; z-index:1; left:70px; top:54%; transform:translateY(-50%);
    font-size:36px; font-weight:900; color:#6d3f7a; font-variant-numeric:tabular-nums;
    text-shadow:0 1px 2px rgba(255,255,255,.7); line-height:1; }
  #best{ position:absolute; z-index:1; right:60px; top:37%; transform:translateY(-50%);
    font-size:15px; font-weight:900; color:#6d3f7a; font-variant-numeric:tabular-nums;
    text-shadow:0 1px 1px rgba(255,255,255,.7); }
  #spd{ position:absolute; z-index:1; right:60px; top:73%; transform:translateY(-50%);
    font-size:14px; font-weight:900; color:#b06a1f; font-variant-numeric:tabular-nums;
    text-shadow:0 1px 1px rgba(255,255,255,.7); }

  /* PIT */
  .pit{position:relative; flex:1; overflow:hidden;
      background:url("beat-cari-bg.png") center bottom/cover no-repeat, #ece9e0;}
  .pit::after{ /* soft vignette */
    content:""; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 70px rgba(150,170,210,.25);
  }
  .ceiling{position:absolute; left:0; right:0; top:0; will-change:transform;}
  .ceiling-body{
    height:100%;
    background:url("beat-cari-rock.png") center bottom / 100% 100% no-repeat;
    filter:drop-shadow(0 6px 10px rgba(90,55,80,.4));
  }
  .teeth{ display:none; } /* 돌 이미지(beat-cari-rock.png) 자체에 종유석 끝이 있어 미사용 */
  .dust{position:absolute; width:5px;height:5px;border-radius:50%;background:#b9c9e6;opacity:.55;}

  /* 충격 이펙트 (게임오버 직전) */
  .wflash{position:absolute; inset:0; z-index:8; pointer-events:none; background:#fff; animation:wf .28s ease-out forwards;}
  @keyframes wf{0%{opacity:.5}100%{opacity:0}}
  .shock{position:absolute; z-index:8; width:280px; height:280px; border-radius:50%;
    border:6px solid rgba(111,138,190,.85); transform:translate(-50%,-50%) scale(.05); pointer-events:none;
    animation:shock .6s cubic-bezier(.15,.7,.35,1) forwards;}
  @keyframes shock{0%{transform:translate(-50%,-50%) scale(.05); opacity:.9}
                   100%{transform:translate(-50%,-50%) scale(1); opacity:0; border-width:1px}}
  .debris{position:absolute; z-index:8; border-radius:3px; pointer-events:none;
    background:linear-gradient(160deg,#b6cae9,#6f86bf); box-shadow:0 1px 2px rgba(60,80,130,.4);}
  .shake-hard{animation:shk2 .09s linear infinite;}
  @keyframes shk2{0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}100%{transform:translate(3px,1px)}}

  .mood{position:absolute; left:0; top:0; z-index:4; font-size:22px; pointer-events:none;
    opacity:0; transition:opacity .18s ease; transform:translate(-50%,-140%); will-change:transform,opacity;
    filter:drop-shadow(0 1px 1px rgba(80,90,120,.3));}
  .sweat{position:absolute; left:0; top:0; z-index:4; width:7px; height:9px; pointer-events:none;
    background:radial-gradient(circle at 40% 30%, #eaf4ff, #7fb0ea 68%, #5f93d8);
    border-radius:50% 50% 50% 50%/62% 62% 40% 40%; box-shadow:0 1px 2px rgba(70,110,180,.4);}

  .player{
    position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
    width:78px; height:auto; z-index:2; transform-origin:50% 100%;
    filter:drop-shadow(0 6px 7px rgba(70,90,140,.30));
    transition:none;
  }
  .floor{ display:none; } /* 초록 풀떼기 바닥 제거 — 동굴 배경의 모래바닥을 실제 바닥으로 사용 */
  .danger{
    position:absolute; inset:0; pointer-events:none; opacity:0; z-index:3;
    background:radial-gradient(120% 60% at 50% 100%, rgba(242,102,79,.5), transparent 70%);
    transition:opacity .12s;
  }
  .depth{
    position:absolute; right:6px; top:6px; z-index:4; font-size:11px; color:var(--sub);
    background:rgba(255,255,255,.72); border:1px solid #e6e9f3; padding:2px 8px; border-radius:20px; font-variant-numeric:tabular-nums;
  }

  /* floating feedback */
  .flash{
    position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
    font-size:30px; font-weight:900; z-index:5; pointer-events:none; opacity:0;
    text-shadow:0 2px 6px rgba(255,255,255,.85), 0 1px 2px rgba(80,90,120,.25);
  }
  @keyframes pop{
    0%{opacity:0; transform:translate(-50%,-30%) scale(.7);}
    18%{opacity:1; transform:translate(-50%,-55%) scale(1.12);}
    100%{opacity:0; transform:translate(-50%,-120%) scale(1);}
  }
  .flash.show{animation:pop .7s ease-out forwards;}

  /* QUESTION CARD */
  .qcard{
    background:transparent; z-index:6;
    border-style:solid; border-width:16px 24px 28px 24px;   /* 문제 영역 전체를 문제창 패널로 9-slice 채움 (좌우 줄여 버튼 폭 확보) */
    border-image:url("beat-cari-panel.png") 175 200 180 200 fill; border-image-repeat:stretch;
    padding:0 6px 6px;
    margin:-3px;   /* 헤더와 같은 이유 — 패널 PNG 바깥 1~2px 이 반투명이라 스테이지 배경이 어두운 실선으로 비친다 */
  }
  .qmeta{display:flex; justify-content:flex-end; align-items:center; min-height:0; margin-bottom:0;}
  .qmeta .streak{font-size:12px; color:#ffcf6b; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.3);}
  .qmeta .tag{display:none;}  /* 카테고리 안내 제거 */
  .prompt{
    font-size:18px; font-weight:800; color:#5c4463; line-height:1.4; margin-bottom:10px;
    min-height:36px; text-align:left;
    display:flex; align-items:center; justify-content:flex-start; padding:2px 8px;
  }
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .choice{
    position:relative; text-align:left; padding:12px 6px 12px 54px; border:0;
    background:url("beat-cari-choice.png") center/100% 100% no-repeat;
    color:#3e2b52; font-size:15.5px; font-weight:800; line-height:1.2;
    white-space:nowrap;   /* 한 줄 고정 — 개행 방지 */
    cursor:pointer; transition:transform .05s, filter .12s; min-height:66px;
    display:flex; align-items:center;
  }
  .choice:active{transform:scale(.97);}
  .choice .num{  /* 왼쪽 크리스탈 위 번호 */
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    width:30px; text-align:center; color:#4e2c5e; font-size:17px; font-weight:900;
    text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 1px 1px #fff;
  }
  .choice.correct{ filter:drop-shadow(0 0 4px var(--good)) drop-shadow(0 0 9px rgba(18,181,140,.6)); }
  .choice.correct .num{ color:var(--good); }
  .choice.wrong{ filter:drop-shadow(0 0 4px var(--bad)) drop-shadow(0 0 9px rgba(242,102,79,.6)); }
  .choice.wrong .num{ color:var(--bad); }
  .skipbtn{
    margin-top:10px; width:100%; padding:10px; border-radius:10px; cursor:pointer;
    background:transparent; border:1px dashed #c3cbe0; color:var(--sub); font-weight:700; font-size:13px;
  }
  .skipbtn:active{transform:scale(.98);}

  /* OVERLAYS */
  .overlay{
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:28px;
    background:rgba(245,247,252,.9); backdrop-filter:blur(4px);
  }
  .overlay h1{font-size:30px; margin:0 0 6px; font-weight:900; color:var(--ink); letter-spacing:-.01em;}
  .overlay .em{font-size:52px; margin-bottom:8px;}
  .overlay p{color:var(--sub); font-size:14px; line-height:1.6; margin:4px 0; max-width:320px;}
  .overlay .big{font-size:56px; font-weight:900; color:var(--brand); font-variant-numeric:tabular-nums; margin:6px 0;}
  .overlay .row{display:flex; gap:18px; margin:10px 0 4px;}
  .overlay .row .k{font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.06em;}
  .overlay .row .val{font-size:24px; font-weight:800; color:var(--ink);}
  .btn{
    margin-top:18px; padding:14px 34px; border-radius:30px; border:0; cursor:pointer;
    background:linear-gradient(120deg,#1b55d0,#004ac6); color:#fff; font-size:16px; font-weight:800;
    box-shadow:0 10px 24px rgba(0,74,198,.32);
  }
  .btn:active{transform:scale(.97);}
  .kbd{display:inline-block; padding:1px 7px; border-radius:5px; background:#eef1f8; border:1px solid #d9e0f0; font-size:12px; font-weight:700; color:var(--ink);}

  /* 시작 인트로 (게임 타이틀 화면) */
  .intro{ gap:0; }
  /* 배경 = 인트로/아웃트로 동굴 아트로 교체 (기존 반투명 흰 배경/블러 제거). 세로 941x1672 → cover */
  .overlay.intro, .overlay.over{
    backdrop-filter:none;
    background:url("beat-cari-intro-bg.png") center/cover no-repeat;
  }
  /* 마스코트 크기를 화면 높이에 연동 — 세로가 짧은 폰(예: 375x667)에서 앱 헤더까지 빠지면
     '버티기 시작' 버튼이 화면 밖으로 밀려 잘렸다. 높은 화면에서는 min() 이 284px 로 잡혀 원래 그대로. */
  .intro-mascot{ width:min(284px, 36vh); height:auto; margin-top:-6px; filter:drop-shadow(0 14px 18px rgba(70,90,140,.32)); animation:bob 2.6s ease-in-out infinite; }
  @keyframes bob{0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)}}
  .intro-title{ font-size:44px; font-weight:900; letter-spacing:-.02em; line-height:1; margin:10px 0 0;
    transform:rotate(-2.5deg); animation:titlePop .55s cubic-bezier(.2,1.7,.4,1) both; }
  /* 동굴 배경(분홍·보라)과 같은 색상 계열이라 명도로 띄운다: 짙은 자주 외곽선 + 밝은 속면.
     -webkit-text-stroke 는 글자 안쪽을 깎아 획이 얇아지므로 쓰지 않고 8방향 text-shadow 로 외곽선을 만든다. */
  .intro-title .t1, .intro-title .t2::before{
    text-shadow:
      -2px -2px 0 #4a2450, 0 -2px 0 #4a2450, 2px -2px 0 #4a2450,
      -2px  0   0 #4a2450,                   2px  0   0 #4a2450,
      -2px  2px 0 #4a2450, 0  2px 0 #4a2450, 2px  2px 0 #4a2450,
      0 6px 15px rgba(60,24,54,.55);
  }
  .intro-title .t1{ color:#fff7ea; }
  .intro-title .t2{ position:relative; display:inline-block;
    background:linear-gradient(180deg,#fff2c8 4%,#ffc63f 48%,#e5921f 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent; }
  /* background-clip:text 는 '배경' 레이어라 text-shadow 가 그 위를 덮는다(= 금색이 사라짐).
     그래서 외곽선은 같은 글자를 뒤에 한 벌 더 깐 ::before 로 그린다. */
  .intro-title .t2::before{ content:attr(data-t); position:absolute; left:0; top:0; z-index:-1;
    color:#4a2450; -webkit-text-fill-color:#4a2450; }
  @keyframes titlePop{0%{opacity:0; transform:scale(.5) rotate(-2.5deg)} 60%{transform:scale(1.08) rotate(-2.5deg)} 100%{opacity:1; transform:scale(1) rotate(-2.5deg)}}
  .intro-tag{ font-size:14.5px; font-weight:800; color:#fff4e4; margin:15px 0 22px; letter-spacing:.005em;
    text-shadow:
      -1px -1px 0 rgba(74,36,80,.9), 1px -1px 0 rgba(74,36,80,.9),
      -1px  1px 0 rgba(74,36,80,.9), 1px  1px 0 rgba(74,36,80,.9),
      0 3px 9px rgba(60,24,54,.6); }
  /* 규칙 3줄을 흰 카드 3개 → 크리스탈 텍스트창 하나로. 원본 비율(1300x466) 유지해 좌우 하단 크리스탈이 눌리지 않게 */
  .intro-rules{ display:flex; flex-direction:column; justify-content:center; gap:6px;
    width:100%; max-width:330px; aspect-ratio:1300/466; margin-bottom:20px; padding:0 20px 8px;
    background:url("beat-cari-intro-panel.png") center/100% 100% no-repeat; }
  .ir{ display:flex; align-items:center; gap:9px; text-align:left; font-size:13.5px; color:#5c4463;
    background:none; border:0; border-radius:0; padding:0; box-shadow:none;
    text-shadow:0 1px 0 rgba(255,255,255,.85), 0 0 5px rgba(255,255,255,.8); }
  .ir b{ font-weight:800; }
  .ir-ic{ flex:none; width:24px; height:24px; border-radius:8px; display:grid; place-items:center; font-size:11px; color:#fff;
    text-shadow:none; box-shadow:0 1px 3px rgba(120,90,140,.28); }
  .ir-ic.up{ background:var(--good); }
  .ir-ic.dn{ background:var(--bad); }
  .ir-ic.st{ background:var(--skip); }
  .btn.play{ padding:15px 48px; font-size:17px; }
  /* 시작·다시도전 버튼 = 크리스탈 알약 이미지 (원본 932x227 비율 고정, 글자만 얹음) */
  #startBtn, #againBtn{
    margin-top:16px; padding:0; border:0; border-radius:0; box-shadow:none;
    width:min(292px, 82%); aspect-ratio:932/227;
    background:url("beat-cari-startbtn.png") center/100% 100% no-repeat;
    color:#5c3a6b; font-size:19px; font-weight:900; letter-spacing:-.01em;
    text-shadow:0 1px 0 rgba(255,255,255,.85), 0 0 8px rgba(255,255,255,.65);
    filter:drop-shadow(0 7px 13px rgba(95,60,110,.28));
  }
  .intro-keys{ margin-top:14px; font-size:12px; color:var(--sub); }

  /* 게임오버 화면 */
  .over-badge{ font-size:12px; font-weight:900; letter-spacing:.14em; color:var(--bad);
    background:rgba(242,102,79,.12); border:1px solid rgba(242,102,79,.3); padding:5px 14px; border-radius:20px; }
  .over-emoji{ font-size:56px; margin:12px 0 0; animation:titlePop .5s cubic-bezier(.2,1.7,.4,1) both; }
  .over-img{ width:196px; height:auto; margin:4px 0 2px; animation:titlePop .5s cubic-bezier(.2,1.7,.4,1) both;
    filter:drop-shadow(0 9px 13px rgba(70,90,140,.3)); }
  .over-title{ font-size:33px; font-weight:900; color:var(--ink); letter-spacing:-.02em; transform:rotate(-2deg);
    margin:2px 0 16px; text-shadow:0 2px 0 #fff, 0 4px 10px rgba(80,100,150,.25); }
  .over-scorebox{ background:#fff; border:1px solid #e6e9f3; border-radius:18px; padding:14px 40px; margin-bottom:16px;
    box-shadow:0 8px 22px rgba(80,100,150,.1); }
  .os-lab{ font-size:11px; color:var(--sub); font-weight:800; letter-spacing:.06em; }
  .os-num{ font-size:52px; font-weight:900; color:var(--brand); font-variant-numeric:tabular-nums; line-height:1.05; }
  .os-new{ margin-top:4px; font-size:13px; font-weight:800; color:var(--good); }
  .over-stats{ display:flex; gap:10px; margin-bottom:22px; }
  .ost{ background:#f4f6fc; border:1px solid #e6e9f3; border-radius:13px; padding:10px 16px; min-width:76px; }
  .ost-k{ font-size:10.5px; color:var(--sub); text-transform:uppercase; letter-spacing:.05em; font-weight:700; margin-bottom:3px; }
  .ost-v{ font-size:20px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
  .hidden{display:none!important;}
  .shake{animation:shk .28s linear infinite;}
  @keyframes shk{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}100%{transform:translate(0,0)}}
</style>

  // ---------- 튜닝 상수 (여기 숫자만 바꾸면 난이도 조절) ----------

  const FACES = (typeof window!=="undefined" && window.CARI_FACES) || {};
  const CALM_SRC = player.getAttribute("src");

  function setFace(name){
    if(name===curFace) return;
    const src = name==="calm" ? CALM_SRC : (FACES[name]||CALM_SRC);

  }

  // 문제풀 셔플 순회
  let bag=[], bagIdx=0;
  function reshuffleBag(){ bag = POOL.map((_,i)=>i); shuffleArr(bag); bagIdx=0; }
  function nextIndex(){ if(bagIdx>=bag.length) reshuffleBag(); return bag[bagIdx++]; }
  function shuffleArr(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]];} return a; }

  // ---------- 오디오 (아주 짧은 blip) ----------
  let ac;
  function blip(freq, dur, type="sine", vol=.15){
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.value=freq; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
      o.start(); o.stop(ac.currentTime+dur);
    }catch(e){}
  }

  // ---------- 배경 먼지 ----------
  function initDust(){
    dust.forEach(d=>d.el.remove()); dust=[];
    for(let i=0;i<8;i++){
      const el=document.createElement("div"); el.className="dust";
      pit.appendChild(el);
      dust.push({el, x:Math.random(), y:Math.random(), sp:.02+Math.random()*.05, sz:2+Math.random()*4});
    }
  }

  function measure(){
    PH = pit.clientHeight;
    const w = pit.clientWidth;
    const SURF = 0.155, FLOORFRAC = 0.03;     // 배경 발판면 비율(cover 기준) / 캐릭터 발높이 비율(작을수록 바닥 아래 덜 보임)
    const FLOOR = Math.max(8, Math.round(w * FLOORFRAC));
    const bgShift = Math.round(w * (SURF - FLOORFRAC)); // 배경을 내려 발판면을 발 높이에 맞춤 → 바닥 아래 과다 노출 제거
    pit.style.backgroundPosition = "center calc(100% + " + bgShift + "px)";
    yF = PH - FLOOR;                          // yF = 발판 윗면 = 캐릭터 발 = 천장 닿는 바닥
    player.style.bottom = FLOOR + "px";       // 캐릭터를 발판 위에 세움
    BH = player.offsetHeight || 78;           // 곰 렌더 높이
    ceiling.style.height = PH+"px";
  }
  window.addEventListener("resize", ()=>{ measure(); });

  // ---------- 게임 흐름 ----------
  function start(){
    initDust();

    level=1; levelProg=0; score=0; descCur=LEVEL_SPEED[0];

    requestAnimationFrame(loop);

  function loadQuestion(){
    const q = POOL[nextIndex()];
    const order = shuffleArr([0,1,2,3]);
    const choices = order.map(i=>q[2][i]);
    const ans = order.indexOf(0); // 원래 정답은 0번
    cur = { text:q[1], choices, ans };
    document.getElementById("cat").textContent = q[0];
    promptEl.textContent = q[1];
    choicesEl.innerHTML = "";
    choices.forEach((c,i)=>{
      const b=document.createElement("button");
      b.className="choice"; b.dataset.i=i;
      b.innerHTML = `<span class="num">${i+1}</span>${c}`;
      b.addEventListener("click", ()=>answer(i));
      choicesEl.appendChild(b);
    });
    locked=false;
  }

  function answer(i){
    if(!running || locked || paused) return;
    locked=true; answered++;
    const btns=[...choicesEl.children];
    const right = (i===cur.ans);
    btns[cur.ans].classList.add("correct");
    if(!right) btns[i].classList.add("wrong");

    if(right){
      correct++; streak++;
      score += level*10;                                                   // 레벨 가중 점수
      levelProg++;
      if(level<7 && levelProg>=LEVEL_REQ[level-1]){ level++; levelProg=0; } // 레벨업(속도 계단↑)
      p = Math.max(0, p - RISE);
      scoreEl.textContent = score;
      streakEl.textContent = streak>=2 ? `🔥 ${streak} 연속` : "";
      showFlash(streak>=3?`+정답! x${streak}`:"+정답!", "var(--good)");
      blip(660,.09,"triangle"); if(streak%5===0) blip(880,.12,"triangle");
      jumpT = performance.now();          // 폴짝
    }else{
      streak=0; streakEl.textContent="";
      p = Math.min(1, p + DROP_WRONG);
      showFlash("오답", "var(--bad)");
      blip(150,.18,"sawtooth",.18); flinchT = performance.now();  // 움찔
    }
    setTimeout(()=>{ if(running) loadQuestion(); }, REVEAL_MS);
  }

  function skip(){
    if(!running || locked) return;
    locked=true; answered++; streak=0; streakEl.textContent="";
    p = Math.min(1, p + DROP_SKIP);
    showFlash("패스", "var(--skip)");
    blip(220,.12,"square",.12);
    setTimeout(()=>{ if(running) loadQuestion(); }, REVEAL_MS/1.6);
  }

  // 땀방울 하나 튀기기
  function spawnSweat(x,y){
    const s=document.createElement("div"); s.className="sweat";
    s.style.left=x+"px"; s.style.top=y+"px"; pit.appendChild(s);
    const dir=(Math.random()<0.5?-1:1), dx=dir*(12+Math.random()*20);
    s.animate([
      {transform:"translate(-50%,-50%) scale(.6)", opacity:0},
      {transform:`translate(calc(-50% + ${dx*0.6}px), -15px) scale(1)`, opacity:1, offset:.3},
      {transform:`translate(calc(-50% + ${dx}px), 20px) scale(.9)`, opacity:0}
    ], {duration:580, easing:"ease-out"});
    setTimeout(()=>s.remove(), 620);
  }
  // 머리 위 무드 말풍선 (부드럽게 페이드)
  function setMood(txt, op, x, y){
    if(!moodEl) return;
    if(op<=0.02){ moodEl.style.opacity=0; return; }
    if(moodEl.textContent!==txt) moodEl.textContent=txt;
    moodEl.style.left=x+"px"; moodEl.style.top=y+"px";
    moodEl.style.opacity=Math.min(1,op).toFixed(2);
  }

  // 곰 상태머신: 여유↑=가만히 웃기 / 가까움=땀+허둥지둥 달리기 / 접촉=정면 놀람→압축
  function updateBear(v, dt){
    if(crushed) return;
    const now = performance.now();
    const cx = pit.clientWidth/2, maxRun = Math.max(40, cx-46);
    const PAD = 22;  // 곰 머리 위 투명여백·안테나 보정 — "살짝 더/덜 닿게"는 이 값만 조절(↑=더 닿음)
    const teeth = v*yF, headY = yF - BH + PAD;   // 발 = yF(발판 윗면)

    // 접촉: 돌이 정수리를 누름 → 가운데로 모여 정면 놀람 → 압축
    if(teeth >= headY){
      runX += (0-runX)*Math.min(1, dt*11);
      lean += (0-lean)*Math.min(1, dt*11);
      let sy=(yF-teeth)/(BH-PAD); sy=Math.max(0.08,sy);
      const sx=1+(1-sy)*0.45, tr=Math.sin(now/38)*Math.min(2,(1-sy)*3);
      player.style.transform=`translateX(calc(-50% + ${(runX+tr).toFixed(1)}px)) rotate(${lean.toFixed(1)}deg) scaleX(${sx.toFixed(3)}) scaleY(${sy.toFixed(3)})`;
      setMood("😱", 1, cx+runX, headY+2);
      setFace("shock");
      return;
    }

    // 공포도(연속): 여유 55%→15% 구간에서 0→1 (smoothstep)
    const room=1-v;
    let fear=(0.55-room)/(0.55-0.15); fear=Math.max(0,Math.min(1,fear)); fear=fear*fear*(3-2*fear);

    // 허둥지둥 다트: fear 클수록 자주·멀리 목표 갱신
    dartT-=dt*1000;
    if(dartT<=0){ targetX=(Math.random()*2-1)*maxRun*fear*0.8; dartT=780-260*fear+Math.random()*320; }
    runX += (targetX-runX)*Math.min(1, dt*(1.9+1.9*fear));
    const vel=targetX-runX;
    lean += (Math.max(-9,Math.min(9,vel*0.06)) - lean)*Math.min(1,dt*9);
    const freq=250-95*fear;
    const waddle = fear>0.04 ? Math.sin(now/freq)*2.4*fear : 0;
    let dy = (fear>0.04 ? -Math.abs(Math.sin(now/freq))*3.2*fear : 0) + Math.sin(now/650)*2*(1-fear);
    let sx=1+0.03*fear, sy=1-0.05*fear, tx=0;

    // 정답 폴짝 / 오답 플린치
    const je=now-jumpT; if(je>=0&&je<380){ const k=Math.sin(je/380*Math.PI); dy-=24*k; sy*=1+0.09*k; }
    const fe=now-flinchT; if(fe>=0&&fe<240){ const k=Math.sin(fe/240*Math.PI); sy*=1-0.09*k; tx+=Math.sin(fe/240*Math.PI*4)*3; }

    player.style.transform=`translateX(calc(-50% + ${(runX+waddle+tx).toFixed(1)}px)) translateY(${dy.toFixed(1)}px) rotate(${lean.toFixed(1)}deg) scale(${sx.toFixed(3)},${sy.toFixed(3)})`;
    // 방향 전환: 이동방향 보게 / 겁나 멈칫=정면 놀람 / 평온=웃는 정면
    const faceDir = targetX - runX;
    if(fear < 0.22) setFace("calm");
    else if(faceDir < -14) setFace("left");
    else if(faceDir > 14) setFace("right");
    else setFace("shock");

    // 땀 (fear>0.25부터, 클수록 자주)
    if(fear>0.25){ sweatT-=dt*1000; if(sweatT<=0){ spawnSweat(cx+runX+(Math.random()<.5?-16:16), headY+10); sweatT=680-360*fear; } }
    // 무드 말풍선
    if(fear>0.6) setMood("💦",(fear-0.6)/0.4, cx+runX, headY+2);
    else if(fear>0.22) setMood("❓",(fear-0.22)/0.4, cx+runX, headY+2);
    else setMood("",0,cx+runX,headY);
  }

  function showFlash(txt,color){
    flash.textContent=txt; flash.style.color=color;
    flash.classList.remove("show"); void flash.offsetWidth; flash.classList.add("show");
  }

  // 게임오버 순간 충격 연출: 번쩍 + 충격파 링 + 돌 파편 + 강한 흔들림 + "꽝!"
  function impactFX(){
    const cx = pit.clientWidth/2, cy = PH - 12;
    const fl=document.createElement("div"); fl.className="wflash"; pit.appendChild(fl);
    setTimeout(()=>fl.remove(), 300);
    const ring=document.createElement("div"); ring.className="shock";
    ring.style.left=cx+"px"; ring.style.top=cy+"px"; pit.appendChild(ring);
    setTimeout(()=>ring.remove(), 640);
    for(let i=0;i<14;i++){
      const d=document.createElement("div"); d.className="debris";
      const sz=4+Math.random()*7; d.style.width=d.style.height=sz+"px";
      d.style.left=cx+"px"; d.style.top=cy+"px"; pit.appendChild(d);
      const vx=(Math.random()*2-1)*150, up=70+Math.random()*100;
      d.animate([
        {transform:"translate(-50%,-50%) rotate(0deg)", opacity:1},
        {transform:`translate(calc(-50% + ${vx*0.5}px), -${up}px) rotate(160deg)`, opacity:1, offset:.4},
        {transform:`translate(calc(-50% + ${vx}px), 44px) rotate(320deg)`, opacity:0}
      ], {duration:640+Math.random()*220, easing:"cubic-bezier(.2,.5,.4,1)"});
      setTimeout(()=>d.remove(), 900);
    }
    pit.classList.add("shake-hard");
    setTimeout(()=>pit.classList.remove("shake-hard"), 380);
    showFlash("꽝!", "var(--bad)");
    blip(70,.4,"sawtooth",.22); blip(300,.05,"square",.12);
  }

  function gameOver(){
    running=false; pit.classList.remove("shake");
    crushed=true;                       // 마지막 압축 프레임에서 정지(=완전히 눌린 상태)
    if(moodEl) moodEl.style.opacity=0;
    impactFX();
    const acc = answered? Math.round(correct/answered*100):0;
    const isNew = score>best;
    if(isNew){ best=score; localStorage.setItem("rockfall_best_v2",best); bestEl.textContent=best; }
    $("finalScore").textContent=score;
    $("finalAns").textContent=answered;
    $("finalAcc").textContent=acc+"%";
    $("finalBest").textContent=best;
    $("newbest").classList.toggle("hidden", !isNew);
    setTimeout(()=>$("overOv").classList.remove("hidden"), 720);
  }

  // ---------- 메인 루프 (transform만 만짐, React 없음) ----------
  function loop(t){
    if(!running || paused) return;
    const dt = Math.min(0.05,(t-lastT)/1000); lastT=t;
    const descTarget = LEVEL_SPEED[level-1];
    descCur += (descTarget - descCur)*Math.min(1, dt*1.8);   // 레벨업 시 ~1초 스르륵 기어변속
    const desc = descCur;
    p = Math.min(1, p + desc*dt);
    dispP += (p-dispP)*Math.min(1,dt*12);
    renderCeil(dispP);
    updateBear(dispP, dt);

    // 먼지 낙하
    for(const d of dust){
      d.y += d.sp*dt; if(d.y>1){ d.y=0; d.x=Math.random(); }
      d.el.style.transform=`translate(${d.x*pit.clientWidth}px, ${d.y*PH}px)`;
      d.el.style.width=d.el.style.height=d.sz+"px";
    }

    // HUD / 위험 연출
    spdEl.textContent = "x"+(descCur/DESC_START).toFixed(1);
    const room = Math.max(0, 1-dispP);

    danger.style.opacity = room<0.30 ? ((0.30-room)/0.30).toFixed(2) : 0;
    if(room<0.12) pit.classList.add("shake"); else pit.classList.remove("shake");

    if(dispP>=0.995){ gameOver(); return; }   // 돌이 바닥에 닿음 = 여유 0% = 게임오버
    requestAnimationFrame(loop);
  }

  function renderCeil(v){ ceiling.style.transform = `translateY(${(v*yF - PH).toFixed(1)}px)`; }

  // ---------- 입력 ----------

  function pauseGame(){
    if(!running || paused) return;
    paused=true;
    $("pauseOv").classList.remove("hidden");
  }
  function resumeGame(){
    if(!paused) return;
    paused=false;
    $("pauseOv").classList.add("hidden");
    lastT=performance.now();
    requestAnimationFrame(loop);
  }

  $("startBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
  window.addEventListener("keydown", e=>{
    if(paused){ if(e.key==="Enter"||e.code==="Space"){ e.preventDefault(); resumeGame(); } return; }
    if(e.key>="1" && e.key<="4"){ const i=+e.key-1; if(cur && i<cur.choices.length) answer(i); }
    else if(e.key==="Enter"){ if(!running) start(); }
  });
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) pauseGame(); });
  window.addEventListener("blur", pauseGame);
  $("resumeBtn").addEventListener("click", resumeGame);

  measure();
})();
</script>
</body>
