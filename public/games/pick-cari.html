<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>골라라 CARI</title>
<style>
  :root{
    /* 껍데기 토큰 = 버텨라·쏴라 CARI 와 동일 */
    --page:#e9eff9; --bg:#fbfaf5; --ink:#28324c; --sub:#7c869e;
    --brand:#004ac6; --brand-hi:#1b55d0; --line:#e6e9f3;
    --good:#12b58c; --bad:#f2664f; --skip:#e59b17;
    --cream:#ece9e0;
    /* 필드 지오메트리는 JS 의 GEO 가 주입 (단일 출처) */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #eff4fc 0%, #e3ebf7 60%);
    color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100%; overflow:hidden;
    user-select:none;
  }
  .stage{
    position:relative; width:min(460px,100vw); height:min(860px,100vh);
    display:flex; flex-direction:column; background:var(--bg);
    box-shadow:0 0 60px rgba(70,90,140,.25); overflow:hidden;
  }

  /* ===== HUD — 가운데에 큰 타이머 ===== */
  .hud{position:relative; display:flex; align-items:center; justify-content:space-between;
    gap:8px; padding:9px 25px; z-index:6; min-height:88px;
    background:#071a43 url("pick-cari-hud-v2.webp") center/100% 100% no-repeat; border:0; box-shadow:none;}
  .hud::before{display:none;}
  .hud>*{position:relative; z-index:1;}
  .hud-score{position:absolute; left:3.5%; top:50%; width:27.5%; transform:translateY(-50%);
    display:flex; align-items:baseline; justify-content:center; gap:5px; padding:0;}
  .hs-num{font-size:28px; font-weight:900; color:#fff; font-variant-numeric:tabular-nums; line-height:1; text-shadow:0 0 8px rgba(81,214,255,.55);}
  .hs-unit{font-size:11px; font-weight:900; color:#b9d4f1; letter-spacing:-.04em;}
  .hud-right{position:absolute; left:55%; top:50%; width:40%; transform:translateY(-50%);
    display:flex; align-items:center; justify-content:center; gap:0; margin:0;}
  .hud-chip{width:100%; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:11px;
    background:transparent; border:0; padding:2px 4px; box-shadow:none; white-space:nowrap;}
  .hud-chip .hc-lab{font-size:11px; line-height:1; color:#b9d8f5; font-weight:900; letter-spacing:.03em;}
  .hud-chip b{min-width:34px; font-size:27px; line-height:1; color:#70f0cc;
    font-variant-numeric:tabular-nums; font-weight:900; text-align:center;
    text-shadow:0 0 10px rgba(73,241,196,.55);}
  /* HUD 정중앙 절대배치 — 좌우 내용 길이에 안 흔들리게 */
  .timer{position:absolute; left:42.4%; top:49.4%; z-index:2; transform:translate(-50%,-50%);
    width:49px; height:49px; border-radius:50%; display:grid; place-items:center;
    --p:1; --tcol:#fff; background:transparent; box-shadow:none; transition:none;}
  .timer::before{display:none;}
  .timer b{position:relative; font-size:28px; font-weight:900; line-height:1;
    color:var(--tcol); text-shadow:0 0 10px color-mix(in srgb,var(--tcol) 72%,transparent);
    font-variant-numeric:tabular-nums; transition:color .18s,text-shadow .18s;}
  .timer.crit{animation:tpulse .5s ease-in-out infinite;}
  @keyframes tpulse{50%{transform:translate(-50%,-50%) scale(1.1);}}

  /* ===== 문제판 (위) — 용어를 먼저 크게, 설명을 아래. 'A — 이것은 B 이다' 문장은 폐기. ===== */
  .qboard{position:relative; margin:0; padding:23px 28px 22px;
    background:#071a43 url("pick-cari-qpanel-v2.webp") center/100% 100% no-repeat;
    border:0; box-shadow:none; z-index:6; min-height:156px;}
  .qrule{width:34px; height:3px; border-radius:2px; margin-bottom:8px;
    background:linear-gradient(90deg,#5edfff,#d9f8ff); box-shadow:0 0 8px rgba(94,223,255,.55);}
  .qterm{font-size:27px; font-weight:900; color:#fff; letter-spacing:-.035em;
    line-height:1.14; margin-bottom:9px; word-break:keep-all;}
  .qdesc{font-size:14.5px; font-weight:600; color:#dceaff; line-height:1.55;
    letter-spacing:-.005em; min-height:66px; word-break:keep-all;}

  /* ===== 필드 = 우주 ===== */
  .field{position:relative; flex:1; overflow:hidden; z-index:1;
    background:url("pick-cari-game-bg-v2.webp") center/cover no-repeat;}

  /* --- 우주 배경 --- */
  .void{display:none; position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  /* 성운 — 크게 흐린 색 구름 */
  .neb{position:absolute; border-radius:50%; filter:blur(38px);}
  .neb.n1{left:-22%; top:-14%; width:86%; height:56%;
    background:radial-gradient(circle, rgba(96,86,220,.42), transparent 66%);}
  .neb.n2{right:-26%; top:22%; width:88%; height:60%;
    background:radial-gradient(circle, rgba(30,150,190,.34), transparent 66%);}
  .neb.n3{left:6%; bottom:-22%; width:96%; height:52%;
    background:radial-gradient(circle, rgba(150,70,190,.26), transparent 68%);}
  /* 은하수 띠 */
  .milky{position:absolute; left:-30%; right:-30%; top:34%; height:34%;
    transform:rotate(-13deg); filter:blur(20px);
    background:linear-gradient(180deg, transparent, rgba(190,205,255,.13) 45%, transparent);}
  /* 멀리 있는 고리 행성 */
  .planet{position:absolute; right:-16%; top:60%; width:150px; height:150px;}
  .planet .pb{position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #7b8fd8, #3d4a86 52%, #232a55 100%);
    box-shadow:inset -14px -10px 26px rgba(0,0,0,.55), 0 0 40px rgba(110,130,220,.22);}
  .planet .pr{position:absolute; left:-26%; top:42%; width:152%; height:24%;
    border-radius:50%; border:5px solid rgba(160,180,240,.3);
    transform:rotate(-19deg); box-shadow:0 0 16px rgba(150,175,240,.2);}
  /* 별 — JS 가 생성 */
  .star{position:absolute; border-radius:50%; background:#fff; animation:tw ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:var(--o);} 50%{opacity:calc(var(--o) * .25);}}
  /* 유성 */
  .shoot{position:absolute; width:110px; height:1.6px; border-radius:2px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.95));
    filter:drop-shadow(0 0 5px rgba(190,220,255,.9));
    transform:rotate(24deg); opacity:0; animation:shoot linear infinite;}
  @keyframes shoot{
    0%{opacity:0; transform:translate(0,0) rotate(24deg);}
    3%{opacity:1;}
    12%{opacity:0; transform:translate(230px,102px) rotate(24deg);}
    100%{opacity:0; transform:translate(230px,102px) rotate(24deg);}}

  /* --- 발판 --- */
  .zone{position:absolute; top:var(--zone-top); height:var(--zone-h); width:56%; z-index:2;}
  .zoneO{left:-6%; --tilt:-7deg;} .zoneX{right:-6%; --tilt:7deg;}
  /* 우주에 떠 있는 정거장 발판 — 밝은 상판(어두운 우주에서 튐) + 색 림 글로우 + 패널 라인 */
  .plate{position:absolute; inset:0; display:grid; place-items:center; overflow:visible;
    border-radius:15px; transition:filter .25s;
    background:url("pick-cari-platform-o-v2.webp") center/100% 100% no-repeat;
    filter:drop-shadow(0 18px 18px rgba(1,8,28,.58));}
  .zoneX .plate{
    background-image:url("pick-cari-platform-x-v2.webp");}
  .zone-mark{position:absolute; left:50%; top:30%; transform:translate(-50%,-50%);
    font-size:82px; font-weight:900; line-height:1; letter-spacing:0; opacity:.18;}
  .zoneO .zone-mark{color:var(--brand);} .zoneX .zone-mark{color:#c2452c;}
  /* 발판·대기 공통 명패 */
  .zone-tag{position:absolute; top:-17px; left:50%; transform:translateX(-50%); z-index:4;
    width:72px; height:34px; display:flex; align-items:center; justify-content:center; gap:2px; padding:0 8px;
    color:#fff; font-size:11.5px; font-weight:900; white-space:nowrap; background:url("pick-cari-tag-v2.webp") center/100% 100% no-repeat;
    font-variant-numeric:tabular-nums; text-shadow:0 1px 3px #00183f; box-shadow:none;}
  .zone-tag b{font-size:18px; font-weight:900; line-height:1;}
  .zoneO .zone-tag,.zoneX .zone-tag{background-image:url("pick-cari-tag-v2.webp");}
  .zone.safe .plate{filter:saturate(1.18) brightness(1.12) drop-shadow(0 0 18px rgba(73,255,198,.85));}
  .zone.collapse .zone-tag{opacity:0; transition:opacity .2s;}
  /* 발판이 나선을 그리며 사건의 지평선으로 빨려든다 */
  .zone.collapse .plate{animation:plateSuck 1.2s cubic-bezier(.55,0,.85,.5) forwards;}
  @keyframes plateSuck{
    0%{transform:translate(0,0) rotate(0) scale(1);}
    14%{transform:translate(0,6px) rotate(calc(var(--tilt) * .5)) scale(.98);}
    100%{transform:translate(0,52%) rotate(430deg) scale(.04); opacity:.15;}}

  /* ===== 블랙홀 ===== */
  .bh{position:absolute; z-index:28; pointer-events:none; transform:translate(-50%,-50%);
    width:0; height:0;}
  .bh-portal{position:absolute; left:50%; top:50%; width:310px; height:310px;
    transform:translate(-50%,-50%) scale(0) rotate(-25deg);
    background:url("pick-cari-blackhole-v3.webp") center/contain no-repeat;
    filter:drop-shadow(0 0 22px rgba(69,170,255,.9)) drop-shadow(0 0 38px rgba(114,72,255,.55));
    animation:bhPortal 1.55s cubic-bezier(.2,.8,.3,1) forwards;}
  @keyframes bhPortal{
    0%{transform:translate(-50%,-50%) scale(.05) rotate(-25deg); opacity:0;}
    18%{opacity:1;}
    44%{transform:translate(-50%,-50%) scale(1.08) rotate(28deg); opacity:1;}
    72%{transform:translate(-50%,-50%) scale(1) rotate(58deg); opacity:1;}
    100%{transform:translate(-50%,-50%) scale(.08) rotate(145deg); opacity:0;}}
  .bh-charge{position:absolute; left:50%; top:50%; width:60px; height:60px; border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    background:radial-gradient(circle, #fff 0%, rgba(200,170,255,.9) 40%, transparent 70%);
    animation:bhCharge 360ms ease-in forwards;}
  @keyframes bhCharge{0%{transform:translate(-50%,-50%) scale(0); opacity:0;}
    70%{transform:translate(-50%,-50%) scale(1.1); opacity:1;}
    100%{transform:translate(-50%,-50%) scale(.45); opacity:1;}}


  /* --- 대기 발판 — 표면은 홀로그램(우주), 형태는 O/X 와 같은 두께 있는 슬랩 --- */
  .waitzone{position:absolute; left:0; right:0; top:var(--wait-top); height:var(--wait-h);
    z-index:1; border-radius:15px;
    background:url("pick-cari-platform-o-v2.webp") center/100% 100% no-repeat;
    filter:saturate(.42) brightness(.68) drop-shadow(0 17px 16px rgba(1,8,28,.58)); box-shadow:none;}
  /* 그리드·스캔라인만 잘라내는 내부 레이어 — waitzone 에 overflow:hidden 을 걸면 명패가 잘린다 */
  .wz-fx{position:absolute; inset:0; border-radius:15px; overflow:hidden; pointer-events:none;}
  .wz-fx::before{content:""; position:absolute; inset:12% 4% 21%;
    background:repeating-linear-gradient(90deg, rgba(165,220,255,.16) 0 1px, transparent 1px 28px),
               repeating-linear-gradient(0deg, rgba(165,220,255,.12) 0 1px, transparent 1px 24px);}
  .wz-fx::after{content:""; position:absolute; left:0; right:0; height:26%;
    background:linear-gradient(180deg, transparent, rgba(185,228,255,.32), transparent);
    animation:scan 3.6s ease-in-out infinite;}
  @keyframes scan{0%,100%{top:-14%;} 50%{top:88%;}}
  /* 명패는 발판 명패와 같은 규격 */
  .waitzone .wl{position:absolute; top:-17px; left:50%; transform:translateX(-50%); z-index:4;
    width:72px; height:34px; display:grid; place-items:center; padding:0 8px; color:#fff; font-size:12px; font-weight:900;
    white-space:nowrap; background:url("pick-cari-tag-v2.webp") center/100% 100% no-repeat;
    text-shadow:0 1px 3px #00183f; box-shadow:none;}

  /* ===== 캐릭터 — 나 = CARI, 나머지 = 같은 우주복의 응시생(슈트 색으로 구분) ===== */
  .ch{position:absolute; z-index:10; width:34px; transform:translate(-50%,-50%);
    transition:left .5s cubic-bezier(.4,1.4,.5,1), top .5s cubic-bezier(.4,1.4,.5,1); will-change:left,top;
    filter:drop-shadow(0 3px 4px rgba(6,12,30,.55));}
  .ch .art{width:100%; height:auto; display:block; transform-origin:50% 92%; animation:hop 1.5s ease-in-out infinite;}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .ch .npc-art{--face:1; animation:npcHop 1.5s ease-in-out infinite;
    image-rendering:auto; object-fit:contain;}
  @keyframes npcHop{
    0%,100%{transform:translateY(0) scaleX(var(--face));}
    50%{transform:translateY(-3px) scaleX(var(--face));}}
  .ch .npc-art.shock{filter:brightness(1.18) drop-shadow(0 0 5px rgba(255,120,100,.72));}
  .ch .lab{position:absolute; top:-11px; left:50%; transform:translateX(-50%); white-space:nowrap;
    font-size:9px; font-weight:800; color:#eaf0fb; background:rgba(18,26,48,.78);
    padding:0 5px; border-radius:7px;}
  .ch.me{width:44px; z-index:12;}
  .ch.me .lab{color:#fff; background:var(--brand); top:-12px;}
  /* 나를 항상 찾을 수 있게 — 크림 슈트가 밝은 발판 위에서 묻혀서 발밑 글로우를 깔았다 */
  .ch.me::before{content:""; position:absolute; left:50%; top:58%; width:165%; height:62%;
    transform:translate(-50%,-50%); border-radius:50%; z-index:-1; pointer-events:none;
    background:radial-gradient(circle, rgba(91,144,255,.6), rgba(91,144,255,0) 70%);
    animation:mePulse 2.2s ease-in-out infinite;}
  @keyframes mePulse{0%,100%{opacity:.75;} 50%{opacity:1;}}
  /* 탈락 — 참가자도 나선으로 빨려든다 */
  .ch.out .art{animation:none;}
  .ch.out{z-index:8; animation:exHole 1.1s cubic-bezier(.5,0,.85,.5) forwards;}
  @keyframes exHole{0%{transform:translate(-50%,-50%) rotate(0) scale(1); opacity:1;}
    18%{transform:translate(-50%,-64%) rotate(-14deg) scale(1.06);}
    100%{transform:translate(-50%,20%) rotate(560deg) scale(.05); opacity:0;}}

  /* 접촉 순간 섬광 — 밝은 발판 위에선 먼지만으론 타격감이 안 살았다 */
  .hitflash{position:absolute; z-index:33; pointer-events:none; width:220px; height:220px;
    border-radius:50%; transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(214,232,255,.55) 38%, transparent 70%);
    animation:hitflash .26s ease-out forwards;}
  @keyframes hitflash{0%{opacity:.95; transform:translate(-50%,-50%) scale(.35);}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1.15);}}

  /* ===== 임팩트 ===== */
  .debris{position:absolute; z-index:34; border-radius:3px; pointer-events:none;
    background:linear-gradient(160deg,#9db4dc,#4f6597); box-shadow:0 1px 3px rgba(10,18,40,.55);}
  .shake-hard{animation:shk2 .09s linear infinite;}
  @keyframes shk2{0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}
    50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}100%{transform:translate(3px,1px)}}

  /* ===== 정답 공개 카드 ===== */
  .verdict{position:absolute; top:50.5%; left:50%; z-index:22; opacity:0;
    transform:translate(-50%,-50%) scale(0); display:flex; align-items:center; gap:10px;
    min-width:196px; height:64px; padding:7px 17px 7px 8px; border-radius:18px; white-space:nowrap;
    background:linear-gradient(145deg,rgba(10,37,82,.98),rgba(3,17,48,.98));
    border:2px solid #58d6ff; box-shadow:0 0 0 3px rgba(20,117,210,.25),0 13px 30px rgba(0,8,32,.72);}
  .verdict.x{border-color:#ff806b; box-shadow:0 0 0 3px rgba(242,102,79,.22),0 13px 30px rgba(0,8,32,.72);}
  .verdict.show{animation:vPop .5s cubic-bezier(.2,1.7,.4,1) forwards;}
  @keyframes vPop{0%{opacity:0; transform:translate(-50%,-50%) scale(0) rotate(-9deg);}
    60%{opacity:1; transform:translate(-50%,-50%) scale(1.1) rotate(2.5deg);}
    100%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0);}}
  .verdict.hide{animation:vOut .28s ease-in forwards;}
  @keyframes vOut{to{opacity:0; transform:translate(-50%,-50%) scale(.86);}}
  .v-mark{position:relative; width:48px; height:48px; border-radius:50%; display:grid;
    place-items:center; font-size:29px; font-weight:900; color:#fff; line-height:1;
    border:3px solid rgba(255,255,255,.88);}
  .verdict.o .v-mark{background:radial-gradient(circle,#168cff,#003ca6); box-shadow:0 0 12px rgba(60,194,255,.75);}
  .verdict.x .v-mark{background:radial-gradient(circle,#ff806b,#bc2d25); box-shadow:0 0 12px rgba(255,92,70,.7);}
  .v-mark::after{content:""; position:absolute; inset:0; border-radius:50%;
    border:3px solid currentColor; opacity:0;}
  .verdict.show .v-mark::after{animation:vRing .62s ease-out .12s;}
  @keyframes vRing{0%{transform:scale(1); opacity:.85;} 100%{transform:scale(2.3); opacity:0;}}
  .v-lab{font-size:9px; font-weight:900; letter-spacing:.16em; color:#8ebbe5;}
  .v-sub{font-size:17px; font-weight:900; color:#fff; letter-spacing:-.03em; margin-top:2px;
    text-shadow:0 0 8px rgba(80,201,255,.35);}

  /* ===== 답 버튼 (아래 — 엄지 닿는 자리) ===== */
  .answerbar{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:8px 14px 12px;
    background:#071a42; border-top:1px solid #447fc1;
    box-shadow:0 -8px 18px rgba(2,12,38,.3); z-index:6;}
  .choice{position:relative; display:block; padding:0;
    border:0; border-radius:0; background:url("pick-cari-choice-o-v2.webp") center/100% 100% no-repeat; color:#fff;
    font-size:17px; font-weight:900; cursor:pointer; min-height:66px;
    transition:transform .05s, background .12s, border-color .12s, box-shadow .12s;}
  .choice:active{transform:scale(.97);}
  .choice svg{position:absolute; left:15.2%; top:50%; width:31px; height:31px;
    transform:translate(-50%,-50%); fill:none; stroke-width:7.5;}
  .choice-label{position:absolute; left:28%; right:4%; top:50%; transform:translateY(-50%); text-align:center;}
  .choice.o svg{stroke:var(--brand);} .choice.x svg{stroke:var(--bad);}
  .answerbar:has(.choice.sel) .choice:not(.sel){filter:saturate(.48) brightness(.66); opacity:.72;}
  .choice.sel{z-index:2; background-image:url("pick-cari-choice-o-v2.webp");
    transform:translateY(-3px) scale(1.035); filter:brightness(1.2) saturate(1.2)
      drop-shadow(0 0 9px rgba(42,190,255,.92)); box-shadow:none;}
  .choice.sel svg{filter:drop-shadow(0 0 9px #42caff);}
  .choice.sel .choice-label{text-shadow:0 0 12px #62d8ff,0 2px 3px #001c58;}
  .choice.sel::after{content:"✓"; position:absolute; right:8px; top:4px; color:#c9f7ff;
    font-size:28px; font-weight:1000; line-height:1; text-shadow:0 0 10px #009dff,0 2px 2px #001944;}
  .choice.x{background-image:url("pick-cari-choice-x-v2.webp");}
  .choice.x.sel{background-image:url("pick-cari-choice-x-v2.webp");
    filter:brightness(1.2) saturate(1.2) drop-shadow(0 0 8px rgba(255,86,65,.92));
    box-shadow:none;}
  .choice.x.sel svg{filter:drop-shadow(0 0 7px #ff806b);}
  .choice.x.sel .choice-label{text-shadow:0 0 9px #ff8f79,0 2px 3px #4d0803;}
  .choice.x.sel::after{color:#ff9b87; text-shadow:0 0 8px #ff4f34,0 2px 2px #4d0803;}
  .choice.correct{z-index:2; transform:translateY(-3px) scale(1.035);
    filter:brightness(1.3) saturate(1.25) drop-shadow(0 0 11px rgba(78,255,199,.95)); box-shadow:none;}
  .choice.wrong{transform:none; filter:saturate(.35) brightness(.48); opacity:.62; box-shadow:none;}
  .choice.wrong::after{content:"×"; position:absolute; right:9px; top:3px; color:#ff8c7b;
    font-size:30px; font-weight:1000; line-height:1; text-shadow:0 0 8px rgba(255,72,50,.8);}
  .choice .kbd{display:none;}

  /* ===== 오버레이 (껍데기 = CARI 그대로) ===== */
  .overlay{position:absolute; inset:0; z-index:40; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:28px;
    background:rgba(245,247,252,.9); backdrop-filter:blur(4px);}
  #startOv{justify-content:center; padding:74px 24px 28px;

/* 문항 갈아끼우기 — 부모(앱)가 DB 문항을 내려주면 위 POOL 을 대체한다.
   ⛔ 위 배열은 **폴백**이다. 단일 출처는 관리자 화면(term_questions)이고, 이 파일을 앱 없이
      직접 열었거나 서버가 안 열릴 때만 쓰인다 — 여기 문항을 고쳐도 서비스에는 안 나간다.
   ⚠️ 받은 문항은 이미 화면 언어로 번역돼 온다(앱이 투영해서 보낸다). */
window.addEventListener("message", function(e){
  if(e.origin !== window.location.origin) return;
  var m = e.data;
  if(!m || m.t !== "mg:pool" || !Array.isArray(m.items)) return;
  var next = m.items
    .filter(function(it){ return it && it.desc && it.answer && it.distractors && it.distractors.length === 3; })
    .map(function(it){ return [it.field || "AI", it.desc, [it.answer].concat(it.distractors)]; });
  if(!next.length) return;
  POOL = next;
  recent.length = 0;   // 옛 문항으로 만든 "최근에 낸 문제" 기록을 비운다
});

function shuffle(a){

  for(let i=out.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }

}

/* 랜덤 배치는 이름표가 서로 뭉개져서 격자 패킹으로 바꿨다.
   대기 구역은 넓고 낮아서 정사각 배치를 쓰면 세로로 겹친다 → maxRows 로 줄 수를 강제. */
const AREA={
  O:{x0:8, x1:42, y0:GEO.zoneTop+10, y1:GEO.zoneTop+21, maxCols:4},
  X:{x0:58, x1:92, y0:GEO.zoneTop+10, y1:GEO.zoneTop+21, maxCols:4},
  W:{x0:7, x1:93, y0:GEO.waitTop+4, y1:GEO.waitTop+16, maxCols:8, maxRows:2},
};
function packInto(list,r){
  const n=list.length; if(!n) return;
  const cols = r.maxRows
    ? Math.max(1,Math.min(r.maxCols,Math.ceil(n/r.maxRows)))
    : Math.max(1,Math.min(r.maxCols,Math.ceil(Math.sqrt(n*1.3))));
  const rows=Math.ceil(n/cols);
  list.forEach((p,i)=>{
    const rw=Math.floor(i/cols), c=i%cols;
    const inRow=(rw===rows-1)?(n-rw*cols):cols;    // 마지막 줄은 남은 수만큼 가운데 정렬
    const cw=(r.x1-r.x0)/inRow, ch=(r.y1-r.y0)/rows;
    place(p.el, r.x0+cw*(c+.5)+p.jx*cw*.14, r.y0+ch*(rw+.5)+p.jy*ch*.14);
  });
}
function relayout(){
  const alive=players.filter(p=>p.alive);
  packInto(alive.filter(p=>p.choice==='O'), AREA.O);
  packInto(alive.filter(p=>p.choice==='X'), AREA.X);
  packInto(alive.filter(p=>!p.choice),      AREA.W);
}

function makeQuestion(){
  let q,key,guard=0;
  do{
    const [cat,desc,opts]=pick(POOL);
    const isTrue=Math.random()<.5;
    const term=isTrue?opts[0]:pick(opts.slice(1));
    q={cat,desc,term,ans:isTrue?'O':'X'}; key=desc+'|'+term;
  }while(recent.includes(key) && ++guard<20);
  recent.push(key); if(recent.length>12) recent.shift();
  return q;
}

function buildPlayers(){
  field.querySelectorAll('.ch,.bh,.debris,.hitflash').forEach(e=>e.remove());
  players=[];
  const names=[...NAMES].sort(()=>Math.random()-.5);
  /* 15명을 같은 8종으로 채우되 반복 순서를 그대로 쓰지 않는다.
     시작 대기석의 좌우 이웃·위아래 같은 열에 같은 종이 서지 않을 때까지 다시 섞는다. */
  let assetBag=[];
  for(let attempt=0;attempt<30;attempt++){
    const candidate=[...shuffle(NPC_ASSETS),...shuffle(NPC_ASSETS)].slice(0,15);
    const spread=candidate.every((asset,i)=>
      (i===0||asset!==candidate[i-1]) && (i<8||asset!==candidate[i-8]));
    assetBag=candidate; if(spread) break;
  }
  for(let i=0;i<16;i++){
    const isMe=i===0;
    const suit=null;
    const asset=isMe?PLAYER_ASSET:assetBag[i-1];
    const el=document.createElement('div'); el.className='ch'+(isMe?' me':'');
    const p={el,isMe,alive:true,choice:null,suit,asset,assign:null,jx:rand(-1,1),jy:rand(-1,1)};
    el.innerHTML=npcArt(asset)+`<div class="lab">${isMe?MGI18N.t('pick.me'):names[i%names.length]}</div>`;
    el.querySelector('.art').style.animationDelay=(Math.random()*1.4).toFixed(2)+'s';
    field.appendChild(el);
    players.push(p); if(isMe) me=p;
  }
  relayout(); updateCounts();
}
function place(el,x,y){ el.style.left=x+'%'; el.style.top=y+'%'; }
function redraw(p,opt){
  const a=p.el.querySelector('.art'); if(!a) return;
  a.outerHTML=npcArt(p.asset,opt);
  const n=p.el.querySelector('.art'); if(n) n.style.animationDelay=(Math.random()*1.4).toFixed(2)+'s';
}
function faceDir(p,c){ redraw(p,{dir:c==='O'?-1:c==='X'?1:0}); }
function updateCounts(){
  let o=0,x=0,alive=0;
  players.forEach(p=>{ if(!p.alive)return; alive++; if(p.choice==='O')o++; else if(p.choice==='X')x++; });
  tagO.innerHTML=MGI18N.t('pick.people',{n:'<b>'+o+'</b>'}); tagX.innerHTML=MGI18N.t('pick.people',{n:'<b>'+x+'</b>'}); $("aliveN").textContent=alive;
}
function moveTo(p,choice){ p.choice=choice; faceDir(p,choice); relayout(); updateCounts(); }

function planSurvivors(n){
  if(n<=2) return 1;
  let frac, r=Math.random();
  if(n>10)      frac = r<.18 ? rand(.32,.5) : rand(.62,.8);
  else if(n>5)  frac = r<.22 ? rand(.4,.55) : rand(.58,.74);
  else          frac = rand(.5,.72);
  return clamp(Math.round(n*frac),1,n-1);
}

function newRound(){
  phase='answer';
  $("stageNum").textContent=round;
  const q=makeQuestion();
  curAns=q.ans;
  qtermEl.textContent=q.term; qdescEl.textContent=q.desc;
  zoneO.className='zone zoneO'; zoneX.className='zone zoneX';
  verdict.className='verdict';

  const aliveList=players.filter(p=>p.alive);
  aliveList.forEach(p=>{ p.choice=null; faceDir(p,null); });
  relayout(); updateCounts();
  btnO.classList.remove('sel','correct','wrong'); btnX.classList.remove('sel','correct','wrong');

  const target=planSurvivors(aliveList.length);
  const dummies=aliveList.filter(p=>!p.isMe);
  const dummySurv=clamp(target-1,0,dummies.length);
  const wrongSide=curAns==='O'?'X':'O';
  [...dummies].sort(()=>Math.random()-.5).forEach((p,i)=> p.assign = i<dummySurv ? curAns : wrongSide);
  dummies.forEach(p=>{
    if(Math.random()<.55){ const ft=rand(1000,4200);
      setTimeout(()=>{ if(phase==='answer'&&p.alive) moveTo(p, Math.random()<.5?'O':'X'); }, ft); }
    const ct=Math.max(400, T0*1000-rand(900,2600));
    setTimeout(()=>{ if(phase==='answer'&&p.alive) moveTo(p,p.assign); }, ct);
  });

  tLeft=T0; renderTimer();
  clearInterval(tick);
  tick=setInterval(()=>{ tLeft--; renderTimer(); if(tLeft<=0){ clearInterval(tick); reveal(); } },1000);
}
function renderTimer(){
  const t=Math.max(0,tLeft);
  tnum.textContent=t;
  timerEl.style.setProperty('--p', t/T0);
  timerEl.style.setProperty('--tcol', t<=5?'#ff5b48':'#fff');
  timerEl.classList.toggle('crit', t<=5 && t>0);
}

function choose(c){
  if(phase!=='answer'||!me.alive) return;
  moveTo(me,c);
  btnO.classList.toggle('sel',c==='O'); btnX.classList.toggle('sel',c==='X');
}
btnO.onclick=()=>choose('O'); btnX.onclick=()=>choose('X');
/* 초안은 F1/F2 였는데 F1 이 브라우저 도움말을 열어버려서 1/2·O/X·←→ 로 바꿨다. */
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='1'||k==='o'||k==='arrowleft'){ e.preventDefault(); choose('O'); }
  else if(k==='2'||k==='x'||k==='arrowright'){ e.preventDefault(); choose('X'); }
});

function reveal(){
  phase='reveal';
  const correctBtn=curAns==='O'?btnO:btnX;
  const wrongBtn=curAns==='O'?btnX:btnO;
  btnO.classList.remove('sel'); btnX.classList.remove('sel');
  correctBtn.classList.add('correct');
  if(me.choice && me.choice!==curAns) wrongBtn.classList.add('wrong');
  (curAns==='O'?zoneO:zoneX).classList.add('safe');
  vMark.textContent=curAns;
  vSub.textContent = MGI18N.t(curAns==='O' ? 'pick.desc_true' : 'pick.desc_false');
  verdict.className='verdict '+(curAns==='O'?'o':'x')+' show';
  setTimeout(()=>verdict.classList.add('hide'),1900);
  const loseSide=curAns==='O'?'X':'O';
  const dead=players.filter(p=>p.alive && p.choice!==curAns);
  smashSide(loseSide,dead);
  setTimeout(()=>{ dead.forEach(p=>p.alive=false); updateCounts(); afterReveal(); }, CONTACT+1600);
}

/* ===== 붕괴 연출 =====
   셋 다 같은 뼈대를 쓴다: [예고 0~CONTACT] → [CONTACT 에서 터짐] → [퇴장].
   FX 하나가 (예고 DOM, 발판 클래스, 캐릭터 퇴장 클래스, 터질 때 할 일)을 들고 있다.
   접촉 시점은 CONTACT 상수 하나가 잡아서 이펙트와 애니가 절대 어긋나지 않는다. */
const PLATE_Y = GEO.zoneTop + GEO.zoneH/2;      // 발판 한가운데(%) — 연출이 터지는 지점

/* 파편은 바깥이 아니라 안쪽으로 — 블랙홀이 빨아들이는 방향 */
function spawnDebris(cx,cy,n){
  for(let i=0;i<n;i++){
    const d=document.createElement('div'); d.className='debris';
    const s=rand(5,12); d.style.width=s+'px'; d.style.height=s*rand(.5,1)+'px';
    d.style.left=cx+'%'; d.style.top=cy+'%'; field.appendChild(d);
    const ang=rand(-Math.PI,Math.PI), dist=rand(70,175);
    d.animate([
      {transform:`translate(${Math.cos(ang)*dist-50}%,${Math.sin(ang)*dist-50}%) rotate(0)`,opacity:1},
      {transform:'translate(-50%,-50%) rotate(420deg) scale(.1)',opacity:0},
    ],{duration:850,easing:'cubic-bezier(.5,0,.85,.5)'});
    setTimeout(()=>d.remove(),870);
  }
}
function flash(cx,cy){
  const fl=document.createElement('div'); fl.className='hitflash';
  fl.style.left=cx+'%'; fl.style.top=cy+'%'; field.appendChild(fl);
  setTimeout(()=>fl.remove(),280);
}

/* 붕괴 = 블랙홀.
   [예고 0~CONTACT] 발판 한가운데로 빛점이 모인다
   [CONTACT]        강착원반 + 사건의 지평선이 열리고, 파편이 안쪽으로 빨려든다
   [이후]           발판과 참가자가 나선을 그리며 삼켜진다
   접촉 시점은 CONTACT 상수 하나가 잡아서 CSS 애니와 이펙트가 어긋나지 않는다. */
function smashSide(side,dead){
  const cx  = side==='O' ? 24 : 76;
  const zone= side==='O' ? zoneO : zoneX;

  const bh=document.createElement('div'); bh.className='bh';
  bh.style.left=cx+'%'; bh.style.top=PLATE_Y+'%';
  bh.innerHTML='<div class="bh-charge"></div>';
  field.appendChild(bh);

  setTimeout(()=>{
    stage.classList.add('shake-hard');
    zone.classList.add('collapse');
    bh.innerHTML='<div class="bh-portal"></div>';
    flash(cx,PLATE_Y);
    spawnDebris(cx,PLATE_Y,12);
    dead.forEach(p=>{ redraw(p,{shock:true}); p.el.classList.add('out'); });
    setTimeout(()=>{
      stage.classList.remove('shake-hard');
      dead.forEach(p=>{ p.el.style.visibility='hidden'; });
    },430);
  }, CONTACT);

  setTimeout(()=>bh.remove(), 1700);
}

function afterReveal(){
  const s=players.filter(p=>p.alive);
  if(!me.alive) return gameOver(false,s.length);
  if(s.length<=1 || round>=TOTAL_STAGES) return gameOver(true,s.length);
  round++; setTimeout(newRound,700);
}
function gameOver(win,aliveCount){
  phase='over'; clearInterval(tick);
  if(window.MGBridge) MGBridge.submit(round, {timed:true}); // 랭킹: 도달 라운드(동률=시간)
  if(round>best){ best=round; localStorage.setItem('cari_ox_best',best); $("newbest").classList.remove('hidden'); }
  else $("newbest").classList.add('hidden');
  $("overBadge").className='over-badge'+(win?' win':'');
  $("overBadge").textContent=win?'CLEAR':'GAME OVER';
  $("overImg").src=win?'pick-cari-intro-cari-v3.webp':'pick-cari-outro-cari-v3.webp';
  $("overTitle").textContent=MGI18N.t(win?(round>=TOTAL_STAGES?'pick.cleared':'pick.last'):'pick.over');
  $("finalRound").textContent=round;
  $("finalRank").textContent=MGI18N.t('pick.rank_n',{n:win?1:(aliveCount+1)});
  $("finalAlive").textContent=aliveCount;
  $("finalBest").textContent=best;
  $("overOv").classList.remove('hidden');
}
function start(){
  round=1; $("startOv").classList.add('hidden'); $("overOv").classList.add('hidden');
  verdict.className='verdict';
  zoneO.className='zone zoneO'; zoneX.className='zone zoneX';
  buildPlayers(); renderTimer(); setTimeout(newRound,450);
}
$("startBtn").onclick=start; $("againBtn").onclick=start;
})();
</script>

<!-- ===== 앱 브리지: 랭킹 버튼 + 점수 전송 =====
     이 HTML 은 자립형이라 세션도 supabase 클라도 없다 → 실제 제출/조회는 부모(/games/:id = MiniGame.tsx)가 한다.
     여기서는 (1) 인트로·아웃트로 우상단에 '랭킹' 버튼을 얹고, (2) 점수가 나면 postMessage 로 알리기만 한다.
     ⚠️ 이 파일을 단독으로 열면 부모가 없어 버튼도 숨고 아무것도 보내지 않는다(게임은 그대로 동작).
     ⚠️ tieMs(레벨형 동률 해소용 소요시간)는 인트로에서 시작을 누른 시점부터 잰다. '처음으로'로 되돌아가
       인트로를 다시 거치지 않으면 계속 누적된다 — 순위 1차 키가 아니라 동률 해소용이라 그대로 둔다. -->
<style>
.mg-rank{position:absolute; top:12px; right:12px; z-index:60; display:none; align-items:center; justify-content:center;
  box-sizing:border-box; width:112px; height:34px; padding:0; border:0; cursor:pointer;
  font:850 11.5px/1 system-ui,-apple-system,sans-serif; letter-spacing:.025em; color:#fff;
  background:url("rank-button.webp") center/100% 100% no-repeat; text-shadow:0 1px 3px #001c55;
  filter:drop-shadow(0 3px 4px rgba(8,20,60,.24)); -webkit-tap-highlight-color:transparent;}
.mg-rank.on{display:inline-flex;}
/* ⚠️ 랭킹 글자는 판 정중앙(58.5%)이 아니라 **54%** 다 — 왼쪽 트로피가 시각적으로 무거워서
     기하학적 중앙에 두면 오른쪽으로 밀려 보인다. 모든 게임이 같은 값이다(2026-08-18 일괄 정렬).
     px 오프셋으로 밀지 말 것 — 버튼 폭이 게임마다 달라(112 vs 131) 같은 px 이 다른 위치가 된다. */
.mg-rank span{position:absolute;left:54%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}
.mg-rank:hover{filter:brightness(1.06) drop-shadow(0 3px 5px rgba(8,20,60,.28));}
.mg-rank:active{transform:translateY(1px) scale(.98);}
</style>
<script>
(function(){
  var EMBED = window.parent !== window;
  var T0 = 0;
  function post(m){ if(EMBED) window.parent.postMessage(m, window.location.origin); }
  window.MGBridge = {
    /** 점수 전송. timed:true 면 시작 이후 경과시간을 동률 해소용으로 같이 보낸다. */
    submit: function(v, opts){
      if(typeof v !== 'number' || !isFinite(v)) return;
      post({ t:'mg:score', score:v, tieMs:(opts && opts.timed && T0) ? (Date.now()-T0) : undefined });
    }
  };
  function mount(id){
    var ov = document.getElementById(id); if(!ov) return;
    if(ov.querySelector('.mg-rank')) return;
    var b = document.createElement('button');
    b.type='button'; b.className='mg-rank' + (EMBED ? ' on' : '');
    b.setAttribute('aria-label', window.MGI18N ? MGI18N.t('mg.rank_aria') : '이 게임 랭킹 보기');
    b.innerHTML='<span>'+(window.MGI18N ? MGI18N.t('mg.rank') : '랭킹')+'</span>';
    b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); post({t:'mg:rank'}); });
    ov.appendChild(b);
  }
  mount('startOv'); mount('overOv');
  // 인트로에서 (랭킹 버튼이 아닌) 무엇이든 누르면 = 플레이 시작 → 소요시간 기준점 리셋.
  var intro = document.getElementById('startOv');
  if(intro) intro.addEventListener('click', function(e){
    if(e.target && e.target.closest && e.target.closest('.mg-rank')) return;
    T0 = Date.now();
  }, true);
})();
</script>
<script>if (window.MGI18N) MGI18N.apply();</script>
</body>
</html>
