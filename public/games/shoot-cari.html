<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>쏴라 CARI</title>
<link rel="preload" as="image" href="shoot-cari-bg.webp"/>
<link rel="preload" as="image" href="shoot-cari-enemy.webp"/>
<link rel="preload" as="image" href="shoot-cari-shield.webp"/>
<link rel="preload" as="image" href="shoot-cari-laser.webp"/>
<link rel="preload" as="image" href="shoot-cari-boom.webp"/>
<link rel="preload" as="image" href="shoot-cari-choice.webp"/>
<link rel="preload" as="image" href="shoot-cari-qbox.webp"/>
<link rel="preload" as="image" href="shoot-cari-hud.webp"/>
<link rel="preload" as="image" href="shoot-cari-heart.webp"/>
<link rel="preload" as="image" href="shoot-cari-introbar.webp"/>
<link rel="preload" as="image" href="shoot-cari-panelbg.webp"/>
<link rel="preload" as="image" href="shoot-cari-btn.webp"/>
<link rel="preload" as="image" href="shoot-cari-scorebox.webp"/>
<style>
  /* 팔레트 = 인게임 배경/적군/쉴드라인 이미지에서 실측한 색.
     배경 #010124~#0c044c · 지평선 #a22de2 · 쉴드 #00bbff · 적군 패널 #2f537e~#183a64 · 눈 #ff3e32 */
  :root{
    --void:#05021c; --void2:#0c044c; --ink:#eaf2ff; --sub:#9fb0e0;
    --neon:#25d7ff; --neon-d:#00a8e8; --violet:#a35bff; --magenta:#e24df0;
    --line:rgba(110,170,255,.22);
    --good:#3ce0a8; --bad:#ff4d6a; --skip:#ffc14d;
    --gold1:#ffd25a; --gold2:#f0a91a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:#05021c;
    color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100%; overflow:hidden; user-select:none;
  }
  .stage{position:relative; width:min(460px,100vw); height:min(860px,100vh);
    display:flex; flex-direction:column; background:#05021c; overflow:hidden;
    box-shadow:0 0 60px rgba(90,40,200,.45);}
  /* 배경 이미지는 스테이지 전체(HUD·보기바 뒤까지) — 위 UI 는 반투명 글래스로 얹는다 */
  .stage-bg{position:absolute; inset:0; width:100%; height:100%; z-index:0;
    object-fit:cover; object-position:center bottom; pointer-events:none;}
  .stage::after{content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(125% 78% at 50% 38%, transparent 42%, rgba(2,0,18,.6) 100%);}

  /* HUD — 헤더 이미지 한 장. 아이콘(금별·왕관·번개)과 하트 윤곽은 그림에 있고, 값만 슬롯에 얹는다.
     좌표는 원본 실측치(주석 상단 참고)를 % 로 옮긴 것이라 폭이 달라져도 안 어긋난다. */
  .hud{position:relative; flex:none; margin:2px 6px 0; aspect-ratio:1745/311; z-index:7;
    background:url(shoot-cari-hud.webp) center/100% 100% no-repeat;
    filter:drop-shadow(0 4px 14px rgba(0,0,0,.5));}
  .hs-num{position:absolute; left:20.5%; right:57.4%; top:50%; transform:translateY(-50%);
    text-align:center; font-size:26px; font-weight:900; color:#fff; font-variant-numeric:tabular-nums; line-height:1;
    text-shadow:0 0 12px rgba(37,215,255,.9), 0 0 26px rgba(37,215,255,.5);}
  .hv{position:absolute; left:50.3%; right:35.4%; transform:translateY(-50%); text-align:center;
    font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;}
  .hv.best{top:37%; color:#ffe08a; text-shadow:0 0 8px rgba(255,200,80,.7);}
  .hv.spd{top:67%; color:#8fe6ff; text-shadow:0 0 8px rgba(60,200,255,.8);}
  /* 하트: 그림의 빈 윤곽 위에 채운 하트를 얹는다 → 잃으면 채움만 사라지고 윤곽이 남는다 */
  .lives{position:absolute; left:66.85%; right:3.45%; top:35.7%; height:26%;
    display:flex; justify-content:space-between; align-items:center;}
  .lives .h{flex:0 0 17.1%; aspect-ratio:89/81; color:#ff4060; display:inline-flex;
    align-items:center; justify-content:center; transition:.2s;
    filter:drop-shadow(0 0 5px rgba(255,60,90,.85));}
  .lives .h img{width:100%; height:100%; object-fit:contain; display:block;}
  .lives .h.gone{opacity:0; filter:none; transform:scale(.8);}
  .lives.hitwrap{animation:livesShake .5s cubic-bezier(.3,.7,.3,1);}   /* top/height 로 배치해 transform 을 비워뒀다 */
  @keyframes livesShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-5px)}30%{transform:translateX(5px)}45%{transform:translateX(-4px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
  .lives .h.breaking{animation:hbreak .55s cubic-bezier(.3,.7,.3,1) forwards; color:#ff2740; position:relative; z-index:2;}
  @keyframes hbreak{
    0%{transform:scale(1);}
    22%{transform:scale(1.9); filter:drop-shadow(0 0 14px rgba(255,40,60,.95)) brightness(1.3);}
    45%{transform:scale(1.55) rotate(-8deg);}
    100%{transform:scale(0) rotate(45deg); opacity:0;}
  }

  /* PIT — 배경은 .stage-bg 가 깔린다(여긴 투명). 낙하 구간 */
  .pit{position:relative; flex:1; overflow:hidden; z-index:3;}
  .star{position:absolute; border-radius:50%; background:#fff; opacity:0; pointer-events:none;
    box-shadow:0 0 8px rgba(140,200,255,.95); animation:tw 3.2s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.15; transform:scale(.7)}50%{opacity:.95; transform:scale(1)}}
  .combo{position:absolute; right:8px; top:8px; z-index:500; font-size:12px; font-weight:900; color:var(--skip);
    font-variant-numeric:tabular-nums; opacity:0; transition:opacity .2s; text-shadow:0 0 10px rgba(255,193,77,.8);}
  .combo.on{opacity:1;}

  /* 적군 기체 — 문제 텍스트는 기체 가슴의 파란 홀로 패널 안에 들어간다.
     패널은 원화 패널(가로 41%·세로 19%)보다 살짝 키운 CSS 레이어라 텍스트 길이에 맞춰 늘어난다. */
  /* z-index 는 loop() 가 y 순서대로 다시 매긴다(낮은 기체 = 위). 여긴 기본값. */
  .meteor{position:absolute; z-index:2; width:56%; max-width:208px; will-change:transform;
    opacity:.86; transition:opacity .12s;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.55));}
  /* 조준 대상(맨 아래 = 지금 풀어야 하는 문제)만 크게 — 폰에서 문제 글씨가 안 읽혔다.
     ⛔ `.meteor` 에 직접 scale 을 걸지 말 것. 그 transform 은 loop() 가 좌표로 쓰고 whack 연출이
        키프레임으로 통째로 덮어써서, 얻어맞는 순간 크기가 튄다. 안쪽 `.body` 만 키운다 —
        바깥 상자(offsetWidth/Height)는 그대로라 낙하·차간거리·착지 판정이 하나도 안 흔들린다.
     ⚠️ 기준점은 **아래 가운데**다. 위로만 자라야 방어선에 닿는 순간이 안 달라진다.
     ⚠️ 배율은 여기가 단일 출처다 — JS 가 `--target-scale` 을 읽어 연출 좌표·스폰 여백에 쓴다. */
  :root{--target-scale:1.25;}
  .meteor .body{position:relative; transform:scale(1); transform-origin:50% 100%;
    transition:transform .18s cubic-bezier(.2,1.2,.4,1);}
  .meteor.target .body{transform:scale(var(--target-scale));}
  .meteor .ship{display:block; width:100%; height:auto; aspect-ratio:536/381; pointer-events:none;}
  .meteor .screen{position:absolute; left:50%; top:59%; transform:translate(-50%,-50%);
    width:76%; min-height:33%; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:6px 9px 13px; border-radius:12px; overflow:hidden;
    background:linear-gradient(180deg,#2f537e,#1e3d6c 55%,#152e55);
    border:2px solid #cfefff;
    box-shadow:0 0 10px rgba(0,190,255,.75), inset 0 0 16px rgba(0,150,255,.4);
    color:#f2fbff; font-size:12.5px; font-weight:800; line-height:1.32; letter-spacing:-.015em;
    text-shadow:0 1px 3px rgba(0,12,36,.9);}
  .meteor.long .screen{font-size:11.5px; line-height:1.3;}
  .meteor .flashred{position:absolute; inset:0; background:var(--bad); opacity:0; pointer-events:none;}
  /* 조준됨 = 시안 락온 글로우 */
  .meteor.target{opacity:1; filter:drop-shadow(0 0 10px rgba(37,215,255,.95)) drop-shadow(0 0 24px rgba(37,215,255,.55));}
  .meteor.target .screen{border-color:#eaffff; box-shadow:0 0 16px rgba(37,215,255,.95), inset 0 0 18px rgba(0,180,255,.5);}
  /* 쉴드라인 근접 = 적색 경보 */
  .meteor.near{animation:alarm .62s ease-in-out infinite;}
  .meteor.near .screen{border-color:#ffd0d6; background:linear-gradient(180deg,#7a2436,#5a1626 55%,#42101c);
    box-shadow:0 0 14px rgba(255,60,90,.85), inset 0 0 16px rgba(255,60,90,.4);}
  @keyframes alarm{0%,100%{filter:drop-shadow(0 0 8px rgba(255,60,90,.75))}50%{filter:drop-shadow(0 0 20px rgba(255,60,90,1))}}
  .meteor.target.near{animation:alarm .38s ease-in-out infinite;}
  .meteor.hit{animation:pop .3s forwards;}
  @keyframes pop{0%{filter:brightness(1.8) drop-shadow(0 0 18px rgba(120,230,255,1))}100%{opacity:0;}}
  .meteor.blowred{animation:blowred .34s forwards;}
  @keyframes blowred{0%{filter:brightness(2) saturate(1.7) drop-shadow(0 0 20px rgba(255,60,90,1))}100%{opacity:0;}}
  .meteor.whack{animation:whack .5s cubic-bezier(.3,.9,.3,1);}
  @keyframes whack{0%{filter:none;}12%{filter:brightness(1.9) saturate(1.6);}100%{filter:none;}}
  .meteor.whack .flashred{animation:frd .5s ease-out;}
  @keyframes frd{0%{opacity:.65}100%{opacity:0}}
  .meteor.doomed{filter:grayscale(.85) brightness(.7); opacity:.75;}

  .missword{position:absolute; z-index:400; font-size:20px; font-weight:900; color:#ff6d84;
    text-shadow:0 0 12px rgba(255,60,90,.95),0 2px 4px rgba(0,0,0,.8); pointer-events:none;
    transform:translate(-50%,-50%) scale(.6); animation:missw .7s cubic-bezier(.2,1.5,.4,1) forwards;}
  @keyframes missw{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.5) rotate(-8deg);}
    22%{opacity:1; transform:translate(-50%,-90%) scale(1.15) rotate(-8deg);}
    100%{opacity:0; transform:translate(-50%,-150%) scale(1) rotate(-8deg);}
  }
  .scoreword{position:absolute; z-index:400; font-weight:900; font-size:19px; color:#63ffc8;
    text-shadow:0 0 12px rgba(60,224,168,.9),0 2px 4px rgba(0,0,0,.8); pointer-events:none; white-space:nowrap;
    transform:translate(-50%,-50%); animation:scorew .7s cubic-bezier(.2,1.4,.4,1) forwards;}
  .scoreword.partial{color:#9fb0e0; text-shadow:0 0 10px rgba(120,150,220,.6),0 2px 4px rgba(0,0,0,.8);}
  .scoreword small{font-size:12px; font-weight:800; opacity:.85;}
  @keyframes scorew{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.6);}
    25%{opacity:1; transform:translate(-50%,-95%) scale(1.1);}
    100%{opacity:0; transform:translate(-50%,-160%) scale(1);}
  }
  .failword{position:absolute; z-index:400; text-align:center; font-size:23px; font-weight:900; color:#ff6d84;
    text-shadow:0 0 14px rgba(255,60,90,.95),0 2px 5px rgba(0,0,0,.85); pointer-events:none; white-space:nowrap;
    transform:translate(-50%,-50%); animation:failw 1.1s cubic-bezier(.2,1.4,.4,1) forwards;}
  .failword small{display:block; font-size:12.5px; font-weight:800; color:#bcd0ff; text-shadow:0 2px 5px rgba(0,0,0,.85); margin-top:3px;}
  @keyframes failw{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.5);}
    18%{opacity:1; transform:translate(-50%,-82%) scale(1.15);}
    80%{opacity:1; transform:translate(-50%,-96%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-124%) scale(1);}
  }

  /* 레이저 — 원화 세로 빔을 가로로 눕혀 내보낸 스프라이트. 길이만 늘리고 두께 고정 */
  .laser{position:absolute; z-index:150; height:20px; transform-origin:0 50%; pointer-events:none;
    background:url(shoot-cari-laser.webp) center/100% 100% no-repeat;
    filter:drop-shadow(0 0 10px rgba(120,70,255,.9));
    animation:laser .24s ease-out forwards;}
  @keyframes laser{0%{opacity:1}70%{opacity:.9}100%{opacity:0}}
  .debris{position:absolute; z-index:3; border-radius:2px; pointer-events:none;
    background:linear-gradient(160deg,#a9ecff,#3d7bff); box-shadow:0 0 7px rgba(90,200,255,.9);}
  .debris.red{background:linear-gradient(160deg,#ffb3a0,#ff3b5c); box-shadow:0 0 7px rgba(255,70,95,.9);}

  /* 쉴드라인 — 여기까지 내려오면 하트 손실. CARI 머리 위 방어선 */
  .danger-line{position:absolute; left:-3%; right:-3%; z-index:1; height:16px; margin-top:-8px;
    background:url(shoot-cari-shield.webp) center/100% 100% no-repeat;
    animation:shieldPulse 2.4s ease-in-out infinite; pointer-events:none;}
  @keyframes shieldPulse{
    0%,100%{opacity:.8; filter:drop-shadow(0 0 8px rgba(0,190,255,.65));}
    50%{opacity:1; filter:drop-shadow(0 0 18px rgba(0,235,255,.95));}
  }

  /* CARI — 그리드 지평선 위에 엎드려 사격 */
  .cari{position:absolute; left:50%; bottom:2px; transform:translateX(-50%); z-index:200;
    width:98px; height:98px; transition:transform .08s; pointer-events:none;
    filter:drop-shadow(0 0 16px rgba(80,160,255,.5));}
  .cari::before{content:""; position:absolute; left:50%; bottom:-4px; transform:translateX(-50%);
    width:150%; height:30px; border-radius:50%; z-index:-1;
    background:radial-gradient(50% 50% at 50% 50%, rgba(110,215,255,.55), rgba(110,215,255,0) 70%);}
  .cari .sprite{display:block; width:100%; height:100%; object-fit:contain; object-position:center bottom;}
  .cari.fire{transform:translateX(-50%) translateY(1px) scale(1.03);}
  .cari.fire .sprite{filter:brightness(1.25) saturate(1.1) drop-shadow(0 0 10px rgba(140,220,255,.9));}

  /* CHOICES */
  /* 보기바 = 프레임 이미지. 패딩은 베젤 두께(원본 좌우95·상40·하48 → 448폭 기준 30/15/18)에 맞췄다. */
  .choicebar{position:relative; display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; align-content:center;
    margin:2px 6px calc(6px + env(safe-area-inset-bottom));
    /* 높이 고정 — 로딩 문구 한 줄일 때 프레임이 쪼그라들지 않게. 패딩도 %로 바꿔 폭이 달라져도 비율 유지 */
    aspect-ratio:1000/302; padding:3.35% 6.7% 4.02%;
    z-index:7;}
  /* 프레임은 그릇이라 한 단계 죽인다 — 안 그러면 베젤 하이라이트(밝기 237)가 버튼보다 밝다.
     버튼에 filter 가 상속되지 않도록 ::before 로 분리. */
  .choicebar::before{content:""; position:absolute; inset:0; z-index:-1;
    background:url(shoot-cari-qbox.webp) center/100% 100% no-repeat;
    filter:brightness(.78) saturate(.9) drop-shadow(0 6px 18px rgba(0,0,0,.55));}
  .choicebar .loading{grid-column:1/-1; display:flex; align-items:center; justify-content:center; gap:9px;
    min-height:56px; color:var(--sub); font-weight:800; font-size:14px; animation:lpulse 1.1s ease-in-out infinite;}
  .choicebar .loading .dot{width:8px;height:8px;border-radius:50%;background:var(--neon);
    box-shadow:0 0 10px rgba(37,215,255,.9); animation:lpulse 1.1s ease-in-out infinite;}
  @keyframes lpulse{0%,100%{opacity:.5}50%{opacity:1}}
  /* 보기 버튼 = 네온 바 이미지. 원본 비율(4.01:1)을 aspect-ratio 로 지켜야 배지 원이 안 찌그러진다.
     좌측 패딩 27% = 배지(폭의 ~25%)를 피한 글자 영역. */
  .choice{position:relative; display:flex; align-items:center; justify-content:center; text-align:center;
    aspect-ratio:1304/325; padding:0 6% 0 27%; border:0; border-radius:0; background:transparent;
    background-image:url(shoot-cari-choice.webp); background-size:100% 100%; background-repeat:no-repeat;
    font-size:15px; font-weight:800; line-height:1.15; color:#eaf6ff; letter-spacing:-.01em;
    text-shadow:0 1px 3px rgba(0,12,44,.9), 0 0 10px rgba(0,40,120,.6);
    cursor:pointer; transition:transform .05s, filter .12s, opacity .12s;
    filter:brightness(.88) saturate(.92);}   /* 기본은 죽여둔다 — 화면에서 제일 밝은 건 문제창이어야 한다.
       45% 아래로는 내리지 말 것: 오답 잠금(.locked, opacity .45+grayscale)과 구분이 안 된다. */
  .choice:active{transform:scale(.97); filter:brightness(1) saturate(1);}
  .choice .k{position:absolute; left:12.3%; top:50%; transform:translate(-50%,-50%);
    width:auto; height:auto; background:none; box-shadow:none; border-radius:0;
    color:#fff; font-size:15px; font-weight:900; font-variant-numeric:tabular-nums;
    text-shadow:0 0 9px rgba(140,225,255,1), 0 1px 2px rgba(0,20,60,.95);}
  @media (max-width:400px){ .choice{font-size:13px;} .choice .k{font-size:13.5px;} }
  /* 상태는 이미지째로 색을 돌린다(흰 글자는 hue-rotate 영향 없음) */
  .choice.wrong{filter:hue-rotate(152deg) saturate(1.6);}
  .choice.right{filter:hue-rotate(-104deg) saturate(1.5) brightness(1.12);}
  .choice.locked{opacity:.45; pointer-events:none; text-decoration:line-through; filter:grayscale(.8) brightness(.75);}
  .choice.wrong.locked{opacity:.55; filter:hue-rotate(152deg) saturate(1.4) brightness(.72);}
  .choicebar.cool{pointer-events:none;}
  .choicebar.cool .choice:not(.locked){opacity:.55; transition:opacity .1s;}

  .flash{position:absolute; inset:0; z-index:300; background:var(--bad); opacity:0; pointer-events:none;}
  .flash.on{animation:fl .34s;}
  @keyframes fl{0%{opacity:.38}100%{opacity:0}}
  .heartshard{position:absolute; z-index:30; font-size:12px; color:#ff4060; pointer-events:none;
    text-shadow:0 0 6px rgba(255,60,90,.9);}
  .shake{animation:shk .28s;}
  @keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}}

  /* OVERLAY */
  .overlay{position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:26px;
    background:radial-gradient(120% 80% at 50% 30%, rgba(20,8,64,.86), rgba(3,1,18,.94));
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
  .overlay.hidden{display:none;}
  /* 인트로·아웃트로 전용 배경(HUD 프레임 + 하단 홀로그램 단상). 프레임이 잘리지 않게 늘려서 채운다 */
  .overlay.intro, .overlay.outro{background:url(shoot-cari-panelbg.webp) center/100% 100% no-repeat;
    backdrop-filter:none; -webkit-backdrop-filter:none;}
  .overlay p{color:var(--sub); font-size:14px; font-weight:600; line-height:1.6; margin:2px 0; max-width:300px;}
  /* CTA — 이미지 버튼. 눌림은 같은 모양의 어두운 컷으로 교체해 실제로 눌린 느낌을 준다 */
  .btn{display:grid; place-items:center; width:min(70%,252px); aspect-ratio:1718/364;
    padding:0; border:0; border-radius:0; cursor:pointer; box-shadow:none;

  /* 인트로(타이틀) */

  .intro-mascot{width:min(72%,284px); aspect-ratio:1/1; object-fit:contain;

  /* 규칙 3줄을 텍스트창 한 장 안에. 패딩은 폭 기준(%)이라 베젤 두께를 폭 비율로 환산했다.

  .ir-ic.aim{background:linear-gradient(140deg,#00b4ff,#0060ff); box-shadow:0 0 10px rgba(0,150,255,.6);}
  .ir-ic.hit{background:linear-gradient(140deg,#3ce0a8,#12a97a); box-shadow:0 0 10px rgba(60,224,168,.5);}
  .ir-ic.dn{background:linear-gradient(140deg,#ff6d84,#e02646); box-shadow:0 0 10px rgba(255,60,90,.5);}

  /* 게임오버 */
  .over-mascot{width:min(62%,206px); aspect-ratio:1/1; object-fit:contain; margin:0 0 2px;
    filter:drop-shadow(0 0 26px rgba(90,170,255,.45)); animation:tPop .5s cubic-bezier(.2,1.6,.4,1) both;}
  .over-emoji{font-size:60px; margin:8px 0 10px; animation:tPop .5s cubic-bezier(.2,1.6,.4,1) both;}

  /* 아웃트로 점수판 — 원본 비율 1.09:1, 베젤(좌5.8·우7·상하8%) 안쪽에 내용을 세운다 */
  .over-scorebox{width:min(47%,172px); aspect-ratio:832/762; margin-bottom:16px; padding:9% 6% 9.5%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;

  .os-new{margin-top:4px; font-size:13px; font-weight:800; color:var(--good); text-shadow:0 0 10px rgba(60,224,168,.7);}
  .over-stats{display:flex; justify-content:center; gap:9px; width:100%; max-width:348px; margin-bottom:16px;}
  .ost{flex:1 1 0; max-width:100px; aspect-ratio:832/762; padding:9% 5% 9.5%;

    border:0; border-radius:0; box-shadow:none;
    filter:drop-shadow(0 5px 14px rgba(0,0,0,.45));}
  .ost-k{font-size:12px; color:#b9c8f2; letter-spacing:-.01em; font-weight:800; white-space:nowrap;}
  .ost-v{font-size:24px; font-weight:900; color:#dff0ff; font-variant-numeric:tabular-nums; line-height:1.1;}

  /* 남은 기회 — 조준 여부와 무관하게 표시(2칸 = 오답 2번째에 아웃) */
  .meteor .tries{position:absolute; left:0; right:0; bottom:4px; display:flex; justify-content:center; gap:4px;}
  .meteor .tries i{width:15px; height:3px; border-radius:2px; background:#7bf0ff;
    box-shadow:0 0 6px rgba(37,215,255,.9); transition:background .15s, box-shadow .15s;}
  .meteor .tries i.off{background:#ff4d6a; box-shadow:0 0 7px rgba(255,77,106,.95);}
  /* 첫 오답 = 경고 상태(다음에 틀리면 아웃) */
  .meteor.warn .screen{border-color:#ffd98a; box-shadow:0 0 14px rgba(255,190,80,.85), inset 0 0 16px rgba(255,160,40,.35);}
  /* 아웃 = 반격 태세. 정답을 패널에 띄우고 붉게 달아오른다 */
  .meteor.retaliate{opacity:1; animation:retal .22s ease-out both;}
  @keyframes retal{0%{filter:none}100%{filter:brightness(1.5) saturate(1.5) drop-shadow(0 0 22px rgba(255,60,60,1))}}
  .meteor .screen.reveal{border-color:#ffe08a; background:linear-gradient(180deg,#7d2130,#5a1220 55%,#3d0b16);
    box-shadow:0 0 20px rgba(255,70,70,.95), inset 0 0 18px rgba(255,60,60,.45);
    color:#ffe9a8; font-size:15px; letter-spacing:0;}
  .meteor .screen.reveal .ans-lab{display:inline-block; margin-right:6px; padding:1px 7px; border-radius:6px;
    background:rgba(255,224,138,.2); color:#ffd06a; font-size:10.5px; font-weight:900; letter-spacing:.08em;
    vertical-align:middle;}
  /* 적이 쏘는 빔 — 아군 레이저 스프라이트(shoot-cari-laser.webp)를 filter 로 붉게 태워 재사용한다.
     별도 에셋 없음. 색을 바꾸려면 아래 sepia/hue-rotate 값만 만지면 된다. */
  .laser.foe{height:24px; filter:sepia(1) saturate(7) hue-rotate(-18deg) brightness(1.12) drop-shadow(0 0 14px rgba(255,70,40,.95));
    animation:laserFoe .34s ease-out forwards;}
  @keyframes laserFoe{0%{opacity:0}12%{opacity:1}75%{opacity:.95}100%{opacity:0}}
  /* 쉴드 피격 — 임시: 쉴드라인 자체를 붉게 태우고 충격파를 얹는다.
     전용 에셋이 오면 .shieldburst 의 background 를 url(shoot-cari-shield-hit.webp) 로 교체. */
  .danger-line.hit{animation:shieldHit .52s ease-out;}
  @keyframes shieldHit{
    0%{filter:hue-rotate(160deg) saturate(2.4) brightness(1.7) drop-shadow(0 0 26px rgba(255,60,50,1)); transform:scaleY(1.7);}
    55%{filter:hue-rotate(160deg) saturate(1.8) brightness(1.2) drop-shadow(0 0 14px rgba(255,80,60,.8)); transform:scaleY(1.15);}
    100%{filter:none; transform:scaleY(1);}
  }
  .shieldburst{position:absolute; z-index:160; width:150px; height:150px; margin:-75px 0 0 -75px; pointer-events:none;
    background:radial-gradient(circle, rgba(255,247,220,.98) 0%, rgba(255,170,60,.85) 22%, rgba(255,50,60,.55) 45%, rgba(255,40,60,0) 72%);
    animation:sburst .5s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes sburst{0%{transform:scale(.25); opacity:1}60%{opacity:.9}100%{transform:scale(1.6); opacity:0}}
  /* CARI 피격 — 충격에 뒤로 밀리며 붉게 */
  .cari.hurt{animation:cariHurt .48s cubic-bezier(.3,.8,.3,1);}
  @keyframes cariHurt{
    0%{transform:translateX(-50%) translateY(0) scale(1);}
    18%{transform:translateX(-50%) translateY(7px) scale(.94) rotate(-4deg); filter:brightness(1.6) sepia(1) hue-rotate(-35deg) saturate(3);}
    55%{transform:translateX(-50%) translateY(2px) scale(1.01) rotate(2deg);}
    100%{transform:translateX(-50%) translateY(0) scale(1);}
  }
  /* 아웃일 때 정답 보기 강조 */
  /* 아웃일 때 정답 보기 강조 — 잠금/취소선을 이기고 초록으로 */
  .choice.right, .choice.right.locked{text-decoration:none!important; opacity:1!important;
    filter:hue-rotate(-104deg) saturate(1.6) brightness(1.15)!important;}
  /* 격추 폭발 — 발광체라 screen 합성으로 얹는다(검은 여백 없이 빛만 남는다) */
  .boom{position:absolute; z-index:250; pointer-events:none; mix-blend-mode:screen;
    background:url(shoot-cari-boom.webp) center/contain no-repeat;
    transform:translate(-50%,-50%) scale(.3); opacity:0;
    animation:boom .42s cubic-bezier(.2,.85,.4,1) forwards;}
  @keyframes boom{
    0%{transform:translate(-50%,-50%) scale(.35); opacity:0;}
    14%{transform:translate(-50%,-50%) scale(.88); opacity:1;}
    48%{transform:translate(-50%,-50%) scale(1.02); opacity:.92;}
    100%{transform:translate(-50%,-50%) scale(1.16); opacity:0;}
  }
  .hidden{display:none!important;}
</style>

<script>
const mem={};
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} mem[k]=v;}
function load(k,d){if(k in mem)return mem[k]; try{const v=localStorage.getItem(k); if(v!=null)return JSON.parse(v);}catch(e){} return d;}

// [용어, 정의, 카테고리]
let POOL=[
  ["인공지능","컴퓨터가 인간처럼 학습·추론하며 문제를 해결하는 기술","AI"],
  ["머신러닝","데이터로부터 규칙·패턴을 스스로 학습해 성능을 개선","AI"],
  ["딥러닝","여러 층의 신경망으로 복잡한 패턴을 학습하는 기법","AI"],
  ["신경망","뉴런 구조를 모방해 입력·가중치를 연산해 출력을 만듦","AI"],

  ["강화학습","환경과 상호작용하며 보상을 최대화하도록 학습","AI"],
  ["트랜스포머","어텐션으로 단어 관계를 병렬 처리하는 신경망 구조","AI"],
  ["거대언어모델","방대한 텍스트로 학습돼 사람 같은 언어를 이해·생성","AI"],
  ["생성형AI","텍스트·이미지·음성 등 새 콘텐츠를 스스로 만들어냄","AI"],
  ["과적합","학습 데이터에 지나치게 맞춰져 새 데이터에 약함","AI"],
  ["컴퓨터비전","이미지·영상에서 객체를 인식·분류·추적","AI"],
  ["프롬프트","원하는 결과를 얻으려 AI에 넣는 지시문","AI"],
  ["액추에이터","에너지를 기계적 움직임으로 바꾸는 구동 장치","로봇"],

  ["역기구학","엔드 이펙터 위치에 맞춰 관절 각도를 계산","로봇"],
  ["SLAM","이동하며 지도를 만드는 동시에 자기 위치를 추정","로봇"],
  ["라이다","레이저 반사 시간으로 거리·형상을 파악하는 센서","로봇"],
  ["토크","회전축을 중심으로 물체를 돌리는 힘","로봇"],
  ["협동로봇","펜스 없이 사람과 함께 작업하도록 설계된 로봇","로봇"],
  ["자율주행","사람 개입 없이 스스로 인식·판단하며 주행","로봇"],
  ["피지컬AI","물리적 실체로 현실과 상호작용하는 AI","피지컬AI"],

/* 문항 갈아끼우기 — 부모(앱)가 DB 문항을 내려주면 위 POOL 을 대체한다.
   ⛔ 위 배열은 **폴백**이다. 단일 출처는 관리자 화면(term_questions)이고, 이 파일을 앱 없이
      직접 열었거나 서버가 안 열릴 때만 쓰인다 — 여기 문항을 고쳐도 서비스에는 안 나간다.
   ⚠️ 받은 문항은 이미 화면 언어로 번역돼 온다(앱이 투영해서 보낸다). */
window.addEventListener("message", function(e){
  if(e.origin !== window.location.origin) return;
  var m = e.data;
  if(!m || m.t !== "mg:pool" || !Array.isArray(m.items)) return;
  var next = m.items
    .filter(function(it){ return it && it.desc && it.answer; })
    .map(function(it){ return [it.answer, it.desc, it.field || "AI"]; });
  if(!next.length) return;
  POOL = next;
  bag = []; bagI = 0;   // 옛 문항 수로 만든 순서표를 버린다
});
function norm(s){return s.replace(/\(.*?\)/g,"").replace(/\s+/g,"").toLowerCase();}

const $=id=>document.getElementById(id);
const pit=$("pit"), cari=$("cari"), choicesEl=$("choices");
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

// 튜닝
const BASE_SPEED=26;      // px/초 (기본 낙하) — 조금 더 느리게
const SPEED_VAR=13;       // px/초 (운석별 랜덤 가감)
const LVL_SPEED=0.10;     // 레벨당 낙하 속도 +10% (완만하게)
const START_SPAWN=3000;   // ms (여유 있게 출제)
const MIN_SPAWN=1300;
const LIVES=5;
const MAX_WRONG=2;        // 운석당 허용 오답 수(초과 시 놓침=하트 손실). 1로 낮추면 무관용
// 한 줄 낙하 — 기체는 언제나 앞 기체 뒤에 줄을 선다(나란히 내려오거나 추월하지 않는다).
// ⛔ 가로 거리를 조건으로 달지 말 것. 예전엔 '가로로 겹칠 때만' 간격을 강제했는데, 기체 폭이
//    화면 폭의 56%(최대 208px)라 폰(≤390px)에서는 어차피 늘 겹쳐서 규칙이 항상 걸렸다.
//    그런데 pit 이 390px 을 넘는 순간(픽셀 412·Pro Max 430·PC 460) 좌우 끝에 하나씩 앉는 조합이
//    생기고, 그 쌍만 규칙 밖이라 나란히 내려오다 빠른 쪽이 추월했다 — 기종에 따라 게임이 달라졌다.
const PANEL_GAP=0.62;     // 문제창끼리 안 겹치는 선(기체 높이 대비)
// 조준 대상 확대 배율 — 값은 CSS(`--target-scale`)가 갖고 여기선 읽기만 한다(한 벌로 유지).
const TARGET_SCALE=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--target-scale"))||1.25;
// 실제 차간거리 — 어느 기체든 맨 아래로 내려가면 **위로** 자라므로(아래 가운데 기준 확대)
// 그만큼을 미리 비워 둬야 한다. 안 비우면 커진 기체가 바로 위 기체의 문제창을 통째로 덮는다.
const GAP_RATIO=PANEL_GAP+(TARGET_SCALE-1);

let running=false, meteors=[], lastT=0, spawnT=0, spawnGap=START_SPAWN;
let runSeq=0;             // 재시작하면 진행 중이던 연출 타이머를 전부 무효화한다
let paused=false;
let score=0, combo=0, maxCombo=0, hits=0, lives=LIVES, level=1;
let best=load("shooter_best_v1",0);
$("best").textContent=best;

let bag=[], bagI=0;
function nextQ(){ if(bagI>=bag.length){ bag=POOL.map((_,i)=>i); for(let i=bag.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[bag[i],bag[j]]=[bag[j],bag[i]];} bagI=0;} return POOL[bag[bagI++]];}

function renderLives(){
  $("lives").innerHTML=Array.from({length:LIVES},(_,i)=>`<span class="h ${i>=lives?'gone':''}"><img src="shoot-cari-heart.webp" alt="" draggable="false"/></span>`).join("");
}
function setFace(f){ $("face").textContent=f; }

function spawn(){
  const el=document.createElement("div");
  el.className="meteor"; el.style.left="0px"; el.style.top="0px"; el.style.visibility="hidden";
  // 기체 스프라이트 + 가슴 홀로 패널(문제 텍스트가 들어갈 자리)
  // `.body` = 확대되는 안쪽 겹. 바깥 `.meteor` 는 좌표·크기 판정용이라 절대 안 커진다(위 CSS 주석).
  el.innerHTML=`<div class="body"><img class="ship" src="shoot-cari-enemy.webp" alt="" draggable="false"/>`+
    `<div class="screen"><i class="flashred"></i><span></span><span class="tries">`+"<i></i>".repeat(MAX_WRONG)+`</span></div></div>`;
  pit.appendChild(el);
  const w=el.offsetWidth, h=el.offsetHeight, pw=pit.clientWidth, y0=-h;
  // 맨 위 기체가 아직 스폰 자리를 비우지 않았으면 이번 스폰은 포기(문제도 안 뽑는다).
  // 가로 위치는 안 본다 — 어차피 뒤에 줄을 서므로 옆자리를 찾아 피할 이유가 없다.
  for(const m of meteors){
    if(m.dead)continue;
    if(m.y<y0+h*GAP_RATIO){ el.remove(); return false; }
  }
  // 맨 아래로 내려가면 확대돼 좌우로 (배율-1)/2 만큼 더 넓어진다 → 그만큼 가장자리를 비워 둔다.
  // 안 비우면 정작 지금 풀어야 하는 기체의 날개가 화면 밖으로 잘린다.
  const pad=8+w*(TARGET_SCALE-1)/2;
  const x=pad+Math.random()*Math.max(0,pw-w-pad*2);
  const q=nextQ(), [term,def,cat]=q;
  // 문제 글씨만 — 위에 붙던 분야 태그(AI·로봇·피지컬AI)는 가독성 때문에 뺐다.
  el.querySelector(".screen span").textContent=def;
  if(def.length>24) el.classList.add("long");   // 긴 정의는 한 단계 작게
  el.style.visibility="";
  const m={el,term,def,cat,x,y:y0,speed:BASE_SPEED+Math.random()*SPEED_VAR};
  el.style.transform=`translate(${x}px,${m.y}px)`;
  meteors.push(m);
  return true;
}

// ---------- 객관식 조준 시스템 ----------
let curTarget=null, answerLock=false, revealLock=false;   // revealLock = 정답 공개 중(다음 조준 보류)
function makeChoices(term,cat){
  const same=shuffle(POOL.filter(p=>p[2]===cat&&p[0]!==term).map(p=>p[0]));
  const other=shuffle(POOL.filter(p=>p[0]!==term).map(p=>p[0]));
  const d=[];
  for(const t of same){ if(d.length>=3)break; if(!d.includes(t))d.push(t); }
  for(const t of other){ if(d.length>=3)break; if(!d.includes(t))d.push(t); }
  return shuffle([term,...d]);
}
function renderChoices(){
  if(!curTarget){ choicesEl.innerHTML='<div class="loading"><span class="dot"></span>'+MGI18N.t('shoot.aiming')+'</div>'; return; }
  choicesEl.innerHTML=curTarget.choices.map((o,i)=>
    `<button class="choice" data-o="${o}"><span class="k">${i+1}</span>${o}</button>`).join("");
  choicesEl.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>answerChoice(b)));
}
// 바닥에 가장 가까운 운석을 조준 대상으로
function updateTarget(){
  if(revealLock)return;            // 정답 공개 연출이 끝날 때까지 다음 문제로 안 넘어간다
  let low=null,maxY=-1e9;
  for(const m of meteors){ if(!m.dead && m.y>maxY){maxY=m.y; low=m;} }
  if(low===curTarget)return;
  // ⚠️ 격추·반격 연출 중인 기체(dead)에서는 안 뗀다 — 떼는 순간 터지는 도중에 원래 크기로
  //    쪼그라들고, 반격 때 크게 띄우는 '정답: ○○' 공개도 같이 작아진다.
  meteors.forEach(m=>{ if(!m.dead) m.el.classList.remove("target") });
  curTarget=low;
  if(curTarget){ curTarget.el.classList.add("target");
    if(!curTarget.choices) curTarget.choices=makeChoices(curTarget.term,curTarget.cat); }
  renderChoices();
}
function answerChoice(btn){
  if(paused)return;
  if(!curTarget||curTarget.dead||curTarget.doomed)return;
  if(answerLock)return;                       // 연타 방지: 한 번 답하면 잠깐 잠금
  if(btn.classList.contains("locked"))return;
  answerLock=true; choicesEl.classList.add("cool");
  setTimeout(()=>{ answerLock=false; choicesEl.classList.remove("cool"); },340);
  if(btn.dataset.o===curTarget.term){
    const t=curTarget; curTarget=null; renderChoices();
    destroy(t,true); updateTarget();
  }else{
    // 오답: 이 보기 잠금 + 오답 카운트 + 콤보 리셋
    btn.classList.add("wrong","locked");
    curTarget.miss=(curTarget.miss||0)+1;
    updateTries(curTarget);
    miss();
    if(curTarget.miss>=MAX_WRONG) doom(curTarget);   // 시도 초과 → 즉시 터짐 + 하트 손실
    else whack(curTarget);                            // 아직 기회 있음 → 얻어맞고 튕겨 내려감
  }
}
// 시도 초과: 그 자리에서 즉시 터지고 하트 손실 (오답임을 확실히 구분)
function updateTries(m){
  m.el.querySelectorAll(".tries i").forEach((el,i)=>el.classList.toggle("off", i < (m.miss||0)));
  m.el.classList.toggle("warn",(m.miss||0)>0 && !m.dead);
}
// 쉴드라인 피격 — 적 빔이 꽂히거나 적이 방어선을 넘었을 때 공통 연출
function shieldHit(x){
  const dl=$("dangerLine"), ty=parseFloat(dl.style.top||"0");
  dl.classList.remove("hit"); void dl.offsetWidth; dl.classList.add("hit");
  setTimeout(()=>dl.classList.remove("hit"),540);
  const bu=document.createElement("div"); bu.className="shieldburst";
  bu.style.left=x+"px"; bu.style.top=ty+"px"; pit.appendChild(bu);
  setTimeout(()=>bu.remove(),540);
  sparks(x,ty,16);
  $("flash").classList.remove("on"); void $("flash").offsetWidth; $("flash").classList.add("on");
  pit.classList.remove("shake"); void pit.offsetWidth; pit.classList.add("shake");
  setTimeout(()=>pit.classList.remove("shake"),300);
  cari.classList.remove("hurt"); void cari.offsetWidth; cari.classList.add("hurt");
  setTimeout(()=>cari.classList.remove("hurt"),500);
  setFace("×﹏×"); setTimeout(()=>{if(running)setFace("◡̈");},520);
  blip(70,.3,"square",.24); setTimeout(()=>blip(48,.32,"sawtooth",.2),60);
}
// 좌표 지정 불꽃
function sparks(cx,cy,n){
  for(let i=0;i<n;i++){
    const d=document.createElement("div"); d.className="debris red";
    const s=4+Math.random()*6; d.style.width=d.style.height=s+"px";
    d.style.left=cx+"px"; d.style.top=cy+"px"; pit.appendChild(d);
    const ang=-Math.PI*(0.15+Math.random()*0.7), dist=40+Math.random()*80, dur=480+Math.random()*260;
    d.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(ang)*dist}px),calc(-50% + ${Math.sin(ang)*dist}px)) scale(.3)`,opacity:0}],
      {duration:dur,easing:"cubic-bezier(.2,.6,.3,1)",fill:"forwards"});
    setTimeout(()=>d.remove(),dur+40);
  }
}
// 적이 아래로 쏘는 빔 (기체 패널 → 쉴드라인)
/* 조준 대상은 아래 가운데를 기준으로 커져 보인다(CSS `.meteor.target .body`).
   빔·폭발·파편·팝업은 상자가 아니라 **보이는 그림**에 맞아야 하므로 세로 좌표를 같이 옮긴다.
   ⚠️ 판정은 `curTarget` 이 아니라 DOM 클래스로 한다 — 정답을 맞히면 curTarget 이 먼저 비워져서
      아직 커져 있는 기체를 작다고 계산한다(폭발이 발밑에서 터진다). */
const artScale=m=>m.el.classList.contains("target")?TARGET_SCALE:1;
/** 기체 안 세로 비율 frac(0=맨 위, 1=맨 아래)이 화면에서 실제로 놓이는 y */
const artY=(m,frac)=>m.y+m.el.offsetHeight*(1-artScale(m)*(1-frac));

function foeBeam(m){
  const w=m.el.offsetWidth;
  const sx=m.x+w/2, sy=artY(m,0.55);
  const ty=parseFloat($("dangerLine").style.top||"0");
  const dx=0, dy=ty-sy, len=Math.max(20,Math.hypot(dx,dy)), ang=Math.atan2(dy,dx)*180/Math.PI;
  const l=document.createElement("div"); l.className="laser foe";
  l.style.left=sx+"px"; l.style.top=(sy-11)+"px"; l.style.width=len+"px";
  l.style.transform=`rotate(${ang}deg)`;
  pit.appendChild(l); setTimeout(()=>l.remove(),360);
  return sx;
}
// 시도 초과 = 아웃. 적이 반격한다 — 정답 공개 → 빔 → 쉴드 피격 → 하트 파괴 → 적 폭발
function doom(m){
  if(m.dead)return;
  m.dead=true;
  if(m===curTarget)curTarget=null;
  const seq=runSeq, alive=()=>seq===runSeq;
  const w=m.el.offsetWidth;

  // 0ms — 패널이 정답을 공개하며 붉게 달아오른다
  m.el.classList.remove("warn"); m.el.classList.add("retaliate");
  const sc=m.el.querySelector(".screen"), sp=sc&&sc.querySelector("span");
  if(sp) sp.innerHTML=`<b class="ans-lab">${MGI18N.t('shoot.answer')}</b>${m.term}`;
  if(sc) sc.classList.add("reveal");
  m.el.querySelectorAll(".tries i").forEach(el=>el.classList.add("off"));
  const fw=document.createElement("div"); fw.className="failword"; fw.textContent=MGI18N.t('shoot.miss');
  fw.style.left=(m.x+w/2)+"px"; fw.style.top=artY(m,0.06)+"px"; pit.appendChild(fw);
  setTimeout(()=>fw.remove(),1100);
  // 정답 보기 강조 + 공개 동안 선택지 잠금
  revealLock=true; choicesEl.classList.add("cool");
  const rb=[...choicesEl.querySelectorAll(".choice")].find(x=>x.dataset.o===m.term);
  if(rb){ rb.classList.remove("locked"); rb.classList.add("right"); }
  blip(150,.16,"square",.16);

  // 240ms — 적이 아래로 빔 발사
  setTimeout(()=>{ if(!alive())return; const bx=foeBeam(m); blip(240,.2,"sawtooth",.2);
    // 440ms — 쉴드 피격
    setTimeout(()=>{ if(!alive())return; shieldHit(bx);
      // 520ms — 하트 파괴
      setTimeout(()=>{ if(!alive())return; loseHeart();
        if(lives<=0) setTimeout(()=>{ if(alive()) gameOver(); },600);
      },80);
    },200);
  },240);

  // 760ms — 적 폭발 후 제거
  setTimeout(()=>{ if(!alive())return;
    m.el.classList.add("blowred"); debrisRed(m,20);
    setTimeout(()=>{ m.el.remove(); meteors=meteors.filter(x=>x!==m); },340);
  },760);

  // 900ms — 다음 문제로
  setTimeout(()=>{ if(!alive())return;
    revealLock=false; choicesEl.classList.remove("cool"); renderChoices(); updateTarget();
  },900);
}
// 빨간 파편
function debrisRed(m,n){
  const w=m.el.offsetWidth, cx=m.x+w/2, cy=artY(m,0.55);
  for(let i=0;i<n;i++){
    const d=document.createElement("div"); d.className="debris red";
    const s=4+Math.random()*6; d.style.width=d.style.height=s+"px";
    d.style.left=cx+"px"; d.style.top=cy+"px"; pit.appendChild(d);
    const vx=(Math.random()*2-1)*120, up=(Math.random()*2-1)*60+20, dur=500+Math.random()*260;
    d.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},
      {transform:`translate(calc(-50% + ${vx}px),${up}px) scale(.4)`,opacity:0}],
      {duration:dur,easing:"cubic-bezier(.2,.5,.4,1)",fill:"forwards"});
    setTimeout(()=>d.remove(),dur+40);
  }
}
// 하트 하나 크게 부서지며 감소
function loseHeart(){
  const livesEl=$("lives");
  const hearts=livesEl.querySelectorAll(".h");
  const idx=lives-1;
  lives--;
  livesEl.classList.remove("hitwrap"); void livesEl.offsetWidth; livesEl.classList.add("hitwrap");
  setTimeout(()=>livesEl.classList.remove("hitwrap"),520);
  if(hearts[idx]){
    hearts[idx].classList.add("breaking");
    heartShards(hearts[idx]);
    setTimeout(()=>renderLives(),560);
  }else renderLives();
}
// 부서진 하트 파편이 사방으로 튐
function heartShards(el){
  const stage=$("stage"), sr=stage.getBoundingClientRect(), hr=el.getBoundingClientRect();
  const cx=hr.left-sr.left+hr.width/2, cy=hr.top-sr.top+hr.height/2;
  for(let i=0;i<11;i++){
    const s=document.createElement("div"); s.className="heartshard"; s.textContent="♥";
    s.style.left=cx+"px"; s.style.top=cy+"px"; stage.appendChild(s);
    const ang=Math.PI*2*i/11+Math.random()*.5, dist=28+Math.random()*46, dur=540+Math.random()*280;
    s.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(ang)*dist}px),calc(-50% + ${Math.sin(ang)*dist}px)) scale(.3) rotate(${(Math.random()*2-1)*120}deg)`,opacity:0}],
      {duration:dur,easing:"cubic-bezier(.2,.6,.3,1)",fill:"forwards"});
    setTimeout(()=>s.remove(),dur+40);
  }
}

// 운석이 얻어맞고 위로 튕겼다가 쿵 떨어지는 반동 연출
function whack(m){
  if(m.animating)return;
  const w=m.el.offsetWidth, hh=m.el.offsetHeight, ph=pit.clientHeight;
  const guard=Math.max(60,(cari.getBoundingClientRect().top-pit.getBoundingClientRect().top)-6);
  const knock=Math.min(0.20, 0.07+(level-1)*0.012);   // 레벨 오를수록 낙하폭 증가
  const y0=m.y;
  let y1=Math.min(guard-hh-4, y0 + ph*knock);
  // 아래 기체를 파고들지 않게 도착점 제한(그래도 최소한 제자리, 위로는 안 감).
  // 여기도 가로 거리를 보지 않는다 — 얻어맞고 내려가다 옆줄 기체를 추월하면 안 된다.
  for(const b of meteors){
    if(b===m||b.dead)continue;
    if(b.y>y0) y1=Math.min(y1, b.y - hh*GAP_RATIO);
  }
  y1=Math.max(y0,y1);
  m.animating=true; m.el.classList.remove("whack"); void m.el.offsetWidth; m.el.classList.add("whack");
  // MISS! 팝업
  const mw=document.createElement("div"); mw.className="missword"; mw.textContent="MISS!";
  mw.style.left=(m.x+w/2)+"px"; mw.style.top=artY(m,0.42)+"px"; pit.appendChild(mw);
  setTimeout(()=>mw.remove(),720);
  debrisAt(m);
  pit.classList.remove("shake"); void pit.offsetWidth; pit.classList.add("shake");
  setTimeout(()=>pit.classList.remove("shake"),260);
  // 반동 곡선: 살짝 위로 → 아래로 쿵 → 잔반동
  const a=m.el.animate([
    {transform:`translate(${m.x}px,${y0}px)`,             offset:0},
    {transform:`translate(${m.x-3}px,${y0-20}px)`,        offset:.26},
    {transform:`translate(${m.x+2}px,${y1+8}px)`,         offset:.70},
    {transform:`translate(${m.x}px,${y1-3}px)`,           offset:.86},
    {transform:`translate(${m.x}px,${y1}px)`,             offset:1}
  ],{duration:480, easing:"cubic-bezier(.3,.7,.25,1)"});
  a.onfinish=()=>{ m.y=y1; m.animating=false; m.el.classList.remove("whack");
    m.el.style.transform=`translate(${m.x}px,${y1}px)`; };
}

function laserTo(m){
  const cr=cari.getBoundingClientRect(), pr=pit.getBoundingClientRect();
  const cx=(cr.left-pr.left)+cr.width*0.63, cy=(cr.top-pr.top)+cr.height*0.13;  // 스프라이트 총구 화염 위치
  const w=m.el.offsetWidth;
  const tx=m.x+w/2, ty=artY(m,0.55);   // 조준점 = 기체 패널 중심(확대분 반영)
  const dx=tx-cx, dy=ty-cy, len=Math.hypot(dx,dy), ang=Math.atan2(dy,dx)*180/Math.PI;
  const l=document.createElement("div"); l.className="laser";
  l.style.left=cx+"px"; l.style.top=(cy-10)+"px"; l.style.width=len+"px";  // height 20px 의 절반만큼 올려 중심 정렬
  l.style.transform=`rotate(${ang}deg)`;
  pit.appendChild(l); setTimeout(()=>l.remove(),240);
  cari.classList.add("fire"); setTimeout(()=>cari.classList.remove("fire"),120);
}

// 격추 폭발 — 기체 패널 중심에서 터진다
function boom(m){
  const w=m.el.offsetWidth, size=w*artScale(m);   // 커진 기체는 폭발도 같이 커야 그림에 안 묻힌다
  const el=document.createElement("div"); el.className="boom";
  el.style.width=el.style.height=size+"px";
  el.style.left=(m.x+w/2)+"px"; el.style.top=artY(m,0.55)+"px";
  pit.appendChild(el);
  setTimeout(()=>el.remove(),500);
}
function debrisAt(m,n=9){
  const w=m.el.offsetWidth, cx=m.x+w/2, cy=artY(m,0.55);
  for(let i=0;i<n;i++){
    const d=document.createElement("div"); d.className="debris";
    const s=4+Math.random()*5; d.style.width=d.style.height=s+"px";
    d.style.left=cx+"px"; d.style.top=cy+"px"; pit.appendChild(d);
    const vx=(Math.random()*2-1)*90, up=30+Math.random()*70, dur=500+Math.random()*200;
    d.animate([{transform:"translate(-50%,-50%)",opacity:1},
      {transform:`translate(calc(-50% + ${vx}px),${up}px)`,opacity:0}],
      {duration:dur,easing:"cubic-bezier(.2,.5,.4,1)",fill:"forwards"});
    setTimeout(()=>d.remove(),dur+40);
  }
}

function destroy(m,byPlayer){
  m.dead=true;
  if(byPlayer){
    laserTo(m); boom(m); debrisAt(m);
    const w=m.miss||0;
    const factor = w===0?1 : w===1?0.6 : w===2?0.3 : 0.1;
    if(w===0){ combo++; maxCombo=Math.max(maxCombo,combo); }  // 무오답만 콤보 상승
    hits++;
    const comboMul = w===0 ? Math.max(1,Math.min(5,1+Math.floor(combo/3))) : 1;
    const gain = Math.max(1,Math.round(20*factor*comboMul));
    score+=gain; $("score").textContent=score;
    scorePop(m, gain, factor);
    if(w===0){
      $("combo").textContent="COMBO x"+combo; $("combo").classList.add("on");
      clearTimeout(combo._t); combo._t=setTimeout(()=>$("combo").classList.remove("on"),900);
      setFace(combo>=4?"◕‿◕":"◡̈"); setTimeout(()=>setFace("◡̈"),300);
    }
    blip(660,.06,"triangle",.16); blip(990,.05,"sine",.1);
    // 레벨업: 속도 + (whack에서 낙하폭도) 함께 상승
    const nl=1+Math.floor(score/160);
    if(nl>level){ level=nl; spawnGap=Math.max(MIN_SPAWN,START_SPAWN-(level-1)*130); $("spd").textContent="x"+(1+(level-1)*LVL_SPEED).toFixed(1);}
  }
  m.el.classList.add("hit");
  setTimeout(()=>{ m.el.remove(); meteors=meteors.filter(x=>x!==m); },320);
}

// 획득 점수 팝업 (무오답이면 초록, 감점되면 회색+%)
function scorePop(m, gain, factor){
  const w=m.el.offsetWidth;
  const p=document.createElement("div"); p.className="scoreword"+(factor<1?" partial":"");
  p.innerHTML= factor<1 ? `+${gain} <small>${Math.round(factor*100)}%</small>` : `+${gain}`;
  p.style.left=(m.x+w/2)+"px"; p.style.top=artY(m,0.42)+"px"; pit.appendChild(p);
  setTimeout(()=>p.remove(),720);
}

function miss(){
  combo=0; $("combo").classList.remove("on");
  choicesEl.classList.remove("shake"); void choicesEl.offsetWidth; choicesEl.classList.add("shake");
  setTimeout(()=>choicesEl.classList.remove("shake"),300);
  setFace("•︿•"); setTimeout(()=>setFace("◡̈"),260);
  blip(180,.08,"sawtooth",.12);
}

// 방어선 돌파(놓침) — 적이 쉴드에 그대로 꽂힌다
function land(m){
  if(m===curTarget)curTarget=null;
  const bx=m.x+m.el.offsetWidth/2;
  m.dead=true; m.el.remove(); meteors=meteors.filter(x=>x!==m);
  shieldHit(bx);
  loseHeart(); combo=0;
  if(lives<=0) setTimeout(gameOver,500);
}

function loop(t){
  if(!running||paused)return;
  const dt=Math.min(40,t-lastT); lastT=t;
  const ph=pit.clientHeight;
  const _cr=cari.getBoundingClientRect(), _pr=pit.getBoundingClientRect();
  const floorY=Math.max(60,(_cr.top-_pr.top)-6);   // 캐릭터 상단 = 요격/실패 라인 (관통 방지)
  $("dangerLine").style.top=floorY+"px";

  spawnT+=dt;
  if(spawnT>=spawnGap && spawn()) spawnT=0;   // 자리 없으면 다음 프레임에 다시 시도

  const speedMul=1+(level-1)*LVL_SPEED;
  // 낮은(=조준 대상에 가까운) 기체부터 처리한다. 위 기체는 이미 확정된 아래 기체 위치를 보고 감속한다.
  const order=meteors.filter(m=>!m.dead).sort((a,b)=>b.y-a.y);
  const settled=[];
  for(let i=0;i<order.length;i++){
    const m=order[i];
    if(!m.animating){
      const h=m.el.offsetHeight;
      let step=m.speed*speedMul*dt/1000;
      // 차간거리: 아래 기체를 침범/추월하지 못하게 감속(위로 되돌리진 않는다).
      // 가로 거리와 무관하다 — 옆으로 멀리 떨어져 있어도 줄을 선다.
      let limit=Infinity;
      for(const b of settled){
        if(b.dead)continue;
        limit=Math.min(limit, b.y - h*GAP_RATIO);
      }
      if(limit<Infinity) step=Math.min(step, Math.max(0, limit-m.y));
      m.y += step;
    }
    const near=(m.y+m.el.offsetHeight) > floorY-70;
    m.el.classList.toggle("near",near);
    m.el.style.transform=`translate(${m.x}px,${m.y}px)`;
    m.el.style.zIndex=String(140-i);   // 낮은 기체일수록 위 → 조준 대상 문제창이 절대 안 가림
    if(m.y + m.el.offsetHeight >= floorY){ land(m); }
    settled.push(m);
  }
  updateTarget();
  requestAnimationFrame(loop);
}

// 오디오
let ac;
function blip(f,d,type="sine",v=.15){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
  o.start();o.stop(ac.currentTime+d);}catch(e){}}

function start(){
  runSeq++;                                   // 이전 판의 연출 타이머 무효화
  revealLock=false; choicesEl.classList.remove("cool");
  meteors.forEach(m=>m.el.remove()); meteors=[];
  score=0;combo=0;maxCombo=0;hits=0;lives=LIVES;level=1;spawnGap=START_SPAWN;spawnT=START_SPAWN-500;
  $("score").textContent=0; $("spd").textContent="x1.0"; $("combo").classList.remove("on");
  renderLives(); setFace("◡̈");
  curTarget=null; renderChoices();
  $("startOv").classList.add("hidden"); $("overOv").classList.add("hidden");
  paused=false; $("pauseOv").classList.add("hidden");
  running=true; lastT=performance.now(); requestAnimationFrame(loop);
}
function gameOver(){
  running=false;
  const nb=score>best;
  if(window.MGBridge) MGBridge.submit(score); // 랭킹: 점수형
  if(nb){best=score; save("shooter_best_v1",best); $("best").textContent=best;}
  $("finalScore").textContent=score; $("finalHits").textContent=hits;
  $("finalScore").classList.toggle("sm", String(score).length>4);
  $("finalCombo").textContent=maxCombo; $("finalBest").textContent=best;
  $("newbest").classList.toggle("hidden",!nb);
  setTimeout(()=>$("overOv").classList.remove("hidden"),400);
}

// 숫자키 1~4로도 선택
window.addEventListener("keydown",e=>{
  if(paused){ if(e.key==="Enter"||e.code==="Space"){ e.preventDefault(); resumeGame(); } return; }
  if(!running)return;
  if(e.repeat)return;                          // 키 홀드(자동 반복) 무시
  if(e.key>="1"&&e.key<="4"){ const i=+e.key-1; const btns=choicesEl.querySelectorAll(".choice");
    if(btns[i]){ e.preventDefault(); answerChoice(btns[i]); } }
});
$("startBtn").addEventListener("click",start);
$("againBtn").addEventListener("click",start);
function pauseGame(){ if(!running||paused)return; paused=true; $("pauseOv").classList.remove("hidden"); }
function resumeGame(){ if(!paused)return; paused=false; $("pauseOv").classList.add("hidden"); lastT=performance.now(); requestAnimationFrame(loop); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pauseGame(); });
window.addEventListener("blur",pauseGame);
$("resumeBtn").addEventListener("click",resumeGame);
renderLives();
</script>

<!-- ===== 앱 브리지: 랭킹 버튼 + 점수 전송 =====
     이 HTML 은 자립형이라 세션도 supabase 클라도 없다 → 실제 제출/조회는 부모(/games/:id = MiniGame.tsx)가 한다.
     여기서는 (1) 인트로·아웃트로 우상단에 '랭킹' 버튼을 얹고, (2) 점수가 나면 postMessage 로 알리기만 한다.
     ⚠️ 이 파일을 단독으로 열면 부모가 없어 버튼도 숨고 아무것도 보내지 않는다(게임은 그대로 동작).
     ⚠️ tieMs(레벨형 동률 해소용 소요시간)는 인트로에서 시작을 누른 시점부터 잰다. '처음으로'로 되돌아가
       인트로를 다시 거치지 않으면 계속 누적된다 — 순위 1차 키가 아니라 동률 해소용이라 그대로 둔다. -->
<style>
.mg-rank{position:absolute; top:12px; right:12px; z-index:60; display:none; align-items:center; justify-content:center;
  box-sizing:border-box; width:112px; height:34px; padding:0; border:0; cursor:pointer;
  font:850 11.5px/1 system-ui,-apple-system,sans-serif; letter-spacing:.025em; color:#fff;
  background:url("rank-button.webp") center/100% 100% no-repeat; text-shadow:0 1px 3px #001c55;
  filter:drop-shadow(0 3px 4px rgba(8,20,60,.24)); -webkit-tap-highlight-color:transparent;}
.mg-rank.on{display:inline-flex;}
/* ⚠️ 랭킹 글자는 판 정중앙(58.5%)이 아니라 **54%** 다 — 왼쪽 트로피가 시각적으로 무거워서
     기하학적 중앙에 두면 오른쪽으로 밀려 보인다. 모든 게임이 같은 값이다(2026-08-18 일괄 정렬).
     px 오프셋으로 밀지 말 것 — 버튼 폭이 게임마다 달라(112 vs 131) 같은 px 이 다른 위치가 된다. */
.mg-rank span{position:absolute;left:54%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}
.mg-rank:hover{filter:brightness(1.06) drop-shadow(0 3px 5px rgba(8,20,60,.28));}
.mg-rank:active{transform:translateY(1px) scale(.98);}
</style>
<script>
(function(){
  var EMBED = window.parent !== window;
  var T0 = 0;
  function post(m){ if(EMBED) window.parent.postMessage(m, window.location.origin); }
  window.MGBridge = {
    /** 점수 전송. timed:true 면 시작 이후 경과시간을 동률 해소용으로 같이 보낸다. */
    submit: function(v, opts){
      if(typeof v !== 'number' || !isFinite(v)) return;
      post({ t:'mg:score', score:v, tieMs:(opts && opts.timed && T0) ? (Date.now()-T0) : undefined });
    }
  };
  function mount(id){
    var ov = document.getElementById(id); if(!ov) return;
    if(ov.querySelector('.mg-rank')) return;
    var b = document.createElement('button');
    b.type='button'; b.className='mg-rank' + (EMBED ? ' on' : '');
    b.setAttribute('aria-label', window.MGI18N ? MGI18N.t('mg.rank_aria') : '이 게임 랭킹 보기');
    b.innerHTML='<span>'+(window.MGI18N ? MGI18N.t('mg.rank') : '랭킹')+'</span>';
    b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); post({t:'mg:rank'}); });
    ov.appendChild(b);
  }
  mount('startOv'); mount('overOv');
  // 인트로에서 (랭킹 버튼이 아닌) 무엇이든 누르면 = 플레이 시작 → 소요시간 기준점 리셋.
  var intro = document.getElementById('startOv');
  if(intro) intro.addEventListener('click', function(e){
    if(e.target && e.target.closest && e.target.closest('.mg-rank')) return;
    T0 = Date.now();
  }, true);
})();
</script>
<script>if (window.MGI18N) MGI18N.apply();</script>
</body>
</html>
