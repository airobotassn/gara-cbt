<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>더듬어라 CARI — 센서를 골라 켜라</title>
<!--
  ─────────────────────────────────────────────────────────────
  더듬어라 CARI (feel-cari) — 프로토타입 v3
  ─────────────────────────────────────────────────────────────
  검정과목 **"에지 AI 디바이스와 센서 데이터 처리"**(CARIS-Ⅰ Elite).

  판을 두 번 갈아엎었고, 그 이유가 곧 이 게임의 설계다:
   v1 센서를 **정보량**으로 다뤘다(1개→3개→8개) → 난이도 조절일 뿐 매 판 하는 일이 같았다.
   v2 출발 전에 **골라서 달고** 들어갔다 → 결정이 판당 한 번뿐이라 플레이 중엔 여전히 할 게 없었다.
   v3 **센서를 전부 주고 플레이 중에 켜고 끈다.** 다 켜두면 고를 이유가 없으므로 **배터리**를 건다 —
      라이다·카메라는 전기를 많이 먹고 초음파·적외선은 거의 안 먹는다(실제로 그렇다).
      그래서 매 순간 "지금 뭘 켤까"가 생기고, 그게 에지 디바이스를 다루는 일 그 자체다.

  ⚠️ 설계상 지킬 것:
   ① 미로로 만들지 말 것. 넓은 공간 + 장애물. 목표 방향은 나침반이 알려준다.
   ② 감지 지점은 화면에 남긴다 — 어떤 센서를 켰느냐에 따라 지도가 완전히 다르게 그려진다.
   ③ 캔버스에 글자를 그리지 않는다(지형=SVG 도형, 숫자=DOM). 나중에 번역이 통째로 덮인다.
   ④ 센서의 강약은 **데이터표(SENSORS)** 한 곳에만 둔다. 코드에 "라이다는 유리를 못 본다" 같은 특례 금지.
   ⑤ 배터리를 다 켜고도 남게 만들지 말 것. 다 켤 수 있으면 이 게임엔 결정이 없다.
   ⑥ **만능인 센서를 두지 말 것.** v3 까지 초음파가 모든 재질을 보고 어느 환경에서도 안 죽고 제일 쌌다 —
      그래서 초음파만 켜고 전 구역을 깰 수 있었다. 천(C) 재질로 초음파의 눈을 하나 막아서 끊었다.
   ⑦ **작동 방식도 달라야 한다.** 각도만 다르고 전부 '즉시·상시' 면 결국 같은 물건이다.
      초음파는 메아리를 기다리고(0.4초, 파동 3겹), 라이다는 회전하며 훑고(한 바퀴 4.5초), 카메라는 셔터가 있고(0.45초),
      ⚠️ 이 숫자들은 실제 센서보다 훨씬 느리다 — 실물은 초당 수십 번 잰다. **눈으로 따라갈 수 있어야** 해서 늦췄다.
      적외선·레이더만 실시간이다. 그래서 **빨리 달릴 땐 켜야 할 센서가 달라진다.**
  지표: 도달 구역 (6) · 동률은 소요시간
-->
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(120% 80% at 50% -10%,#141c2e 0%,#0b1020 55%,#070a14 100%);
    color:#dfe7f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #app{position:relative;height:100%;width:100%;max-width:520px;margin:0 auto;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 80px -20px rgba(0,0,0,.7)}

  /* HUD 그림(hud-v1)은 '틀'이 아니라 **배치도**다 — 계기판 세 칸이 이미 그려져 있다.
     ⚠️ 아래 %는 실측값이다(알파 트림 후 2147×427 기준 · 왼 4.3~17.9 · 가운데 20.2~78 · 오른 82.2~95.8,
        칸 세로 21.4~80.4). 그림을 갈면 이 값들을 다시 재야 한다.
     ⚠️ 칸을 flex 로 흘리지 말 것 — 그림은 100% 100% 로 늘어나는데 글자는 안 늘어나서
        폭이 바뀔 때마다 칸 밖으로 새어나간다(2026-08-18 실제로 그 상태였다). 절대배치가 맞다. */
  .top{position:relative;flex:0 0 auto;margin:5px 13px 3px;height:64px;
    border:0;background:url('/games/feel-cari-hud-v1.webp') center/100% 100% no-repeat;
    filter:drop-shadow(0 4px 7px rgba(0,0,0,.5))}
  .top .slot{position:absolute;top:21.4%;height:59%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;line-height:1;min-width:0}
  .top .slot b{font-size:19px;font-weight:900;letter-spacing:-.02em;color:#eaf4ff}
  .top .slot i{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.02em;color:#7fa8cf}
  .sl-l{left:4.3%;width:13.6%}
  .sl-c{left:20.2%;width:57.8%;flex-direction:row;gap:7px}
  .sl-r{left:82.2%;width:13.6%}
  .sl-r b{color:#ff9a8a}
  .lvname{font-weight:900;font-size:16px;letter-spacing:-.02em;color:#eaf4ff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .envt{flex:0 0 auto;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:900;
    background:rgba(240,192,120,.16);border:1px solid rgba(240,192,120,.4);color:#f0c078}

  /* ── 배터리 ───────────────────────────────── */
  /* HUD 와 같은 계기 톤(남색 판 + 청록 테)으로 맞춘다 — 여기만 회색 박스면 바로 티가 난다. */
  .batt{flex:0 0 auto;display:flex;align-items:center;gap:9px;margin:0 13px 7px;padding:7px 11px;
    background:linear-gradient(180deg,#0b2038,#061321);border:1px solid rgba(90,200,255,.26);border-radius:9px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.35)}
  .batt .cap{font-size:12px;font-weight:900;color:#7fa8cf;letter-spacing:.02em}
  .batt .bar{flex:1 1 auto;height:11px;border-radius:3px;background:#02070d;border:1px solid rgba(90,200,255,.3);overflow:hidden;padding:1px}
  .batt .bar i{display:block;height:100%;background:linear-gradient(90deg,#3ddc84,#8fe0a8);
    transition:width .15s linear}
  .batt.low .bar i{background:linear-gradient(90deg,#ff5a48,#ffb020)}
  .batt .pct{font-size:13px;font-weight:900;width:44px;text-align:right}
  .batt.low .pct{color:#ff8a7a}
  .batt .rate{font-size:11.5px;font-weight:800;color:#7fa8cf;width:52px;text-align:right}

  /* ── 시야 ─────────────────────────────────── */
  .view{flex:1 1 auto;min-height:0;margin:0 13px;border-radius:12px;overflow:hidden;
    background:#010409 url('/games/feel-cari-game-bg-v3.webp') center/cover no-repeat;
    border:2px solid rgba(90,200,255,.3);display:grid;place-items:center;position:relative;
    box-shadow:inset 0 0 25px rgba(0,0,0,.55),0 5px 18px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.5)}
  .view svg{width:100%;height:100%;display:block}
  .view.bump{animation:bmp .45s}
  /* 부딪힌 칸 한 개만 잠깐. (예전엔 구역 벽 전체를 켰다 — 아래 flashHitCell 주석 참고) */
  .wflash{fill:#ff8a7a;animation:wf .7s ease-out forwards}
  @keyframes wf{0%{opacity:.9}70%{opacity:.5}100%{opacity:0}}
  /* 도착지 = 착륙 비컨. 맥박 링 두 겹(시차) + 천천히 도는 점선 링 + 코어.
     ⚠️ transform-origin 은 사용자 좌표로 직접 박는다(구역마다 도착지 위치가 다르다).
        fill-box 에 기대면 브라우저마다 기준이 달라져 링이 엉뚱한 데서 커진다. */
  .goal-pulse{animation:gpulse 2.2s ease-out infinite}
  .goal-pulse.b{animation-delay:1.1s}
  @keyframes gpulse{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.4);opacity:0}}
  .goal-scan{animation:gspin 7s linear infinite}
  @keyframes gspin{to{transform:rotate(360deg)}}
  .goal-core{animation:gcore 2.2s ease-in-out infinite}
  @keyframes gcore{0%,100%{opacity:.75}50%{opacity:1}}
  /* 로봇 — 검은 바닥에 묻히지 않게 바닥 발광 + 진행 방향 표시.
     ⚠️ 그림을 키우지 말 것. 스프라이트 반지름(28)이 이미 충돌 반지름(6)의 네 배라
        더 키우면 벽에 파묻혀 보이는데 안 부딪힌 판정이 나는 게 심해진다. */
  .botglow{animation:bglow 2.6s ease-in-out infinite}
  @keyframes bglow{0%,100%{opacity:.85}50%{opacity:1}}
  @keyframes bmp{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}45%{transform:translate(4px,-2px)}70%{transform:translate(-2px,1px)}}
  .compass{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:6px;
    background:rgba(7,22,40,.86);border:1px solid rgba(90,200,255,.34);border-radius:999px;padding:5px 11px;
    box-shadow:inset 0 1px 0 rgba(140,220,255,.16)}
  .compass svg{width:17px;height:17px}
  .compass span{font-size:13px;font-weight:900;color:#cfe0ff}
  .drift{position:absolute;top:8px;left:8px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:900;
    background:rgba(255,120,60,.16);border:1px solid rgba(255,140,80,.4);color:#ffb98a}
  /* ⚠️ 조이스틱(왼쪽 아래, 98px) 위로 띄운다 — 바닥에 두면 손잡이에 깔린다. */
  .blind{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);padding:6px 13px;border-radius:999px;
    font-size:13px;font-weight:900;background:rgba(255,90,72,.18);border:1px solid rgba(255,120,90,.45);color:#ffb1a4}

  /* ── 센서 (토글 = 판독기) ──────────────────── */
  /* 센서 카드 = 판독기 그림 한 장. 글자는 그림의 **액정 안**에만 들어간다.
     ⚠️ 좌우 여백은 취향이 아니라 실측값이다(트림 후 749×198 기준) — 커넥터(7~15%)와 상태등(86~96%)을
        피하고 남은 자리가 액정(25.9~91.7%)이다. 여백을 줄이면 글자가 커넥터 위로 올라탄다.
     ⚠️ aspect-ratio 를 빼면 안 된다. 안 그러면 카드가 글자 높이만큼만 서고 그림은 100% 100% 로
        늘어나서 액정이 납작해지고 위 %좌표가 통째로 어긋난다(2026-08-18 실제로 그 상태였다). */
  .sens{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:5px;
    padding:7px 13px calc(7px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(8,20,35,.1),rgba(8,20,35,.88))}
  .s{position:relative;display:flex;align-items:center;gap:6px;cursor:pointer;aspect-ratio:749/198;
    padding:0 8% 0 28%;border:0;border-radius:0;box-shadow:none;
    background:url('/games/feel-cari-sensor-card-v1.webp') center/100% 100% no-repeat;
    text-align:left;font:inherit;color:inherit;min-width:0}
  /* 켜짐 표시 = **그림에 이미 파여 있는 커넥터 소켓에 불이 들어온다.**
     아이콘을 새로 얹지 않는 이유: 그림에 자리가 있는데 그 위에 이모지를 또 놓으면 표식이 두 벌이 된다
     (시켜라 CARI 의 별 소켓과 같은 이유). 색은 센서 색(--c) 하나에서 나온다.
     ⚠️ 아래 %는 실측값이다(트림 후 749×198 · 소켓 핀면 중심 11.4% / 45%). 그림을 갈면 다시 재야 한다. */
  .s .si{position:absolute;left:11.4%;top:45%;transform:translate(-50%,-50%);
    width:8.2%;aspect-ratio:1;border-radius:50%;background:var(--c);opacity:.13;
    transition:opacity .12s linear,box-shadow .12s linear}
  .s.on .si{opacity:1;box-shadow:0 0 6px var(--c),0 0 13px var(--c),inset 0 0 3px rgba(255,255,255,.65)}
  .s .sn{color:var(--c)}
  .s .bd{flex:1 1 auto;min-width:0}
  .s .sn{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:900;letter-spacing:-.01em;
    line-height:1.15;min-width:0}
  .s .sn .nt{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 숫자키 힌트 — 1~6 으로도 켜지는데 화면에 번호가 없어서 알 길이 없었다(2026-08-19).
     ⚠️ 이름과 같은 줄이라 이름 쪽에만 말줄임을 걸어야 한다 — .sn 에 걸면 번호가 먼저 잘린다. */
  .s .sk{flex:0 0 auto;font-size:9px;line-height:1;padding:2px 3.5px;border-radius:3px;
    color:#4a5878;border:1px solid rgba(120,150,200,.32)}
  .s.on .sk{color:var(--c);border-color:currentColor}
  .s .sv{display:block;font-size:16px;font-weight:900;line-height:1.2;color:#4d5c7d;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s .sv small{font-size:10px;font-weight:800;margin-left:1px}
  .s .sp{flex:0 0 auto;font-size:8.5px;letter-spacing:.5px;color:#4a5878;line-height:1}
  .s.on{filter:brightness(1.12)}
  .s.on .sv{color:#eaf1ff}
  .s.on .sp{color:#8fd0ff}
  .s.on.near .sv{color:#ff8a7a}
  .s.on.dead .sv{font-size:12px;color:#ff8a7a;line-height:1.4}
  .s.on.touch .sv{font-size:12px;line-height:1.4}
  /* 갱신 순간의 '찰칵' 점멸은 뺐다(2026-08-18 요청) — 초음파·라이다·카메라가 각자 박자로 계속
     깜빡여서 센서판 전체가 정신없었다. 켜짐은 소켓 불빛 하나로만 말한다.
     JS 는 계속 .ping 을 붙였다 뗀다 — 되살릴 거면 카드 전체 말고 소켓(.si)만 건드릴 것.
     ⚠️ background 단축 속성으로 칠하지 말 것: 카드 그림까지 지워져 회색 네모가 된다(실측). */

  /* ── 조종 ─────────────────────────────────── */
  /* 조이스틱은 **지도 위에 떠 있다.** 자기 줄(104px)을 쓰던 걸 걷어내 그만큼 시야에 줬다 —
     지도가 세로에 걸려 있어서 이 105px 이 곧 지도 크기다(349×457 → 400×523, 면적 +31%).
     ⚠️ **왼쪽 아래**여야 한다. 여섯 구역 전부 출발이 왼쪽 위, 도착이 **오른쪽 아래**라
        오른쪽에 두면 도착지를 정확히 덮는다. 왼쪽 아래는 경로에서 가장 안 밟는 구석이다.
     ⚠️ .pad 는 클릭을 통과시키고(pointer-events:none) 손잡이만 받는다 — 안 그러면 조이스틱
        주변의 빈 사각형이 지도 위 터치를 통째로 먹는다. */
  .pad{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;
    pointer-events:none}
  .joystick{position:relative;width:98px;height:98px;touch-action:none;user-select:none;cursor:grab;outline:none;
    pointer-events:auto;opacity:.82;transition:opacity .15s linear}
  .joystick:active{opacity:1}
  .joystick:active{cursor:grabbing}
  .joybase{position:absolute;inset:-7px;border-radius:50%;background:url('/games/feel-cari-joystick-base-v1.webp') center/contain no-repeat;
    filter:drop-shadow(0 7px 8px rgba(0,0,0,.6))}
  .joyknob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#62aee3,#1e5f96 48%,#0a2945 72%);border:2px solid #8ed8ff;
    box-shadow:inset 0 2px 5px rgba(255,255,255,.28),0 5px 9px rgba(0,0,0,.6);will-change:transform}
  .ctl{flex:1 1 0;padding:15px 8px;border-radius:10px;cursor:pointer;font:900 19px/1 system-ui,sans-serif;
    background:linear-gradient(#263e55,#101d2c);color:#cfe0ff;border:1px solid #45637b;box-shadow:inset 0 1px #668299,0 4px 0 #07101a;touch-action:none}
  .ctl.go{flex:1.5 1 0;background:linear-gradient(#2f7de1,#1c56b8);color:#fff;border-color:transparent;
    box-shadow:0 4px 0 #123a80}
  .ctl.on{filter:brightness(1.25)}
  .ctl.go.on{transform:translateY(2px);box-shadow:0 2px 0 #123a80}

  /* ── 판정 ─────────────────────────────────── */
  /* 판정 패널 — 전용 판 그림이 아직 없어서, 그림 대신 **계기판과 같은 색·테**로 맞춘다
     (남색 판 + 청록 테 + 안쪽 그림자). 회색 카드로 두면 이 화면만 다른 게임처럼 보인다. */
  .fb{position:absolute;left:13px;right:13px;bottom:13px;z-index:30;
    background:linear-gradient(180deg,#0d2740,#071628);
    border:1px solid rgba(90,200,255,.3);border-radius:14px;padding:14px 16px;
    box-shadow:0 22px 46px -18px rgba(0,0,0,.9),inset 0 1px 0 rgba(140,220,255,.18);
    transform:translateY(170%);
    pointer-events:none;transition:transform .24s cubic-bezier(.2,.9,.3,1)}
  .fbart{display:none;position:absolute;right:8px;bottom:88%;width:112px;height:112px;object-fit:contain;
    filter:drop-shadow(0 12px 12px rgba(0,0,0,.55));pointer-events:none}
  .fb.no .fbart{display:block}
  .fb.on{transform:translateY(0);pointer-events:auto}
  .fbhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .fbhead b{font-size:17px;font-weight:900;letter-spacing:-.02em;color:#8fe0a8}
  .fb.no .fbhead b{color:#ff9a8a}
  .fbhead .st{margin-left:auto;font-size:15px;color:#e0a92a;font-weight:900;letter-spacing:1px}
  .fbhead .st i{font-style:normal;color:#4a5570}
  .fbwhy{margin:0 0 13px;font-size:14.5px;font-weight:700;line-height:1.6;color:#aebbd6;word-break:keep-all}
  .fbwhy em{font-style:normal;color:#ffd08a;font-weight:900}
  .fbbtn{width:100%;padding:14px;border:1px solid rgba(140,220,255,.45);border-radius:11px;cursor:pointer;
    background:linear-gradient(#2f7de1,#1c56b8);color:#fff;font:900 16px/1 system-ui,sans-serif;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 #0d2f6b}
  .fbbtn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 0 #0d2f6b}

  /* ── 오버레이 ─────────────────────────────── */
  .ov{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;
    background:rgba(5,8,18,.82);backdrop-filter:blur(4px)}
  .sheet{width:100%;max-width:430px;max-height:100%;overflow-y:auto;
    background:linear-gradient(#18213a,#111829);border:1px solid rgba(255,255,255,.12);
    border-radius:20px;padding:18px 16px;box-shadow:0 26px 60px -20px rgba(0,0,0,.95)}
  .art{width:74px;height:74px;display:block;margin:0 auto}
  #sArt{flex:0 1 auto;width:100%;height:min(245px,30vh);margin:-5px auto 4px;background:url('/games/feel-cari-intro-hero-v2.webp') center/contain no-repeat;
    filter:drop-shadow(0 15px 18px rgba(0,0,0,.5))}
  #oArt{flex:0 1 auto;height:min(165px,20vh);margin:-4px auto 2px;width:100%;
    background:url('/games/feel-cari-success-v1.webp') center/contain no-repeat;
    filter:drop-shadow(0 15px 18px rgba(0,0,0,.48))}
  #sArt svg,#oArt svg{display:none}
  .ttl{flex:0 0 auto;text-align:center;font-size:min(25px,3vh);font-weight:900;letter-spacing:-.03em;
    margin:8px 0 5px;color:#eaf4ff}
  .ttl i{font-style:normal;color:#5aa3ff}
  .lead{flex:0 0 auto;text-align:center;font-size:min(15px,1.8vh);font-weight:700;line-height:1.6;
    color:#9fb0d8;margin:0 0 14px}
  .rules{flex:0 0 auto;list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:8px}
  .rules li{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:700;line-height:1.55;
    background:rgba(255,255,255,.05);border-radius:12px;padding:11px 13px;color:#cbd6f0}
  .rules li span{flex:0 0 auto;color:#5aa3ff;font-weight:900}
  .btn{width:100%;padding:15px;border:0;border-radius:13px;cursor:pointer;
    background:linear-gradient(#3a8bff,#1f63e0);color:#fff;font:900 16.5px/1 system-ui,sans-serif}

  /* ── 판 그림 위에 올리기 ───────────────────────────────────────────
     세 화면(인트로 · 구역 브리핑 · 결과)이 **같은 계기판 한 장**을 쓴다. 다른 게임(막아라=클립보드,
     시켜라=금속 훈장판)이 화면마다 판 그림을 두는 것과 같은 자리를 채우는 것이다.
     ⚠️ intro-panel 은 위 가운데에 **손잡이**가 그려져 있어 border-image(9슬라이스)를 쓰면 안 된다 —
        가운데 조각이 가로로 늘어나 손잡이가 판 전체 폭의 막대가 된다. 통짜로 늘리고 비율을 고정한다.
     ⚠️ 그래서 판은 **높이로 크기를 정한다**(width:auto + aspect-ratio). 폭으로 정하면 낮은 화면에서
        판이 세로로 넘쳐 잘린다.
     ⚠️ 아래 %는 실측값이다(트림 후 652×994 · 안쪽 판 x10.3~89.4 · y13.9~92.6).
        padding 의 % 는 **폭 기준**이라 세로값은 높이비(1/0.6559)를 곱해 환산했다 — 그림을 갈면 다시 잰다. */
  .ov .sheet{height:min(92%,660px);width:auto;aspect-ratio:652/994;max-width:96%;
    padding:21.2% 10.5% 11.3%;border:0;border-radius:0;box-shadow:none;
    background:url('/games/feel-cari-intro-panel-v1.webp') center/100% 100% no-repeat;
    filter:drop-shadow(0 18px 24px rgba(0,0,0,.7));
    display:flex;flex-direction:column;scrollbar-width:none}
  .ov .sheet::-webkit-scrollbar{display:none}
  /* 버튼은 판 바닥에 붙인다 — 내용이 짧아도 버튼이 가운데에 떠 있으면 판이 비어 보인다. */
  .ov .btn{margin-top:auto;width:min(100%,300px);align-self:center;height:auto;aspect-ratio:2022/593;
    padding:0 12% 2%;border:0;border-radius:0;box-shadow:none;
    background:url('/games/feel-cari-start-v1.webp') center/100% 100% no-repeat;
    color:#fff;font-size:min(18px,2.2vh);text-shadow:0 2px 3px #05203c;
    filter:drop-shadow(0 7px 7px rgba(0,0,0,.48))}
  .ov .btn:active{transform:translateY(2px)}

  #startOv{padding:10px;background:#040810 url('/games/feel-cari-intro-bg-v1.webp') center/cover no-repeat;backdrop-filter:none}
  #startOv:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,3,8,.05),rgba(0,3,8,.42));pointer-events:none}
  #startOv .sheet{position:relative;z-index:1}
  #startOv #sArt{height:min(235px,28vh);margin:-8px auto 0}
  #startOv .ttl{font-size:min(25px,3vh);margin:4px 0 3px;color:#f4f8ff;text-shadow:0 2px 2px #02070d}
  #startOv .lead{font-size:min(14px,1.7vh);line-height:1.45;margin:0 0 10px;color:#bcd0e7}
  #startOv .rules{gap:6px;margin:0 0 10px}
  #startOv .rules li{gap:8px;padding:8px 10px;border-radius:7px;background:rgba(2,9,17,.34);
    font-size:min(13.5px,1.65vh);line-height:1.4;color:#d6e2ef;white-space:nowrap}
  @media (max-width:430px){ #startOv .rules li{font-size:min(12.5px,1.6vh);padding:7px 8px} }
  #startOv .rules li span{color:#68d4ff}

  /* 브리핑 — 판 안쪽에서 글이 넘치면 판이 아니라 글이 커진 것처럼 보인다. 넘치는 건 본문만 스크롤한다. */
  #brOv .sheet{justify-content:flex-start}
  /* margin:auto 0 = 판 안쪽 남는 높이를 위아래로 나눠 본문을 가운데 세운다.
     ⚠️ 위로 붙이면 '아는 것' 이 없는 1구역에서 판 아래 절반이 통째로 빈다. */
  .zbody{margin:auto 0;min-height:0;display:flex;flex-direction:column}
  .zhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex:0 0 auto}
  .zhead b{font-size:min(20px,2.4vh);font-weight:900;letter-spacing:-.02em;color:#eaf4ff}
  .zhead span{padding:4px 9px;border-radius:7px;font-size:min(12px,1.5vh);font-weight:900;
    background:rgba(240,192,120,.16);border:1px solid rgba(240,192,120,.4);color:#f0c078}
  .zdesc{font-size:min(14.5px,1.75vh);font-weight:700;line-height:1.6;color:#a9b8d6;margin:0 0 12px;
    word-break:keep-all;flex:0 1 auto;overflow-y:auto;scrollbar-width:none}
  .zdesc::-webkit-scrollbar{display:none}
  /* 구역 브리핑의 핵심 = "여기서 뭐가 안 되나". 글로 풀면 네 줄이라 안 읽히므로 칩으로 보여준다.
     칩 색은 센서 카드 소켓과 같은 색(--c)이라 브리핑에서 본 색을 게임 화면에서 그대로 찾는다.
     ⚠️ 먹통 칩의 점은 회색이다 — 색이 살아 있으면 "쓸 수 있다"로 읽힌다. */
  .zhints{flex:0 0 auto;display:flex;flex-direction:column;gap:9px;margin:0 0 12px}
  .zrow h5{margin:0 0 6px;font-size:min(12px,1.5vh);font-weight:900;letter-spacing:.02em}
  .zrow.bad h5{color:#ff9a8a}
  .zrow.good h5{color:#8fe0a8}
  .zrow>div{display:flex;flex-wrap:wrap;gap:5px}
  .zrow.all{font-size:min(14px,1.7vh);font-weight:700;color:#a9b8d6}
  .zrow.all b{color:#8fe0a8}
  .zc{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;
    font-size:min(13px,1.6vh);font-weight:900;color:#dbe6f7;
    background:rgba(2,9,17,.42);border:1px solid rgba(255,255,255,.1)}
  .zc i{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 5px var(--c)}
  .zc.b{color:#9fadc6}
  .zc.b i{background:#57627e;box-shadow:none}
  .zc em{font-style:normal;font-weight:800;font-size:min(11.5px,1.45vh);color:#8b9ab9}

  .known{background:rgba(255,150,80,.09);border:1px solid rgba(255,160,90,.26);border-radius:12px;
    padding:10px 12px;margin-bottom:12px;flex:0 1 auto;overflow-y:auto;scrollbar-width:none}
  .known::-webkit-scrollbar{display:none}
  .known h4{margin:0 0 7px;font-size:min(13px,1.6vh);font-weight:900;color:#ffb98a;letter-spacing:.02em}
  .known div{font-size:min(13.5px,1.6vh);font-weight:700;line-height:1.55;color:#e6d2c2;margin-bottom:3px}
  .known div b{font-weight:900}

  /* 결과 — 판 안이 위에서부터 [캐릭터][제목][별][별 수][한 줄 교훈] 이고 버튼은 바닥(.ov .btn). */
  #overOv .sheet{justify-content:flex-start}
  .big{flex:0 0 auto;margin:2px 0 0;text-align:center;font-size:min(38px,4.4vh);font-weight:900;color:#e0a92a;line-height:1.1;letter-spacing:2px}
  .big i{font-style:normal;color:#3d4a6b}
  .biglab{flex:0 0 auto;text-align:center;font-size:min(13px,1.6vh);font-weight:800;color:#7d8dba;margin:6px 0 12px}
  .note{background:rgba(90,163,255,.10);border:1px solid rgba(90,163,255,.28);border-radius:12px;
    padding:11px 13px;font-size:min(14px,1.7vh);line-height:1.55;font-weight:700;color:#bcd6ff;
    margin-bottom:12px;flex:0 1 auto;overflow-y:auto;scrollbar-width:none}
  .note::-webkit-scrollbar{display:none}
  .note b{color:#fff}

  /* 랭킹 버튼 = 게임 공용 에셋(/games/rank-button.webp) — 막아라·지어라·닿아라 등과 같은 값이다.
     ⚠️ 그림에 트로피가 이미 그려져 있어서 이모지 span 은 숨기고 글자만 오른쪽으로 민다(padding-left).
        안 숨기면 트로피가 두 개가 된다. aspect-ratio 는 에셋 실물(1701×494)이다. */
  .mg-rank{position:absolute;top:11px;right:11px;z-index:60;display:none;width:auto;height:38px;aspect-ratio:1701/494;
    padding:0;border:0;border-radius:0;cursor:pointer;place-items:center;
    background:url('/games/rank-button.webp') center/100% 100% no-repeat;color:#fff;
    font:800 12.5px/1 system-ui,sans-serif;text-shadow:0 1px 3px #001c55;
    filter:drop-shadow(0 5px 8px rgba(0,10,42,.38))}
  .mg-rank.on{display:grid}
  .mg-rank>span[aria-hidden="true"]{display:none}
  .mg-rank .rank-label{position:absolute;left:54%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}

  /* ⚠️ .hidden 은 스타일시트 맨 끝 — 특정도가 같은 .ov / .drift 보다 뒤에 있어야 이긴다. */
  .hidden{display:none}
</style>
</head>
<body>

<div id="app">
  <div class="top">
    <span class="slot sl-l"><b id="lvNum">1</b><i>구역</i></span>
    <span class="slot sl-c"><b class="lvname" id="lvName">—</b><span class="envt hidden" id="envTag">—</span></span>
    <span class="slot sl-r"><b id="hitEl">0</b><i>부딪힘</i></span>
  </div>

  <div class="batt" id="battBox">
    <span class="cap">배터리</span>
    <span class="bar"><i id="battFill" style="width:100%"></i></span>
    <span class="pct" id="battPct">100%</span>
    <span class="rate" id="battRate">0.0/s</span>
  </div>

  <div class="view" id="view">
    <svg id="svg" viewBox="0 0 338 442" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="botAura">
          <stop offset="0" stop-color="#7cc0ff" stop-opacity=".6"/>
          <stop offset="45%" stop-color="#4a8fe8" stop-opacity=".22"/>
          <stop offset="100%" stop-color="#4a8fe8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="goalAura">
          <stop offset="0" stop-color="#3ddc84" stop-opacity=".42"/>
          <stop offset="55%" stop-color="#3ddc84" stop-opacity=".13"/>
          <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g id="gWall"></g><g id="gHit"></g><g id="gMark"></g><polyline id="gTrail" fill="none"
        stroke="rgba(90,163,255,.26)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <g id="gBeam"></g><g id="gGoal"></g><g id="gBot"></g>
    </svg>
    <div class="compass">
      <svg viewBox="0 0 24 24"><g id="cArrow"><path d="M12 3 L17 19 L12 15.5 L7 19 Z" fill="#5aa3ff"/></g></svg>
      <span id="cDist">—</span>
    </div>
    <div class="drift hidden" id="driftTag">위치 추정 흔들림</div>
    <div class="blind hidden" id="blindTag">센서를 하나도 안 켰다</div>
    <!-- 조이스틱은 시야 **안**에 떠 있다(자기 줄을 안 쓴다) — 아래 .pad 주석 참고. -->
    <div class="pad">
      <div class="joystick" id="joystick" role="application" tabindex="0" aria-label="주행 조이스틱">
        <div class="joybase"></div><div class="joyknob" id="joyKnob"></div>
      </div>
    </div>
  </div>

  <div class="sens" id="sens"></div>

  <div class="fb" id="fb">
    <img class="fbart" src="/games/feel-cari-fail-v1.webp" alt="" aria-hidden="true" />
    <div class="fbhead"><b id="fbTtl">도착</b><span class="st" id="fbStar"></span></div>
    <p class="fbwhy" id="fbWhy">—</p>
    <button class="fbbtn" id="fbBtn">다음</button>
  </div>

<!-- ⚠️ 오버레이 셋은 반드시 #app **안**에 있어야 한다 — `.ov{position:absolute;inset:0}` 의 기준이
     #app(520px 상한)이 아니라 뷰포트가 되면 데스크톱에서 인트로가 화면 전체(1280px+)로 퍼지고
     랭킹 버튼도 게임이 아니라 브라우저 오른쪽 끝에 붙는다. (2026-08-18 실제로 그 상태였다.
     시켜라 CARI 가 같은 이유로 먼저 고쳐졌다 — 밖으로 빼지 말 것.) -->

<!-- 인트로 -->
<div class="ov" id="startOv">
  <div class="sheet">
    <div id="sArt"></div>
    <p class="ttl">더듬어라 <i>CARI</i></p>
    <p class="lead">“앞이 안 보인다. 센서만 믿고 가라.”</p>
    <!-- ⚠️ 인트로에 다 적지 않는다 — 태그 1줄 + 규칙 3개, 각 한 줄(다른 게임 전부 이 분량이다).
         센서별 갱신 속도·감지 점 같은 건 구역 브리핑과 판정이 알아서 알려준다.
         남길 것은 "안 하면 손해 보는 것" 셋뿐이다. -->
    <ul class="rules">
      <li><span>①</span><div><b>센서를 켜야</b> 보인다 · 켤수록 <b>빨리 닳는다</b></div></li>
      <li><span>②</span><div>구역마다 <b>먹통인 센서</b>가 있다</div></li>
      <li><span>③</span><div><b>3번</b> 부딪히면 끝 · 무사통과 <b>★★★</b></div></li>
    </ul>
    <button class="btn" id="startBtn">시작하기</button>
  </div>
</div>

<!-- 구역 브리핑 -->
<div class="ov hidden" id="brOv">
  <div class="sheet">
    <div class="zbody">
      <div class="zhead"><b id="zName">—</b><span class="hidden" id="zEnv">—</span></div>
      <p class="zdesc" id="zDesc">—</p>
      <div class="zhints" id="zHints"></div>
      <div class="known hidden" id="zKnown"><h4>지금까지 겪어서 아는 것</h4><div id="zKnownBody"></div></div>
    </div>
    <button class="btn" id="zGo">들어가기</button>
  </div>
</div>

<!-- 종료 -->
<div class="ov hidden" id="overOv">
  <div class="sheet">
    <div id="oArt"></div>
    <p class="ttl" id="oTtl">전 구역 통과</p>
    <p class="big" id="oStars">★</p>
    <p class="biglab" id="oLab">별 0 / 0</p>
    <div class="note">센서는 세상을 알려주지 않는다. <b>자기가 잴 수 있는 것만</b>, 그것도 <b>전기를 쓰면서</b> 알려준다. 무엇을 언제 켤지 정하는 게 일이다.</div>
    <button class="btn" id="oAgain">처음부터 다시</button>
  </div>
</div>

</div><!-- /#app -->

<script>
/* ================= CARI mascot (기존 게임과 동일 자산) ================= */
function charSVG(suit,o={}){
  const [body,shade,ear]=suit; const isCari=o.cari, dir=o.dir||0, shock=o.shock;
  const gid='c'+shade.slice(1)+(isCari?'m':'')+(shock?'k':'')+(dir+1)+Math.random().toString(36).slice(2,6);
  const ex=dir*2.2;
  const eyes = shock
    ? `<path d="M22.5 25.5 l5.5 5 M28 25.5 l-5.5 5" stroke="#8fd0ff" stroke-width="2.3" stroke-linecap="round"/>
       <path d="M36 25.5 l5.5 5 M41.5 25.5 l-5.5 5" stroke="#8fd0ff" stroke-width="2.3" stroke-linecap="round"/>`
    : `<ellipse cx="${25.5+ex}" cy="27" rx="3.7" ry="4.8" fill="#d3ecff"/>
       <ellipse cx="${38.5+ex}" cy="27" rx="3.7" ry="4.8" fill="#d3ecff"/>
       <ellipse cx="${24.6+ex}" cy="25.2" rx="1.15" ry="1.5" fill="#fff"/>
       <ellipse cx="${37.6+ex}" cy="25.2" rx="1.15" ry="1.5" fill="#fff"/>`;
  const mouth = shock
    ? `<ellipse cx="32" cy="35.5" rx="2.8" ry="3.4" fill="#2b5f8c"/>`
    : `<path d="M28.8 34 q3.2 2.8 6.4 0" stroke="#7fc4ff" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  const antenna = isCari ? `
    <path d="M32 10 v-4.4" stroke="#7fa8d8" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="32" cy="3.8" r="3" fill="#5b90ff"/>
    <ellipse cx="32" cy="3.8" rx="5.7" ry="1.9" fill="none" stroke="#9cc0ff" stroke-width="1.2" transform="rotate(-18 32 3.8)"/>` : '';
  const badge = isCari ? `
    <rect x="24" y="45" width="16" height="8.5" rx="3" fill="#fdfbf5" stroke="${shade}" stroke-width=".9"/>
    <text x="32" y="51.3" font-size="5.4" font-weight="900" text-anchor="middle" fill="#8fb0e2" font-family="system-ui,sans-serif">CARI</text>` : '';
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="width:74px;height:74px">
    <defs><radialGradient id="${gid}" cx="38%" cy="26%" r="80%">
      <stop offset="0" stop-color="#fff" stop-opacity=".62"/>
      <stop offset="42%" stop-color="${body}"/><stop offset="100%" stop-color="${shade}"/>
    </radialGradient></defs>
    <ellipse cx="32" cy="58.5" rx="16" ry="3.4" fill="rgba(0,0,0,.32)"/>
    ${antenna}

/** 이 구역에서 어떤 센서가 먹통이고 어떤 센서가 유리한가 — **전부 데이터에서 뽑는다.**
 *  브리핑을 글로 쓰면 규칙과 설명이 따로 놀기 시작한다(초음파 사거리를 고치면 문장도 같이 고쳐야 한다).
 *  ⚠️ 여기에 "이 구역은 라이다가 안 된다" 같은 특례를 적지 말 것 — 설계 규칙 ④(강약은 SENSORS 한 곳).
 *  ⚠️ 환경 먹통이 재질보다 먼저다. 둘 다 걸리면 이유를 하나만 보여줘야 칩이 안 길어진다. */
function zoneHints(l){
  const mats=new Set();
  l.grid.forEach(r=>{ for(const c of r) if(MATLBL[c]) mats.add(c); });
  const bad=[], good=[];
  Object.keys(SENSORS).forEach(k=>{
    const S=SENSORS[k];
    const e=S.envFail.find(x=>l.envs.indexOf(x)>=0);
    if(e){ bad.push({k,why:ENVWHY[e]||ENVLBL[e]}); return; }
    const m=[...mats].find(x=>S.sees[x]===0);
    if(m){ bad.push({k,why:MATLBL[m]}); return; }
    const b=S.boost&&Object.keys(S.boost).find(x=>mats.has(x));
    if(b) good.push({k,why:MATLBL[b]+' '+S.boost[b]+'배'});
  });
  return {bad,good};
}

function starStr(n){ n=Math.max(0,Math.min(3,Math.round(n)||0));
  return '★'.repeat(n)+'<i>'+'☆'.repeat(3-n)+'</i>'; }
function envOn(k){ return L && L.envs.indexOf(k)>=0; }

function cellAt(px,py){
  const cx=Math.floor(px/CELL), cy=Math.floor(py/CELL);
  if(cx<0||cy<0||cy>=H||cx>=W) return '#';
  return grid[cy][cx];

const SOLID='#GBMC';
function solid(ch){ return SOLID.indexOf(ch)>=0; }
/** 센서가 그 재질을 감지하나 — 판단은 전부 SENSORS.sees 표에서 나온다(코드에 특례 금지). */
function detects(sk,ch){ return solid(ch) && SENSORS[sk].sees[ch]===1; }
function dead(sk){ return SENSORS[sk].envFail.some(e=>envOn(e)); }

/** 광선 하나. `boost` 가 있으면 그 재질만 사거리가 늘어난다(레이더는 금속에 두 배 멀리 닿는다). */
function ray(sk,ang,ox,oy){
  const S=SENSORS[sk], dx=Math.cos(ang), dy=Math.sin(ang);
  const bx=ox===undefined?bot.x:ox, by=oy===undefined?bot.y:oy;
  const far=S.boost?S.range*Math.max(...Object.values(S.boost)):S.range;
  for(let t=BOT_R;t<far;t+=2){
    const px=bx+dx*t, py=by+dy*t;
    const ch=cellAt(px,py);
    if(!detects(sk,ch)) continue;
    const lim=S.range*((S.boost&&S.boost[ch])||1);
    if(t<=lim) return {d:t,x:px,y:py,hit:true};
    break;  // 벽이 가로막았는데 사거리 밖 — 아무것도 못 본 것
  }
  return {d:S.range,x:bx+dx*S.range,y:by+dy*S.range,hit:false};
}
let lastHit=null;   // 마지막으로 부딪힌 칸 [cx,cy] — 충돌 번쩍임이 쓴다
function hitsWall(x,y){
  for(let i=0;i<8;i++){
    const a=i*45*D2R;
    const px=x+Math.cos(a)*BOT_R, py=y+Math.sin(a)*BOT_R;
    if(solid(cellAt(px,py))){ lastHit=[Math.floor(px/CELL),Math.floor(py/CELL)]; return true; }
  }
  if(solid(cellAt(x,y))){ lastHit=[Math.floor(x/CELL),Math.floor(y/CELL)]; return true; }
  return false;
}
/** 부딪힌 **그 칸 하나만** 잠깐 보여준다.
 *  ⛔ 예전엔 gWall(구역 벽 **전체**)을 0.7초 켰다. 충돌 피드백이었는데 게임 전제를 통째로 깼다 —
 *     일부러 두 번 박으면 목숨 두 개로 지도를 다 사서, 센서를 하나도 안 켜고 완주할 수 있었다
 *     (배터리도 안 쓴다). 2026-08-18 제거. 완주·실패 뒤의 전체 공개(opacity .35)는 답 공개라 그대로 둔다.
 *  ⚠️ 좌표는 **로봇이 믿는 위치 기준**으로 옮겨 그린다 — 감지 점·자취와 같은 프레임이어야 한다.
 *     참값에 그리면 미끄러진 뒤 번쩍임만 엉뚱한 자리에서 난다. */
function flashHitCell(){
  if(!lastHit) return;
  const n=document.createElementNS('http://www.w3.org/2000/svg','rect');
  n.setAttribute('x',lastHit[0]*CELL+err.x); n.setAttribute('y',lastHit[1]*CELL+err.y);
  n.setAttribute('width',CELL); n.setAttribute('height',CELL);
  n.setAttribute('class','wflash');
  $('gHit').appendChild(n);
  setTimeout(()=>{ n.remove(); },700);
}
function drainRate(){
  // ⚠️ 먹통인 센서도 켜두면 전기를 먹는다. 그게 "잘못 켰다"의 대가다.
  return Object.keys(SENSORS).reduce((a,k)=>a+(on[k]?SENSORS[k].pw:0),0);
}
function pwDots(k){ const p=SENSORS[k].pw; const n=p>=3?4:p>=1.5?3:p>=0.8?2:p>0?1:0;
  return '●'.repeat(n)+'○'.repeat(4-n); }

/** 센서가 쏘는 방향들 — **화면에서 센서를 구분하는 건 숫자가 아니라 이 모양이다.**
 *  적외선은 한 줄기, 초음파는 짧고 좁은 부채, 카메라는 넓고 긴 부채, 라이다는 사방 스캔, 레이더는 넓고 흐리다.
 *  ⚠️ 전부 선 하나로 그리면 어느 센서를 켜도 화면이 똑같아져서 이 게임이 성립하지 않는다. */
function rayAngles(k){
  const S=SENSORS[k];
  if(!S.rays) return [];
  if(S.fov>=360) return Array.from({length:S.rays},(_,i)=>i*360/S.rays);
  if(S.rays<2) return [0];
  return Array.from({length:S.rays},(_,i)=>-S.fov/2+i*S.fov/(S.rays-1));
}

/* ===================== 센서 판 ===================== */
function buildSensors(){
  $('sens').innerHTML=Object.keys(SENSORS).map((k,i)=>{
    const S=SENSORS[k];
    // 번호는 여기서 세지 않는다 — 키 순서가 곧 숫자키(아래 keydown 의 Object.keys(SENSORS)[n-1]).
    return `<button class="s" data-k="${k}" id="s_${k}" style="--c:${S.c}">
      <span class="si" aria-hidden="true"></span>
      <span class="bd"><span class="sn"><span class="nt">${S.nm}</span><b class="sk">${i+1}</b></span>
      <span class="sv" id="v_${k}">꺼짐</span></span>
      <span class="sp">${pwDots(k)}</span></button>`;
  }).join('');
  $('sens').querySelectorAll('.s').forEach(b=>{
    b.onclick=()=>{ const k=b.dataset.k; on[k]=!on[k]; b.classList.toggle('on',!!on[k]);
      if(!on[k]){ $('v_'+k).textContent='꺼짐'; b.classList.remove('near','dead','touch'); delete meas[k]; } };
  });
}

/* ===================== 구역 적재 ===================== */
function loadLevel(){
  L=LEVELS[LI]; grid=L.grid; H=grid.length; W=grid[0].length;
  $('lvNum').textContent=LI+1; $('lvName').textContent=L.name;
  const envTxt=L.envs.map(e=>ENVLBL[e]).join(' · ');
  $('envTag').textContent=envTxt; $('envTag').classList.toggle('hidden',!envTxt);
  $('driftTag').classList.toggle('hidden',!envOn('slip'));
  hits=0; marks=new Set(); markDom=0; trail=[]; trailStr=''; err={x:0,y:0}; held={u:0,d:0,l:0,r:0}; joyX=0; joyY=0; touching=false;
  batt=BATT_MAX; on={}; meas={}; scanA=0;
  driftDir=Math.random()*Math.PI*2;   // 드리프트는 한 방향으로 쏠린다 — 랜덤워크면 상쇄돼 아무 일도 안 난다
  $('hitEl').textContent='0';
  $('svg').setAttribute('viewBox',`0 0 ${W*CELL} ${H*CELL}`);
  buildSensors();

  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(grid[y][x]==='S') bot={x:x*CELL+CELL/2,y:y*CELL+CELL/2,a:0};
    if(grid[y][x]==='E') goal={x:x*CELL+CELL/2,y:y*CELL+CELL/2};
  }
  const FILL={'#':'#3c4a6a','G':'#2f7f8e','B':'#23262e','M':'#7a6a4a','C':'#6a5a52'};
  let w='';
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const c=grid[y][x];
    if(FILL[c]) w+=`<rect x="${x*CELL}" y="${y*CELL}" width="${CELL}" height="${CELL}" fill="${FILL[c]}"/>`;
  }
  $('gWall').innerHTML=w; $('gWall').setAttribute('opacity','0');
  // 도착지 — 초록 동그라미 두 개였던 것을 착륙 비컨으로. 어두운 화면에서 멀리서도 눈에 걸려야 한다.
  const go=`${goal.x}px ${goal.y}px`;
  $('gGoal').innerHTML=`
    <circle cx="${goal.x}" cy="${goal.y}" r="30" fill="url(#goalAura)"/>
    <g class="goal-pulse"   style="transform-origin:${go}"><circle cx="${goal.x}" cy="${goal.y}" r="9" fill="none" stroke="#3ddc84" stroke-width="2.2"/></g>
    <g class="goal-pulse b" style="transform-origin:${go}"><circle cx="${goal.x}" cy="${goal.y}" r="9" fill="none" stroke="#3ddc84" stroke-width="2.2"/></g>
    <circle class="goal-scan" style="transform-origin:${go}" cx="${goal.x}" cy="${goal.y}" r="14"
      fill="none" stroke="#8bf0b4" stroke-width="1.5" stroke-dasharray="5 7" opacity=".8"/>
    <circle cx="${goal.x}" cy="${goal.y}" r="7.5" fill="rgba(10,40,26,.85)" stroke="#3ddc84" stroke-width="1.6"/>
    <circle class="goal-core" cx="${goal.x}" cy="${goal.y}" r="3.4" fill="#c9ffe2"/>`;
  $('gMark').innerHTML=''; $('gBeam').innerHTML=''; $('gHit').innerHTML=''; lastHit=null;
  $('gTrail').setAttribute('points','');
  /* 로봇 = 톱다운 차체 + 같은 시점으로 다시 만든 방향성 CARI.
     CARI와 차체 모두 로컬 기준 오른쪽(초음파 출력 방향)을 바라보고 함께 회전한다.
     ⛔ 방향 표시를 따로 그리지 말 것 — **차체 그림 앞쪽에 청록 부채꼴이 이미 그려져 있다.**
        세모를 덧붙였다가 방향 표시가 두 벌이 됐다(판독기 소켓과 같은 실수).
     ⚠️ 어두운 후광이 발광보다 먼저다. 파란 발광만 깔면 남색 바닥 위 파란 로봇이라 실루엣이 안 산다 —
        어두운 원반이 배경을 죽여야 차체 윤곽이 뜬다. */
  $('gBot').innerHTML=
    '<g id="botG">'
    + '<circle r="24" fill="rgba(2,6,14,.72)"/>'
    + '<circle class="botglow" r="26" fill="url(#botAura)"/>'
    + '<circle r="'+BOT_R+'" fill="#cfe8ff" opacity=".75"/>'
    + '<g id="botDir">'
    +   '<image href="/games/feel-cari-rover-base-v1.webp" x="-27" y="-27" width="54" height="54" preserveAspectRatio="xMidYMid meet"/>'
    /* 머리는 정가운데가 아니라 **링 구멍 중심**에 앉힌다.
       ⚠️ 로버 그림의 구멍은 캔버스 한가운데가 아니다 — 실측 (43.81%, 48.88%) 이라
          54px 로 놓았을 때 로컬 좌표로 (-3.34, -0.61) 이다. 머리를 (0,0) 에 두면 그 차이만큼
          **앞으로 나가 보인다**(앞이 +x 라서). 그래서 x·y 를 그만큼 뺀 값이다.
          대칭으로 보인다고 -13/-13 으로 되돌리지 말 것. 로버 그림을 갈면 다시 재야 한다. */
    +   '<image href="/games/feel-cari-head-topdown-v2.webp" x="-16.34" y="-13.61" width="26" height="26" preserveAspectRatio="xMidYMid meet"/>'
    + '</g>'
    + '</g>';
  botG=$('botG'); botDir=$('botDir');

  $('fb').classList.remove('on');
  running=true; lastT=performance.now();
  cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
}

/* ===================== 루프 ===================== */
function loop(){
  if(!running) return;
  const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  const nowS=now/1000;

  /* 조작 = **민 방향으로 간다.** 차체는 가는 쪽으로 빠르게 돌아선다(TURN=520도/s ≈ 0.35초에 반바퀴).
     ⛔ 옛 탱크식(좌우=제자리 회전, 위=전진, 아래=무반응)으로 되돌리지 말 것 — 모바일에서
        "오른쪽으로 당겼는데 오른쪽으로 안 간다"·"아래로 당기면 아무 일도 없다"로 읽혀
        조작을 이해하지 못한다(2026-08-19 실기기에서 확인).
     ⚠️ 각도 차는 반드시 atan2(sin,cos) 로 접는다. 그냥 빼면 179°→-179° 같은 경계에서
        먼 쪽으로 한 바퀴 돌아간다.
     ⚠️ 즉시 스냅이 아니라 최대 회전량으로 제한한다 — 스냅하면 센서 부채꼴이 순간이동해서
        어디를 훑었는지 눈으로 못 따라간다(이 게임은 그 궤적이 곧 지도다). */
  touching=false;
  let ix=joyX+((held.r?1:0)-(held.l?1:0));
  let iy=joyY+((held.d?1:0)-(held.u?1:0));
  let driveInput=Math.hypot(ix,iy);
  if(driveInput>1){ ix/=driveInput; iy/=driveInput; driveInput=1; }
  if(driveInput>DEADZONE){
    let diff=Math.atan2(iy,ix)-bot.a;
    diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    const maxTurn=TURN*dt*D2R;
    bot.a += Math.abs(diff)<=maxTurn ? diff : Math.sign(diff)*maxTurn;
  }
  if(driveInput>DEADZONE){
    const step=SPEED*driveInput*dt;
    const nx=bot.x+Math.cos(bot.a)*step, ny=bot.y+Math.sin(bot.a)*step;
    if(hitsWall(nx,ny)){
      touching=true;
      // 범퍼를 켜뒀으면 접촉이 곧 정보다 — 벽을 지도에 남기고 위치 추정을 다시 잡는다.
      if(on.bump){
        addMark(bot.x+Math.cos(bot.a)*BOT_R, bot.y+Math.sin(bot.a)*BOT_R, SENSORS.bump.c, SENSORS.bump.dotR, 0);
        err.x*=0.3; err.y*=0.3;
      }
      if(now>bumpUntil){
        hits++; $('hitEl').textContent=hits;
        bumpUntil=now+900;
        flashHitCell();
        $('view').classList.add('bump');
        setTimeout(()=>{ $('view').classList.remove('bump'); },700);
        if(hits>=MAX_HIT) return fail('부딪힘 3번');
      }
      bot.x-=Math.cos(bot.a)*1.6; bot.y-=Math.sin(bot.a)*1.6;
    } else {
      bot.x=nx; bot.y=ny;
      // 미끄러운 바닥 — 바퀴가 헛돌아 "내가 아는 내 위치"가 한쪽으로 밀린다(오도메트리 드리프트).
      if(envOn('slip')){ err.x+=Math.cos(driftDir)*0.09; err.y+=Math.sin(driftDir)*0.09; }
    }
    const last=trail[trail.length-1];
    if(!last||Math.hypot(last[0]-estX(),last[1]-estY())>4){
      trail.push([estX(),estY()]);
      trailStr+=(trailStr?' ':'')+estX().toFixed(1)+','+estY().toFixed(1);
      $('gTrail').setAttribute('points',trailStr);
    }
  }

  // 배터리 — 켜둔 센서만큼 닳는다
  const rate=drainRate();
  batt=Math.max(0,batt-rate*dt);
  $('battFill').style.width=(batt/BATT_MAX*100)+'%';
  $('battPct').textContent=Math.ceil(batt)+'%';
  $('battRate').textContent=rate?('-'+rate.toFixed(1)+'/s'):'0.0/s';
  $('battBox').classList.toggle('low',batt<30);
  if(batt<=0) return fail('배터리 방전');

  const beams=[]; let anyOn=false;
  Object.keys(SENSORS).forEach(k=>{
    const S=SENSORS[k], box=$('s_'+k), el=$('v_'+k);
    if(!on[k]) return;
    anyOn=true;
    if(dead(k)){ box.classList.add('dead'); box.classList.remove('near','touch');
      el.textContent='먹통'; return; }
    box.classList.remove('dead');
    if(S.contact){ box.classList.add('touch');
      el.textContent=touching?'접촉!':'닿지 않음'; return; }
    const m=meas[k]||(meas[k]={d:S.range,seg:[],sm:null,r:undefined,t:-9});
    const op = S.rays>12 ? '2e' : S.rays>4 ? '44' : '66';

    if(S.spin){
      // ── 회전 스캔 (라이다) ────────────────────────────────
      // 실제 라이다는 빙글 돌며 훑는다. 그래서 **한 바퀴 돌아야 사방이 보이고**,
      // 빨리 움직이면 도는 사이에 로봇이 이동해 지도가 뒤틀린다. 그게 이 센서의 값과 대가다.
      const from=scanA, to=scanA+S.spin*dt;
      for(let a=Math.ceil(from/1.6)*1.6;a<to;a+=1.6){
        const r=ray(k,bot.a+a*D2R);
        if(r.hit) addMark(r.x,r.y,S.c,S.dotR,S.jit);
      }
      if(Math.floor(to/360)>Math.floor(from/360)){ m.d=ray(k,bot.a).d; m.t=nowS; } // 정면은 한 바퀴에 한 번만 갱신
      scanA=to;
      const sa=bot.a+(to%360)*D2R;
      beams.push(`<line x1="${estX()}" y1="${estY()}" x2="${estX()+Math.cos(sa)*S.range}" y2="${estY()+Math.sin(sa)*S.range}" stroke="${S.c}88" stroke-width="1.6"/>`);
    } else if(nowS-m.t >= (S.tick||0)){
      // ── 펄스/셔터 ─────────────────────────────────────────
      // 초음파는 메아리를 기다리고 카메라는 셔터를 연다. tick 이 0 인 적외선·레이더만 실시간이다.
      // ⚠️ 잰 결과는 **로봇 기준 상대 거리**로만 담는다. 절대 좌표로 담아두면 로봇이 앞서 나갈 때
      //   부채꼴이 뒤에 못 박혀 툭툭 끊겨 보인다 — 지연이 아니라 고장으로 읽힌다.
      m.t=nowS; m.seg=[];
      m.d=ray(k,bot.a).d;
      rayAngles(k).forEach(ad=>{
        const r=ray(k,bot.a+ad*D2R);
        if(r.hit) addMark(r.x,r.y,S.c,S.dotR,S.jit);
        m.seg.push(r.d);
      });
      if(S.tick) box.classList.add('ping'), setTimeout(()=>box.classList.remove('ping'),110);
    }
    // ⚠️ 그리는 모양이 곧 그 센서가 아는 것의 정확도다. 선으로 그리면 "그 방향을 정확히 쟀다"는 뜻이라
    //   원뿔로 퍼지는 센서를 선으로 그리면 물리를 거꾸로 가르친다.
    // ⚠️ 그리는 거리는 목표값으로 **부드럽게 따라간다**. 측정 순간에 툭 바꾸면 눈엔 버벅임으로 보인다 —
    //   지연은 숫자와 펄스 링으로 보여주고, 도형은 매끄럽게 움직이게 한다.
    const cx=estX(), cy=estY(), k2=Math.min(1,dt*7);
    m.r = m.r===undefined ? m.d : m.r+(m.d-m.r)*k2;
    if(!m.sm) m.sm=m.seg.slice();
    m.seg.forEach((v,i)=>{ m.sm[i] = m.sm[i]===undefined ? v : m.sm[i]+(v-m.sm[i])*k2; });

    if(S.cone){
      // 소리·전파 — 원뿔로 퍼진다. 거리는 알아도 **그 안 어디인지는 모른다** → 균일한 부채꼴
      const half=S.fov/2*D2R, R=Math.max(6,m.r);
      const a0=bot.a-half, a1=bot.a+half;
      beams.push(`<path d="M ${cx},${cy} L ${cx+Math.cos(a0)*R},${cy+Math.sin(a0)*R}`
        +` A ${R},${R} 0 0 1 ${cx+Math.cos(a1)*R},${cy+Math.sin(a1)*R} Z"`
        +` fill="${S.c}" opacity="${S.fuzzy?.13:.20}" stroke="${S.c}55" stroke-width="1"/>`);
      // 펄스 링 — "지금 쐈다"가 보여야 값이 계단처럼 뛰는 이유가 납득된다.
      // ⚠️ 한 겹만 그리면 "툭 하나 나가고 한참 조용" 으로 보인다. 실제 초음파는 한 번 쏠 때
      //   40kHz 펄스를 **여덟 개 묶음**으로 내보내므로, 겹쳐 퍼지는 파동으로 그리는 쪽이 맞다.
      const age=nowS-m.t, life=S.tick*0.85;
      if(S.tick) for(let b=0;b<(S.burst||1);b++){
        const t2=age-b*0.075;
        if(t2<0||t2>=life) continue;
        const p=t2/life, rr=Math.max(6,m.r*p);
        beams.push(`<path d="M ${cx+Math.cos(a0)*rr},${cy+Math.sin(a0)*rr}`
          +` A ${rr},${rr} 0 0 1 ${cx+Math.cos(a1)*rr},${cy+Math.sin(a1)*rr}"`
          +` fill="none" stroke="${S.c}" stroke-width="${2-b*0.4}" opacity="${(1-p)*0.7*(1-b*0.24)}"/>`);
      }
    } else if(S.area && m.sm.length){
      // 카메라 — 각도는 정확하고(그림이니까) 거리가 어림이다 → 벽 모양을 따라가는 면
      const ang=rayAngles(k);
      beams.push(`<path d="M ${cx},${cy} L `
        +m.sm.map((d,i)=>{ const a=bot.a+ang[i]*D2R;
            return (cx+Math.cos(a)*d).toFixed(1)+','+(cy+Math.sin(a)*d).toFixed(1); }).join(' L ')
        +` Z" fill="${S.c}" opacity=".14" stroke="${S.c}44" stroke-width="1"/>`);
    } else if(!S.spin){
      // 레이저·적외선 — 진짜 직선. 한 점을 정확히 집는다
      const ang=rayAngles(k);
      m.sm.forEach((d,i)=>{ const a=bot.a+ang[i]*D2R;
        beams.push(`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*d}" y2="${cy+Math.sin(a)*d}" stroke="${S.c}${op}" stroke-width="1.3"/>`); });
    }

    // 레이더는 해상도가 낮아 값이 뭉뚱그려진다 — 있다는 건 알아도 정확히 어디인지는 흐리다.
    const shown = S.fuzzy ? m.d+(Math.random()-0.5)*S.fuzzy : m.d;
    el.innerHTML=Math.round(Math.max(0,shown)/2)+'<small>cm</small>';
    box.classList.toggle('near',shown<32);
  });
  $('blindTag').classList.toggle('hidden',anyOn);
  flushMarks();
  $('gBeam').innerHTML=beams.join('');
  // ⚠️ 로봇은 transform 만 갱신한다. innerHTML 로 다시 그리면 매 프레임 SVG 를 새로 파싱한다.
  // CARI는 화면에 똑바로 유지하고, 주행 방향 표시만 회전시킨다.
  if(botG) botG.setAttribute('transform',`translate(${estX()},${estY()})`);
  if(botDir) botDir.setAttribute('transform',`rotate(${bot.a/D2R})`);

  // 나침반도 로봇이 **믿는 위치** 기준이다 — 그래서 미끄러지면 방향까지 틀어진다.
  const ga=Math.atan2(goal.y-estY(),goal.x-estX())-bot.a;
  $('cArrow').setAttribute('transform',`rotate(${ga/D2R+90} 12 12)`);
  $('cDist').textContent=Math.round(Math.hypot(goal.x-estX(),goal.y-estY())/2)+'cm';

  if(Math.hypot(goal.x-bot.x,goal.y-bot.y)<CELL*0.7) return clear();
  raf=requestAnimationFrame(loop);
}

/** 감지 지점 누적.
 *  · 로봇이 **믿는 위치** 기준으로 찍히므로 드리프트가 쌓이면 지도가 통째로 어긋난다.
 *  · 점 크기·흐림이 센서마다 다르다 — 라이다는 가늘고 또렷한 윤곽을, 레이더는 뭉개진 덩어리를 남긴다.
 *    **같은 벽을 훑어도 남는 지도가 다르다는 게 이 게임에서 센서 차이를 보여주는 핵심이다.** */
function addMark(x,y,c,r,jit){
  const rad=r||1.9;
  if(jit){ x+=(Math.random()-0.5)*jit; y+=(Math.random()-0.5)*jit; }
  const g=Math.max(3,Math.round(rad*1.7));   // 점이 클수록 성기게 눌러 담는다(안 그러면 큰 점이 화면을 덮는다)
  const kx=Math.round((x+err.x)/g), ky=Math.round((y+err.y)/g), key=c+kx+','+ky;
  // ⚠️ 중복 검사는 반드시 Set 이어야 한다. 배열 indexOf 로 두면 라이다가 매 프레임 수십 번 찍는 동안
  //   점 수만큼 선형 탐색이 돌아서, 지도가 채워질수록 게임이 느려진다(실제로 렉이 났다).
  if(marks.has(key)) return;
  marks.add(key);
  if(markDom>=MARK_MAX) return;              // DOM 노드 상한 — 원소가 너무 많아도 렌더가 느려진다
  markDom++;
  const n=document.createElementNS('http://www.w3.org/2000/svg','circle');
  n.setAttribute('cx',kx*g); n.setAttribute('cy',ky*g); n.setAttribute('r',rad);
  n.setAttribute('fill',c); n.setAttribute('opacity',jit?'.42':'.78');
  markFrag.appendChild(n);                   // 프레임당 한 번만 붙인다(아래 flushMarks)
}
/** 이 프레임에 생긴 점들을 한 번에 붙인다 — appendChild 를 점마다 하면 레이아웃이 그만큼 돈다. */
function flushMarks(){ if(markFrag.childNodes.length) $('gMark').appendChild(markFrag); }

/* ===================== 판정 ===================== */
function noteLearned(){
  const r=LEVELS[LI].reveals||{};
  Object.keys(r).forEach(k=>{
    if(!on[k]&&!usedOnce[k]) return;      // 켜본 적 있는 센서만 배운다
    learned[k]=learned[k]||[];
    if(learned[k].indexOf(r[k])<0) learned[k].push(r[k]);
  });
}
let usedOnce={};
function stop(){ running=false; cancelAnimationFrame(raf); held={u:0,d:0,l:0,r:0}; joyX=0; joyY=0;
  document.querySelectorAll('.ctl').forEach(b=>b.classList.remove('on')); }

function clear(){
  Object.keys(on).forEach(k=>{ if(on[k]) usedOnce[k]=1; });
  stop(); noteLearned();
  const st=hits===0?3:hits<=2?2:1;
  starsPer[LI]=st;
  $('gWall').setAttribute('opacity','.35');
  $('fb').className='fb on';
  $('fbTtl').textContent=hits===0?'한 번도 안 부딪혔다':'도착';
  $('fbStar').innerHTML=starStr(st);
  $('fbWhy').innerHTML=LEVELS[LI].after+' <em>배터리 '+Math.ceil(batt)+'% 남음.</em>';
  $('fbBtn').textContent=LI+1>=LEVELS.length?'결과 보기':'다음 구역 ›';
  $('fb').dataset.ok='1';
  if(window.MGBridge) MGBridge.submit(LI+1,{timed:true}); // 랭킹: 도달 구역(동률=시간)
}
function fail(why){
  Object.keys(on).forEach(k=>{ if(on[k]) usedOnce[k]=1; });
  stop(); noteLearned();
  $('gWall').setAttribute('opacity','.35');
  $('fb').className='fb no on';
  $('fbTtl').textContent=why;
  $('fbStar').innerHTML='';
  const deads=Object.keys(SENSORS).filter(k=>on[k]&&dead(k)).map(k=>SENSORS[k].nm);
  $('fbWhy').innerHTML = deads.length
    ? `<em>${deads.join(' · ')}</em> 을(를) 켜둔 채였다. 이 환경에선 먹통인데 전기는 그대로 먹는다.`
    : (why==='배터리 방전'
       ? '센 센서를 오래 켜뒀다. <em>필요할 때만 켜고 끄면</em> 훨씬 오래 간다.'
       : '켜둔 센서로는 이 장애물이 안 잡혔다. <em>무엇이 안 보였는지</em> 생각하고 다른 걸 켜라.');
  $('fbBtn').textContent='다시 들어가기';
  $('fb').dataset.ok='0';
}

/* ===================== 조종 ===================== */
/* 하나의 아날로그 조이스틱: 위로 밀면 전진, 좌우로 밀면 차체 회전.
   Pointer Events라 터치·펜·PC 마우스가 같은 코드로 동작한다. */
const joy=$('joystick'), joyKnob=$('joyKnob');
let joyPointer=null;
function resetJoy(){ joyX=0; joyY=0; joyPointer=null; joyKnob.style.transform='translate(0,0)'; }
function moveJoy(e){
  if(joyPointer!==e.pointerId) return;
  const r=joy.getBoundingClientRect(), radius=r.width*.34;
  let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  const d=Math.hypot(dx,dy); if(d>radius){dx*=radius/d;dy*=radius/d;}
  // 민 방향 그대로 넘긴다(위가 -y). 회전·전진으로 쪼개지 않는다 — 쪼개면 옛 탱크 조작이 된다.
  joyX=dx/radius; joyY=dy/radius;
  joyKnob.style.transform=`translate(${dx}px,${dy}px)`;
}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e);});
joy.addEventListener('pointermove',moveJoy);
['pointerup','pointercancel','lostpointercapture'].forEach(t=>joy.addEventListener(t,resetJoy));
/* 화살표도 조이스틱과 같은 뜻이다 — 누른 방향으로 간다(두 개 같이 누르면 대각선).
   ⚠️ 좌우를 회전으로 두면 키보드와 스틱이 서로 다른 조작이 되어, PC 로 익힌 감각이 모바일에서 안 통한다. */
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){held.l=1;e.preventDefault();} if(e.key==='ArrowRight'){held.r=1;e.preventDefault();}
  if(e.key==='ArrowUp'){held.u=1;e.preventDefault();} if(e.key==='ArrowDown'){held.d=1;e.preventDefault();}
  const n=parseInt(e.key,10); if(n>=1&&n<=6){ const k=Object.keys(SENSORS)[n-1]; $('s_'+k)&&$('s_'+k).click(); }
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft')held.l=0; if(e.key==='ArrowRight')held.r=0;
  if(e.key==='ArrowUp')held.u=0; if(e.key==='ArrowDown')held.d=0;
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden){held={u:0,d:0,l:0,r:0};resetJoy();} });

/* ===================== 흐름 ===================== */
function openBrief(){
  const l=LEVELS[LI];
  $('zName').textContent=(LI+1)+'구역 · '+l.name;
  const envTxt=l.envs.map(e=>ENVLBL[e]).join(' · ');
  $('zEnv').textContent=envTxt; $('zEnv').classList.toggle('hidden',!envTxt);
  $('zDesc').innerHTML=l.desc;
  const hint=zoneHints(l);
  const chip=(o,cls)=>`<span class="zc ${cls}" style="--c:${SENSORS[o.k].c}"><i></i>${SENSORS[o.k].nm}<em>${o.why}</em></span>`;
  $('zHints').innerHTML =
      (hint.bad.length ? `<div class="zrow bad"><h5>여기선 먹통</h5><div>${hint.bad.map(o=>chip(o,'b')).join('')}</div></div>` : '')
    + (hint.good.length? `<div class="zrow good"><h5>여기선 유리</h5><div>${hint.good.map(o=>chip(o,'g')).join('')}</div></div>` : '')
    + (!hint.bad.length && !hint.good.length ? `<div class="zrow all">여기선 <b>어떤 센서든 다 통한다</b></div>` : '');
  const ks=Object.keys(learned).filter(k=>learned[k].length);
  $('zKnown').classList.toggle('hidden',!ks.length);
  $('zKnownBody').innerHTML=ks.map(k=>
    `<div><b style="color:${SENSORS[k].c}">${SENSORS[k].nm}</b> — ${learned[k].join(' · ')}</div>`).join('');
  $('brOv').classList.remove('hidden');
}
$('zGo').onclick=()=>{ $('brOv').classList.add('hidden'); loadLevel(); };
$('startBtn').onclick=()=>{ $('startOv').classList.add('hidden'); LI=0; starsPer=[]; learned={}; usedOnce={}; openBrief(); };
$('fbBtn').onclick=()=>{
  const ok=$('fb').dataset.ok==='1';
  $('fb').classList.remove('on');
  if(!ok) return loadLevel();           // 실패 — 같은 구역 다시
  if(LI+1>=LEVELS.length){
    const tot=starsPer.reduce((a,b)=>a+(b||0),0), full=LEVELS.length*3;
    $('oArt').innerHTML='';
    // ⚠️ 구역 수를 문구에 박지 말 것 — LEVELS 를 늘리면 '다섯 구역 통과'가 그대로 남는다(실제로 그랬다).
    $('oTtl').textContent=LEVELS.length+'개 구역 통과';
    $('oStars').innerHTML=starStr(tot/full*3);
    $('oLab').textContent='별 '+tot+' / '+full;
    $('overOv').classList.remove('hidden');
  } else { LI++; openBrief(); }
};
$('oAgain').onclick=()=>{ $('overOv').classList.add('hidden'); LI=0; starsPer=[]; learned={}; usedOnce={}; openBrief(); };

$('sArt').innerHTML='';
buildSensors();
</script>

<!-- ===== 앱 브리지: 랭킹 버튼 + 점수 전송 ===== -->
<script>
(function(){
  var EMBED=window.parent!==window, T0=Date.now();
  function post(m){ if(EMBED) window.parent.postMessage(m,window.location.origin); }
  window.MGBridge={submit:function(v,opts){
    if(typeof v!=='number'||!isFinite(v)) return;
    post({t:'mg:score',score:v,tieMs:(opts&&opts.timed&&T0)?(Date.now()-T0):undefined});
  }};
  function mount(id){
    var ov=document.getElementById(id); if(!ov||ov.querySelector('.mg-rank')) return;
    var b=document.createElement('button');
    b.type='button'; b.className='mg-rank'+(EMBED?' on':'');
    b.setAttribute('aria-label','이 게임 랭킹 보기');
    b.innerHTML='<span aria-hidden="true">🏆</span><span class="rank-label">랭킹</span>';
    b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();post({t:'mg:rank'});});
    ov.appendChild(b);
  }
  mount('startOv'); mount('overOv');
  var intro=document.getElementById('startOv');
  if(intro) intro.addEventListener('click',function(e){
    if(e.target.closest&&e.target.closest('.mg-rank')) return;
    T0=Date.now();
  });
})();
</script>
