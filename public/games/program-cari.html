<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>프로그램해라 CARI</title>
<style>
:root{
  --page:#e9eff9; --bg:#fbfaf5; --ink:#28324c; --sub:#7c869e;
  --brand:#004ac6; --brand-hi:#1b55d0; --line:#e6e9f3;
  --good:#12b58c; --bad:#f2664f; --skip:#e59b17;
  --cream:#ece9e0;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:radial-gradient(120% 80% at 50% -10%, #152d53 0%, #09172c 68%);
  color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
  display:flex; align-items:center; justify-content:center; min-height:100%; overflow:hidden; user-select:none;
}
.stage{
  position:relative; width:min(460px,100vw); height:min(860px,100vh);
  display:flex; flex-direction:column; background:#d9e6f3 url('program-cari-workshop-ui-v7.webp') center/100% 100% no-repeat;
  box-shadow:0 0 60px rgba(70,90,140,.25); overflow:hidden;
}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:transparent;}
.hud,.goaltxt,.gridwrap,.progtitle,.program,.palette,.controls,.takeaway{position:relative;z-index:1;}
.art{width:100%;height:100%;display:block;}
.btn{padding:15px 44px; border-radius:30px; border:0; cursor:pointer;
  background:linear-gradient(120deg,#1b55d0,#004ac6); color:#fff; font-size:17px; font-weight:800;
  box-shadow:0 10px 24px rgba(0,74,198,.32);}
.btn:active{transform:scale(.97);}
.btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--line);box-shadow:none;}

/* overlays */
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:26px;
  background:radial-gradient(120% 80% at 50% -10%, #eff4fc 0%, #e3ebf7 60%);}
.overlay.hidden{display:none;}
.float{width:138px;height:138px;animation:bob 2.6s ease-in-out infinite;display:flex;align-items:center;justify-content:center;}
.float img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 16px rgba(27,63,125,.22));}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.t1{font-size:34px;font-weight:900;letter-spacing:-1px;margin:14px 0 0;}
.t2{font-size:34px;font-weight:900;letter-spacing:-1px;margin:0 0 6px;
  background:linear-gradient(90deg,#1b55d0,#3f8bff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.tag{color:var(--sub);font-size:15px;font-weight:600;margin-bottom:18px;}
.rules{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;
  text-align:left;box-shadow:0 8px 22px rgba(70,90,140,.10);max-width:330px;}
.rules div{font-size:14px;color:var(--ink);margin:7px 0;font-weight:600;line-height:1.35;}
.rules b{color:var(--brand);}
#startOv{justify-content:center;padding:38px 24px 22px;background:url('program-cari-intro-bg-v7.webp') center/cover no-repeat;color:#17345d;}
#startOv .float{width:178px;height:202px;margin-bottom:0;animation:bob 2.8s ease-in-out infinite;}
#startOv .intro-title{font-family:"Arial Black","Malgun Gothic",system-ui,sans-serif;font-size:41px;font-weight:1000;line-height:1.12;letter-spacing:-2.5px;transform:none;margin:4px 0 0;text-shadow:0 3px 0 #fff,0 6px 12px rgba(34,73,120,.24);white-space:nowrap;}
#startOv .intro-title .t1{color:#102d57;-webkit-text-stroke:0;text-shadow:0 3px 0 #fff,0 6px 12px rgba(34,73,120,.24);}
#startOv .intro-title .t2{background:linear-gradient(180deg,#fff5b8,#ffc945 55%,#e99000);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(78,45,0,.45);}
#startOv .tag{color:#31577e;margin:13px 0 12px;text-shadow:0 1px 0 #fff;}
#startOv .rules{width:340px;max-width:88vw;padding:12px 19px;background:rgba(4,25,61,.88);border:1px solid #54c9ff;color:#fff;
  box-shadow:inset 0 0 18px rgba(33,151,255,.16),0 10px 25px rgba(0,7,28,.45);}
#startOv .rules div{color:#e9f6ff;margin:5px 0;font-size:13px;}#startOv .rules b{color:#63dcff;}
#startOv #startBtn{width:190px;height:60px;margin-top:12px!important;padding:0;text-align:center;background:url('reach-cari-start-btn-v3.webp') center/100% 100% no-repeat;
  border:0;border-radius:0;box-shadow:none;filter:drop-shadow(0 8px 11px rgba(0,8,32,.5));text-shadow:0 2px 5px #001244;}

/* HUD */
.hud{position:absolute;left:48px;right:48px;top:24px;height:102px;margin:0;padding:0;background:none;filter:none;}
.hud>div{position:absolute;top:50%;transform:translateY(-48%);text-align:center;}
.hud>div:first-child{left:7%;width:27%;}.hud .mid{left:36%;width:28%;}.hud .slots{left:65%;width:28%;}
.hud .lv{font-size:12px;color:#9bd4ff;font-weight:800;}
.hud .lvn{font-size:23px;font-weight:950;color:#fff;}
.hud .mid{text-align:center;font-size:14px;font-weight:850;color:#fff;}
.hud .slots{text-align:center;}
.hud .slots .n{font-size:24px;font-weight:950;color:#79dfff;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(37,185,255,.55);}
.hud .slots .lab{font-size:12px;color:#9bd4ff;font-weight:800;}
.hud .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.hud .runs{font-size:11px;color:#9bd4ff;font-weight:800;display:flex;align-items:center;gap:4px;}
.hud .runs i{display:inline-block;width:9px;height:9px;border-radius:50%;background:rgba(155,212,255,.25);box-shadow:inset 0 0 0 1px rgba(155,212,255,.5);}
.hud .runs i.on{background:#79dfff;box-shadow:0 0 6px rgba(37,185,255,.8);}
/* 튜토리얼 — 지어라·닿아라와 같은 방식: 지금 할 것 하나만 빛나고, 안내 한 줄이 격자 위에 뜬다. */
.tutmsg{position:absolute;left:54px;right:54px;top:140px;z-index:6;display:none;padding:8px 12px;border-radius:12px;
  background:linear-gradient(#143563,#0d2145);border:1.5px solid rgba(238,233,220,.5);color:#e9f7ff;font-size:12.5px;font-weight:800;line-height:1.35;
  box-shadow:0 4px 12px rgba(0,20,60,.35);text-align:center;}
.tutmsg b{color:#ffd253;}
.tutmsg.on{display:block;}
.tut-help{position:absolute;right:18px;top:196px;z-index:6;width:30px;height:30px;padding:0;border-radius:50%;cursor:pointer;
  border:1.5px solid rgba(238,233,220,.5);background:linear-gradient(#143563,#0d2145);color:#ffd253;font:900 15px/1 system-ui,-apple-system,sans-serif;
  box-shadow:0 3px 0 rgba(4,14,32,.4),inset 0 1px 0 rgba(255,255,255,.16);}
.tut-help.quit{color:#ffb0a0;font-size:14px;}
@keyframes tutring{0%,100%{box-shadow:0 0 0 3px #ffd253,0 0 10px 2px rgba(255,210,83,.5)}50%{box-shadow:0 0 0 3px #ffd253,0 0 18px 6px rgba(255,210,83,.95)}}
.tut-on{position:relative;z-index:7;animation:tutring 1.15s ease-in-out infinite;}
.pbtn.tut-on{border-radius:7px;}.slot .cnt.tut-on{z-index:8;}
#startOv #btnTutIntro{margin-top:10px;padding:10px 26px;font-size:14px;}
.goaltxt{position:absolute;left:108px;right:108px;top:140px;height:48px;display:grid;place-items:center;font-size:14px;color:#fff;font-weight:900;padding:0 10px;text-align:center;min-height:0;
  text-shadow:0 1px 5px #00112c;}

/* grid */
.gridwrap{position:absolute;left:54px;right:54px;top:198px;height:240px;display:flex;align-items:center;justify-content:center;padding:8px;}
.grid{position:relative;background:transparent;border:0;border-radius:0;box-shadow:none;}
.cell{position:absolute;border-radius:8px;}
.tile{background:linear-gradient(145deg,#eff9ff,#bcd9ef);border:1px solid rgba(255,255,255,.72);
  box-shadow:inset 0 0 0 1px rgba(70,141,205,.28),0 4px 8px rgba(0,8,28,.34),0 0 8px rgba(70,191,255,.25);}
.gap{background:transparent;}
.goal{position:absolute;pointer-events:none;display:flex;align-items:center;justify-content:center;}
.goal svg{width:72%;height:72%;}
.goal img{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 0 8px rgba(50,213,255,.78));animation:goalPulse 1.7s ease-in-out infinite;}
@keyframes goalPulse{50%{transform:scale(1.08);filter:drop-shadow(0 0 13px rgba(50,213,255,.95));}}
.item{position:absolute;pointer-events:none;display:flex;align-items:center;justify-content:center;transition:opacity .2s,transform .2s;}
.item svg{width:64%;height:64%;}
.item img{width:72%;height:72%;object-fit:contain;filter:drop-shadow(0 0 7px rgba(255,202,41,.7));}
.item.gone{opacity:0;transform:scale(.2);}
.cari{position:absolute;transition:left .26s ease,top .26s ease,transform .26s ease;z-index:5;
  display:flex;align-items:center;justify-content:center;}
.cari img{width:114%;height:114%;object-fit:contain;display:block;filter:drop-shadow(0 4px 7px rgba(0,8,28,.48));}
.cari.shock img{filter:drop-shadow(0 0 8px #ff755e) saturate(.75);}
.cari::after{content:"";position:absolute;left:5%;top:5%;width:90%;height:90%;z-index:-1;opacity:0;
  background:url('reach-cari-contact-vfx-v3.webp') center/contain no-repeat;pointer-events:none;}
.cari.stepfx::after{animation:stepBurst .3s ease-out;}
@keyframes stepBurst{0%{opacity:.95;transform:scale(.45) rotate(0)}100%{opacity:0;transform:scale(1.45) rotate(90deg)}}

/* program area */
.progtitle{display:flex;justify-content:space-between;align-items:center;padding:3px 16px;}
.progtitle .h{font-size:13px;font-weight:850;color:#fff;text-shadow:0 1px 4px #00112c;}
.progtitle .hint{font-size:10.5px;color:#b8d8f2;font-weight:650;text-shadow:0 1px 3px #00112c;}
.console{position:absolute;left:55px;right:55px;top:510px;z-index:1;height:328px;margin:0;background:none;filter:none;}
.console .progtitle{position:absolute;left:40px;right:40px;top:31px;padding:0;z-index:3;}
.console .progtitle .hint{display:none;}
.console .program{position:absolute;left:32px;right:32px;top:56px;height:77px;margin:0;background:transparent;border:0;border-radius:9px;
  padding:8px;display:flex;flex-wrap:nowrap;gap:6px;align-items:center;align-content:center;min-height:0;max-height:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;box-shadow:none;backdrop-filter:none;}
.console .program::-webkit-scrollbar{display:none;}
.console .program{gap:6px}.console .slot.simple{width:43px;height:43px;padding:0;font-size:0;line-height:0;text-shadow:none;background-size:41px 41px!important;background-position:center!important;box-shadow:none;}
.console .slot.simple>div:last-child{display:none;}
.console .slot.simple .ic{display:none}.mini:not(.iff):not(.dot):not(.chip){font-size:0;}
.console .slot.block.lp{background:linear-gradient(145deg,#f3a512,#a95d00)!important;border:1px solid #ffd76b;}.console .slot.block.iff{background:linear-gradient(145deg,#ed6a52,#9f3024)!important;border:1px solid #ffad9e;}
.program.empty{align-items:center;justify-content:center;}
.program.empty::before{content:attr(data-empty);color:#bfe8ff;font-size:13px;font-weight:850;letter-spacing:.02em;transform:translateY(-5px);}
.slot{position:relative;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;cursor:pointer;
  box-shadow:0 3px 7px rgba(40,50,80,.16);}
.slot.simple{width:44px;height:44px;}
.slot .ic{font-size:18px;line-height:1;}
.slot.run{outline:3px solid #ffd54a;outline-offset:1px;z-index:2;}
.slot.mv,.pbtn.mv,.mini.mv{background-image:url('program-cari-key-mv-v4.webp')!important;}.slot.tl,.pbtn.tl,.mini.tl{background-image:url('program-cari-key-tl-v4.webp')!important;}
.slot.tr,.pbtn.tr,.mini.tr{background-image:url('program-cari-key-tr-v4.webp')!important;}.slot.pk,.pbtn.pk,.mini.pk{background-image:url('program-cari-key-pk-v4.webp')!important;}
.slot.lp,.pbtn.lp{background-image:url('program-cari-key-lp-v4.webp')!important;}.slot.iff,.pbtn.iff,.mini.iff{background-image:url('program-cari-key-if-v4.webp')!important;}
.slot.simple,.pbtn,.mini{background-position:center!important;background-size:100% 100%!important;background-repeat:no-repeat!important;background-color:transparent!important;}
/* 배지(×N·막힘?)는 라벨 줄 안에 나란히 — 모서리에 띄우면 좁은 블록에서 라벨을 가린다 */
.slot .cnt{display:inline-block;margin-left:4px;background:#fff;color:#e59b17;border-radius:9px;vertical-align:middle;
  font-size:11px;font-weight:900;padding:2px 6px;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer;}
.slot .cnt.tut-on{transform:scale(1.15);transform-origin:left center;}
.slot.iff .cnt{color:#e0674a;}
.slot.block{flex:0 0 auto;flex-direction:column;padding:4px 5px 5px;min-width:48px;max-height:61px;gap:3px;}
.slot.block .blab{font-size:9px;font-weight:900;opacity:.95;display:flex;align-items:center;justify-content:center;white-space:nowrap;}
.slot.block .body{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;
  background:rgba(255,255,255,.22);border-radius:7px;padding:3px;min-width:26px;min-height:26px;}
.mini{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#fff;background:rgba(0,0,0,.18);}
.mini.iff{position:relative;width:auto;height:auto;min-height:26px;padding:2px 3px;gap:2px;border-radius:7px;border:1px solid #ffad9e;}
.slot .body .mini.iff{background:linear-gradient(145deg,#ed6a52,#9f3024)!important;font-size:9px;}
.mini.iff .q{font-size:9px;font-weight:900;color:#fff;padding:0 2px;white-space:nowrap;}
.mini.iff .mini{width:20px;height:20px;border-radius:5px;}
.mini.iff.open{outline:2px solid #ffd54a;outline-offset:1px;}
.mini.dot{font-size:12px!important;color:#fff;background:rgba(0,0,0,.18)!important;}
/* 글자 블록(문장 흐름) — 프로그램 칸이 두 줄 높이라 칩이 길면 다음 줄로 */
.console .program.flow{flex-wrap:wrap;align-items:flex-start;align-content:flex-start;gap:4px 3px;padding:6px 8px;overflow:hidden;}
.console .program.flow .chip{flex:0 0 auto;width:auto!important;min-width:0;height:28px!important;line-height:28px!important;padding:0 8px!important;font-size:12px!important;font-weight:850;color:#fff;white-space:nowrap;border-radius:7px;
  background-size:auto!important;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 2px 0 rgba(0,0,0,.25);display:block;cursor:pointer;}
.console .program.flow .chip.mv{background:linear-gradient(#3d8ff0,#1f5fc0)!important;}
.console .program.flow .chip.tl{background:linear-gradient(#9a6ad6,#6b3fae)!important;}
.console .program.flow .chip.tr{background:linear-gradient(#f0578f,#c22a66)!important;}
.console .program.flow .chip.pk{background:linear-gradient(#f5bd3a,#d48a0e)!important;}
.console .program.flow .chip.lp{background:linear-gradient(145deg,#f3a512,#a95d00)!important;border:1px solid #ffd76b;}
.console .program.flow .chip.iff{background:linear-gradient(145deg,#ed6a52,#9f3024)!important;border:1px solid #ffad9e;}
.console .program.flow .chip.br{padding:0 7px!important;font-size:14px!important;}
.console .program.flow .chip.dot{background:rgba(255,255,255,.14)!important;color:#cfe3ff;padding:0 6px!important;}
.console .program.flow .chip .cnt,.console .program.flow .chip .q{display:inline-block;margin:0;padding:1px 6px;font-size:11.5px;line-height:1.2;vertical-align:middle;border-radius:7px;background:#fff;}
.console .program.flow .chip.lp .cnt{color:#e59b17;}.console .program.flow .chip.iff .cnt,.console .program.flow .chip.iff .q{color:#e0674a;}
.console .program.flow .chip .cnt.tut-on{transform:none;}
.console .program.flow .chip.open{outline:2.5px solid #ffd54a;outline-offset:1px;}
.slot.open{outline:2.5px solid #ffd54a;outline-offset:1px;}

/* palette */
.palette{position:absolute!important;left:18px;right:18px;top:145px;height:58px;display:flex;flex-wrap:nowrap;gap:4px;justify-content:flex-start;padding:5px 7px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;background:transparent;border:0;border-radius:0;box-shadow:none;}
.palette::-webkit-scrollbar{display:none;}
.pbtn{width:52px;height:54px;border-radius:12px;border:0;cursor:pointer;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10px;font-weight:800;box-shadow:0 4px 9px rgba(40,50,80,.18);}
.pbtn:active{transform:scale(.94);}
.pbtn .pic{display:none;}
.pbtn:disabled{opacity:.62;cursor:default;}
.pbtn.close{background:#5b6784;}

.console .pbtn{flex:0 0 47px;width:47px;height:48px;padding:0;border-radius:7px;box-shadow:none;background-size:42px 42px!important;background-position:center!important;
  font-size:0;line-height:0;color:transparent;text-shadow:none;overflow:visible;}
.console .pbtn .pic{font-size:18px}
/* 닫기는 그림이 없는 버튼이라 글자를 되살린다 — 콘솔 스킨이 팔레트 글자를 전부 숨겨서 빈 네모로 보였다(2026-09-14 지적) */
.console .pbtn.close{position:relative;right:auto;top:auto;flex:0 0 52px;width:52px;height:44px;padding:0;background:linear-gradient(#2e4a7a,#1b2f52)!important;border:1.5px solid #9bb6d0;border-radius:9px;color:#fff;z-index:5;
  font-size:11px;line-height:1.1;font-weight:850;gap:1px;box-shadow:0 2px 0 rgba(4,14,32,.4);}
.console .pbtn.close .pic{display:block;font-size:15px;line-height:1;color:#ffd253;}
.console .pbtn.close[hidden]{display:none!important;}
.controls{position:absolute!important;left:18px;right:18px;top:232px;height:68px;display:flex;gap:23px;justify-content:center;padding:0;transform:translate(-2px,-3px);}
.controls .btn{display:grid;place-items:center;padding:0!important;line-height:1;font-size:15px;}
.controls .btn.run{flex:1;max-width:none;background:transparent;box-shadow:none;text-shadow:0 2px 4px #073d9b;border-radius:7px;font-size:18px;transform:translateY(-1px);}
.controls .btn.small{flex:0 0 25%;background:transparent;color:#174477;border:0;box-shadow:none;text-shadow:0 1px 2px #fff;border-radius:7px;font-size:15px;transform:translateY(-1px);}

/* takeaway toast */
.takeaway{position:absolute;left:50%;top:108px;bottom:auto;transform:translateX(-50%) translateY(-12px);
  background:#28324c;color:#fff;padding:12px 20px;border-radius:16px;font-size:14px;font-weight:700;
  box-shadow:0 12px 30px rgba(0,0,0,.28);z-index:15;opacity:0;transition:.35s;max-width:86%;text-align:center;
  line-height:1.4;pointer-events:none;}
.takeaway.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* result */
.result-console{position:relative;width:300px;height:507px;background:url('program-cari-result-console-v3.webp') center/100% 100% no-repeat;
  filter:drop-shadow(0 18px 25px rgba(0,7,30,.58));}
#resultOv{background:linear-gradient(rgba(238,248,255,.08),rgba(222,239,250,.18)),url('program-cari-intro-bg-v7.webp') center/cover no-repeat;}
.result-console .float{position:absolute;left:50%;top:calc(6% + 10px);transform:translateX(-50%);width:142px;height:142px;animation:none;}
.result-console .badge{position:absolute;left:12%;top:calc(32% + 10px);width:76%;text-align:center;}
.result-console .stars{position:absolute;left:12%;top:calc(38% + 10px);width:76%;text-align:center;}
.result-console .rbox{position:absolute;left:10%;top:calc(45% + 10px);width:80%;margin:0;padding:8px;background:transparent;border:0;box-shadow:none;}
.result-console .rbox .rn{color:#fff;text-shadow:0 2px 4px #00102f}.result-console .rbox .rmsg{color:#c9e8ff;}
.result-console .result-strip{position:absolute;left:13%;top:calc(65.7% + 4px);width:74%;height:7.2%;display:grid;place-items:center;
  color:#d9f5ff;font-size:16px;font-weight:950;text-shadow:0 1px 4px #001442;}
.result-console .rrow{position:absolute;left:9.5%;right:9.5%;bottom:calc(6.5% + 5px);height:66px;margin:0;display:flex;align-items:center;gap:7px;}
.result-console .rrow .btn{display:grid;place-items:center;height:100%;flex:1;padding:0 8px;background:transparent!important;color:#fff!important;border:0!important;box-shadow:none;text-shadow:0 2px 4px #001442;font-size:18px;line-height:1;}
.result-console .rrow .btn:first-child{flex:0 0 64%;}.result-console .rrow .btn:last-child{flex:1;font-size:16px;white-space:nowrap;}
.badge{font-size:26px;font-weight:900;margin:8px 0 2px;}
.badge.win{color:var(--good);} .badge.lose{color:var(--bad);}
.stars{font-size:30px;letter-spacing:4px;margin:2px 0;color:#f5c518;}

/* ===================== 상태 ===================== */
const S={lv:0, prog:[], running:false, runsLeft:0, usedRuns:0, cleared:0, log:[], runOver:false};
let openStack=[];
function curContainer(){ return openStack.length? openStack[openStack.length-1] : null; }
function lv(){return tutOn ? TUT_ROUNDS[tutRound].level : LEVELS[S.lv];}
function isTile(x,y){return lv().tiles.some(t=>t[0]===x&&t[1]===y);}
/* ===================== 격자 ===================== */
const grid=document.getElementById('grid');
let CELL=52, GAP=5, cariEl=null, itemEls={};
function buildGrid(){
  const L=lv();
  const maxW=340, maxH=238;
  CELL=Math.floor(Math.min((maxW-(L.cols-1)*GAP)/L.cols,(maxH-(L.rows-1)*GAP)/L.rows));
  CELL=Math.max(30,Math.min(CELL,58));
  const W=L.cols*CELL+(L.cols-1)*GAP, H=L.rows*CELL+(L.rows-1)*GAP;
  grid.style.width=W+'px'; grid.style.height=H+'px'; grid.innerHTML='';
  for(let y=0;y<L.rows;y++)for(let x=0;x<L.cols;x++){
    const c=document.createElement('div');
    c.className='cell '+(isTile(x,y)?'tile':'gap');
    c.style.cssText=`width:${CELL}px;height:${CELL}px;left:${x*(CELL+GAP)}px;top:${y*(CELL+GAP)}px`;
    grid.appendChild(c);
  }
  const g=document.createElement('div'); g.className='goal';
  g.style.cssText=`width:${CELL}px;height:${CELL}px;left:${L.goalPos[0]*(CELL+GAP)}px;top:${L.goalPos[1]*(CELL+GAP)}px`;
  g.innerHTML=goalSVG(); grid.appendChild(g);
  itemEls={};
  L.stars.forEach(s=>{
    const it=document.createElement('div'); it.className='item';
    it.style.cssText=`width:${CELL}px;height:${CELL}px;left:${s[0]*(CELL+GAP)}px;top:${s[1]*(CELL+GAP)}px`;
    it.innerHTML=starSVG(); grid.appendChild(it); itemEls[s[0]+','+s[1]]=it;
  });
  cariEl=document.createElement('div'); cariEl.className='cari';
  cariEl.style.cssText=`width:${CELL}px;height:${CELL}px`;
  cariEl.innerHTML=`<img src="program-cari-dir-${DIR_ASSET[L.start.dir]}-v4.webp" alt="CARI" draggable="false">`;
  grid.appendChild(cariEl);
  placeCari(L.start.x,L.start.y,L.start.dir,false);
}
function placeCari(x,y,dir,shock,fx=false){
  cariEl.style.left=(x*(CELL+GAP))+'px';
  cariEl.style.top=(y*(CELL+GAP))+'px';
  const img=cariEl.querySelector('img');
  if(img) img.src=`program-cari-dir-${DIR_ASSET[dir]}-v4.webp`;
  cariEl.style.transform=shock?'scale(.9)':'';
  cariEl.classList.toggle('shock',!!shock);
  cariEl.classList.remove('stepfx');
  if(fx){void cariEl.offsetWidth;cariEl.classList.add('stepfx');}
}
/* ===================== 프로그램 ===================== */
function countOps(list){ list=list||S.prog; let n=0; for(const ins of list){ n++; if(ins.body) n+=countOps(ins.body); } return n; }
function condLabel(c){return T(c==='blocked'?'prog.cond.blocked':'prog.cond.star');}
const programEl=document.getElementById('program');
/* 글자 블록(시안 · 2026-09-14): 프로그램 칸을 그림이 아니라 문장으로 — "전진 · 오른쪽 돌기 · 6번 반복 [ 만약 앞이 막히면 [오른쪽 돌기] · 전진 ]".
   ⚠️ 지금은 튜토리얼에서만 켜고 한국어만 박아 뒀다(번역 전). 본게임까지 갈지는 보고 정한다. */
const txtMode=()=>tutOn;
const TXT={MV:'전진',TL:'왼쪽',TR:'오른쪽',PK:'별 줍기'};
const txtCond=c=>c==='blocked'?'앞이 막히면':'별이 있으면';
/* 문장 흐름: 블록을 한 덩어리로 묶지 않고 "2번 반복 [" · "앞이 막히면 [" · "오른쪽" · "]" · "전진" · "]" 칩으로 풀어 놓아 길면 다음 줄로 넘어간다(칸이 두 줄 높이). */
function chipsHTML(list){
  let out='';
  list.forEach((ins,i)=>{
    const open=openStack.includes(ins)?' open':'';
    if(ins.op==='LP'||ins.op==='IF'){
      const lab=ins.op==='LP'?`<span class="cnt">${ins.count}번</span> 반복 [`:`<span class="cnt">${txtCond(ins.cond)}</span> [`;
      out+=`<div class="slot chip ${ins.op==='LP'?'lp':'iff'}${open}" data-i="${i}">${lab}</div>`;
      if(!ins.body.length) out+='<div class="chip dot">·</div>';
      ins.body.forEach((b,j)=>{
        if(b.op==='IF'){
          const o2=openStack.includes(b)?' open':'';
          out+=`<div class="mini chip iff${o2}" data-parent="${i}" data-child="${j}"><span class="q">${txtCond(b.cond)}</span> [</div>`;
          if(!b.body.length) out+='<div class="chip dot">·</div>';
          for(const c of b.body) out+=`<div class="mini chip ${OPS[c.op].cls}">${TXT[c.op]}</div>`;
          out+=`<div class="mini chip br iff${o2}" data-parent="${i}" data-child="${j}">]</div>`;
        } else out+=`<div class="mini chip ${OPS[b.op].cls}" data-parent="${i}" data-child="${j}">${TXT[b.op]}</div>`;
      });
      out+=`<div class="slot chip br ${ins.op==='LP'?'lp':'iff'}${open}" data-i="${i}">]</div>`;
    } else out+=`<div class="slot chip ${OPS[ins.op].cls}" data-i="${i}">${TXT[ins.op]}</div>`;
  });
  return out;
}
function miniHTML(ins,parentIdx,childIdx){
  if(ins.op==='IF'){
    // 반복 안의 조건은 알약 블록으로 — 조건 라벨(막힘?/별?) + 안에 넣은 명령을 그림 그대로. 글자 아이콘으로 접으면 뭘 넣었는지 안 보인다(2026-09-14 지적).
    const inner=ins.body.map(b=>`<div class="mini ${OPS[b.op].cls}"></div>`).join('')||'<div class="mini dot">·</div>';
    const open=openStack.includes(ins)?' open':'';
    return `<div class="mini iff${open}" data-parent="${parentIdx}" data-child="${childIdx}"><span class="q">${condLabel(ins.cond)}</span>${inner}</div>`;
  }
  return `<div class="mini ${OPS[ins.op].cls}" data-parent="${parentIdx}" data-child="${childIdx}">${OPS[ins.op].ic}</div>`;
}
function slotHTML(ins,idx){
  if(ins.op==='LP'){
    const open=openStack.includes(ins)?' open':'';
    const body=ins.body.map((b,j)=>miniHTML(b,idx,j)).join('')||'<div class="mini">·</div>';
    return `<div class="slot block lp${open}" data-i="${idx}"><div class="blab">${opLab('LP')}<span class="cnt">×${ins.count}</span></div><div class="body">${body}</div></div>`;
  }
  if(ins.op==='IF'){
    const open=openStack.includes(ins)?' open':'';
    const body=ins.body.map((b,j)=>miniHTML(b,idx,j)).join('')||'<div class="mini">·</div>';
    return `<div class="slot block iff${open}" data-i="${idx}"><div class="blab">${opLab('IF')}<span class="cnt">${condLabel(ins.cond)}</span></div><div class="body">${body}</div></div>`;
  }
  const o=OPS[ins.op];
  return `<div class="slot simple ${o.cls}" data-i="${idx}"><div class="ic">${o.ic}</div><div>${opLab(ins.op)}</div></div>`;
}
function renderProgram(){
  programEl.innerHTML=txtMode()?chipsHTML(S.prog):S.prog.map((ins,i)=>slotHTML(ins,i)).join('');
  programEl.classList.toggle('flow',txtMode());
  programEl.classList.toggle('empty',S.prog.length===0);
  document.getElementById('slotN').textContent=countOps()+'/'+lv().limit;
  tutMark();
}
/* 프로그램 칸 클릭: 배지(×N·조건) → 값 바꾸기 / 블록·명령 → 삭제 */
programEl.onclick=function(e){
  if(S.running)return;
  const mini=e.target.closest('.mini[data-parent]');
  if(mini){
    if(tutOn) return;   // 튜토리얼 중엔 지운 걸 되돌릴 안내가 없다
    const parent=S.prog[+mini.dataset.parent];
    const child=parent&&parent.body&&parent.body[+mini.dataset.child];
    if(!child)return;
    if(child.op==='IF') child.cond=child.cond==='blocked'?'star':'blocked';
    else parent.body.splice(+mini.dataset.child,1);
    renderProgram();buildPalette();return;
  }
  const slot=e.target.closest('.slot'); if(!slot)return;
  const i=+slot.dataset.i; const ins=S.prog[i]; if(!ins)return;
  if(e.target.classList.contains('cnt')){
    if(ins.op==='LP'){ ins.count = ins.count>=8?2:ins.count+2; }
    else if(ins.op==='IF'){ if(tutOn) return; ins.cond = ins.cond==='blocked'?'star':'blocked'; }
    renderProgram(); tutCheck(); return;
  }
  if(tutOn) return;
  openStack=openStack.filter(b=>b!==ins);
  S.prog.splice(i,1);
  renderProgram(); buildPalette();
};
/* ===================== 팔레트 ===================== */
const paletteEl=document.getElementById('palette');
function buildPalette(){
  const L=lv();
  let html=L.ops.map(op=>`<button class="pbtn ${OPS[op].cls}" data-op="${op}" title="${opLab(op)}"><div class="pic">${OPS[op].ic}</div>${opLab(op)}</button>`).join('');
  if(L.ops.includes('LP')||L.ops.includes('IF'))
    html+=`<button class="pbtn close" data-op="CLOSE" title="${T('prog.op.close')}"><div class="pic">✔</div>${T('prog.op.close')}</button>`;
  paletteEl.innerHTML=html;
  paletteEl.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>onOp(b.dataset.op));
  updatePalette();
}
function updatePalette(){
  const full=countOps()>=lv().limit;
  const inIf   = curContainer() && curContainer().op==='IF';
  const st=tutStep();
  paletteEl.querySelectorAll('.pbtn').forEach(b=>{
    const op=b.dataset.op;
    if(op==='CLOSE'){ b.hidden=openStack.length===0; b.disabled=openStack.length===0||(st&&st.op!=='CLOSE'); return; }
    let dis=full;
    if(op==='LP' && curContainer()) dis=true;   // 반복은 최상위에만
    if(op==='IF' && inIf) dis=true;              // 조건 안에 조건은 안 됨
    if(st && st.op && st.op!==op) dis=true;      // 튜토리얼: 지목한 것만
    b.disabled=dis;
  });
  tutMark();
}
function onOp(op){
  if(S.running)return;
  if(op==='CLOSE'){ openStack.pop(); buildPalette(); renderProgram(); tutCheck(); return; }
  if(countOps()>=lv().limit){ flashFull(); return; }
  if(op==='LP'){
    const inst={op:'LP',count:2,body:[]}; S.prog.push(inst); openStack.push(inst);
  }else if(op==='IF'){
    const inst={op:'IF',cond:'blocked',body:[]};
    const c=curContainer();
    if(c) c.body.push(inst); else S.prog.push(inst);
    openStack.push(inst);
  }else{
    const inst={op};
    const c=curContainer();
    if(c) c.body.push(inst); else S.prog.push(inst);
  }
  // 방금 넣은 명령 이름을 잠깐 보여준다 — 아이콘만으로는 뭘 넣었는지 모른다
  const hint=document.querySelector('.progtitle .hint'); if(hint){ hint.textContent=OPS[op].ic+' '+opLab(op); clearTimeout(hint._t); hint._t=setTimeout(()=>hint.textContent='',1400); }
  buildPalette(); renderProgram(); tutCheck();
}
let fullT=null;
function flashFull(){
  const n=document.getElementById('slotN'); n.style.color='var(--bad)';
  toast(T('prog.full'));
  clearTimeout(fullT); fullT=setTimeout(()=>n.style.color='var(--brand)',700);
}
/* ===================== 실행기 ===================== */
const DX=[0,1,0,-1], DY=[-1,0,1,0];
function compile(list,topIdx,out){
  for(const ins of list){
    const ti = topIdx==null ? S.prog.indexOf(ins) : topIdx;
    if(ins.op==='LP'){ for(let r=0;r<ins.count;r++) compile(ins.body,ti,out); }
    else if(ins.op==='IF'){ const body=[]; compile(ins.body,ti,body); out.push({op:'IF',cond:ins.cond,body,slot:ti}); }
    else out.push({op:ins.op,slot:ti});
  }
}
let vmTimer=null;
function renderRuns(){
  const L=lv(); const el=document.getElementById('runsEl');
  if(tutOn){ el.innerHTML=''; return; }   // 튜토리얼엔 실행 횟수가 없다
  el.innerHTML=T('prog.runs')+' '+Array.from({length:L.runs},(_,i)=>`<i class="${i<S.runsLeft?'on':''}"></i>`).join('');
}
function runProgram(){
  if(S.running)return;
  if(countOps()===0){ toast(T('prog.empty')); return; }
  if(tutStep() && !tutStep().run) return;           // 튜토리얼: 지목했을 때만 실행
  if(!tutOn && S.runsLeft<=0) return;
  openStack=[]; buildPalette(); renderProgram();
  S.running=true; if(!tutOn){ S.runsLeft--; S.usedRuns++; renderRuns(); }
  document.getElementById('runBtn').textContent=T('prog.running');
  const L=lv();
  const st={x:L.start.x,y:L.start.y,dir:L.start.dir,got:new Set()};
  const steps=[]; compile(S.prog,null,steps);
  let pc=0, guard=0;
  const hl=slot=>programEl.querySelectorAll('.slot').forEach(el=>el.classList.toggle('run',+el.dataset.i===slot));
  const aheadBlocked=()=>!isTile(st.x+DX[st.dir],st.y+DY[st.dir]);
  const starHere=()=>L.stars.some(s=>s[0]===st.x&&s[1]===st.y)&&!st.got.has(st.x+'_'+st.y);
  const atGoalDone=()=>st.x===L.goalPos[0]&&st.y===L.goalPos[1]&&L.stars.every(s=>st.got.has(s[0]+'_'+s[1]));
  function finish(win){
    S.running=false; clearInterval(vmTimer);
    programEl.querySelectorAll('.slot').forEach(el=>el.classList.remove('run'));
    document.getElementById('runBtn').textContent=T('prog.run');
    setTimeout(()=>{ if(tutOn) tutRunDone(win); else afterRun(win); },400);
  }
  vmTimer=setInterval(()=>{
    if(++guard>300){ finish(false); return; }
    if(pc>=steps.length){ finish(atGoalDone()); return; }
    const step=steps[pc]; hl(step.slot);
    if(step.op==='IF'){
      const t = step.cond==='blocked'? aheadBlocked() : starHere();
      if(t) steps.splice(pc+1,0,...step.body.map(b=>({op:b.op,slot:step.slot})));
      pc++; return;
    }
    if(step.op==='MV'){
      const nx=st.x+DX[st.dir], ny=st.y+DY[st.dir];
      if(!isTile(nx,ny)){ placeCari(st.x,st.y,st.dir,true); finish(false); return; }
      st.x=nx; st.y=ny; placeCari(st.x,st.y,st.dir,false,true);
    }else if(step.op==='TL'){ st.dir=(st.dir+3)%4; placeCari(st.x,st.y,st.dir,false);
    }else if(step.op==='TR'){ st.dir=(st.dir+1)%4; placeCari(st.x,st.y,st.dir,false);
    }else if(step.op==='PK'){
      if(starHere()){ st.got.add(st.x+'_'+st.y); const el=itemEls[st.x+','+st.y]; if(el) el.classList.add('gone'); }
    }
    if(atGoalDone()){ finish(true); return; }
    pc++;
  },330);
}
/* ===================== 토스트 ===================== */
const takeEl=document.getElementById('takeaway'); let takeT=null;
function toast(msg,ms=1600){
  takeEl.textContent=msg; takeEl.classList.add('show');
  clearTimeout(takeT); takeT=setTimeout(()=>takeEl.classList.remove('show'),ms);
}
/* ===================== 판(run) 흐름 =====================
   한 판 = 1레벨부터. 레벨마다 실행 횟수(runs)가 있고, 실패해도 횟수가 남으면 프로그램을 고쳐 다시 실행한다.
   횟수를 다 쓰면 판이 끝난다(2026-09-14 지시 — 시간 대신 실행 횟수. 생각하는 게임이라).
   기록 = 깬 레벨 수 → 같으면 명령 수 합(적을수록) → 같으면 실행 횟수 합(적을수록). 서버가 log 로 다시 센다. */
function submitRun(){
  if(window.MGBridge) MGBridge.submit(S.cleared, {timed:true, log:S.log}); // 숫자는 참고값 — 서버가 log(레벨별 프로그램·실행 횟수)로 다시 센다
}
function afterRun(win){
  const ov=document.getElementById('resultOv'); ov.classList.remove('hidden');
  document.getElementById('resCari').innerHTML=cariPNG(win?'win':'fail');
  const badge=document.getElementById('resBadge'), rn=document.getElementById('resN'), rmsg=document.getElementById('resMsg'), stEl=document.getElementById('resStars'), row=document.getElementById('resRow');
  row.innerHTML=''; stEl.textContent='';
  if(win){
    S.log.push({lv:S.lv, prog:JSON.parse(JSON.stringify(S.prog)), runs:S.usedRuns});
    S.cleared++;
    const used=countOps(), isLast=S.lv>=LEVELS.length-1;
    badge.textContent=T(isLast?'prog.all_clear':'prog.success'); badge.className='badge win';
    rn.textContent=T('prog.res_used',{n:used, m:lv().limit, r:S.usedRuns});
    rmsg.textContent=isLast?T('prog.res_all'):T('prog.res_next');
    document.getElementById('resStrip').textContent=T('prog.level_done',{n:S.lv+1});
    if(isLast){ S.runOver=true; submitRun(); }
    row.appendChild(btn(T(isLast?'prog.to_start':'prog.next'),'',()=>{ ov.classList.add('hidden'); if(isLast) goStart(); else {S.lv++; loadLevel();} }));
    row.appendChild(btn(T('prog.quit'),'ghost',()=>{ ov.classList.add('hidden'); quitRun(); }));
  }else if(S.runsLeft>0){
    badge.textContent=T('prog.fail'); badge.className='badge lose';
    rn.textContent=T('prog.lost');
    rmsg.textContent=T('prog.runs_left',{n:S.runsLeft});
    document.getElementById('resStrip').textContent=T('prog.stopped');
    row.appendChild(btn(T('prog.fix_retry'),'',()=>{ ov.classList.add('hidden'); resetCari(); }));   // 프로그램은 그대로 — 고쳐서 다시
    row.appendChild(btn(T('prog.quit'),'ghost',()=>{ ov.classList.add('hidden'); quitRun(); }));
  }else{
    // 실행 횟수 소진 → 판 끝
    S.runOver=true; submitRun();
    badge.textContent=T('prog.out_of_runs'); badge.className='badge lose';
    rn.textContent=T('prog.res_cleared',{n:S.cleared});
    rmsg.textContent=T('prog.res_over');
    document.getElementById('resStrip').textContent=T('prog.game_over');
    row.appendChild(btn(T('prog.retry_run'),'',()=>{ ov.classList.add('hidden'); startRun(); }));
    row.appendChild(btn(T('prog.to_start'),'ghost',()=>{ ov.classList.add('hidden'); goStart(); }));
  }
}
/** 그만두기 — 깬 데까지가 기록 */
function quitRun(){
  S.runOver=true; submitRun();
  const ov=document.getElementById('resultOv'); ov.classList.remove('hidden');
  document.getElementById('resCari').innerHTML=cariPNG('win');
  document.getElementById('resBadge').textContent=T('prog.here'); document.getElementById('resBadge').className='badge win';
  document.getElementById('resStars').textContent='';
  document.getElementById('resN').textContent=T('prog.res_cleared',{n:S.cleared});
  document.getElementById('resMsg').textContent=T('prog.res_here');
  document.getElementById('resStrip').textContent=T('prog.game_over');
  const row=document.getElementById('resRow'); row.innerHTML='';
  row.appendChild(btn(T('prog.retry_run'),'',()=>{ ov.classList.add('hidden'); startRun(); }));
  row.appendChild(btn(T('prog.to_start'),'ghost',()=>{ ov.classList.add('hidden'); goStart(); }));
}
function btn(txt,cls,fn){const b=document.createElement('button');b.className='btn'+(cls?' '+cls:'');b.textContent=txt;b.onclick=fn;return b;}
/* ===================== 레벨 ===================== */
function loadLevel(){
  const L=lv();
  S.prog=[]; openStack=[]; S.running=false; clearInterval(vmTimer);
  S.runsLeft=L.runs; S.usedRuns=0;
  document.getElementById('runBtn').textContent=T('prog.run');
  document.getElementById('lvNum').textContent=tutOn ? T('prog.tut_short') : (S.lv+1)+' / '+LEVELS.length;
  document.getElementById('lvName').textContent=tutOn ? L.name : lvT(S.lv,'name',L.name);
  document.getElementById('goalTxt').textContent='🎯 '+(tutOn ? L.goal : lvT(S.lv,'goal',L.goal));
  renderRuns();
  buildGrid(); buildPalette(); renderProgram();
  const teach = tutOn ? null : lvT(S.lv,'teach',L.teach||'');
  if(teach) setTimeout(()=>toast(teach,2600),450);
}
/** 실패 뒤 — CARI 만 제자리로, 프로그램은 남긴다 */
function resetCari(){ S.running=false; clearInterval(vmTimer); document.getElementById('runBtn').textContent=T('prog.run'); buildGrid(); buildPalette(); renderProgram(); }
function resetProgram(){ if(tutOn) return; S.prog=[]; openStack=[]; resetCari(); }
function startRun(){ S.lv=0; S.cleared=0; S.log=[]; S.runOver=false; loadLevel(); }
function goStart(){ document.getElementById('startOv').classList.remove('hidden'); }
/* ===================== 튜토리얼 =====================
   지어라와 같은 규칙: 눌러야 시작하고, 지금 할 것 하나만 빛나고 그것만 반응하며, 끝나면 시작한 자리로 돌아간다. 기록·실행 횟수 없음.
   다섯 라운드 — ① 앞으로·회전 ② 집기 ③ 반복(칸이 모자란 상황을 먼저 보여주고 반복으로 푼다) ④ 조건 하나만(모퉁이에서 '막혔나?' 를 본다) ⑤ 반복 안의 조건.
   ④⑤ 를 나눈 이유: 반복 안에서 조건부터 배우면 "조건이 뭔지" 를 못 잡는다(2026-09-14 지적 — "먼소리인지 모르겠다").
   각 단계 문구가 "이 블록이 뭘 하는가" 를 말한다 — 아이콘만으로는 모른다는 지적(2026-09-14). */
let tutOn=false, tutRound=0, tutIdx=0, tutFrom='intro', tutReturnLv=0;
const TUT_ROUNDS=[
  { title:T('prog.tut.r1'),
    level:{ name:T('prog.tut.r1'), goal:T('prog.tut.g1'), cols:4, rows:3, limit:6, runs:9, ops:['MV','TL','TR'], start:{x:0,y:2,dir:1}, goalPos:[2,1], stars:[], tiles:[[0,2],[1,2],[2,2],[2,1]] },
    steps:[
      { msg:T('prog.tut.s1_1'), op:'MV', done:()=>progTop().length>=1 },
      { msg:T('prog.tut.s1_2'), op:'MV', done:()=>progTop().length>=2 },
      { msg:T('prog.tut.s1_3'), op:'TL', done:()=>progTop().some(i=>i.op==='TL') },
      { msg:T('prog.tut.s1_4'), op:'MV', done:()=>progTop().length>=4 },
      { msg:T('prog.tut.s1_5'), run:true } ] },
  { title:T('prog.tut.r2'),
    level:{ name:T('prog.tut.r2'), goal:T('prog.tut.g2'), cols:4, rows:3, limit:6, runs:9, ops:['MV','TL','TR','PK'], start:{x:0,y:1,dir:1}, goalPos:[3,1], stars:[[1,1]], tiles:[[0,1],[1,1],[2,1],[3,1]] },
    steps:[
      { msg:T('prog.tut.s2_1'), op:'MV', done:()=>progTop().length>=1 },
      { msg:T('prog.tut.s2_2'), op:'PK', done:()=>progTop().some(i=>i.op==='PK') },
      { msg:T('prog.tut.s2_3'), op:'MV', done:()=>progTop().filter(i=>i.op==='MV').length>=2 },
      { msg:T('prog.tut.s2_4'), op:'MV', done:()=>progTop().filter(i=>i.op==='MV').length>=3 },
      { msg:T('prog.tut.s2_5'), run:true } ] },
  { title:T('prog.tut.r3'),
    level:{ name:T('prog.tut.r3'), goal:T('prog.tut.g3'), cols:7, rows:3, limit:3, runs:9, ops:['MV','TL','TR','LP'], start:{x:0,y:1,dir:1}, goalPos:[6,1], stars:[], tiles:[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]] },
    steps:[
      { msg:T('prog.tut.s3_1'), op:'LP', done:()=>progTop().some(i=>i.op==='LP') },
      { msg:T('prog.tut.s3_2'), op:'MV', done:()=>{const l=progTop().find(i=>i.op==='LP'); return !!l&&l.body.length>=1;} },
      { msg:T('prog.tut.s3_3'), op:'CLOSE', done:()=>openStack.length===0 },
      { msg:T('prog.tut.s3_4'), cnt:0, done:()=>{const l=progTop().find(i=>i.op==='LP'); return !!l&&l.count>=6;} },
      { msg:T('prog.tut.s3_5'), run:true } ] },
  { title:T('prog.tut.r4'),   // 조건 하나만 — 모퉁이 한 곳에서 "막혔나?" 를 눈으로 보게
    level:{ name:T('prog.tut.r4'), goal:T('prog.tut.g4'), cols:4, rows:3, limit:4, runs:9, ops:['MV','TL','TR','IF'], start:{x:0,y:2,dir:0}, goalPos:[1,1], stars:[], tiles:[[0,2],[0,1],[1,1]] },
    steps:[
      { msg:T('prog.tut.s4_1'), op:'MV', done:()=>progTop().length>=1 },
      { msg:T('prog.tut.s4_2'), op:'IF', done:()=>progTop().some(i=>i.op==='IF') },
      { msg:T('prog.tut.s4_3'), op:'TR', done:()=>{const f=progTop().find(i=>i.op==='IF'); return !!f&&f.body.some(i=>i.op==='TR');} },
      { msg:T('prog.tut.s4_4'), op:'CLOSE', done:()=>openStack.length===0 },
      { msg:T('prog.tut.s4_5'), op:'MV', done:()=>progTop().filter(i=>i.op==='MV').length>=2 },
      { msg:T('prog.tut.s4_6'), run:true } ] },
  { title:T('prog.tut.r5'),   // 반복 안의 조건 — 매 칸마다 확인
    level:{ name:T('prog.tut.r5'), goal:T('prog.tut.g5'), cols:4, rows:4, limit:4, runs:9, ops:['MV','TL','TR','LP','IF'], start:{x:0,y:3,dir:0}, goalPos:[2,1], stars:[], tiles:[[0,3],[0,2],[0,1],[1,1],[2,1]] },
    steps:[
      { msg:T('prog.tut.s5_1'), op:'LP', done:()=>progTop().some(i=>i.op==='LP') },
      { msg:T('prog.tut.s5_2'), op:'IF', done:()=>{const l=progTop().find(i=>i.op==='LP'); return !!l&&l.body.some(i=>i.op==='IF');} },
      { msg:T('prog.tut.s5_3'), op:'TR', done:()=>{const l=progTop().find(i=>i.op==='LP'); const f=l&&l.body.find(i=>i.op==='IF'); return !!f&&f.body.some(i=>i.op==='TR');} },
      { msg:T('prog.tut.s5_4'), op:'CLOSE', done:()=>openStack.length===1 },
      { msg:T('prog.tut.s5_5'), op:'MV', done:()=>{const l=progTop().find(i=>i.op==='LP'); return !!l&&l.body.some(i=>i.op==='MV');} },
      { msg:T('prog.tut.s5_6'), op:'CLOSE', done:()=>openStack.length===0 },
      { msg:T('prog.tut.s5_7'), cnt:0, done:()=>{const l=progTop().find(i=>i.op==='LP'); return !!l&&l.count>=6;} },
      { msg:T('prog.tut.s5_8'), run:true } ] },
];
function progTop(){ return S.prog; }
function tutStep(){ return tutOn ? TUT_ROUNDS[tutRound].steps[tutIdx] : null; }
function tutSetHelp(){ const b=document.getElementById('btnTut'); b.textContent=tutOn?'✕':'?'; b.classList.toggle('quit',tutOn); b.setAttribute('aria-label',T(tutOn?'prog.tutorial_quit':'prog.tutorial')); }
function tutClear(){ document.querySelectorAll('.tut-on').forEach(el=>el.classList.remove('tut-on')); }
function tutMark(){
  tutClear();
  const st=tutStep(); const m=document.getElementById('tutMsg');
  if(!st){ m.classList.remove('on'); return; }
  m.innerHTML=st.msg; m.classList.add('on');
  if(st.op){ const b=paletteEl.querySelector(`.pbtn[data-op="${st.op}"]`); if(b) b.classList.add('tut-on'); }
  if(st.run) document.getElementById('runBtn').classList.add('tut-on');
  if(st.cnt!=null){ const c=programEl.querySelectorAll('.slot .cnt')[st.cnt]; if(c) c.classList.add('tut-on'); }
}
function tutCheck(){
  const st=tutStep(); if(!st || st.run || !st.done()) return;
  tutIdx++; tutMark(); updatePalette();
}
function tutRunDone(win){
  if(!win){ // 튜토리얼에서 실패는 안 나오게 짜여 있지만, 혹시 몰라 처음부터
    toast(T('prog.tut.redo')); loadTutRound(); return; }
  if(tutRound<TUT_ROUNDS.length-1){
    document.getElementById('tutMsg').innerHTML=T('prog.tut.good_next',{title:TUT_ROUNDS[tutRound+1].title});
    setTimeout(()=>{ if(!tutOn) return; tutRound++; loadTutRound(); },1500); return;
  }
  // 전부 끝
  const ov=document.getElementById('resultOv'); ov.classList.remove('hidden');
  document.getElementById('resCari').innerHTML=cariPNG('win');
  document.getElementById('resBadge').textContent=T('prog.tut.done'); document.getElementById('resBadge').className='badge win';
  document.getElementById('resStars').textContent='';
  document.getElementById('resN').textContent=T('prog.tut.done_title');
  document.getElementById('resMsg').textContent=T('prog.tut.done_take');
  document.getElementById('resStrip').textContent=T('prog.tut_short');
  const row=document.getElementById('resRow'); row.innerHTML='';
  row.appendChild(btn(T('prog.tut.close'),'',()=>{ ov.classList.add('hidden'); exitTutorial(); }));
  row.appendChild(btn(T('prog.tut.again'),'ghost',()=>{ ov.classList.add('hidden'); startTutorial(tutFrom); }));
}
function loadTutRound(){ tutIdx=0; loadLevel(); tutMark(); updatePalette(); }
function startTutorial(from){
  tutFrom=from; if(from==='game') tutReturnLv=S.lv;
  document.getElementById('startOv').classList.add('hidden'); document.getElementById('resultOv').classList.add('hidden');
  tutOn=true; tutRound=0; loadTutRound(); tutSetHelp();
}
function exitTutorial(){
  tutOn=false; tutClear(); document.getElementById('tutMsg').classList.remove('on'); tutSetHelp();
  document.getElementById('resultOv').classList.add('hidden');
  if(tutFrom==='game'){ startRun(); return; }   // 하던 판은 새 판으로
  S.lv=0; loadLevel(); document.getElementById('startOv').classList.remove('hidden');
}
document.getElementById('btnTut').onclick=()=>{ if(S.running) return; tutOn?exitTutorial():startTutorial('game'); };
document.getElementById('btnTutIntro').onclick=()=>startTutorial('intro');
/* ===================== 연결 ===================== */
document.getElementById('startCari').innerHTML=cariPNG('intro');
programEl.dataset.empty='＋  '+T('prog.empty_hint');   // 빈 프로그램 칸 안내(CSS ::before 가 attr 로 읽는다)
document.getElementById('startBtn').onclick=()=>{ document.getElementById('startOv').classList.add('hidden'); startRun(); };
document.getElementById('runBtn').onclick=runProgram;
document.getElementById('resetBtn').onclick=resetProgram;
S.lv=0; loadLevel();
</script>

<!-- ===== 앱 브리지: 랭킹 버튼 + 점수 전송 =====
     이 HTML 은 자립형이라 세션도 supabase 클라도 없다 → 실제 제출/조회는 부모(/games/:id = MiniGame.tsx)가 한다.
     여기서는 (1) 인트로·아웃트로 우상단에 '랭킹' 버튼을 얹고, (2) 점수가 나면 postMessage 로 알리기만 한다.
     ⚠️ 이 파일을 단독으로 열면 부모가 없어 버튼도 숨고 아무것도 보내지 않는다(게임은 그대로 동작).
     ⚠️ tieMs(레벨형 동률 해소용 소요시간)는 인트로에서 시작을 누른 시점부터 잰다. '처음으로'로 되돌아가
       인트로를 다시 거치지 않으면 계속 누적된다 — 순위 1차 키가 아니라 동률 해소용이라 그대로 둔다. -->
<style>
.mg-rank{position:absolute; top:12px; right:12px; z-index:60; display:none; align-items:center; justify-content:center;
  box-sizing:border-box;width:112px;height:34px;padding:0;border:0;cursor:pointer;font:850 11.5px/1 system-ui,-apple-system,sans-serif;letter-spacing:.025em;
  background:url('rank-button.webp') center/100% 100% no-repeat;color:#fff;text-shadow:0 1px 3px #001c55;
  filter:drop-shadow(0 5px 7px rgba(0,8,32,.42));-webkit-tap-highlight-color:transparent;}
/* ⚠️ 랭킹 글자는 판 정중앙(58.5%)이 아니라 **54%** 다 — 왼쪽 트로피가 시각적으로 무거워서
     기하학적 중앙에 두면 오른쪽으로 밀려 보인다. 모든 게임이 같은 값이다(2026-08-18 일괄 정렬).
     px 오프셋으로 밀지 말 것 — 버튼 폭이 게임마다 달라(112 vs 131) 같은 px 이 다른 위치가 된다. */
.mg-rank span{position:absolute;left:54%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}
.mg-rank.on{display:inline-flex;}
.mg-rank:active{transform:translateY(1px);}
</style>
<script>
(function(){
  var EMBED = window.parent !== window;
  var T0 = 0;
  function post(m){ if(EMBED) window.parent.postMessage(m, window.location.origin); }
  window.MGBridge = {
    /** 점수 전송. timed:true 면 시작 이후 경과시간을 동률 해소용으로 같이 보낸다. */
    submit: function(v, opts){
      if(typeof v !== 'number' || !isFinite(v)) return;
      post({ t:'mg:score', score:v, tieMs:(opts && opts.timed && T0) ? (Date.now()-T0) : undefined });
    }
  };
  function mount(id){
    var ov = document.getElementById(id); if(!ov) return;
    if(ov.querySelector('.mg-rank')) return;
    var b = document.createElement('button');
    b.type='button'; b.className='mg-rank' + (EMBED ? ' on' : '');
    b.setAttribute('aria-label','이 게임 랭킹 보기');
    b.innerHTML='<span>랭킹</span>';
    b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); post({t:'mg:rank'}); });
    ov.appendChild(b);
  }
  mount('startOv'); mount('resultOv');
  // 인트로에서 (랭킹 버튼이 아닌) 무엇이든 누르면 = 플레이 시작 → 소요시간 기준점 리셋.
  var intro = document.getElementById('startOv');
  if(intro) intro.addEventListener('click', function(e){
    if(e.target && e.target.closest && e.target.closest('.mg-rank')) return;
    T0 = Date.now();
  }, true);
})();
</script>
<script>if (window.MGI18N) MGI18N.apply();</script>
</body>
</html>
