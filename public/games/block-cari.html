<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>막아라 CARI — 검문소</title>
<!--
  ─────────────────────────────────────────────────────────────
  막아라 CARI (block-cari) — 10일 × 5장 (2026-09-15 재설계)
  ─────────────────────────────────────────────────────────────
  Papers, Please 구조를 그대로 가져온다. 다만 검사하는 것이 여권이 아니라
  **AI 에 넣기 직전의 사내 문서**다.

    · 규정집이 날마다 하나씩 늘어난다 (외울 수 없게 되는 것이 핵심) — 10일, 규정 10개
    · 서류에서 규정에 걸리는 곳을 찍어 가린다
    · 도장 두 개 — [AI 전송] / [반려] · 판정은 서류 위 잉크 도장 한 마디(설명 글 없음)
    · 틀리면 경고장. 세 장이면 끝.
    · 점수는 서버가 기록(LOG)으로 다시 센다 — _shared/block-days.ts 가 sync pair
    · 문구는 6개국어 — i18n.js 의 block.* (서류 번역은 조각 순서가 한국어와 같아야 한다)

  ⚠️ 이 게임이 퀴즈가 되지 않는 이유는 "동사"에 있다. 읽고 고르는 게 아니라
     **규정집과 서류를 왔다 갔다 하며 걸리는 곳을 찍어내는 작업**이다.
     그래서 규칙은 반드시 누적돼야 한다 — 한두 개만 있으면 그냥 찾기 퀴즈가 된다.

  ⚠️ 설계상 반드시 지킬 것 세 가지:
    ① **위반이 하나도 없는 서류를 섞는다.** 전부 뭔가 걸리면 "일단 칠하고 본다"가 최적 전략이 된다.
    ② **다 칠하면 실패해야 한다.** 핵심 정보(k)를 가리면 CARI 가 맥락을 잃고 엉뚱한 답을 낸다.
       "지울 것과 남길 것을 가르는 것"이 실력이고, 과잉 마스킹은 실무에서 실제로 흔한 실패다.
    ③ **아직 규정에 없는 것은 통과다.** 7일차에 코드 서류가 와도 8일차 규정이 생기기 전엔 위반이 아니다.
       규정이 자라난다는 걸 몸으로 알게 하는 장치라, 편의로 미리 막지 말 것.

  지표: 점수(전송형 100 + 완벽 보너스 50 · 반려형 100 · 만점 7,150) · 통산 최고
-->
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#050e1c;color:#e9ecf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  /* 앱 안에서는 세로 화면 iframe 이지만, 파일을 그냥 열면 데스크톱 전체 폭이 된다.
     폭을 안 묶으면 요소가 화면 양 끝으로 흩어져 한눈에 안 들어온다.
     ⚠️ 배경 그림은 body 가 아니라 이 기둥에 붙인다 — body 에 두면 데스크톱 폭(1440)에서 책상이
        화면 전체로 퍼져, 그림 속 서류함·돋보기가 기둥 밖으로 나가고 UI 만 가운데 떠 있게 된다.
        아래 도장 두 개가 그림의 빨강·파랑 서류함 위에 오는 구도도 그때 깨진다. */
  #app{position:relative;height:100%;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,rgba(4,13,29,.34),rgba(4,13,29,.08) 38%,rgba(4,13,29,.4)),
      #071426 url('/games/block-cari-game-bg-v2.webp') center/cover no-repeat;
    box-shadow:0 0 80px -20px rgba(0,0,0,.45)}
  .hidden{display:none}

  #flash{position:absolute;inset:0;z-index:40;pointer-events:none;background:#ff3b2a;opacity:0}
  #flash.on{animation:fl .5s ease-out}
  @keyframes fl{0%{opacity:.34}100%{opacity:0}}

  /* ── 상단 ─────────────────────────────────── */
  /* ⚠️ 아트를 깐 상자는 그림 비율로 고정한다 — 내용 높이에 맡기면 100% 100% 배경이 눌려서
     테두리 두께와 슬롯 위치가 통째로 어긋난다(HUD 는 4.618:1, 규정집은 2.988:1).
     아래 %좌표는 전부 원본 PNG 를 스캔해 얻은 슬롯 안쪽 값이다. 그림을 갈면 다시 재야 한다.
     ⚠️ v4 아트는 캔버스에 투명 여백이 크다(HUD 는 실물이 캔버스의 94.6%×72.4%). 캔버스 비율로 상자를
        잡으면 위아래에 빈 띠가 생겨 자리만 먹는다 → 상자는 **실물(알파 bbox) 비율**로 잡고,
        배경을 그만큼 확대·이동해 실물이 상자를 정확히 채우게 한다. 아래 %는 전부 실물 기준이다.
       hud-v4 실물 1747×617(2.831) : 큰 클립보드 x4.6~32.2 y18.8~85.3 · 좁은 클립보드 x42.6~55.5 y16.7~89.5
                                     빨간 경고카드 3장 x61/72.4/83.9(각 10) y17.8~55.6 · 금색 명패 x61.4~93.7 y62.7~89.9 */
  .top{position:relative;flex:0 0 auto;width:calc(100% - 18px);aspect-ratio:1747/617;margin:7px auto 3px;padding:0;border:0;
    background:url('/games/block-cari-hud-v4.webp') 48.1% 53.6%/105.7% 138.1% no-repeat;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
  /* 좁은 클립보드 — 세로로 길어서 숫자 위 / '일차' 아래가 딱 맞는다. */
  .day{position:absolute;left:42.6%;top:16.7%;width:12.9%;height:72.8%;padding:0;background:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
    color:#3d3427;font-weight:950;font-size:min(26px,5.6vw);text-shadow:none}
  .day i{font-style:normal;font-size:.44em;font-weight:800;color:#7a6a52;letter-spacing:.04em;margin-top:.3em}
  .prog{position:absolute;left:4.6%;top:18.8%;width:27.6%;height:66.5%;display:grid;place-items:center;
    font-size:min(30px,6.6vw);font-weight:900;color:#3d3427;font-variant-numeric:tabular-nums;text-shadow:none}
  /* ⚠️ v4 는 경고카드가 이미 빨갛게 그려져 있다 — 켜질 때 칠하는 게 아니라, 안 쓴 칸을 덮어둔다.
        (v3 은 빈 칸이라 반대였다. 그림이 바뀌면 이 방향도 같이 뒤집어야 한다.) */
  .strikes{position:absolute;left:61%;top:17.8%;width:33.2%;height:37.8%;margin:0;display:flex;justify-content:space-between;align-items:stretch}
  .strikes span{width:30.1%;height:100%;border:0;border-radius:3px;background:rgba(8,16,30,.66)}
  .strikes span.on{background:none;box-shadow:0 0 12px rgba(255,70,45,.85)}
  .sc{position:absolute;left:63%;top:66%;width:29%;height:20%;margin:0;display:grid;place-items:center;
    font-size:min(27px,5.9vw);font-weight:950;color:#2b1d04;font-variant-numeric:tabular-nums;
    text-shadow:0 1px 0 rgba(255,240,190,.55)}   /* 금색 판 위 — 옅은 갈색은 그대로 묻힌다 */

  /* ── 규정집 ───────────────────────────────── */
  /* rules-v4 실물 1453×774(1.877, 캔버스의 l11.1 t1.8 w77.2 h92.6) : 위 줄 y15.4~51.2 · 아래 줄 y55~92 */
  .book{position:relative;flex:0 0 auto;width:calc(100% - 18px);aspect-ratio:1453/774;margin:0 auto 5px;padding:0;border:0;
    background:url('/games/block-cari-rules-v4.webp') 48.7% 24.3%/129.5% 108% no-repeat;filter:drop-shadow(0 7px 12px rgba(0,0,0,.28))}
  .brow{position:absolute;left:6%;width:87%;height:35.8%;margin:0;display:flex;align-items:center;gap:8px;overflow:hidden}
  /* ⚠️ 위 줄은 클립 그림이 5% 만큼 내려와 있어 그만큼 아래서 시작한다 — 안 그러면 첫 줄이 클립 밑으로 들어간다. */
  .brow:nth-of-type(1){top:20.4%;height:30.8%}
  .brow:nth-of-type(2){top:55%}
  /* ⚠️ 규정집은 매 판 눈으로 훑는 곳이다 — 12px 대로 두면 안 읽힌다(종이 칸은 넉넉하다). */
  .blab{flex:0 0 auto;font-size:15px;font-weight:900;letter-spacing:.01em;color:#355f82;padding:0}
  .blab.red{color:#a3271c}
  /* ⚠️ 규정은 칩이 아니라 글줄이다 — 가릴 것이 7개까지 차는데(10일차) 칩으로는 360px 폰에서 네 줄이 되어 넘쳤다.
        글줄이면 360px 에서 세 줄(줄높이 1.3 × 14px × 3 = 55px ≤ 칸 56px), 460px 에서 두 줄이다.
        글자를 키우거나 라벨을 늘리면 다시 넘친다 — 라벨은 짧게 유지할 것. */
  .chips{flex:1 1 auto;display:block;font-size:14px;line-height:1.3;word-break:keep-all}
  .chip{display:inline;white-space:nowrap;padding:0 2px;border:0;border-radius:4px;font-size:14px;font-weight:800;color:#4a3c28;cursor:default}
  .chip::after{content:' · ';color:#b3a68a;font-weight:400;white-space:normal}
  .chip:last-child::after{content:''}
  .chip.blk{color:#a3271c}
  .chip.new{animation:glow 1.4s ease-in-out 3}
  @keyframes glow{0%,100%{box-shadow:0 0 0 rgba(150,110,40,0);background:none}50%{box-shadow:0 0 0 3px rgba(227,180,90,.55);background:rgba(227,180,90,.55)}}
  .bnone{font-size:14px;font-weight:700;color:#8b7c66;padding:0}

  /* ── 서류 ─────────────────────────────────── */
  /* ⚠️ 서류는 남는 공간 가운데에 둔다. flex-start 로 두면 짧은 서류일 때 아래가 통째로 비어
     (860px 화면에서 500px 가까이) 도장만 화면 바닥에 따로 떨어져 보인다. */
  .desk{position:relative;flex:1 1 auto;min-height:0;padding:0 13px 8px;display:flex;align-items:center}
  /* 내용만큼만 서되 한 장의 서류로 보일 만큼은 확보한다 — 짧은 문서가 쪽지처럼 보이면 안 된다. */
  .paper{flex:0 1 auto;width:100%;max-height:100%;min-height:min(100%,330px);background:linear-gradient(135deg,#fffdf4,#eee5d2);color:#2a2620;border-radius:7px;border:1px solid #d5c8ac;
    padding:15px 16px 18px;overflow-y:auto;box-shadow:0 14px 30px -12px rgba(0,0,0,.75);
    transform-origin:50% 50%;position:relative}
  .paper.in{animation:pin .32s ease-out}
  @keyframes pin{0%{transform:translateY(26px) rotate(-1.5deg);opacity:0}100%{transform:none;opacity:1}}
  .paper.out{animation:pout .34s ease-in forwards}
  @keyframes pout{100%{transform:translateX(115%) rotate(7deg);opacity:0}}
  .paper.rej{animation:prej .34s ease-in forwards}
  @keyframes prej{100%{transform:translateX(-115%) rotate(-7deg);opacity:0}}

  .phead{display:flex;align-items:center;gap:7px;padding-bottom:8px;margin-bottom:9px;
    border-bottom:1.5px dashed #cdc4b0}
  .pfrom{font-size:16px;font-weight:900;color:#4a4335}
  .pstamp{margin-left:auto;padding:4px 10px;border:2.5px solid #c0392b;color:#c0392b;border-radius:5px;
    font-size:13px;font-weight:900;transform:rotate(-6deg);letter-spacing:.04em}
  .pask{font-size:15px;font-weight:800;color:#7a6f57;margin:0 0 13px;line-height:1.5}
  .pask b{color:#4a4335}
  .ptext{font-size:17.5px;line-height:1.95;font-weight:600;word-break:keep-all}
  /* 검사 대상 — 점선 밑줄. 이게 없으면 어디를 봐야 할지 몰라 게임이 성립하지 않는다. */
  .tk{display:inline-block;padding:2px 5px;margin:0 1px;border-radius:4px;cursor:pointer;
    border-bottom:2px dotted #b3a68a;background:rgba(180,160,110,.13);transition:background .1s}
  .tk:active{background:rgba(180,160,110,.32)}
  .tk.mk{background:#221f1a;color:transparent;border-bottom-color:#221f1a;text-shadow:none;
    box-shadow:inset 0 0 0 1px #000}
  .tk.leak{animation:leak .5s ease-out 3;background:rgba(224,60,45,.35);border-bottom-color:#c0392b}
  @keyframes leak{0%,100%{background:rgba(224,60,45,.14)}50%{background:rgba(224,60,45,.5)}}
  .tk.over{background:rgba(255,170,40,.4);border-bottom-color:#d08a12;color:#2a2620}   /* 가렸던 글자를 다시 보여준다 — 뭘 가리면 안 됐는지 */
  .paper.done .tk{cursor:default}
  /* 첫 서류 안내 — 별도 튜토리얼 없이, 눌러야 할 조각 하나 → 도장 순서로 깜빡인다(2026-09-15 결정). */
  .tk.hint{animation:hint 1s ease-in-out infinite}
  @keyframes hint{0%,100%{box-shadow:0 0 0 0 rgba(63,134,232,0)}50%{box-shadow:0 0 0 4px rgba(63,134,232,.6);background:rgba(63,134,232,.22)}}
  .st.hint{animation:sthint 1s ease-in-out infinite}
  @keyframes sthint{0%,100%{filter:drop-shadow(0 7px 9px rgba(0,0,0,.35))}50%{filter:drop-shadow(0 0 14px rgba(63,134,232,.95)) brightness(1.15)}}
  /* 금지 서류를 보내 버렸을 때 — 머리의 붉은 표시가 깜빡인다(거기 적혀 있었다). */
  .pstamp.hit{animation:phit .5s ease-out 3}
  @keyframes phit{50%{background:#c0392b;color:#fff;transform:rotate(-6deg) scale(1.12)}}

  /* ── 판정 도장 ────────────────────────────── */
  /* 본문 아래 빈 칸(.pfoot)에 잉크로 찍힌다 — 글자와 겹치면 도장 문구가 안 읽혀서 자리를 따로 뒀다.
     설명 글 없이 도장 한 마디 + 점수. 서류 안에 있어서 서류가 빠질 때 같이 나간다. */
  .pfoot{position:relative;height:96px;margin-top:4px}
  .verdict{position:absolute;left:50%;top:50%;z-index:20;pointer-events:none;display:none;
    flex-direction:column;align-items:center;gap:2px;padding:9px 24px 11px;border:5px solid;border-radius:14px;
    mix-blend-mode:multiply;opacity:.92;
    transform:translate(-50%,-50%) rotate(-12deg);
    font-family:system-ui,sans-serif;letter-spacing:-.02em;white-space:nowrap}
  .verdict.on{display:flex;animation:vin .28s cubic-bezier(.2,1.4,.4,1)}
  @keyframes vin{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);opacity:0}100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:.92}}
  .verdict b{font-size:42px;font-weight:950;line-height:1}
  .verdict span{font-size:20px;font-weight:900;line-height:1}
  .verdict span:empty{display:none}
  .verdict.pass{color:#1f7a47;border-color:#1f7a47}
  .verdict.rej{color:#1f4f85;border-color:#1f4f85}
  .verdict.fail{color:#b8281c;border-color:#b8281c}
  .verdict.over{color:#b8700c;border-color:#b8700c}

  /* ── 도장 ─────────────────────────────────── */
  /* ⚠️ 두 도장은 그림 비율이 서로 다르다(전송 2.688 · 반려 2.534) — flex:1 로 같은 폭을 주면
     둘 다, 그것도 서로 다르게 찌그러진다. 높이를 맞추고 폭은 각자 비율에 맡긴다. */
  .stamps{flex:0 0 auto;display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:0 13px calc(12px + env(safe-area-inset-bottom))}
  .st{flex:0 0 auto;height:76px;width:auto;padding:0 0 6px;border:0;cursor:pointer;color:#fff;
    display:grid;place-items:center;font:950 17px/1 system-ui,sans-serif;letter-spacing:-.01em;
    text-shadow:0 2px 4px rgba(0,0,0,.7);filter:drop-shadow(0 7px 9px rgba(0,0,0,.35))}
  .st.send{aspect-ratio:1942/809;background:url('/games/block-cari-send-v4.webp') center/100% 100% no-repeat}
  .st.rej{aspect-ratio:1942/809;background:url('/games/block-cari-reject-v4.webp') center/100% 100% no-repeat}
  .st:active{transform:translateY(2px)}
  .st:disabled{opacity:.4;cursor:default;transform:none}
  /* 도장을 찍고 나면 두 도장 자리에 '다음 서류' 하나만 선다 — 판정은 서류 위 도장이 이미 말했다. */
  .nxt{display:none;flex:1 1 auto;max-width:300px;height:56px;margin-bottom:10px;border:0;border-radius:13px;cursor:pointer;
    background:#3f86e8;color:#fff;font:900 17px/1 system-ui,sans-serif;box-shadow:0 10px 20px -10px rgba(0,0,0,.6)}
  .stamps.judged .st{display:none}
  .stamps.judged .nxt{display:block}

  /* ── 오버레이 ─────────────────────────────── */
  /* ⚠️ 오버레이도 게임 기둥(520px) 안에 묶는다. 화면 전체로 두면 데스크톱 폭에서 인트로·결과 그림이
     가로로 확대돼 CARI 얼굴이 시트 뒤로 숨고 귀와 손만 남는다(실제로 그랬다). */
  .ov{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
    z-index:50;display:grid;place-items:center;padding:18px;
    background:rgba(8,10,16,.76);backdrop-filter:blur(4px)}
  /* ⚠️ .hidden 은 위에 있어 .ov 와 특정도가 같다 → 순서상 .ov 가 이긴다.
     이 줄이 없으면 오버레이 셋이 처음부터 전부 떠서 맨 뒤의 '해고' 화면이 게임을 덮는다. */
  .ov.hidden{display:none}
  .sheet{width:100%;max-width:400px;max-height:100%;overflow-y:auto;
    background:linear-gradient(#262b38,#1b1f29);border:1px solid rgba(255,255,255,.12);
    border-radius:19px;padding:20px 18px;box-shadow:0 26px 60px -20px rgba(0,0,0,.95)}
  .art{width:74px;height:74px;display:block;margin:0 auto}
  .ttl{text-align:center;font-size:25px;font-weight:900;letter-spacing:-.03em;margin:11px 0 5px}
  .ttl i{font-style:normal;color:#e3b45a}
  .lead{text-align:center;font-size:15px;font-weight:700;line-height:1.6;color:#a3abbe;margin:0 0 15px}
  .rules{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:8px}
  .rules li{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:700;line-height:1.55;
    background:rgba(255,255,255,.05);border-radius:12px;padding:11px 13px;color:#cbd2e2}

  .stat{flex:1;background:rgba(255,255,255,.05);border-radius:12px;padding:11px 6px;text-align:center}
  .stat b{display:block;font-size:24px;font-weight:900;line-height:1.1}
  .stat span{display:block;font-size:12.5px;font-weight:800;color:#8b93a8;margin-top:5px}
  .bigscore{text-align:center;font-size:50px;font-weight:900;letter-spacing:-.03em;color:#e3b45a;line-height:1}
  .biglab{text-align:center;font-size:13px;font-weight:800;color:#8b93a8;margin:6px 0 14px;letter-spacing:.06em}
  .note{background:rgba(227,180,90,.10);border:1px solid rgba(227,180,90,.26);border-radius:12px;
    padding:12px 14px;font-size:14.5px;line-height:1.65;font-weight:700;color:#e0c99a;margin-bottom:15px}
  .btn{width:100%;padding:15px;border:0;border-radius:13px;cursor:pointer;

  .newbest{text-align:center;font-size:14px;font-weight:900;color:#e3b45a;margin:-6px 0 13px}

  /* 랭킹 버튼은 게임마다 같은 그림을 쓴다(지어라 CARI 와 동일). ⚠️ padding 은 %가 아니라 px —
     absolute 요소라 %패딩이 자기 폭이 아니라 부모 폭 기준으로 잡혀 글자가 오른쪽 끝으로 밀린다. */
  .mg-rank{position:absolute;top:11px;right:11px;z-index:60;display:none;width:auto;height:38px;aspect-ratio:1701/494;

  /* 인트로는 팝업이 아니라 하나의 게임 시작 화면이다. */
  #startOv{display:flex;align-items:flex-end;justify-content:center;padding:0 16px calc(18px + env(safe-area-inset-bottom));background:#071426 url('/games/block-cari-intro-v3.webp') center top/cover no-repeat;backdrop-filter:none}
  #startOv.hidden{display:none}
  /* ⚠️ 위 여백은 그림의 집게 두 개를 피하는 값이다 — 줄이면 제목이 집게에 물린다. 아래 여백은 종이 말린 끝. */
  #startOv .sheet{max-width:460px;max-height:56%;padding:46px 32px 32px;border:0;border-radius:0;background:url('/games/block-cari-intro-panel-v4.webp') center/100% 100% no-repeat;box-shadow:none;filter:drop-shadow(0 20px 24px rgba(0,0,0,.55));color:#332b22}
  #startOv #sArt{display:none}
  #startOv .ttl{font-size:30px;margin:0 0 3px;text-shadow:0 3px 12px #000}
  #startOv .lead{margin-bottom:9px;color:#625747}
  /* 한 줄에 하나씩. 두 칸으로 나누면 문장이 3~4줄로 접혀 오히려 글이 많아 보인다.
     ⚠️ 문장은 한 줄에 떨어져야 한다 — 끝 단어 하나만 다음 줄로 넘어가면 그것만으로 글이 배로 보인다.

  #startOv .rules{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:11px}
  #startOv .rules li{font-size:13.5px;line-height:1.45;padding:9px 11px;border:1px solid rgba(102,77,44,.17);background:rgba(91,65,34,.06);color:#4d4234}
  @media (max-width:410px){ #startOv .rules li{font-size:12.5px;padding:8px 10px} #startOv .lead{font-size:13.5px} }
  #startOv .btn{height:62px;padding:4px 18px 10px;border-radius:0;background:url('/games/block-cari-start-v4.webp') center/100% 100% no-repeat;box-shadow:none;font-size:18px;text-shadow:0 1px rgba(255,232,160,.7)}

  /* 일차 브리핑은 사내 공지 클립보드다. 1일차부터 같은 화면을 써서 규정 추가 흐름을 먼저 익힌다. */
  #dayOv{background:rgba(4,12,25,.74);backdrop-filter:blur(3px)}
  /* 일차 공지 팝업(day-popup-v4)도 배치도다 — 집게 아래 이름표(제목) · 큰 종이(공지) · 나무 명패(버튼).
     ⚠️ 비율이 1024/1536 으로 적혀 있었는데 실제 그림은 다르다. 캔버스에 여백도 있어서
        상자는 실물 비율(924×1329 = 0.695)로 잡고 배경을 확대·이동해 실물이 상자를 채우게 한다.
     day-popup-v4 실물 좌표 : 이름표 x9.8~90 y11~20.5 · 종이 x8~91.7 y23.3~83.6 · 나무 명패 x9.1~90.8 y85.5~95 */

  #dayOv .ttl{position:absolute;left:9.8%;top:11%;width:80.2%;height:9.5%;margin:0;display:grid;place-items:center;font-size:min(31px,3.6vh);color:#443727}
  #dayOv .lead{position:absolute;left:10%;top:25.5%;width:80%;height:5.5%;margin:0;display:grid;place-items:center;font-size:min(15px,1.8vh);color:#796b57}
  #dayOv .memo{position:absolute;left:11%;top:32%;width:78%;height:49%;margin:0;padding:0 4%;overflow:auto;background:none;border:0;border-radius:0;color:#3d3428}
  #dayOv .memo h4{font-size:min(18px,2.1vh);color:#5a4630;margin:0 0 8px}
  #dayOv .memo li{font-size:min(16px,1.9vh);line-height:1.5}
  #dayOv .btn{position:absolute;left:9.1%;top:85.5%;width:81.7%;height:9.5%;padding:0;background:none;border:0;box-shadow:none;color:#f3e3be;font-size:min(19px,2.2vh);text-shadow:0 2px 3px rgba(0,0,0,.65)}

  /* 아웃트로도 같은 책상이다 — 결과 클립보드가 그 책상 위에 놓인 것으로 읽힌다. */
  #overOv{align-items:flex-end;padding:0 16px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(4,13,29,.34),rgba(4,13,29,.12) 40%,rgba(4,13,29,.55)),
      #071426 url('/games/block-cari-game-bg-v2.webp') center/cover no-repeat;backdrop-filter:none}
  #overOv .sheet{max-width:460px;max-height:51%;padding:16px 17px;background:linear-gradient(180deg,rgba(7,29,57,.93),rgba(4,17,37,.98));border-color:rgba(82,207,255,.27);box-shadow:0 20px 55px rgba(0,0,0,.6)}
  #overOv #oArt{display:none}
  #overOv .ttl{margin:0 0 4px}
  #overOv .bigscore{font-size:43px}
  #overOv .note{margin-bottom:10px;padding:9px 12px}
  #overOv .btn{background:linear-gradient(#2faff3,#1452bd);color:#fff}
  /* 해고 판(v4)은 '틀'이 아니라 '배치도'다 — 클립보드에 붉은 제목쪽지 · 큰 종이 · 클립 메모 3장 ·
     노란 포스트잇 · 파란 폴더탭이 이미 그려져 있다. 각 요소를 그 자리에 직접 앉힌다.
     ⚠️ 캔버스에 투명 여백이 있다(실물은 캔버스의 l10 t0.5 w79.7 h98.7) → 배경을 확대·이동해 실물이
        상자를 정확히 채우게 하고, %좌표는 실물 기준으로 쓴다.
     fail-panel-v4 실물 865×1429(0.605) : 제목쪽지 y11~19 · 큰 종이 y24~57 · 메모 3장 x8.7/37.6/66.5 y61~72
                                          포스트잇 y75~84 · 폴더탭 y86.5~95.5
     ⚠️ 종이·포스트잇 위 글자는 잉크색이어야 한다. 흰 글자는 그대로 사라진다. */
  #overOv:not(.cleared) .sheet{position:relative;width:min(92%,53vh);max-width:100%;height:auto;max-height:none;aspect-ratio:865/1429;
    padding:0;border:0;border-radius:0;overflow:visible;
    background:url('/games/block-cari-fail-panel-v4.webp') 49.3% 38.5%/125.5% 101.3% no-repeat;
    box-shadow:none;filter:drop-shadow(0 20px 28px rgba(0,0,0,.65))}
  #overOv:not(.cleared) .sheet>*{position:absolute;margin:0;display:grid;place-items:center;text-align:center}
  /* ⚠️ 라벨이 값 위에 온다 — 종이 위에서는 '점수 / 150' 순서가 자연스럽고, 값 밑에 붙으면 각주로 읽힌다.
        (통계 3장도 같은 이유로 column-reverse. DOM 순서는 그대로 두고 보이는 순서만 뒤집는다.) */
  #overOv:not(.cleared) .ttl{left:20%;top:11.2%;width:60%;height:8.3%;font-size:min(34px,3.9vh);color:#a3271c;text-shadow:none}
  #overOv:not(.cleared) .biglab{left:10%;top:26.5%;width:80%;height:6%;font-size:min(20px,2.3vh);font-weight:800;color:#7a6a52;letter-spacing:.08em}
  #overOv:not(.cleared) .bigscore{left:10%;top:32.5%;width:80%;height:17%;font-size:min(88px,10vh);line-height:1;color:#3d3427}
  #overOv:not(.cleared) .newbest{left:10%;top:50%;width:80%;height:5.5%;font-size:min(20px,2.3vh);font-weight:900;color:#a3271c}
  /* ⚠️ 메모 3장은 위쪽에 집게가 그려져 있다 — 종이(y60.4~71) 전체를 쓰면 글자가 집게에 물린다.
        집게 아래(y63~71)만 쓴다. */
  /* ⚠️ 칸 하나하나가 메모지 한 장의 한가운데에 와야 한다. 메모지 중심은 x20.65 / 49.75 / 78.9 —
        space-between 으로 대충 벌리면 양끝이 10px 씩 어긋난다(뒤 종이와 어긋난 게 바로 보인다). */
  #overOv:not(.cleared) .stats{left:6.1%;top:63%;width:87.4%;height:8%;display:flex;gap:0}
  #overOv:not(.cleared) .stats .stat{width:33.333%;height:100%;display:flex;flex-direction:column-reverse;
    align-items:center;justify-content:center;gap:3px;background:none;border:0;padding:0}
  #overOv:not(.cleared) .stats .stat b{font-size:min(31px,3.5vh);line-height:1;color:#3d3427}
  #overOv:not(.cleared) .stats .stat span{font-size:min(15px,1.75vh);font-weight:800;color:#7a6a52}
  #overOv:not(.cleared) .note{left:10%;top:75.5%;width:79%;height:8.5%;padding:0 10px;background:none;border:0;
    font-size:min(15px,1.8vh);line-height:1.4;color:#4a3c28;overflow:hidden}
  /* 폴더탭은 그림에 이미 파랗게 그려져 있다 — 위에 또 칠하지 않는다. */
  #overOv:not(.cleared) .btn{left:16%;top:87%;width:68%;height:8%;background:none!important;box-shadow:none;border:0;border-radius:0;
    color:#e9f2ff;font-size:min(20px,2.3vh);text-shadow:0 2px 4px rgba(0,10,30,.7)}

  @media (max-height:720px){
    #startOv .sheet{max-height:59%;padding:36px 26px 24px} #startOv .lead{display:none} #startOv .rules li{font-size:11.5px;padding:5px 7px}
    #overOv .sheet{max-height:55%}.stats{margin-bottom:8px}.note{font-size:12.5px}
  }
</style>
</head>
<body>

<div id="app">
  <div id="flash"></div>

  <div class="top">
    <span class="day" id="dayEl">1<i data-i18n="block.day">일차</i></span>
    <span class="prog" id="progEl">1 / 5</span>
    <span class="strikes" id="strEl"></span>
    <span class="sc" id="scEl">0</span>
  </div>

  <div class="book">
    <div class="brow"><span class="blab" data-i18n="block.mask">가릴 것</span><span class="chips" id="maskChips"></span></div>
    <div class="brow"><span class="blab red" data-i18n="block.block">전송 금지</span><span class="chips" id="blockChips"></span></div>
  </div>

  <div class="desk">
    <div class="paper" id="paper"></div>
    <!-- 판정 도장 — loadDoc 이 서류 안으로 옮겨 붙인다. 서류는 그대로 보이고 걸린 조각만 색이 든다. -->
    <div class="verdict" id="verdict"><b id="vTtl"></b><span id="vPt"></span></div>
  </div>

  <div class="stamps" id="stamps">
    <button class="st rej" id="rejBtn" data-i18n="block.reject">반려</button>
    <button class="st send" id="sendBtn" data-i18n="block.send">AI 전송</button>
    <button class="nxt" id="fbBtn" data-i18n="block.next">다음 서류</button>
  </div>
</div>

<!-- 인트로 -->
<div class="ov" id="startOv">
  <div class="sheet">
    <div id="sArt"></div>
    <p class="ttl" data-i18n="block.title">막아라 <i>CARI</i></p>
    <p class="lead" data-i18n="block.lead">“이거 AI로 정리해 주세요.”</p>
    <!-- ⚠️ 인트로에 다 적지 않는다. 화면에 보이는 것(밑줄·도장 두 개)과 게임이 알아서 알려주는 것
         (규정이 날마다 는다 → 2일차 공지 화면)은 뺀다. 남길 것은 "안 하면 손해 보는 것" 셋뿐이다. -->
    <ul class="rules">
      <li><span>①</span><div data-i18n="block.rule1"><b>규정집</b>을 보고 <b>걸리는 곳을 눌러 가린다</b></div></li>
      <li><span>②</span><div data-i18n="block.rule2">다 됐으면 <b>AI 전송</b> · 안 될 건 <b>반려</b></div></li>
      <li><span>③</span><div data-i18n="block.rule3">놓쳐도 과하게 가려도 <b>경고장</b> · 3장이면 끝</div></li>
    </ul>
    <button class="btn" id="startBtn" data-i18n="block.start">출근하기</button>
  </div>
</div>

<!-- 일차 브리핑 -->
<div class="ov hidden" id="dayOv">
  <div class="sheet">
    <p class="ttl" id="dTtl">2일차</p>
    <p class="lead" data-i18n="block.notice">사내 공지가 붙었다.</p>
    <div class="memo">
      <h4 id="dMemoTtl" data-i18n="block.memo_title">■ 추가 지침</h4>
      <ul id="dMemo"></ul>
    </div>
    <button class="btn" id="dBtn" data-i18n="block.begin">일 시작</button>
  </div>
</div>

<!-- 종료 -->
<div class="ov hidden" id="overOv">
  <div class="sheet">
    <div id="oArt"></div>
    <p class="ttl" id="oTtl">해고</p>
    <p class="bigscore" id="oScore">0</p>
    <p class="biglab" data-i18n="block.o_score">점수</p>
    <p class="newbest hidden" id="newbest" data-i18n="block.o_best">최고 기록 경신!</p>
    <div class="stats">
      <div class="stat"><b id="oDay">1</b><span data-i18n="block.o_days">버틴 일수</span></div>
      <div class="stat"><b id="oDocs">0</b><span data-i18n="block.o_docs">처리 서류</span></div>
      <div class="stat"><b id="oPerf">0</b><span data-i18n="block.o_perfect">완벽 처리</span></div>
    </div>
    <button class="btn" id="againBtn" data-i18n="block.again">다시 출근</button>
  </div>
</div>

<script src="i18n.js"></script>
<script>
/* 문구는 전부 사전(i18n.js 의 block.*)에서 온다 — 사전에 없으면 아래 한국어로 떨어진다.
   서류 50장도 block.d{일차}.{번호}.from|ask|text|stamp 키로 온다. ⚠️ 번역된 text 의 {종류|…} 조각은 한국어와
   **같은 순서·개수**여야 한다 — 기록(LOG)이 조각 자리로 서버에 가고 서버는 한국어 표로 판정한다(tests/minigame-replay.mjs 가 대조). */
const T=(k,v)=>window.MGI18N?MGI18N.t(k,v):k;
/* ================= CARI mascot (기존 게임과 동일 자산) ================= */
function charSVG(suit,o={}){
  const [body,shade,ear]=suit; const isCari=o.cari, dir=o.dir||0, shock=o.shock;
  const gid='c'+shade.slice(1)+(isCari?'m':'')+(shock?'k':'')+(dir+1)+Math.random().toString(36).slice(2,6);
  const ex=dir*2.2;
  const eyes = shock
    ? `<path d="M22.5 25.5 l5.5 5 M28 25.5 l-5.5 5" stroke="#8fd0ff" stroke-width="2.3" stroke-linecap="round"/>
       <path d="M36 25.5 l5.5 5 M41.5 25.5 l-5.5 5" stroke="#8fd0ff" stroke-width="2.3" stroke-linecap="round"/>`
    : `<ellipse cx="${25.5+ex}" cy="27" rx="3.7" ry="4.8" fill="#d3ecff"/>
       <ellipse cx="${38.5+ex}" cy="27" rx="3.7" ry="4.8" fill="#d3ecff"/>
       <ellipse cx="${24.6+ex}" cy="25.2" rx="1.15" ry="1.5" fill="#fff"/>
       <ellipse cx="${37.6+ex}" cy="25.2" rx="1.15" ry="1.5" fill="#fff"/>`;
  const mouth = shock
    ? `<ellipse cx="32" cy="35.5" rx="2.8" ry="3.4" fill="#2b5f8c"/>`
    : `<path d="M28.8 34 q3.2 2.8 6.4 0" stroke="#7fc4ff" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  const antenna = isCari ? `
    <path d="M32 10 v-4.4" stroke="#7fa8d8" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="32" cy="3.8" r="3" fill="#5b90ff"/>
    <ellipse cx="32" cy="3.8" rx="5.7" ry="1.9" fill="none" stroke="#9cc0ff" stroke-width="1.2" transform="rotate(-18 32 3.8)"/>` : '';
  const badge = isCari ? `
    <rect x="24" y="45" width="16" height="8.5" rx="3" fill="#fdfbf5" stroke="${shade}" stroke-width=".9"/>
    <text x="32" y="51.3" font-size="5.4" font-weight="900" text-anchor="middle" fill="#8fb0e2" font-family="system-ui,sans-serif">CARI</text>` : '';
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="width:74px;height:74px">
    <defs><radialGradient id="${gid}" cx="38%" cy="26%" r="80%">
      <stop offset="0" stop-color="#fff" stop-opacity=".62"/>

/* ===================== 상태 ===================== */
const $=id=>document.getElementById(id);
const VERDICT=document.getElementById('verdict');   // 서류 innerHTML 에 지워지므로 참조를 들고 있는다
/* ⛔ 아래 셋은 서버 _shared/block-days.ts 와 sync pair 다(tests/minigame-replay.mjs 가 대조) — 점수는 서버가 기록으로 다시 센다. */
const MAX_STRIKE=3;
const DOC_POINT=100;
const PERFECT_BONUS=50;
let di=0, qi=0, strikes=0, score=0, docsDone=0, perfect=0;
let LOG=[], T0=0;   // 답안 기록 — 서류마다 {d,i,m:가린 자리,s:전송1/반려0,t} · 서버가 이걸로 점수를 다시 센다
let activeMask=new Set(), activeBlock=new Set(), cur=null, locked=true, lastSent=true;
let best=(()=>{try{return +localStorage.getItem('cari_block_best')||0}catch(e){return 0}})();

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/** 본문 표기 → 토큰 span. 밑줄 친 것만 누를 수 있다. */
function renderText(src){
  let out='',i=0;
  const re=/\{([a-z]+)\|([^}]*)\}/g; let m;
  while((m=re.exec(src))){
    out+=esc(src.slice(i,m.index));
    out+=`<span class="tk" data-kind="${m[1]}">${esc(m[2])}</span>`;
    i=m.index+m[0].length;
  }
  out+=esc(src.slice(i));
  return out;
}

/** 한국어는 이 파일이 원본이다 — 사전의 ko 사본을 쓰지 않는다(사본이 낡으면 옛 서류가 뜬다 — 실제로 그랬다). */
const KO=()=>!window.MGI18N||MGI18N.lang==='ko';
/** 규정 라벨·설명 — 한국어는 위 MASK/BLOCK, 다른 언어는 사전(block.rule.<코드>), 사전에 없으면 한국어. */
function ruleLabel(k){ if(KO()) return (MASK[k]||BLOCK[k]).label; const v=T('block.rule.'+k); return v==='block.rule.'+k ? (MASK[k]||BLOCK[k]).label : v; }
function ruleDesc(k){ if(KO()) return (MASK[k]||BLOCK[k]).desc; const v=T('block.rule.'+k+'.desc'); return v==='block.rule.'+k+'.desc' ? (MASK[k]||BLOCK[k]).desc : v; }
/** 서류 문구 — 한국어는 DAYS, 다른 언어는 사전(block.d{일차}.{번호}.<필드>), 사전에 없으면 한국어. */
function docText(f){ if(KO()) return cur[f]||''; const k='block.d'+DAYS[di].n+'.'+(qi+1)+'.'+f; const v=T(k); return v===k ? (cur[f]||'') : v; }
function renderBook(newOnes){
  const mk=[...activeMask];
  $('maskChips').innerHTML = mk.length
    ? mk.map(k=>`<span class="chip${newOnes&&newOnes.includes(k)?' new':''}">${esc(ruleLabel(k))}</span>`).join('')
    : `<span class="bnone">${esc(T('block.none'))}</span>`;
  const bk=[...activeBlock];
  $('blockChips').innerHTML = bk.length
    ? bk.map(k=>`<span class="chip blk${newOnes&&newOnes.includes(k)?' new':''}">${esc(ruleLabel(k))}</span>`).join('')
    : `<span class="bnone">${esc(T('block.none'))}</span>`;
}

function renderHud(){
  $('dayEl').innerHTML=DAYS[di].n+'<i>'+esc(T('block.day'))+'</i>';   // 정사각 슬롯이라 숫자 크게 + '일차' 작게 두 줄
  $('progEl').textContent=(qi+1)+' / '+DAYS[di].docs.length;
  $('scEl').textContent=score.toLocaleString();
  $('strEl').innerHTML=Array.from({length:MAX_STRIKE},(_,i)=>`<span class="${i<strikes?'on':''}"></span>`).join('');
}

function loadDoc(){
  const d=DAYS[di].docs[qi];
  cur=d;
  const p=$('paper');
  p.className='paper in';
  p.innerHTML=
    `<div class="phead"><span class="pfrom">${esc(docText('from'))}</span>`+
    (d.stamp?`<span class="pstamp">${esc(docText('stamp'))}</span>`:'')+`</div>`+
    `<p class="pask">“${docText('ask')}”</p>`+
    `<div class="ptext">${renderText(docText('text'))}</div>`+
    `<div class="pfoot"></div>`;                   // 도장 자리 — 본문 아래 빈 칸이라 글자와 안 겹친다
  p.querySelector('.pfoot').appendChild(VERDICT);  // innerHTML 로 지워지므로 매번 다시 붙인다
  p.querySelectorAll('.tk').forEach(t=>{
    t.onclick=()=>{ if(locked) return; t.classList.toggle('mk');
      if(t.classList.contains('hint')){ t.classList.remove('hint'); $('sendBtn').classList.add('hint'); } };
  });
  // 첫 서류만: 가려야 할 조각 하나가 깜빡이고, 가리면 전송 도장이 깜빡인다.
  if(di===0&&qi===0){ const h=p.querySelector('.tk[data-kind="name"]'); if(h) h.classList.add('hint'); }
  p.scrollTop=0;
  locked=false;
  $('sendBtn').disabled=false; $('rejBtn').disabled=false;
  renderHud();
}

/* ===================== 판정 =====================
   전송: ① 활성 block 서류면 실패(유출 사고)
         ② 활성 mask 위반이 안 가려져 있으면 실패(유출)
         ③ k 를 가렸으면 실패(맥락 손상) — 다 칠하기 방지
         ④ 전부 통과 + 불필요한 마스킹 0 이면 완벽(+보너스)
   반려: 활성 block 서류일 때만 정답. 아니면 업무 마비.
   ⚠️ 아직 도입 안 된 규칙은 위반이 아니다(활성 집합만 본다) — 의도된 동작.
=============================================== */
function judge(sent){
  if(locked) return;
  const p0=$('paper');
  locked=true; lastSent=sent;
  $('sendBtn').disabled=true; $('rejBtn').disabled=true; $('sendBtn').classList.remove('hint');
  p0.querySelectorAll('.tk.hint').forEach(t=>t.classList.remove('hint'));
  const p=$('paper'), toks=[...p.querySelectorAll('.tk')];
  const isBlock = cur.block && activeBlock.has(cur.block);
  // 도장 한 마디로 끝낸다 — 설명 글은 없다. 걸린 조각(빨강/주황)과 서류 머리 표시가 이유를 보여준다.
  let ok=false, ttl, kind, pt='', flash=false;

  if(!sent){
    if(isBlock){ ok=true; ttl=T('block.v_rej'); kind='rej'; }
    else { ttl=T('block.v_rejwrong'); kind='fail'; }
  } else if(isBlock){
    ttl=T('block.v_incident'); kind='fail'; flash=true;
    const ps=p.querySelector('.pstamp'); if(ps) ps.classList.add('hit');
  } else {
    const leaked=toks.filter(t=>activeMask.has(t.dataset.kind)&&!t.classList.contains('mk'));
    const over=toks.filter(t=>t.dataset.kind==='k'&&t.classList.contains('mk'));
    if(leaked.length){
      leaked.forEach(t=>t.classList.add('leak'));
      ttl=T('block.v_leak'); kind='fail'; flash=true;
    } else if(over.length){
      over.forEach(t=>t.classList.add('over'));
      ttl=T('block.v_over'); kind='over';
    } else {
      ok=true; ttl=T('block.v_pass'); kind='pass';
      const extra=toks.filter(t=>t.dataset.kind!=='k'&&!activeMask.has(t.dataset.kind)&&t.classList.contains('mk'));
      const gain=DOC_POINT+(extra.length?0:PERFECT_BONUS);
      score+=gain; pt='+'+gain; docsDone++;
      if(!extra.length) perfect++;
    }
  }

  if(ok&&!sent){ score+=DOC_POINT; pt='+'+DOC_POINT; docsDone++; }
  if(!ok) strikes++;
  LOG.push({d:di,i:qi,m:toks.map((t,i)=>t.classList.contains('mk')?i:-1).filter(i=>i>=0),s:sent?1:0,t:Math.max(0,Math.round(performance.now()-T0))});
  if(flash){ $('flash').classList.remove('on'); void $('flash').offsetWidth; $('flash').classList.add('on'); }
  p.classList.add('done');
  renderHud();

  const v=VERDICT;
  v.className='verdict '+kind; void v.offsetWidth; v.classList.add('on');
  $('vTtl').textContent=ttl; $('vPt').textContent=pt;
  p.scrollTop=p.scrollHeight;   // 긴 서류면 도장이 아래 있으니 내려서 보여준다
  $('fbBtn').textContent = strikes>=MAX_STRIKE ? T('block.result')
    : (qi+1>=DAYS[di].docs.length ? (di+1>=DAYS.length?T('block.result'):T('block.clockout')) : T('block.next'));
  $('stamps').classList.add('judged');
}

function nextStep(){
  VERDICT.classList.remove('on');
  $('stamps').classList.remove('judged');
  if(strikes>=MAX_STRIKE) return gameOver(false);
  const p=$('paper');
  // 전송한 서류는 오른쪽(AI 쪽)으로, 반려한 서류는 왼쪽(되돌려주는 쪽)으로 빠진다.
  p.classList.add(lastSent?'out':'rej');
  setTimeout(()=>{
    qi++;
    if(qi>=DAYS[di].docs.length){
      di++; qi=0;
      if(di>=DAYS.length) return gameOver(true);
      openDay();
    } else loadDoc();
  },320);
}

function openDay(){
  const D=DAYS[di];
  const news=[...D.newMask,...D.newBlock];
  D.newMask.forEach(k=>activeMask.add(k));
  D.newBlock.forEach(k=>activeBlock.add(k));
  renderBook(news);
  renderHud();
  $('dTtl').textContent=T('block.day_n',{n:D.n});
  $('dMemo').innerHTML=
    D.newMask.map(k=>`<li>${T('block.memo_mask',{x:esc(ruleLabel(k))})}<i>${esc(ruleDesc(k))}</i></li>`).join('')+
    D.newBlock.map(k=>`<li>${T('block.memo_block',{x:esc(ruleLabel(k))})}<i>${esc(ruleDesc(k))}</i></li>`).join('');
  $('dayOv').classList.remove('hidden');
}

function start(){
  di=0;qi=0;strikes=0;score=0;docsDone=0;perfect=0;
  LOG=[]; T0=performance.now();
  activeMask=new Set(); activeBlock=new Set();
  $('startOv').classList.add('hidden');
  $('overOv').classList.add('hidden');
  VERDICT.classList.remove('on'); $('stamps').classList.remove('judged');
  openDay();
}

function gameOver(cleared){
  locked=true;
  VERDICT.classList.remove('on'); $('stamps').classList.remove('judged');
  if(window.MGBridge) MGBridge.submit(score,{log:LOG}); // 숫자는 참고값 — 서버가 log 로 다시 센다
  $('overOv').classList.toggle('cleared',cleared);
  $('oArt').innerHTML=charSVG(CARI_SUIT,{cari:true,shock:!cleared});
  $('oTtl').textContent=cleared?T('block.o_clear'):T('block.o_fired');
  $('oScore').textContent=score.toLocaleString();
  $('oDay').textContent=DAYS[Math.min(di,DAYS.length-1)].n;
  $('oDocs').textContent=docsDone;
  $('oPerf').textContent=perfect;
  if(score>best){best=score;try{localStorage.setItem('cari_block_best',best)}catch(e){}
    $('newbest').classList.remove('hidden');}
  else $('newbest').classList.add('hidden');
  $('overOv').classList.remove('hidden');
}

/* ===================== 배선 ===================== */
$('sendBtn').onclick=()=>judge(true);
$('rejBtn').onclick=()=>judge(false);
$('fbBtn').onclick=nextStep;
$('startBtn').onclick=start;
$('againBtn').onclick=start;
$('dBtn').onclick=()=>{ $('dayOv').classList.add('hidden'); loadDoc(); };

$('sArt').innerHTML=charSVG(CARI_SUIT,{cari:true});
renderBook(); renderHud();
</script>

<!-- ===== 앱 브리지: 랭킹 버튼 + 점수 전송 ===== -->
<script>
(function(){
  var EMBED=window.parent!==window;
  function post(m){ if(EMBED) window.parent.postMessage(m,window.location.origin); }
  // ⚠️ log 를 꼭 실어 보낸다 — 이 한 줄이 빠지면 서버(재채점)가 기록을 못 받아 전부 400 이고 부모는 조용히 넘긴다(프로그램해라에서 겪었다).
  window.MGBridge={submit:function(v,opts){ if(typeof v==='number'&&isFinite(v)) post({t:'mg:score',score:v,log:(opts&&Array.isArray(opts.log))?opts.log:undefined}); }};
  function mount(id){
    var ov=document.getElementById(id); if(!ov||ov.querySelector('.mg-rank')) return;
    var b=document.createElement('button');
    b.type='button'; b.className='mg-rank'+(EMBED?' on':'');
    var tr=function(k){ return window.MGI18N ? MGI18N.t(k) : k; };
    b.setAttribute('aria-label',tr('mg.rank_aria'));
    b.innerHTML='<span aria-hidden="true">🏆</span><span class="rank-label">'+tr('mg.rank')+'</span>';
    b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();post({t:'mg:rank'});});
    ov.appendChild(b);
  }
  mount('startOv'); mount('overOv');
})();
if (window.MGI18N) MGI18N.apply();
</script>
</body>
</html>
