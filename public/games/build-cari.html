<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>지어라 CARI</title>
<style>
:root{
  --page:#e9eff9; --bg:#fbfaf5; --ink:#28324c; --sub:#7c869e;
  --brand:#004ac6; --brand-hi:#1b55d0; --line:#e6e9f3;
  --good:#12b58c; --bad:#f2664f; --skip:#e59b17;
  --cream:#ece9e0; --tk:520ms;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:radial-gradient(120% 80% at 50% -10%, #eff4fc 0%, #e3ebf7 60%);
  color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
  display:flex; align-items:center; justify-content:center; min-height:100%; overflow:hidden; user-select:none;
}
.stage{
  position:relative; width:min(460px,100vw); height:min(860px,100vh);
  display:flex; flex-direction:column; background:var(--bg);
  box-shadow:0 0 60px rgba(70,90,140,.25); overflow:hidden;
}
.art{width:100%;height:100%;display:block;}

/* HUD */
.hud{display:flex; align-items:center; gap:10px; padding:12px 14px 4px; z-index:5;}
.hud .cari-mini{width:40px;height:40px;flex:0 0 40px;}
.hud .lvlbox{display:flex;flex-direction:column;line-height:1.05;}
.hud .lvlbox b{font-size:16px;color:var(--ink);}
.hud .lvlbox span{font-size:11px;color:var(--sub);}
.hud .scorepill{margin-left:auto; background:#eef3fd; border:1px solid var(--line); color:var(--brand);
  font-weight:800; font-size:12.5px; padding:8px 12px; border-radius:16px; text-align:right;
  font-variant-numeric:tabular-nums; white-space:nowrap;}
.scorepill .miss{color:var(--bad);}

.hint{font-size:12px;color:var(--sub);text-align:center;padding:2px 16px 3px;line-height:1.35;}
.hint b{color:var(--brand);}

/* factory board */
.gridwrap{display:flex;justify-content:center;margin:4px 0 2px;}
.grid{position:relative;width:312px;height:416px;}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,52px);grid-template-rows:repeat(8,52px);}
.cell{width:52px;height:52px;position:relative;cursor:pointer;box-shadow:inset 0 0 0 2px var(--bg);}
.ci{position:absolute;inset:2px;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.ci.empty{background:#eef1f7;box-shadow:inset 0 0 0 1px #e2e7f1;}
.ci.conv{background:#e5edff;box-shadow:inset 0 0 0 1px #cfdcff;}
.ci.conv .ar{color:var(--brand);font-size:22px;font-weight:900;line-height:1;}
.ci.sensor{background:#efe7fb;box-shadow:inset 0 0 0 1.5px #c9b7ef;}
.ci.sensor .ar{color:#6b52b0;font-size:18px;font-weight:900;position:absolute;}
.ci.sensor .sdot{position:absolute;top:4px;left:4px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 5px rgba(0,0,0,.25);}
.ci.sensor .sbr{position:absolute;bottom:2px;right:3px;font-size:15px;font-weight:900;}
.ci.src{background:#28324c;flex-direction:column;gap:0;}
.ci.src .cmini{width:34px;height:30px;margin-top:1px;}
.ci.src .ar{color:#8fd0ff;font-size:15px;font-weight:900;line-height:.6;margin-bottom:2px;}
.ci.bin{background:var(--cream);box-shadow:inset 0 0 0 1px #d8d2c4;}
.ci.bin .binbox{width:34px;height:26px;border:2.5px solid;border-radius:5px;border-top:0;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;background:#fff;}
.ci.bin .bsw{width:16px;height:10px;border-radius:3px;}
/* '아무 색이나 받는 함' 표시. ⚠️ 물음표를 쓰지 말 것 — "아무거나" 가 아니라 "뭔지 모름" 으로 읽힌다.
   색 세 개를 나란히 두면 설명 없이 통한다. */
.ci.bin .bany{display:flex;gap:2px;align-items:center;justify-content:center;font-size:0;}
.ci.bin .bany i{display:block;width:6px;height:10px;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);}

.ilayer{position:absolute;inset:0;pointer-events:none;z-index:3;}
.item{position:absolute;left:0;top:0;width:26px;height:26px;
  background-position:center!important;background-size:100% 100%!important;background-repeat:no-repeat!important;
  transition:transform var(--tk) linear, opacity .28s ease;}
.item::after{display:none;}
/* 상자 결말 표시는 v4 블록에서 다시 정의한다(초록 테두리 → 흡수/거부 연출). */

/* palette */
.palette{display:flex;gap:8px;justify-content:center;padding:3px 12px 2px;}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;padding:6px 12px;cursor:pointer;transition:.12s;min-width:74px;}
.tool .tico{font-size:19px;line-height:1;}
.tool .tnm{font-size:10.5px;font-weight:800;color:var(--sub);}
.tool.on{background:#eaf1ff;border-color:var(--brand);}
.tool.on .tnm{color:var(--brand);}
.tool.erase.on{background:#ffece7;border-color:var(--bad);}
.tool.erase.on .tnm{color:var(--bad);}

/* controls */
.controls{padding:6px 14px 14px;margin-top:auto;display:flex;gap:10px;}
.btn{flex:1;padding:14px 10px; border-radius:24px; border:0; cursor:pointer;
  background:linear-gradient(120deg,#1b55d0,#004ac6); color:#fff; font-size:16px; font-weight:800;
  box-shadow:0 8px 20px rgba(0,74,198,.28);}
.btn.ghost{flex:0 0 96px;background:#eef1f8;color:var(--brand);box-shadow:none;}
.btn.stop{background:linear-gradient(120deg,#f2664f,#e0492f);box-shadow:0 8px 20px rgba(224,73,47,.28);}
.btn:active{transform:scale(.97);}

.toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);z-index:15;
  background:var(--brand);color:#fff;font-weight:800;font-size:13px;padding:9px 18px;border-radius:20px;
  box-shadow:0 6px 16px rgba(0,0,0,.18);opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;}
.toast.show{opacity:1;}

/* overlays */
.overlay{position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:26px;
  background:radial-gradient(120% 80% at 50% 0%, #f2f6fd 0%, #e7eef9 70%);}
.overlay.hide{display:none;}
.floaty{width:128px;height:128px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.t1{font-size:34px;font-weight:900;color:var(--ink);letter-spacing:-1px;}
.t2{font-size:34px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(120deg,#1b55d0,#004ac6);-webkit-background-clip:text;background-clip:text;color:transparent;}
.title{margin:8px 0 2px;}
.tag{color:var(--sub);font-size:14px;margin:2px 0 16px;font-weight:600;}
.rules{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 18px;text-align:left;
  max-width:344px;box-shadow:0 6px 18px rgba(70,90,140,.10);}
.rules div{font-size:13px;color:var(--ink);margin:7px 0;display:flex;gap:9px;align-items:flex-start;line-height:1.4;}
.rules b{color:var(--brand);}
.badge{font-size:26px;font-weight:900;margin:6px 0 2px;}
.badge.win{color:var(--good);} .badge.lose{color:var(--bad);}
.scorebox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 22px;margin:12px 0 4px;
  box-shadow:0 6px 18px rgba(70,90,140,.10);max-width:352px;}
.scorebox .big{font-size:15px;font-weight:800;color:var(--ink);}
.scorebox .take{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.5;}
.scorebox .take b{color:var(--brand);}
.scorebox .foot{font-size:11.5px;color:var(--sub);margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);line-height:1.5;}
.scorebox .foot b{color:var(--brand);}
.ovbtns{display:flex;gap:10px;margin-top:16px;}
.ovbtns .btn{padding:13px 28px;flex:0 0 auto;}

/* v2 asset direction — the interactive rules stay intact while the presentation
   now belongs to the same cinematic CARI family as the other finished games. */
.stage{
  background:
    linear-gradient(rgba(6,20,42,.12),rgba(6,20,42,.3)),
    url('/games/build-cari-game-bg-v7.webp') center/cover no-repeat;
}
.hud,.hint,.palette,.controls{background:none;backdrop-filter:none;}
.hud{padding-top:10px;}
.gridwrap{padding:5px 8px;border-radius:20px;margin-inline:auto;background:rgba(8,28,58,.32);backdrop-filter:blur(5px);}
.cell{box-shadow:inset 0 0 0 2px rgba(8,28,58,.68);}
.ci.empty{background:rgba(230,240,252,.86);}
.overlay{
  color:#fff;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}
#ovStart .floaty,#ovResult .floaty{display:none;}
#ovStart .title{margin-top:0;text-shadow:0 3px 18px rgba(0,0,0,.45);}
#ovStart .t1{color:#fff;}
#ovStart .tag{color:#d7e9ff;text-shadow:0 2px 10px rgba(0,0,0,.7);}
.rules,.scorebox{backdrop-filter:none;}

/* ===== v4 — 아트 좌표를 실측해서 맞춘 배치 (2026-08-12) =====
   아래 %좌표는 전부 PNG 를 픽셀 스캔해서 뽑은 값이다. 그림을 갈면 다시 재야 한다.
     hud-v10        1735×473 : 가운데 남색판 x23.2~74.6 y8.7~91.3 · 오른쪽 칸 x76.7~97.5(위 y8.7~45.9 / 아래 y54.1~91.3)
     intro-v10       955×1413: 남색판 x9~90.6 y49.5~61.6 · 규칙 3줄 중심 y67.6/74.7/81.8(뱃지 오른쪽 끝 x21.2) · 시작=초록원 cx49.8 cy92
     result-win-v9  1086×1448: 남색판 x11.9~87.8 y52.9~75.7 · 버튼 y78.2~93.4(x11.7~47.9 / x51.8~88)
     result-fail-v9           : 남색판 x12.7~87.2 y59.8~76.6 · 버튼 1개 x10.3~86.6 y78.9~93.5
     run/reset-v9    810×352 : 아이콘 x13.6~26.4(왼쪽) · 안쪽 판 x6.8~93 → 글자는 버튼 정중앙(아이콘과 안 겹친다)
     rank-button     1701×494: 트로피 x2.5~20.2 · 남색판 x22.3~96.5 → 글자는 판 중앙 = 버튼 폭의 59.4%
   ⚠️ 배경은 contain 이 아니라 `100% 100%` + 박스를 그림 비율로 고정한다. contain 은 박스가 그림보다
      넓으면 그림만 가운데로 줄어드는데 %좌표는 박스 기준이라 글자가 통째로 어긋난다(v3 의 실제 버그 —
      점수판이 HUD 그림 밖 허공에 떠 있었다).
   ⚠️ 글자 크기는 px 이 아니라 콘솔 크기(--ch/--rh/--hh)의 비율이다. 화면이 작아지면 콘솔이 줄어드는데
      글자만 안 줄면 칸을 넘친다.
   ⚠️ 승리 결과창의 다시/다음 버튼과 인트로 시작 버튼은 그림이 아이콘을 버튼 정중앙에 박아놔서
      글자 자리가 없다 → 아이콘 단독으로 두고 라벨은 스크린리더용으로만 남긴다(text-indent).
      실패창 버튼은 아이콘이 왼쪽이라 글자를 넣는다. */

/* --- HUD --- */
.stage{--sw:min(460px,100vw);--sh:min(860px,100vh);}
.hud{--hw:calc(var(--sw) - 16px);--hh:calc(var(--hw) / 3.668);
  position:relative;flex:0 0 auto;width:var(--hw);height:var(--hh);margin:6px auto 0;padding:0;
  background:url('/games/build-cari-hud-v10.webp') center/100% 100% no-repeat;backdrop-filter:none;}
.hud .cari-mini{display:none;}
.hud .lvlbox{position:absolute;left:23.2%;top:8.7%;width:51.4%;height:82.6%;transform:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--hh)*.075);text-align:center;line-height:1;}
.hud .lvlbox b{font-size:calc(var(--hh)*.19);color:#fff;letter-spacing:-.02em;text-shadow:0 2px 5px #00133a;}
/* 부제는 레벨명과 붙으면 한 덩어리로 읽힌다 — 자간을 벌리고 캡션 톤으로 한 급 낮춘다. */
.hud .lvlbox span{font-size:calc(var(--hh)*.105);color:#8fc9ee;font-weight:800;letter-spacing:.14em;text-indent:.14em;}
.hud .scorepill{position:absolute;left:76.7%;top:8.7%;width:20.8%;height:82.6%;transform:none;margin:0;padding:0;
  background:none;border:0;box-shadow:none;display:grid;grid-template-columns:1fr;grid-template-rows:1fr 1fr;
  text-align:center;white-space:nowrap;text-shadow:0 2px 4px #00133a;}
.scorepill .metric{display:flex;height:auto;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--hh)*.02)}
.scorepill small{font-size:calc(var(--hh)*.105);line-height:1;color:#9bcbe8;font-weight:800;}
.scorepill b{font-size:calc(var(--hh)*.165);line-height:1;font-variant-numeric:tabular-nums}
.scorepill .ok b{color:#7de8ff}.scorepill .err b{color:#ff9b87}

/* 목표 줄 — 전용 아트가 없다. 회색 반투명 띠로 두면 게임 위에 얹힌 웹 요소로 보이므로
   HUD 남색판과 같은 색·테두리·두께 그림자를 줘서 같은 기구의 아랫단으로 읽히게 한다. */
.hintrow{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;margin:7px 12px 0;}
.tut-help{flex:0 0 auto;width:30px;height:30px;padding:0;border-radius:50%;cursor:pointer;
  border:1.5px solid rgba(238,233,220,.5);background:linear-gradient(#143563,#0d2145);
  color:#ffd253;font:900 15px/1 system-ui,-apple-system,sans-serif;
  box-shadow:0 3px 0 rgba(4,14,32,.4),inset 0 1px 0 rgba(255,255,255,.16);}
.tut-help.quit{color:#ffb0a0;font-size:14px;}
.hint{margin:0;padding:8px 14px;min-width:0;max-width:100%;
  border:1.5px solid rgba(238,233,220,.5);border-radius:11px;
  background:linear-gradient(#143563,#0d2145)!important;color:#eaf4ff;font-size:12.5px;font-weight:800;line-height:1.3;
  letter-spacing:-.01em;box-shadow:0 3px 0 rgba(4,14,32,.4),inset 0 1px 0 rgba(255,255,255,.16);
  backdrop-filter:none;text-shadow:0 1px 2px rgba(0,10,30,.5);}
.hint b{color:#ffd253;}

/* --- 보드 --- ⚠️ 칸 좌표(CELL=52)는 JS 가 쓰므로 크기는 transform 으로만 줄인다.
       래퍼 높이를 같이 줄이지 않으면 아래가 빈 칸으로 남는다(옛 코드의 음수 margin 우회를 대체). */
.gridwrap{flex:0 0 auto;margin:auto;padding:4px 7px;border-radius:20px;   /* 배율 --gs 는 아래 미디어쿼리 사다리가 단일 출처 */
  width:calc(312px*var(--gs) + 14px);height:calc(416px*var(--gs) + 8px);
  background:rgba(8,28,58,.32);backdrop-filter:blur(5px);}
/* ⚠️ flex:0 0 auto 필수 — 래퍼가 flex 라 줄어든 폭에 맞춰 .grid 가 한 번 더 눌린다(52px 칸이 밖으로 밀림). */
.grid{flex:0 0 auto;transform:scale(var(--gs));transform-origin:top center;}
/* 상자가 함에 닿았을 때 — 성공은 초록 테두리, 실패·놓침은 그냥 흐려지기였다. 실패와 놓침이
   구분이 안 되고 성공도 "테두리 한 줄" 이라 안 읽혔다.
   ⚠️ .item 의 transform 은 칸 좌표라 애니메이션에 쓰면 상자가 순간이동한다 — 연출은 box-shadow ·
      filter · opacity 로만 만든다. 흔들기 같은 transform 연출은 함(.ci) 쪽에 건다. */
/* ⚠️ box-shadow 로 테를 두르지 말 것 — 상자는 그림(PNG)인데 box-shadow 는 26px 네모 박스를 따라
      그려져서, 화물 모양과 무관한 네모 테가 뜬다. 빛은 drop-shadow 로 준다(그림 실루엣을 따라간다). */
.item.xgood{animation:itGood .42s ease-out forwards;}
@keyframes itGood{
  0%{filter:brightness(2.1) drop-shadow(0 0 2px rgba(255,255,255,.95))}
  40%{filter:brightness(1.5) drop-shadow(0 0 11px rgba(255,255,255,.9))}
  100%{opacity:0;filter:brightness(1.2) drop-shadow(0 0 16px rgba(255,255,255,0))}
}
.item.xbad{animation:itBad .45s ease-out forwards;}
@keyframes itBad{
  0%{filter:brightness(1.35) saturate(1.5) drop-shadow(0 0 5px rgba(255,59,48,.95))}
  40%{filter:brightness(.6) saturate(.2) drop-shadow(0 0 10px rgba(255,59,48,.6))}
  100%{opacity:0;filter:brightness(.45) saturate(0)}
}
.item.xmiss{animation:itMiss .4s ease-in forwards;}
@keyframes itMiss{ 0%{filter:grayscale(1) brightness(.85)} 100%{opacity:0;filter:grayscale(1) brightness(.6)} }
/* 함 반응 — 상자보다 크고 자리가 고정이라 제일 잘 읽히는 신호다. 받으면 삼키듯 커졌다 돌아오고,
   틀린 색이 오면 고개를 젓는다. */
.cell.binOk .ci.bin{animation:binOk .5s cubic-bezier(.3,1.5,.5,1);}
@keyframes binOk{0%{transform:scale(1)}30%{transform:scale(1.16)}100%{transform:scale(1)}}
.cell.binNo .ci.bin{animation:binNo .45s ease-out;}
@keyframes binNo{0%,100%{transform:translateX(0)}18%{transform:translateX(-3px)}38%{transform:translateX(3px)}58%{transform:translateX(-2px)}78%{transform:translateX(2px)}}
/* ⚠️ 테두리 색만 바꾸면 안 된다 — 빨강 함은 원래 테두리가 빨강이라 오류인지 아닌지 구분이 안 된다.
      면 색까지 같이 바꿔서 어느 함에서든 성공/실패가 같은 신호로 읽히게 한다. */
.cell.binOk .ci.bin .binbox{background:#e4fbf2!important;}
.cell.binNo .ci.bin .binbox{border-color:#ff3b30!important;background:#ffe4e0!important;}

/* 센서 출구 화살표 — 어느 색이 어디로 나가는지를 타일 위에서 바로 읽게 한다.
   ⚠️ 그림 회전(--rot)에 얹지 말 것. 방향 클래스로 따로 놓아야 그림을 갈아도 안 어긋난다. */
/* 튜토리얼 지목 — 지금 눌러야 하는 것 하나만 빛난다(칸·도구·가동 버튼 공용). */
@keyframes tutring{
  0%,100%{box-shadow:0 0 0 3px #ffd253,0 0 10px 2px rgba(255,210,83,.5),inset 0 0 0 2px rgba(8,28,58,.68)}
  50%    {box-shadow:0 0 0 3px #ffd253,0 0 18px 6px rgba(255,210,83,.95),inset 0 0 0 2px rgba(8,28,58,.68)}
}
.tut-on{position:relative;z-index:7;border-radius:12px;animation:tutring 1.15s ease-in-out infinite;}
.ci .sar{position:absolute;width:0;height:0;z-index:2;
  filter:drop-shadow(0 0 1.6px rgba(255,255,255,.95)) drop-shadow(0 1px 2px rgba(0,10,35,.85));}
.ci .sar.d0{top:0;left:50%;margin-left:-9px;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:11px solid var(--c);}

/* --- 조작 콘솔 --- ⚠️ 도구 6개(지우기 포함)가 항상 한 줄에 다 보여야 한다.
       가로 스크롤로 두면 좁은 화면에서 분기센서·지우기가 화면 밖으로 나가 게임이 막힌다. */
.control-console{position:relative;flex:0 0 auto;margin:0 8px 8px;padding:0;z-index:6;display:flex;flex-direction:column;gap:6px;}

.control-console .tool{position:relative;flex:0 0 auto;width:min(60px,14.5%);min-width:0;height:auto;aspect-ratio:305/328;padding:0;border:0;border-radius:0;background:none;box-shadow:none;overflow:visible;}

/* ⚠️ background-color 를 반드시 죽일 것 — .btn.ghost(리셋)가 배경색 #eef1f8 을 들고 있어서

/* --- 인트로 --- */
#ovStart{justify-content:flex-start;padding:0;background-image:linear-gradient(rgba(18,28,36,.08),rgba(18,28,36,.18)),url('/games/build-cari-intro-bg-v7.webp');}
#ovStart .intro-console{--ch:min(calc(var(--sh)*.92),calc(var(--sw)*1.3316));
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);

  background:url('/games/build-cari-intro-v11.webp') center/100% 100% no-repeat;filter:drop-shadow(0 16px 22px rgba(25,28,24,.35));
  /* ⛔ 위쪽을 마스크로 자르지 말 것 — 액자의 두꺼운 윗 테두리가 같이 잘려 **판 머리가 싹둑 잘린 것처럼**
     보인다(2026-08-14 반려). 콘솔 아트에 원래 있는 CARI 의 안테나(행성)가 액자 위로 나와 있는데,
     그건 자르는 게 아니라 **창 안 새 CARI 의 행성을 잘라** 해결한다(아래 .floaty img 참고). */}
/* 창 실측(눈금 대조) = x6.7~93.3% · y4.2~47.0% · 모서리 곡률 = 높이의 3.3%.
   ⚠️ **곡률이 이 판의 핵심이다.** 창은 모서리가 크게 둥근데 사각으로 덮으면 네 귀퉁이가 크림색 액자를
      파고들어 "안 맞는" 게 바로 보인다(2026-08-14 반려). 사각형을 창에 맞추는 게 아니라 곡률까지 맞춘다. */
#ovStart .floaty{display:block;position:absolute;z-index:1;left:8%;top:4.6%;width:84%;height:44.7%;
  overflow:hidden;border-radius:6%/4.06%;animation:none;

/* ⚠️ 인트로·결과 캐릭터 PNG(-v7)는 **알파 여백을 잘라낸 상태**로 저장돼 있다(2026-08-14).
   받았을 때는 정사각 캔버스 한가운데 그림이 있어서, contain 으로 넣으면 캔버스의 빈 테두리까지
   슬롯을 먹어 그림이 작아졌다(실패 그림은 슬롯 높이의 65%밖에 못 썼다 — 정사각 캔버스에 가로로
   넓은 그림이라 위아래가 통째로 비어 있었다).
   ⛔ 그림을 다시 뽑으면 **여백부터 다시 잘라야 한다.** 안 자르면 이 자리가 도로 작아진다.
   패딩 2%는 그림이 슬롯 모서리에 딱 붙지 않게 하는 여유다. */
#ovStart .floaty img{width:100%;height:100%;padding:2%;box-sizing:border-box;object-fit:contain;display:block;}
#ovStart .title{position:absolute;z-index:1;left:9%;top:50.25%;width:81.6%;height:7%;margin:0;

#ovStart .t1,#ovStart .t2{font-size:calc(var(--ch)*.046);font-weight:950;}
#ovStart .t2{color:#ffd253;background:none;-webkit-text-fill-color:initial}
#ovStart .tag{position:absolute;z-index:1;left:10%;top:57.25%;width:80%;height:3.6%;margin:0;

#ovStart .rules{position:absolute;z-index:1;left:12%;top:64.05%;width:76%;height:21.3%;padding:0;background:transparent!important;border:0;box-shadow:none;display:grid;grid-template-rows:repeat(3,1fr);}
#ovStart .rules div{margin:0;padding:0 2% 0 14.5%;color:#29313b;font-size:calc(var(--ch)*.023);font-weight:800;line-height:1.2;display:flex;align-items:center;}
#ovStart .rules>div>b{display:none}#ovStart .rules span b{color:#b77800;}
#ovStart #btnStart{position:absolute;z-index:1;left:38%;top:86.5%;width:24%;height:11%;margin:0!important;padding:0!important;
  border:0;background:none;box-shadow:none;filter:none;overflow:hidden;text-indent:-999px;}
/* 튜토리얼 — 아래 바 왼쪽 홈에 앉는 판. 그림이 아니라 CSS 로 그린다.
   ⚠️ 홈은 사각형이 아니다 — 좌하·우상이 길게 사선으로 깎인 육각형이라 어떤 사각 버튼도 안 맞는다
      (그림으로 시도했다가 홈을 통째로 덮어버리는 판이 됐다). clip-path 로 홈 실루엣을 그대로 딴다.
   ⚠️ 좌표 출처 = 인트로 원본(955×1413) 홈 바닥을 플러드필로 훑은 값 x89~333 / y1245~1344.
      그림을 갈면 이 다각형과 박스를 다시 떠야 한다.
   ⚠️ 박스는 홈 바닥과 정확히 같다. 안쪽으로 물리면 사선 끝(좌하·우상 꼭짓점)에서 틈이 벌어져 보인다 —
      깊이는 틈이 아니라 inset 베벨이 만든다. */
#ovStart #btnTutIntro{position:absolute;z-index:1;left:9.32%;top:88.11%;width:25.55%;height:7.006%;margin:0!important;padding:0!important;
  border:0;filter:none;display:grid;place-items:center;
  /* ⚠️ border-radius 를 반드시 0 으로 죽일 것 — 기본 .btn 이 24px 을 들고 있는데 버튼 높이가 43px 이라
        clip-path 로 딴 모서리를 둥글게 다시 깎아버린다(둘은 교집합으로 적용된다).
        실제로 우하단이 30px 잘려 홈이 비어 보였다. */
  border-radius:0;
  clip-path:polygon(2.5% 0,75.8% 0,100% 72.7%,100% 97%,97.1% 100%,25.8% 100%,.8% 33.3%,.8% 3%);
  background:linear-gradient(180deg,#f4ecd8 0%,#e4d8bb 38%,#c9b894 72%,#9d8a67 100%);
  /* clip-path 안쪽은 inset 그림자만 살아남는다(바깥 그림자는 잘린다) → 베벨을 inset 으로 만든다. */
  box-shadow:inset 0 2px 0 rgba(255,253,244,.6),inset 0 -3px 0 rgba(88,70,44,.45);
  /* 글자는 어두운 잉크 — 판 면이 밝은 크림색이라 흰 글자는 대비가 안 난다. */
  color:#33281c;font-size:calc(var(--ch)*.0225);font-weight:900;letter-spacing:-.02em;
  text-shadow:0 1px 0 rgba(255,250,236,.5);}
#ovStart #btnTutIntro:active{background:linear-gradient(180deg,#e4d8bb 0%,#cdbe9c 60%,#8f7d5c 100%);
  box-shadow:inset 0 2px 0 rgba(255,253,244,.3),inset 0 -2px 0 rgba(88,70,44,.4);
  transform:translateY(calc(var(--ch)*.0016));}

/* --- 결과 --- ⚠️ 승리/실패 아트는 판 위치가 다르다(실패가 더 아래·짧고 버튼이 1개). 좌표를 공유하지 말 것. */
#ovResult{padding:0;background-image:linear-gradient(rgba(18,28,36,.1),rgba(18,28,36,.3)),url('/games/build-cari-game-bg-v7.webp');}
.result-console{--rh:min(calc(var(--sh)*.78),calc(var(--sw)*1.12));

   그래서 창 테두리와 **정확히** 겹쳐야 한다 — 옛 값(left 6.5% / w 87%)은 창(11%~88.9%)보다 넓어서
   사진 판이 크림색 프레임 위로 넘쳐 나왔다(2026-08-14 반려. 화면에서 네모가 액자 밖으로 튀어나온 그것).
   ⚠️ 승리/실패는 창 위치가 다르다 — 아래 .fail 이 따로 잡는다. 한 벌로 합치지 말 것.
   ⚠️ 모서리 곡률까지 맞춰야 한다 — 사각으로 덮으면 네 귀퉁이가 액자를 파고든다.
   창 실측(눈금 대조) = 승리 x11.6~88.4% y8.8~51.3% · 실패 x11.8~88.2% y7.3~56.8%. */

   같은 슬롯을 쓰지만 contain 이라 각자 알아서 앉는다 — 한쪽에 맞춰 슬롯 비율을 바꾸지 말 것. */
#ovResult .floaty img{width:100%;height:100%;padding:2%;box-sizing:border-box;object-fit:contain;display:block;}

   아이콘이 버튼 폭의 27% 에서 끝나므로 겹치지 않는다. */
#ovResult.fail #btnRetry{overflow:visible;text-indent:0;padding:0!important;display:grid;place-items:center;color:#fff;font-size:calc(var(--rh)*.032);text-shadow:0 2px 3px #111;}

.mg-rank{top:11px!important;right:11px!important;width:auto!important;height:38px!important;aspect-ratio:1701/494;
  /* ⚠️ 여기 padding 은 %가 아니라 px 이다 — 이 버튼은 absolute 라 %패딩이 자기 폭이 아니라
        무대 폭(460)을 기준으로 잡혀 글자가 오른쪽 끝으로 밀린다. 25px = 폭 130.8 기준 중앙 59.4%. */
  padding:0!important;border:0!important;border-radius:0!important;background:url('/games/rank-button.webp') center/100% 100% no-repeat!important;
  color:#fff!important;box-shadow:none!important;filter:drop-shadow(0 5px 8px rgba(0,10,42,.38));text-shadow:0 1px 3px #001c55!important;

.mg-rank.on{display:grid!important}.mg-rank>span[aria-hidden="true"]{display:none}.mg-rank .rank-label{position:absolute;left:54%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}

/* 보드 크기 — 6×8 고정판이라 레벨이 올라가도 안 커진다(그래서 화면에 맞춰 키워도 안전).
   ⚠️ 배율은 폭·높이 둘 다 만족할 때만 올린다. 한쪽만 보면 세로 긴 화면에서 보드가 폭을 넘거나,
      넓고 낮은 화면에서 조작 콘솔이 화면 밖으로 밀린다. 조건 = 폭 312×배율+30, 높이 = 나머지 UI + 416×배율. */
.gridwrap{--gs:.54}
@media (min-width:320px) and (min-height:575px){.gridwrap{--gs:.64}}
@media (min-width:320px) and (min-height:610px){.gridwrap{--gs:.72}}
@media (min-width:320px) and (min-height:650px){.gridwrap{--gs:.80}}
/* 좁은 화면은 HUD·팔레트도 같이 작아져 여유가 더 난다 — 그만큼 먼저 키운다(넓은 쪽 기준으로만 짜면 폰에서 손해). */

@media (max-width:400px) and (min-height:600px){.gridwrap{--gs:.80}}
@media (max-width:400px) and (min-height:660px){.gridwrap{--gs:.90}}

@media (min-width:375px) and (min-height:780px){.gridwrap{--gs:1.1}}
/* ⚠️ 여기서 끝 — 무대(.stage) 높이가 860px 에서 멈추므로 화면이 더 커져도 자리가 안 늘어난다.
      미디어쿼리는 뷰포트를 보기 때문에 이걸 잊고 한 칸 더 올리면 900px 화면에서 보드가 위아래에 딱 붙는다. */
@media (min-width:405px) and (min-height:822px){.gridwrap{--gs:1.2}}
@media (max-height:700px){.control-console .controls .btn{height:58px}.control-console .tool{width:min(54px,14.5%)}}
@media (max-height:620px){.control-console .controls .btn{height:52px}.hint{font-size:11.5px;padding:6px 10px}}
/* ===== 2026-09-15 재설계 — 벽 · 색별 센서 · 고정 타일 · 가동 횟수 ===== */
/* 벽 = 못 놓는 칸. 빈 칸과 확실히 구분되게 어둡고 빗금. */
.ci.wall{background:repeating-linear-gradient(135deg,#2b3550 0 6px,#1d2538 6px 12px);box-shadow:inset 0 0 0 2px #0d1426,inset 0 2px 0 rgba(255,255,255,.08);border-radius:7px;}
/* 고정 타일 = 못 지우고 못 돌리는 기계. 자물쇠 배지 하나로 말한다(색을 죽이면 센서 색이 안 읽힌다). */
.ci .lock{position:absolute;right:1px;top:1px;z-index:3;width:15px;height:15px;border-radius:50%;background:#fff3c4;box-shadow:0 1px 3px rgba(0,10,35,.6);
  display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;}
/* 센서 색 점 — 출구 화살표만으로는 센서가 무슨 색을 보는지 한눈에 안 들어와서 왼쪽 위에 색 점을 박는다. */
.ci.sensor .sdot{z-index:3;width:11px;height:11px;top:3px;left:3px;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.5);}
/* 팔레트의 센서 도구도 같은 색 점을 단다(도구 셋이 같은 그림이라 점이 유일한 구분). */
.control-console .tool .tdot{position:absolute;left:8%;top:6%;width:26%;height:24%;border-radius:50%;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.5);pointer-events:none;}
/* 도구가 8개까지 는다(컨베이어 4 + 센서 최대 3 + 지우개). 한 줄에 다 보이게 폭을 개수로 나눈다. */
.control-console .palette.n7 .tool{width:min(54px,12.5%)}
.control-console .palette.n8 .tool{width:min(50px,11%)}
/* 레벨 이름이 부제 자리에 온다 — 옛 부제(4글자)보다 길어서 자간을 줄인다. */
.hud .lvlbox span{letter-spacing:.05em;text-indent:.05em;}
/* 가동 횟수 — 점수판 아랫칸. 남은 만큼 밝다. */
.scorepill .runs{display:flex;gap:calc(var(--hh)*.05);justify-content:center;align-items:center;height:calc(var(--hh)*.17);}
.scorepill .runs i{display:block;width:calc(var(--hh)*.11);height:calc(var(--hh)*.11);border-radius:50%;background:rgba(155,212,255,.22);box-shadow:inset 0 0 0 1px rgba(155,212,255,.5);}
.scorepill .runs i.on{background:#79dfff;box-shadow:0 0 6px rgba(37,185,255,.8);}
/* 그만두기 — 승리 콘솔의 ↻ 자리. 그림에 ↻ 아이콘이 박혀 있는데 클리어 뒤엔 '다시' 가 뜻이 없어서,
   그 판을 같은 색 판으로 덮고 글자를 쓴다(아이콘을 그대로 두면 눌러도 아무 일 없는 버튼이 된다). */
#ovResult #btnRetry.asquit{overflow:visible;text-indent:0;display:grid;place-items:center;
  background:#2b2e33!important;border-radius:9%/22%;box-shadow:inset 0 0 0 2px #17191c,inset 0 2px 0 rgba(255,255,255,.06);
  color:#e8ecf3;font-size:calc(var(--rh)*.028);font-weight:900;letter-spacing:-.01em;text-shadow:0 1px 2px #000;}
/* 결과 콘솔의 설명 줄 — 영어가 한국어보다 길어 세 줄이 되면 판을 넘친다(2026-09-15 실측). 한 급 줄여 세 줄까지 담는다. */
#ovResult .scorebox .take{font-size:calc(var(--rh)*.0235);line-height:1.3;}
/* 실패창 — 버튼 하나뿐인 그림이라 '처음으로' 글자를 그대로 쓴다. */
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="hud">
    <img class="cari-mini" id="hudCari" src="/games/build-cari-play-v5.webp" alt="CARI"/>
    <div class="lvlbox"><b id="lvlName">레벨 1</b><span id="lvlSub">직선 라인</span></div>
    <div class="scorepill" id="scorePill"></div>
  </div>

  <div class="hintrow">
    <div class="hint" id="hintLine"></div>
    <!-- 튜토리얼 두 번째 진입점. 인트로는 페이지당 한 번만 뜨고 '다시 시작' 도 인트로로 안 돌아가서,
         여기가 없으면 게임에 들어간 뒤엔 튜토리얼을 영영 다시 못 본다. -->
    <button class="tut-help" id="btnTut" type="button" aria-label="튜토리얼" data-i18n-attr="aria-label:build.tut_aria">?</button>
  </div>

  <div class="gridwrap">
    <div class="grid">
      <div class="cells" id="cells"></div>
      <div class="ilayer" id="ilayer"></div>
    </div>
  </div>

  <div class="control-console">
    <div class="palette" id="palette"></div>
    <div class="controls">
      <button class="btn" id="btnRun">가동</button>
      <button class="btn ghost" id="btnReset" data-i18n="build.reset">리셋</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- START -->
  <div class="overlay" id="ovStart">
    <div class="intro-console">
      <div class="floaty" id="startCari"><img src="/games/build-cari-intro-hero-v7.webp" alt="컨베이어 라인을 조립하는 CARI"/></div>
      <div class="title"><span class="t1" data-i18n="build.title">지어라 </span><span class="t2">CARI</span></div>
      <div class="tag" data-i18n="build.tagline">라인을 깔면 공장이 알아서 돌아가요!</div>
      <div class="rules">
        <div><b>1</b><span data-i18n="build.rule1">칸을 눌러 <b>컨베이어</b>를 놓고, <b>센서</b>로 색을 갈라요</span></div>
        <div><b>2</b><span data-i18n="build.rule2">상자가 <b>전부</b> 제 함에 들어가면 다음 레벨</span></div>
        <div><b>3</b><span data-i18n="build.rule3">가동은 레벨마다 <b>3번</b>뿐 — 다 쓰면 끝</span></div>
      </div>
      <button class="btn" id="btnStart">시작하기</button>
      <!-- 아래 바의 빈 판(왼쪽)에 얹는다 — 그림에 이미 자리가 있어 아트를 다시 뽑지 않아도 된다. -->
      <button class="btn" id="btnTutIntro" type="button" data-i18n="build.tutorial">튜토리얼</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="overlay hide" id="ovResult">
    <div class="result-console">
      <div class="floaty"><img id="resCari" src="/games/build-cari-success-v7.webp" alt="컨베이어 출고에 성공한 CARI"/></div>
      <div class="badge win" id="resBadge">가동 성공!</div>
      <div class="scorebox">
        <div class="big" id="resTitle"></div>
        <div class="take" id="resTake"></div>
        <div class="foot" id="resFoot"></div>
      </div>
      <div class="ovbtns">
        <button class="btn ghost" id="btnRetry">다시</button>
        <button class="btn" id="btnNext">다음</button>
      </div>
    </div>
  </div>

</div>

<script src="i18n.js"></script>
<script>
/* 문구는 전부 사전(i18n.js 의 build.*)에서 온다. 레벨 문구는 build.lv{n}.name/goal/teach/take — 사전에 없으면 아래 한국어로 떨어진다. */
const T=(k,v)=>window.MGI18N?MGI18N.t(k,v):k;
function lvT(i,f,fb){ const k='build.lv'+(i+1)+'.'+f; const v=T(k); return v===k?(fb||''):v; }

/* ================= Constants ================= */
const COLS=6, ROWS=8, CELL=52, ITEM=26, SPAWN_EVERY=2;
const DIRS=[[-1,0],[0,1],[1,0],[0,-1]];      // 0=up 1=right 2=down 3=left
const ARROW=['▲','▶','▼','◀'];
const FEAT={ R:{c:'#f2664f',k:'build.red'}, B:{c:'#1b55d0',k:'build.blue'}, G:{c:'#12b58c',k:'build.green'} };
const CARGO_ASSET={R:'/games/build-cari-cargo-red-v1.webp',B:'/games/build-cari-cargo-blue-v1.webp',G:'/games/build-cari-cargo-green-v1.webp'};
const TOOL_IMG={0:'/games/build-cari-tool-up-v9.webp',1:'/games/build-cari-tool-right-v9.webp',2:'/games/build-cari-tool-down-v9.webp',3:'/games/build-cari-tool-left-v9.webp',
  sensor:'/games/build-cari-tool-sensor-v9.webp',erase:'/games/build-cari-tool-erase-v9.webp'};
const branchOf=dir=>(dir+3)%4;              // 센서: 자기 색은 진행 기준 왼쪽으로(아래로 가는 라인이면 화면 오른쪽)
const DEFAULT_RUNS=3;

/* ================= Levels =================
   좌표 [r,c] (r 0~7 위→아래 · c 0~5). 타일 = [r,c,'conv'|'sensor',dir,color]. dir 0=위 1=오른쪽 2=아래 3=왼쪽.
   sources = 생산기(각자 pattern 을 한 번 내보낸다 · 두 틱마다 하나) · bins = 함(want null = 아무 색) · walls = 못 놓는 칸
   fixed = 못 지우는 타일 · pre = 미리 깔린(지울 수 있는) 타일 · sensors = 이 레벨의 센서 색 · runs = 가동 횟수.
   ⛔ 기하(sources·bins·walls·fixed·pre·sensors·runs)는 서버 _shared/build-levels.ts 와 sync pair —
      서버가 게임이 보낸 레벨별 타일 배치를 같은 시뮬레이션으로 돌려 "정말 다 출고됐나" 를 본다.
      tests/minigame-replay.mjs 가 대조한다. 레벨을 넣거나 고치면 양쪽 다(+ 테스트의 SOL). 설계·검증 = tmp/_build-levels.mjs · _build-verify.mjs */
const LEVELS=[
  /* 1 */ {name:'직선 라인', goal:'생산기 상자를 <b>컨베이어</b>로 아래 <b>출고함</b>까지 이어라', take:'컨베이어만 깔았는데 상자가 <b>알아서</b> 흘러 출고됐어요 — 이게 자동 라인!',
    sources:[{"r":0,"c":2,"dir":2,"pattern":["B","B","B","B","B"]}], bins:[{"r":7,"c":2,"want":null}], sensors:[], runs:3},
  /* 2 */ {name:'모퉁이', goal:'함이 옆에 있다 — <b>꺾어서</b> 이어라', teach:'컨베이어는 <b>방향 도구</b>로 고른다. 꺾는 칸에 다른 방향을 놓으면 돼요',
    sources:[{"r":0,"c":0,"dir":2,"pattern":["B","B","B","B","B"]}], bins:[{"r":5,"c":4,"want":null}], sensors:[], runs:3},
  /* 3 */ {name:'벽 돌아가기', goal:'<b>벽</b>은 못 놓는 칸이다 — 돌아서 가라',
    sources:[{"r":0,"c":2,"dir":2,"pattern":["B","B","B","B","B"]}], bins:[{"r":7,"c":2,"want":null}], walls:[[3,1],[3,2],[3,3]], sensors:[], runs:3},
  /* 4 */ {name:'두 색 분류', goal:'<b>빨강 센서</b>로 빨강→오른쪽 함, 파랑→아래 함으로 갈라라', teach:'센서는 자기 색만 <b>옆으로</b> 꺾고 나머지는 <b>직진</b>시켜요', take:'센서 하나가 <b>빨강/파랑</b>을 스스로 갈라 보냈어요 — 판단하는 라인!',
    sources:[{"r":0,"c":1,"dir":2,"pattern":["R","B","R","B","R","B"]}], bins:[{"r":3,"c":3,"want":"R"},{"r":7,"c":1,"want":"B"}], sensors:["R"], runs:3},
  /* 5 */ {name:'꺾이는 쪽이 정해져 있다', goal:'센서는 자기 색을 <b>진행 방향의 왼쪽</b>으로만 꺾는다 — 빨강 함이 반대쪽이면?', teach:'센서를 <b>다시 눌러</b> 돌릴 수 있어요. 라인을 먼저 옆으로 보낸 뒤 센서를 두면 꺾이는 쪽이 바뀌어요',
    sources:[{"r":0,"c":4,"dir":2,"pattern":["R","B","R","B","R","B"]}], bins:[{"r":4,"c":3,"want":"R"},{"r":7,"c":1,"want":"B"}], walls:[[1,5],[2,5],[3,5],[4,5],[5,5],[6,5]], sensors:["R"], runs:3},
  /* 6 */ {name:'고장 난 라인', goal:'누가 깔아둔 라인이 <b>어딘가 틀렸다</b> — 찾아서 고쳐라', teach:'틀린 칸 위에 바로 새 컨베이어를 놓으면 덮어써요. <b>지우개</b>는 아예 비울 때',

  /* 7 */ {name:'세 색', goal:'빨강·초록·파랑 — 센서 <b>두 개</b>를 이어서 세 갈래로', teach:'첫 센서가 한 색을 빼면 남은 두 색이 다음 센서로 가요. <b>순서</b>를 정하는 게 설계',
    sources:[{"r":0,"c":2,"dir":2,"pattern":["R","G","B","R","G","B","R","G","B"]}], bins:[{"r":2,"c":5,"want":"R"},{"r":4,"c":5,"want":"G"},{"r":7,"c":2,"want":"B"}], sensors:["R","G","B"], runs:3},
  /* 8 */ {name:'빨강 센서가 없다', goal:'빨강을 왼쪽 함으로 보내야 하는데 <b>파랑 센서</b>뿐이다', teach:'파랑을 빼내면 <b>남는 건 빨강</b>이에요. 꼭 그 색을 잡지 않아도 갈라져요',
    sources:[{"r":0,"c":4,"dir":2,"pattern":["R","B","R","B","R","B"]}], bins:[{"r":4,"c":0,"want":"R"},{"r":7,"c":3,"want":"B"}], sensors:["B"], runs:3},
  /* 9 */ {name:'두 생산기', goal:'생산기가 <b>둘</b>이다 — 두 줄을 하나의 함으로', teach:'두 라인이 같은 칸으로 들어오면 <b>합쳐져요</b>. 상자끼리는 부딪히지 않아요',
    sources:[{"r":0,"c":0,"dir":2,"pattern":["B","B","B"]},{"r":0,"c":5,"dir":2,"pattern":["B","B","B"]}], bins:[{"r":7,"c":2,"want":null}], sensors:[], runs:3},
  /* 10 */ {name:'문은 하나', goal:'벽에 <b>문이 하나</b>뿐이다 — 두 줄 다 그 문으로', teach:'문 앞에서 <b>합치고</b>, 문 뒤에서 <b>가른다</b>. 센서는 문 뒤 한 개면 돼요',

    sources:[{"r":0,"c":1,"dir":2,"pattern":["R","B","R","B","R","B"]}], bins:[{"r":5,"c":3,"want":"R"},{"r":2,"c":4,"want":"B"}], walls:[[4,3],[6,3],[5,2]], sensors:["R"], runs:3},

  /* 14 */ {name:'문이 둘', goal:'문이 <b>둘</b>이다 — 색마다 자기 문으로', teach:'문 앞에서 갈라요. 센서 자리를 <b>위쪽</b>에 잡을수록 두 길이 여유 있어요',
    sources:[{"r":0,"c":3,"dir":2,"pattern":["R","B","R","B","R","B"]}], bins:[{"r":7,"c":4,"want":"R"},{"r":7,"c":1,"want":"B"}], walls:[[4,0],[4,2],[4,3],[4,5]], sensors:["R"], runs:3},
  /* 15 */ {name:'고집 센 센서', goal:'<b>못 지우는 파랑 센서</b>가 길목에 있다 — 파랑을 오른쪽으로 보내버린다', teach:'센서가 갈라놓은 걸 다시 <b>한 줄로 합치고</b>, 내 센서로 다시 갈라요',

  /* 16 */ {name:'셋 중 둘만', goal:'세 색인데 센서는 <b>초록·파랑</b>뿐 — 빨강은 어떻게?', teach:'둘을 빼내면 <b>남는 게 빨강</b>. 빼내는 순서는 함 위치가 정해요',

  /* 17 */ {name:'아래에서 올려 넣기', goal:'두 함 다 <b>아래에서만</b> 들어간다 — 그런데 센서는 파랑뿐', teach:'왼쪽으로 가는 라인에서 파랑을 <b>아래</b>로 떨구고, 남은 빨강은 그대로 위로 올려요. 떨군 파랑은 돌아서 올라와요',

  /* 18 */ {name:'되돌아 올라가기', goal:'빨강 함이 <b>위쪽</b>에 있다 — 내려갔다가 올라와라', teach:'센서가 <b>아래</b>를 보면 빨강은 오른쪽으로 — 거기서 위로 올려요',

  /* 19 */ {name:'두 줄이 한 색을 나눈다', goal:'두 생산기 모두 <b>파랑</b>이 섞여 나온다 — 파랑은 한 함으로', teach:'센서는 라인마다 하나씩, 함은 하나. 두 파랑 줄이 <b>합쳐져</b> 들어가요',

/* ================= 튜토리얼 =================
   "이 게임이 뭔지 모르겠다" 는 글로 안 풀린다 — 한 번 굴려보게 한다.
   ⚠️ 자동 실행하지 않는다. 눌러야 시작한다 — 아는 사람에게 두 번 시키면 그게 더 나쁘다.
   ⚠️ 대신 언제든 다시 할 수 있어야 한다(한 번 해도 이해 못 할 수 있다) → 진입점이 인트로·게임화면 둘.
   ⚠️ 한 라운드에 다 넣지 않는다 — 도구마다 짧은 라운드 하나씩이고, 각자 자기 가동으로 끝난다.
   ⚠️ 끝나면 그냥 끝난다 — 메인 게임으로 밀어넣지 않는다. 시작한 자리(인트로 / 하던 레벨)로 돌아간다.
   ⚠️ 튜토리얼엔 가동 횟수가 없다(홈을 비운다). 제출도 없다. */
const TUT_ROUNDS=[
  { key:'conv',

        센서만 재클릭으로 회전한다) → 상자가 오는 방향과 어긋나게 놓이도록 판을 짜서, 한 번 돌려야
        풀리게 만든다. 센서는 항상 아래(dir 2)로 놓이므로 여기선 왼쪽(dir 3)이 정답 = 클릭 한 번. */
  { key:'sensor',
    level:{ sources:[{r:3,c:4,dir:3,pattern:['R','B','R','B']}], bins:[{r:3,c:1,want:'B'},{r:4,c:2,want:'R'}], pre:[[3,3,'conv',3]], sensors:['R'], runs:0 },

/* ================= State =================
   한 판 = 1레벨부터. 레벨마다 가동 횟수(runs)가 있고, 실패해도 횟수가 남으면 배치를 고쳐 다시 가동한다.
   횟수를 다 쓰면 판이 끝난다. 기록 = 깬 레벨 수 → 같으면 놓은 타일 수 합(적을수록) → 같으면 가동 횟수 합(적을수록).
   서버가 log(레벨별 타일 배치·가동 횟수)로 다시 센다. */
const S={ lv:0, runsLeft:0, usedRuns:0, cleared:0, log:[], runOver:false };
let L=null, grid=[], items=[], nextId=0, cellEls=[];
let running=false, timer=null, tickN=0, spawnedCount=0, spawnIdx=[];

const $=id=>document.getElementById(id);

/* ================= Board build ================= */
function buildCells(){
  const wrap=$('cells'); wrap.innerHTML=''; cellEls=[];
  for(let r=0;r<ROWS;r++){ cellEls.push([]);
    for(let c=0;c<COLS;c++){ const d=document.createElement('div'); d.className='cell'; d.dataset.r=r; d.dataset.c=c; wrap.appendChild(d); cellEls[r].push(d); } }
}
/** 팔레트는 레벨이 정한다 — 컨베이어 4 + 이 레벨의 센서 색 + 지우개. */
function buildPalette(){
  const tools=[['conv-0',TOOL_IMG[0],'build.tool_up'],['conv-1',TOOL_IMG[1],'build.tool_right'],['conv-2',TOOL_IMG[2],'build.tool_down'],['conv-3',TOOL_IMG[3],'build.tool_left']];
  for(const col of (L.sensors||[])) tools.push(['sensor-'+col,TOOL_IMG.sensor,'build.tool_sensor',col]);
  tools.push(['erase',TOOL_IMG.erase,'build.tool_erase']);
  const pal=$('palette'); pal.className='palette n'+tools.length;
  pal.innerHTML=tools.map(([id,src,lab,col])=>{
    const name=col?T(lab,{color:T(FEAT[col].k)}):T(lab);
    return `<button type="button" class="tool${id==='erase'?' erase':''}" data-tool="${id}" aria-label="${name}" title="${name}"><img class="tico" src="${src}" alt="" draggable="false">${col?`<i class="tdot" style="background:${FEAT[col].c}"></i>`:''}</button>`;
  }).join('');
}
function cellInner(r,c){
  const g=grid[r][c];
  const lock=g.fixed?`<span class="lock" title="${T('build.fixed')}">🔒</span>`:'';
  if(g.type==='wall') return `<div class="ci wall"></div>`;
  if(g.type==='source') return `<div class="ci src"><div class="cmini"><img src="/games/build-cari-play-v5.webp" alt="" draggable="false"></div><span class="ar">${ARROW[g.dir]}</span></div>`;
  if(g.type==='bin'){ const col=g.want?FEAT[g.want].c:null;
    return `<div class="ci bin"><div class="binbox" style="border-color:${col||'#b9c2d6'}">`+
      (col?`<span class="bsw" style="background:${col}"></span>`
          :`<span class="bany">${['R','G','B'].map(f=>`<i style="background:${FEAT[f].c}"></i>`).join('')}</span>`)+`</div></div>`; }
  if(g.type==='conv'){ return `<div class="ci conv"><img class="tile-asset" src="${TOOL_IMG[g.dir]}" alt="">${lock}</div>`; }
  if(g.type==='sensor'){
    // 센서는 "자기 색만 왼쪽으로 꺾고 나머지는 직진". 그림만으로는 안 읽히므로 두 출구에 색 화살표를 얹는다 —
    // 꺾이는 쪽엔 센서 색, 직진 쪽엔 남는 색(하나면 그 색, 둘 이상이면 중립색). 왼쪽 위 점 = 센서 색.
    const sc=FEAT[g.color].c;
    const others=[...new Set(L.sources.flatMap(s=>s.pattern))].filter(f=>f!==g.color);
    const oc=others.length===1?FEAT[others[0]].c:'#dbe6f7';
    return `<div class="ci sensor" style="--rot:${(g.dir-2)*90}deg"><img class="tile-asset" src="${TOOL_IMG.sensor}" alt="">`+
      `<span class="sdot" style="background:${sc}"></span>`+
      `<span class="sar d${g.dir}" style="--c:${oc}"></span>`+
      `<span class="sar d${branchOf(g.dir)}" style="--c:${sc}"></span>${lock}</div>`; }
  return `<div class="ci empty"></div>`;
}
function renderCell(r,c){ cellEls[r][c].innerHTML=cellInner(r,c); }
function renderBoard(){ for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)renderCell(r,c); }

/* ================= Level load ================= */
/** 레벨의 고정물만 깐 판(플레이어 타일 없음). 서버 _shared/build-levels.ts 의 makeGrid 와 같은 규칙. */
function baseGrid(Lv){
  const g=[]; for(let r=0;r<ROWS;r++){ g.push([]); for(let c=0;c<COLS;c++) g[r].push({type:'empty'}); }
  Lv.sources.forEach(s=>{ g[s.r][s.c]={type:'source',dir:s.dir}; });
  Lv.bins.forEach(b=>{ g[b.r][b.c]={type:'bin',want:b.want}; });
  (Lv.walls||[]).forEach(([r,c])=>{ g[r][c]={type:'wall'}; });
  (Lv.fixed||[]).forEach(([r,c,t,d,col])=>{ g[r][c]={type:t,dir:d,color:col,fixed:true}; });
  (Lv.pre||[]).forEach(([r,c,t,d,col])=>{ g[r][c]={type:t,dir:d,color:col}; });
  return g;
}
function layBoard(){ grid=baseGrid(L); }
/** def 를 주면 그 판(=튜토리얼)을 띄운다. 안 주면 평소대로 LEVELS[i] — 이때 튜토리얼 모드는 자동 해제. */
function startLevel(i, def){
  stopSim();
  if(!def){ S.lv=i; tutOn=false; tutSetHelp(); }
  L=def||LEVELS[i];
  $('ovResult').classList.add('hide'); $('btnRetry').classList.remove('asquit');
  document.documentElement.style.setProperty('--tk', (L.tick||500)+'ms');
  layBoard();
  S.runsLeft=L.runs; S.usedRuns=0;
  resetSim();
  buildPalette();
  renderBoard();
  if(def){ $('lvlName').textContent=T('build.tutorial'); $('lvlSub').textContent=T('build.tut_round',{n:tutRound+1,m:TUT_ROUNDS.length}); $('hintLine').innerHTML=''; }
  else { $('lvlName').textContent=T('build.level',{n:i+1}); $('lvlSub').textContent=lvT(i,'name',L.name); $('hintLine').innerHTML=lvT(i,'goal',L.goal); }
  setTool('conv-2');
}
/** 플레이어가 놓은 타일 목록(고정물·미리 깔린 것 제외 — 미리 깔린 것은 고쳐야 카운트된다). 서버에 보내는 기록의 단위. */
function playerTiles(){
  const base=baseGrid(L);
  const out=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const g=grid[r][c], b=base[r][c];
    if(g.type!=='conv'&&g.type!=='sensor') continue; if(g.fixed) continue;
    if(b.type===g.type&&b.dir===g.dir&&(b.color||null)===(g.color||null)) continue;   // 미리 깔린 그대로
    out.push(g.type==='sensor'?[r,c,'sensor',g.dir,g.color]:[r,c,'conv',g.dir]); }
  return out;
}

/* ================= Simulation ================= */
function tokenXY(r,c){ return [c*CELL+(CELL-ITEM)/2, r*CELL+(CELL-ITEM)/2]; }
function makeToken(it){
  const el=document.createElement('div'); el.className='item';
  el.style.backgroundImage=`url('${CARGO_ASSET[it.feat]}')`;
  const [x,y]=tokenXY(it.r,it.c); el.style.transform=`translate(${x}px,${y}px)`;
  $('ilayer').appendChild(el); it.el=el;
}
function updateToken(it){ if(it.el){ const [x,y]=tokenXY(it.r,it.c); it.el.style.transform=`translate(${x}px,${y}px)`; } }
function exitDir(it){
  const g=grid[it.r][it.c];
  if(g.type==='conv'||g.type==='source') return g.dir;
  if(g.type==='sensor') return (it.feat===g.color) ? branchOf(g.dir) : g.dir;
  return null;
}
function killItem(it,fate){
  it.dead=true;
  if(fate==='good')good++; else if(fate==='bad')bad++; else miss++;
  if(it.el){ updateToken(it); const el=it.el; el.classList.add('x'+fate);
    setTimeout(()=>el.remove(), Math.max(240, (L.tick||500)*0.9)); }
  // 함도 같이 반응시킨다 — 상자는 26px 이라 그것만으로는 성공/실패가 안 읽힌다.
  if((fate==='good'||fate==='bad') && cellEls[it.r] && cellEls[it.r][it.c]){
    const cd=cellEls[it.r][it.c], cls=fate==='good'?'binOk':'binNo';
    cd.classList.remove('binOk','binNo'); void cd.offsetWidth;   // 연속 도착에도 다시 재생되게
    cd.classList.add(cls); setTimeout(()=>cd.classList.remove(cls), 520);
  }
  updateScore();
}
function tick(){
  tickN++;
  for(const it of items.slice()){
    if(it.dead) continue;
    const dir=exitDir(it);
    if(dir===null){ killItem(it,'miss'); continue; }             // 빈 칸 위 = 멈춤
    const [nr,nc]=[it.r+DIRS[dir][0], it.c+DIRS[dir][1]];
    it.r=nr; it.c=nc; it.steps=(it.steps||0)+1;
    if(nr<0||nr>=ROWS||nc<0||nc>=COLS){ killItem(it,'miss'); continue; }  // 판 밖
    const t=grid[nr][nc];
    if(t.type==='bin'){ killItem(it,(t.want==null||t.want===it.feat)?'good':'bad'); continue; }
    if(t.type==='empty'||t.type==='wall'){ killItem(it,'miss'); continue; }   // 벨트 끝 · 벽
    if(it.steps>ROWS*COLS+4){ killItem(it,'miss'); continue; }    // 고리
    updateToken(it);
  }
  if(spawnedCount<needOf(L) && tickN%SPAWN_EVERY===1) spawn();
  checkFinish();
}
function spawn(){
  L.sources.forEach((s,si)=>{
    if(spawnIdx[si]>=s.pattern.length) return;
    const it={id:nextId++, r:s.r, c:s.c, feat:s.pattern[spawnIdx[si]], dead:false, steps:0};
    spawnIdx[si]++; spawnedCount++; items.push(it); makeToken(it);
  });
  updateScore();
}
function checkFinish(){
  const live=items.some(it=>!it.dead);
  if((spawnedCount>=needOf(L) && !live) || tickN>200){ finish(); }
}
function resetSim(){
  items.forEach(it=>it.el&&it.el.remove()); items=[];
  good=bad=miss=0; tickN=0; spawnedCount=0; spawnIdx=L.sources.map(()=>0); updateScore();
}
function startSim(){
  if(running) return;
  if(!tutOn && S.runsLeft<=0) return;
  resetSim(); running=true; setEditable(false); updateRunBtn();
  if(!tutOn){ S.runsLeft--; S.usedRuns++; updateScore(); }
  timer=setInterval(tick, L.tick||500);
}
function stopSim(){ running=false; if(timer){clearInterval(timer);timer=null;} setEditable(true); updateRunBtn(); }

/* ================= UI ================= */
function updateScore(){
  const runs = tutOn ? '' : `<span class="metric"><small>${T('build.runs')}</small><span class="runs">${Array.from({length:L?L.runs:0},(_,i)=>`<i class="${i<S.runsLeft?'on':''}"></i>`).join('')}</span></span>`;
  $('scorePill').innerHTML=`<span class="metric ok"><small>${T('build.out')}</small><b>${good}/${L?needOf(L):0}</b></span>${runs||`<span class="metric err"><small>${T('build.err')}</small><b>${bad+miss}</b></span>`}`;
}
function updateRunBtn(){ const b=$('btnRun'); b.textContent=running?T('build.stop'):T('build.run'); b.classList.toggle('stop',running); }
function setEditable(on){ $('cells').style.opacity=on?'1':'.92'; }
function setTool(t){ tool=t; document.querySelectorAll('.tool').forEach(el=>el.classList.toggle('on', el.dataset.tool===t)); }
let toastT=null;
function toast(msg,ms=1500){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),ms); }

/* --- 튜토리얼 진행 --- 지금 눌러야 하는 것 하나만 빛나고, 그것만 반응한다. */
function tutStep(){ return tutOn ? TUT_ROUNDS[tutRound].steps[tutIdx] : null; }
function tutClear(){ document.querySelectorAll('.tut-on').forEach(el=>el.classList.remove('tut-on')); }
function tutSetHelp(){
  const b=$('btnTut'); if(!b) return;
  b.textContent=tutOn?'✕':'?'; b.classList.toggle('quit',tutOn);
  b.setAttribute('aria-label', T(tutOn?'build.tut_quit':'build.tut_aria'));
}
function tutMark(){
  tutClear();
  const s=tutStep(); if(!s) return;
  if(s.cell) cellEls[s.cell[0]][s.cell[1]].classList.add('tut-on');
  if(s.tool){ const el=document.querySelector(`.tool[data-tool="${s.tool}"]`); if(el) el.classList.add('tut-on'); }
  if(s.run) $('btnRun').classList.add('tut-on');
  $('hintLine').innerHTML=T(s.msg);
}
function tutNext(){ tutIdx++; if(tutIdx>=TUT_ROUNDS[tutRound].steps.length){ tutClear(); return; } tutMark(); }
function loadTutRound(){ tutIdx=0; startLevel(-1, TUT_ROUNDS[tutRound].level); tutMark(); }
/** from='intro' | 'game' — 끝나거나 그만두면 시작한 자리로 돌려보낸다(메인 게임으로 밀지 않는다). */
function startTutorial(from){
  if(from){ tutFrom=from; if(from==='game') tutReturnLI=S.lv; }
  clearTimeout(tutTimer);
  $('ovStart').classList.add('hide'); $('ovResult').classList.add('hide');
  tutOn=true; tutRound=0; loadTutRound(); tutSetHelp();
}
function exitTutorial(){
  clearTimeout(tutTimer); tutOn=false; tutClear();
  $('ovResult').classList.add('hide');
  if(tutFrom==='game'){ startLevel(tutReturnLI); }
  else { startLevel(0); $('ovStart').classList.remove('hide'); }
}

$('cells').addEventListener('click',e=>{
  if(running) return;
  const cd=e.target.closest('.cell'); if(!cd) return;
  const r=+cd.dataset.r, c=+cd.dataset.c, g=grid[r][c];
  const s=tutStep(); if(s && !(s.cell && s.cell[0]===r && s.cell[1]===c)) return;  // 튜토리얼: 지목한 칸만
  if(g.type==='source'||g.type==='bin'||g.type==='wall') return;
  if(g.fixed){ toast(T('build.fixed')); return; }
  if(tool==='erase'){ grid[r][c]={type:'empty'}; }
  else if(tool.startsWith('conv-')){ grid[r][c]={type:'conv',dir:+tool.slice(5)}; }
  else if(tool.startsWith('sensor-')){
    const col=tool.slice(7);
    if(g.type==='sensor'&&g.color===col){ g.dir=(g.dir+1)%4; }        // 같은 색 센서를 다시 누르면 회전
    else grid[r][c]={type:'sensor',dir:2,color:col};                    // 다른 색이면 갈아끼운다
  }
  renderCell(r,c);
  if(s) tutNext();
});
$('palette').addEventListener('click',e=>{
  const t=e.target.closest('.tool'); if(!t) return;
  const s=tutStep(); if(s && s.tool!==t.dataset.tool) return;
  setTool(t.dataset.tool);
  if(s) tutNext();
});
$('btnRun').onclick=()=>{
  const s=tutStep(); if(s && !s.run) return;
  if(running){ stopSim(); return; }
  if(!tutOn && S.runsLeft<=0) return;
  if(s) tutNext();
  startSim();
};
/* 리셋 = 내가 놓은 타일만 비운다(가동 횟수는 그대로 — 되돌리기는 공짜다). */
$('btnReset').onclick=()=>{ if(running) return; if(tutOn){ loadTutRound(); return; } layBoard(); resetSim(); renderBoard(); };
$('btnTut').onclick=()=>{ tutOn?exitTutorial():startTutorial('game'); };

/* ================= Result =================
   결과 콘솔 그림은 승리(버튼 둘: ↻ →) / 실패(버튼 하나) 두 벌뿐이다. 그 안에서 세 상황을 나눈다:
   · 클리어: ↻ 자리 = '그만두기'(여기까지 기록), → = 다음(마지막이면 처음으로)
   · 실패·횟수 남음: **콘솔을 안 띄운다** — 판 위에서 힌트·토스트로만(실패 콘솔은 게임오버로 읽힌다)
   · 실패·횟수 소진: 실패 그림, 버튼 = 처음으로. 기록은 이때(또는 그만두기·전부 클리어) 한 번만 보낸다. */
function submitRun(){
  if(window.MGBridge) MGBridge.submit(S.cleared, {timed:true, log:S.log}); // 숫자는 참고값 — 서버가 log 로 다시 센다
}
function finish(){
  stopSim();
  const win=good>=needOf(L);
  if(tutOn){
    // 중간 라운드는 결과창을 띄우지 않는다 — 짧은 레슨 사이에 창이 끼면 흐름이 끊긴다.
    if(win && tutRound < TUT_ROUNDS.length-1){
      $('hintLine').innerHTML=T('build.tut_next',{name:T('build.tut_'+TUT_ROUNDS[tutRound+1].key)});
      tutTimer=setTimeout(()=>{ if(!tutOn) return; tutRound++; loadTutRound(); }, 1500);
      return;
    }
    if(!win){ $('hintLine').innerHTML=T('build.tut_again'); loadTutRoundKeep(); return; }
    $('resCari').src='/games/build-cari-success-v7.webp';
    $('resBadge').textContent=T('build.tut_done'); $('resBadge').className='badge win';
    $('resTitle').textContent=T('build.tut_done_title');
    $('resTake').textContent=T('build.tut_done_take');
    $('resFoot').textContent='';
    $('ovResult').classList.remove('fail');
    $('btnRetry').hidden=false; $('btnRetry').textContent=T('build.again'); $('btnRetry').classList.remove('asquit');
    const nt=$('btnNext'); nt.hidden=false; nt.textContent=T('build.close'); nt.dataset.win='tut';
    $('ovResult').classList.remove('hide');
    return;
  }
  const nx=$('btnNext'), rt=$('btnRetry');
  $('resFoot').textContent='';
  if(win){
    S.log.push({lv:S.lv, tiles:playerTiles(), runs:S.usedRuns});
    S.cleared++;
    const isLast=S.lv>=LEVELS.length-1;
    $('resCari').src='/games/build-cari-success-v7.webp';
    $('resBadge').textContent=T(isLast?'build.all_clear':'build.success'); $('resBadge').className='badge win';
    $('resTitle').textContent=T('build.res_used',{n:S.log[S.log.length-1].tiles.length, r:S.usedRuns});
    $('resTake').innerHTML=lvT(S.lv,'take',L.take)||T(isLast?'build.res_all':'build.res_next');
    $('ovResult').classList.remove('fail');
    rt.hidden=isLast; rt.textContent=T('build.quit'); rt.dataset.mode='quit'; rt.classList.add('asquit');
    nx.hidden=false; nx.textContent=T(isLast?'build.to_start':'build.next'); nx.dataset.win=isLast?'last':'1';
    if(isLast){ S.runOver=true; submitRun(); }
  }else if(S.runsLeft>0){
    // 횟수가 남은 실패는 화면을 안 바꾼다 — 실패 콘솔로 넘기면 게임오버로 읽힌다(2026-09-15 지적). 판은 그대로,
    // 힌트줄이 배울 점(teach)을 말하고 토스트가 출고 수·남은 횟수를 알린다(점수판에도 그대로 있다).
    $('hintLine').innerHTML=lvT(S.lv,'teach',L.teach)||T('build.res_fix');
    toast(T('build.res_out',{n:good, m:needOf(L)})+' · '+T('build.runs_left',{n:S.runsLeft}), 2600);
    return;
  }else{
    S.runOver=true; submitRun();
    $('resCari').src='/games/build-cari-fail-v7.webp';
    $('resBadge').textContent=T('build.out_of_runs'); $('resBadge').className='badge lose';
    $('resTitle').textContent=T('build.res_cleared',{n:S.cleared});
    $('resTake').textContent=T('build.res_over');
    $('ovResult').classList.add('fail');
    rt.hidden=false; rt.textContent=T('build.to_start'); rt.dataset.mode='over'; rt.classList.remove('asquit');
    nx.hidden=true;
  }
  $('ovResult').classList.remove('hide');
}
function loadTutRoundKeep(){ tutTimer=setTimeout(()=>{ if(tutOn) loadTutRound(); }, 1200); }
$('btnRetry').onclick=()=>{
  const mode=$('btnRetry').dataset.mode;
  $('ovResult').classList.add('hide');
  if(tutOn){ startTutorial(); return; }
  if(mode==='over'){ goStart(); return; }
  if(mode==='quit'){ S.runOver=true; submitRun(); goStart(); return; }   // 그만두기 — 깬 데까지가 기록
};
$('btnNext').onclick=()=>{
  const d=$('btnNext').dataset.win;
  $('ovResult').classList.add('hide');
  if(d==='tut'){ exitTutorial(); return; }               // 튜토리얼 끝 → 시작한 자리로(메인 게임으로 안 넘김)
  if(d==='last'){ goStart(); return; }
  startLevel(S.lv+1);
};
function goStart(){ startRun(); $('ovStart').classList.remove('hide'); }
function startRun(){ S.cleared=0; S.log=[]; S.runOver=false; startLevel(0); }

/* ================= Boot ================= */
buildCells();
startRun();
$('btnStart').onclick=()=>{ $('ovStart').classList.add('hide'); started=true; startRun(); };
$('btnTutIntro').onclick=()=>{ started=true; startTutorial('intro'); };

/* ================= test hooks ================= */
window.LEVELS=LEVELS;
window.TUT_ROUNDS=TUT_ROUNDS;
window.S=S;
window.__startLevel=startLevel;
window.__place=tiles=>{ tiles.forEach(([r,c,t,d,col])=>{ grid[r][c]=t==='sensor'?{type:t,dir:d,color:col}:{type:t,dir:d}; }); renderBoard(); };
window.__auto=i=>{ startLevel(i); };
window.__tick=tick;
window.__run=startSim;
window.__stop=stopSim;
window.__reset=resetSim;
window.__stat=()=>({good,bad,miss,spawnedCount,tickN,running,lv:S.lv,live:items.filter(x=>!x.dead).length,need:needOf(L),runsLeft:S.runsLeft,cleared:S.cleared});
window.__finished=()=>!$('ovResult').classList.contains('hide');
window.__won=()=>$('resBadge').classList.contains('win');
</script>

<!-- ===== 앱 브리지: 랭킹 버튼 + 점수 전송 =====
     이 HTML 은 자립형이라 세션도 supabase 클라도 없다 → 실제 제출/조회는 부모(/games/:id = MiniGame.tsx)가 한다.
     여기서는 (1) 인트로·아웃트로 우상단에 '랭킹' 버튼을 얹고, (2) 점수가 나면 postMessage 로 알리기만 한다.
     ⚠️ 이 파일을 단독으로 열면 부모가 없어 버튼도 숨고 아무것도 보내지 않는다(게임은 그대로 동작).
     ⚠️ log(레벨별 타일 배치·가동 횟수)를 같이 실어 보낸다 — 서버가 이걸로 기록을 다시 센다. 빠지면 서버가 400 을 주고 랭킹에 안 남는다. -->
<style>
.mg-rank{top:11px!important;right:11px!important;width:auto!important;height:38px!important;aspect-ratio:1701/494;
  position:absolute;z-index:60;cursor:pointer;
  padding:0!important;border:0!important;border-radius:0!important;background:url('/games/rank-button.webp') center/100% 100% no-repeat!important;
  color:#fff!important;box-shadow:none!important;filter:drop-shadow(0 5px 8px rgba(0,10,42,.38));text-shadow:0 1px 3px #001c55!important;
  font:800 12.5px/1 system-ui,-apple-system,sans-serif;display:none;place-items:center;-webkit-tap-highlight-color:transparent;}
.mg-rank.on{display:grid!important}.mg-rank .rank-label{position:absolute;left:54%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}
.mg-rank:active{transform:translateY(1px);}
</style>
<script>
(function(){
  var EMBED = window.parent !== window;
  var T0 = 0;
  function post(m){ if(EMBED) window.parent.postMessage(m, window.location.origin); }
  window.MGBridge = {
    /** 점수 전송. timed:true 면 시작 이후 경과시간을 동률 해소용으로 같이 보낸다(서버는 log 의 값을 우선한다). */
    submit: function(v, opts){
      if(typeof v !== 'number' || !isFinite(v)) return;
      post({ t:'mg:score', score:v, tieMs:(opts && opts.timed && T0) ? (Date.now()-T0) : undefined,
             log:(opts && Array.isArray(opts.log)) ? opts.log : undefined });
    }
  };
  var tr = function(k){ return window.MGI18N ? MGI18N.t(k) : k; };
  function mount(id){
    var ov = document.getElementById(id); if(!ov) return;
    if(ov.querySelector('.mg-rank')) return;
    var b = document.createElement('button');
    b.type='button'; b.className='mg-rank' + (EMBED ? ' on' : '');
    b.setAttribute('aria-label', tr('mg.rank_aria'));
    b.innerHTML='<span class="rank-label">'+tr('mg.rank')+'</span>';
    b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); post({t:'mg:rank'}); });
    ov.appendChild(b);
  }
  mount('ovStart'); mount('ovResult');
  // 인트로에서 (랭킹 버튼이 아닌) 무엇이든 누르면 = 플레이 시작 → 소요시간 기준점 리셋.
  var intro = document.getElementById('ovStart');
  if(intro) intro.addEventListener('click', function(e){
    if(e.target && e.target.closest && e.target.closest('.mg-rank')) return;
    T0 = Date.now();
  }, true);
})();
</script>
<script>if (window.MGI18N) MGI18N.apply();</script>
</body>
</html>
